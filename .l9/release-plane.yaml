schema: l9.release-plane/v1
metadata:
  repository: Quantum-L9/l9-ci-core
  status: authoritative
  updated: '2026-09-04'

principle: >-
  Core is the organization's centrally selected CI runtime, not a library
  every repository upgrades. The GitHub organization ruleset is the
  dependency indirection layer: it binds governed repositories to Core's
  production branch and workflow file directly. Releases therefore stop being
  a fleet-distribution mechanism and regain their proper function: audit,
  provenance, compatibility communication, and rollback identity.

authority:
  governance_repository: Quantum-L9/Cursor-Governance
  governance_invariants:
    - L9-ORG-007
    - L9-ORG-008
  execution_repository: Quantum-L9/l9-ci-core

production:
  mechanism: github_organization_required_workflow_ruleset
  source:
    repository: Quantum-L9/l9-ci-core
    branch: main
    workflow: .github/workflows/org-ci.yml
  propagation: >-
    A merge to Core main is production. The next governed pull_request or
    merge_group evaluation in any targeted repository runs the current Core
    main workflow. Nothing is propagated to, pinned in, or updated inside a
    consumer repository.
  consumer:
    workflow_copy_allowed: false
    core_revision_selection_allowed: false
    sdk_revision_selection_allowed: false
    moving_release_tag_required: false
    update_pull_requests_required: false
  admission_freshness:
    strict_required_status_checks_policy: true
    merge_queue_rule_satisfies: true
    note: >-
      A green required check is admission evidence only if it evaluated the
      head against the current base. The organization ruleset's
      required_status_checks rule must therefore run in strict mode
      (strict_required_status_checks_policy), or an active merge_queue rule
      must make the queue the final admission mechanism, since the queue
      evaluates the merged result itself. Observed 2026-09-13 on ruleset
      21895545 ("L9 canonical CI required"): the policy was false and no
      merge_queue rule was active, so a passing "Analyze (central Core)" did
      not prove the head was current. Attested by tools/verify_control_plane.py;
      do not loosen this block to make the attestation PASS.

core_release:
  purpose:
    - audit
    - provenance
    - rollback_identity
    - release_notes
    - compatibility_communication
  versioning: semver
  tag_pattern: vMAJOR.MINOR.PATCH
  immutable: true
  runtime_authority: false
  moving_major_alias:
    enabled: false
    note: >-
      No Core release moves a major alias. The refs/tags/v2 ref is not a
      release alias and is not a governed organization-enforcement consumption
      path. It is a mutable compatibility tag for the bounded optional
      consumer integration channel and toolchain installer, moved only by
      tools/publish_consumer_ci_tag.sh after a human pin-file PR.
  optional_integration_channel:
    enabled: true
    tag: v2
    purpose: >-
      Provides a reviewed compatibility channel for the named Cognitive Runtime
      release workflow. It is neither a Core release nor the organization CI
      runtime, and it does not authorize general consumer Core revision choice.
    consumers:
      - repository: Quantum-L9/l9-cognitive-runtime
        workflow: .github/workflows/release-staging.yml
        permitted_surfaces:
          - .github/workflows/analyze-semgrep.yml
          - .github/actions/container-release
    safeguards:
      - human_reviewed_core_pin_file_change_before_retag
      - reviewed_consumer_change_before_use
      - source_revision_and_image_digest_are_release_evidence
      - never_organization_required_workflow
      - never_exact_core_release_alias
  validation:
    workflow: .github/workflows/release-validation.yml
    action: .github/actions/validate-release
    expected_version_source: .l9/repo-spec.yaml
    expected_version_hardcoded_in_workflow: false
    preflight_before_tag: true
    preflight_script: docs/release/tag-and-release.sh
    post_tag_identity:
      remote_ref_source: exact_refs_tags_name
      tag_object_required: annotated
      target_type: direct_commit
      checkout: peeled_commit
      push_event_sha_must_equal_peeled_commit: true
      manual_dispatch_resolves_same_remote_ref: true
      mutating: false
    note: >-
      An immutable tag is an audit identity; an invalid one cannot be moved,
      only superseded. The release script therefore runs the same validator
      against the exact target commit (a temporary detached worktree, never
      the operator's working tree) and creates the tag only after it passes.
      The post-tag release-validation.yml run is the independent attestation
      of the same revision, not the first time it is checked. For both a tag
      push and a manual dispatch, that attestation reads the exact remote tag
      ref with contents:read, requires an annotated tag object that points
      directly to a commit, peels it, and executes only the peeled commit. On a
      tag push the peeled commit must also equal the event SHA. Resolution never
      creates, moves, pushes, or deletes a tag or release.
  lifecycle:
    - version bump and release notes PR
    - merge Core main
    - release preflight validates the exact main SHA
    - create immutable vMAJOR.MINOR.PATCH tag
    - push tag and create GitHub Release
    - post-tag release-validation.yml attestation

release_writers:
  principle: >-
    Two deliberately distinct tag namespaces exist and must never be
    conflated. Exactly one executable surface may create, move, or push each,
    and neither authorized writer may mutate the other's namespace. The
    invariant is namespace ownership, not the absence of tagging commands:
    "only one git tag in the repository" is the wrong rule.
  namespaces:
    exact_core_release:
      pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      authorized_writer: docs/release/tag-and-release.sh
      description: >-
        Immutable Core release identity. Audit, provenance, and rollback only.
    transitional_consumer_installer:
      pattern: '^v2$'
      authorized_writer: tools/publish_consumer_ci_tag.sh
      description: >-
        The mutable compatibility tag for install-consumer-ci@v2 and the
        bounded optional integration channel declared above. It is never a Core
        production-runtime release mechanism.
  validator: tools/check_release_writers.py

core_main_protection:
  branch: main
  repository: Quantum-L9/l9-ci-core
  mechanism: github_ruleset
  documented_in: docs/release/README.md
  required_rule_types:
    - pull_request
    - required_status_checks
  pull_request:
    require_code_owner_review: true
  required_status_checks:
    contexts_declared_here: false
    minimum_bound_contexts: 1
    note: >-
      Cursor-Governance L9-ORG-009 requires blocking enforcement to be
      evidence-backed, so the required check contexts are taken from real
      successful Actions runs and are deliberately not written here. An
      attestation therefore proves that at least one required status check is
      bound to main, never a specific context string.
  note: >-
    This is the machine-readable form of the protection already documented in
    docs/release/README.md under "Core main protection" (pull request
    required; independent approval for governed paths through CODEOWNERS;
    required checks taken from real successful self-CI runs). It declares no
    new policy; it exists so an attestation reads the expectation from a
    contract instead of hard-coding it.

attestation:
  live_control_plane:
    verifier: tools/verify_control_plane.py
    workflow: .github/workflows/control-plane-attestation.yml
    mutating: false
    checks:
      - organization_required_workflow_binding
      - core_main_protection
      - immutable_releases
      - required_status_freshness
    unknown_is_pass: false
    note: >-
      Read-only. It compares live GitHub state against this contract and never
      creates or edits a ruleset, branch, repository setting, release, or tag.
      Absent credentials, insufficient permissions, and an undeterminable
      remote state are all reported as UNKNOWN, which is not PASS. It is Core
      governance/release assurance and is never a downstream repository's
      responsibility: no governed repository needs organization-admin
      credentials.

sdk:
  repository: Quantum-L9/l9-ci-sdk
  selection:
    authority: Quantum-L9/l9-ci-core
    manifest: .l9/sdk-compatibility.yaml
    reference_type: git_commit_sha
    full_length_required: true
    floating_refs_allowed: false
  promotion:
    requires_core_compatibility_validation: true
    requires_governed_core_change: true
    note: >-
      An SDK change reaches the fleet through exactly one governed Core
      promotion PR that inserts the exact SDK SHA into
      .l9/sdk-compatibility.yaml and passes the SDK contract suite. Core is
      the compatibility firewall; SDK main never enters production because it
      moved.

events:
  organization_ruleset:
    - pull_request
    - merge_group
  cross_repository_push_fanout:
    provided_by_ruleset: false
    note: >-
      GitHub required-workflow rulesets invoke the required workflow on
      pull_request, pull_request_target, and merge_group only. Core's native
      push trigger governs Core's own repository and any repository that calls
      org-ci.yml natively; it is not organization-wide push fanout. A
      post-merge independent attestation is a separate capability and must be
      implemented explicitly, never inferred from the required-workflow model.

governance_clarification:
  id: ruleset-source-branch-binding-is-not-a-reusable-workflow-ref
  statement: >-
    A GitHub organization ruleset required-workflow source-branch binding is a
    GitHub control-plane binding and is not a reusable-workflow consumer
    reference. L9-ORG-008 continues to prohibit
    uses: Quantum-L9/l9-ci-core/...@main in any workflow. It does not prohibit
    the organization ruleset from selecting repository Quantum-L9/l9-ci-core,
    branch main, workflow .github/workflows/org-ci.yml, provided that Core
    main is independently protected as the production control-plane branch.
  core_main_protection_required: true
  recorded_in_cursor_governance: false
  note: >-
    This clarification is proposed from Core. It becomes organization law only
    when recorded in Quantum-L9/Cursor-Governance ORG_INVARIANTS.yaml through
    that repository's own governed change path (L9-ORG-007).

validation:
  contract_tests:
    - tests/workflows/test_release_plane.py
    - tests/release/test_release_contract.py
    - tests/release/test_control_plane_attestation.py
    - tests/release/test_release_writers.py
  admission: >-
    Repository-local tests prove Core's own contracts agree with each other.
    They cannot prove that an organization ruleset is bound to Core main, that
    Core main is protected, or that a release is immutable on GitHub; those
    states remain UNKNOWN until GitHub evidence exists. The attestation
    declared under `attestation.live_control_plane` is how that evidence is
    obtained: it reads live GitHub state and reports PASS, FAIL, or UNKNOWN.
    Its unit tests exercise the comparison logic against recorded API shapes
    and never require live organization access.
