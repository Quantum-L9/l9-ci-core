schema: l9.core-artifact-protocol/v1
metadata:
  repository: Quantum-L9/l9-ci-core
  phase: 2
  status: authoritative
sdk_contract:
  schema: l9.integration-contract/v1
  revision: bc678190582694f6efee08b6b7ea39be7e09bd5c
workspace_layout:
  root: artifacts
  raw:
    root: artifacts/raw
    pattern: artifacts/raw/{provider}/{matrix_id}/
    ownership: Core
    mutability: diagnostic
  canonical:
    root: artifacts/l9
    bundle: artifacts/l9/{matrix_id}/finding-bundle.json
    ownership: SDK
    mutability: immutable_after_validation
  projections:
    root: artifacts/l9
    agent_payload: artifacts/l9/{matrix_id}/agent-review-payload.json
    sarif: artifacts/l9/{matrix_id}/results.sarif
    ownership: SDK
    mutability: immutable_after_validation
  orchestration_records:
    root: artifacts/l9
    gate_result: artifacts/l9/{matrix_id}/gate-result.json
    repository_capabilities: artifacts/l9/{matrix_id}/repository-capabilities.json
    ownership: Core
    mutability: immutable_before_index
  metadata:
    root: artifacts/metadata
    routing_record: artifacts/metadata/{matrix_id}/routing-record.json
    routing_record_schema: l9.core-routing-record/v2
    integrity_index: artifacts/metadata/{matrix_id}/artifact-index.json
    ownership: Core
    mutability: immutable_before_upload
integrity_index:
  schema: l9.core-artifact-index/v1
  root: artifacts
  path: artifacts/metadata/{matrix_id}/artifact-index.json
  algorithm: sha256
  coverage: >-
    Every regular file below the artifact root at index time except the index
    itself. Each entry contains a root-relative POSIX path, byte size, and
    SHA-256 digest. Unknown and unindexed files fail retrieval.
  self_reference: >-
    The index excludes itself to avoid an impossible self-referential digest.
    GitHub's immutable uploaded-artifact identity is the enclosing transport;
    the index verifies every other member after exact-name retrieval.
  relocatability:
    artifact_root: .
    absolute_paths_allowed: false
    parent_traversal_allowed: false
    symlinks_allowed: false
  identity_bindings:
    - exact artifact name
    - analyzed repository and full revision
    - provider and matrix_id
    - exact SDK revision and integration contract
  semantic_scope: >-
    Core hashes bytes and records routes only. It never parses, reconstructs,
    merges, or reserializes SDK-owned finding bundles, agent-review payloads,
    or SARIF logs.
retrieval:
  action: .github/actions/retrieve-artifacts
  downloader: actions/download-artifact
  artifact_selection: exact_name_current_run
  destination_must_be_empty: true
  fail_closed_on:
    - artifact identity mismatch
    - repository or revision mismatch
    - provider, matrix, or SDK mismatch
    - unsafe, absolute, or non-canonical relative path
    - symlink or non-regular indexed member
    - missing indexed member
    - checksum or size mismatch
    - unindexed file
    - missing or unknown route
rules:
  - Core may move or copy canonical files without modifying their bytes.
  - Core must validate a canonical bundle before routing or upload.
  - Core must run SDK compatibility negotiation before upload.
  - Raw reports and canonical bundles must remain separate.
  - Every matrix execution must use a unique matrix_id.
  - Artifact names must include provider and matrix_id.
  - Core must not merge canonical bundles.
  - Core must not infer compatibility from JSON shape.
  - SDK exit codes must propagate without remapping.
  - Core must index the complete routed upload tree before upload.
  - Core artifact-index paths and routes must be relative to the artifact root.
  - Core retrieval must verify the complete index before exposing any route.
  - Core must reject symlinks, path escapes, stale destinations, and unindexed files.
phase_2_outputs:
  - raw provider report
  - validated finding bundle
  - validated agent-review payload
  - SDK-projected SARIF when enabled
  - Core technical gate and capability records when emitted
  - Core routing record
  - complete relocatable Core artifact integrity index
