schema: l9.sdk-compatibility/v1
metadata:
  status: authoritative
  consumer: Quantum-L9/l9-ci-core
  producer: Quantum-L9/l9-ci-sdk
default:
  source: git
  repository: https://github.com/Quantum-L9/l9-ci-sdk.git
  revision: 9fd4efe7a3f2d671e063b0e7c15fd52b95d0ccd1
supported:
  # 9fd4efe7 (l9-ci-sdk#109): new L9-owned rule L9-PYTHON-WRITABLE-FILE-MODE
  # (l9.baseline.python.group-or-other-writable-file-mode) in the packaged
  # Python ruleset: os.chmod / lchmod / fchmod and pathlib chmod / lchmod are
  # reported when the mode grants group or other WRITE permission (0o022 bits,
  # S_IWGRP/S_IWOTH/S_IRWXG/S_IRWXO), not by numeric order, so owner-only 0o700
  # and 0o755 pass and 0o660/0o666/0o777 are reported. Adds one rule file and its
  # semgrep --test fixture; no l9_ci code outside rulesets/semgrep/python, no CLI
  # path, integration-contract, artifact-protocol or schema change;
  # requirements.txt is byte-identical to d09d3963, so requirements_sha256 is
  # unchanged.
  - source: git
    repository: https://github.com/Quantum-L9/l9-ci-sdk.git
    revision: 9fd4efe7a3f2d671e063b0e7c15fd52b95d0ccd1
    integration_contract: l9.integration-contract/v1
    requirements_sha256: 96cad34733f60567c110bc9b7a25679ae5d2c76a3107dad8e118868ab59b70e3
    runtime_locks:
      - cpython-3.12.14-linux-x86_64.txt
    artifact_protocols:
      - l9.finding-bundle/v1
      - l9.agent-review-payload/v1
      - l9.sarif-log/v1
    required_cli_paths:
      - providers detect
      - semgrep run
      - semgrep normalize
      - gate evaluate
      - bundle validate
      - bundle project-agent-payload
      - bundle project-sarif
      - compatibility check
      - baseline compare-tests
      - baseline scan-packet-envelope
      - baseline compare-scan
      - baseline validate-ledger
  # d09d3963 (l9-ci-sdk#108): packaged Semgrep rule precision for the
  # Enrichment.Inference.Engine false positives (SDK ADR-0019): token-usage
  # counts in AST-LOGGING-001/002/003, constant-value proof for the f-string
  # form of L9-PYTHON-SQL-STRING-FORMAT, destination-scoped taint for
  # AST-ROUTING-001/002 and AST-TRANSPORT-004, handler identity for
  # AST-HANDLER-002, and the AST-ROUTING-003 `.internal` regex fix. Rule ids and
  # canonical_rule_ids unchanged. No l9_ci code outside rulesets/semgrep/python,
  # no CLI path, integration-contract, artifact-protocol or schema change;
  # requirements.txt is byte-identical to 6d70e829, so requirements_sha256 is
  # unchanged.
  - source: git
    repository: https://github.com/Quantum-L9/l9-ci-sdk.git
    revision: d09d3963cf8835446b9d1cfd5a03cc79ce16e2e2
    integration_contract: l9.integration-contract/v1
    requirements_sha256: 96cad34733f60567c110bc9b7a25679ae5d2c76a3107dad8e118868ab59b70e3
    runtime_locks:
      - cpython-3.12.14-linux-x86_64.txt
    artifact_protocols:
      - l9.finding-bundle/v1
      - l9.agent-review-payload/v1
      - l9.sarif-log/v1
    required_cli_paths:
      - providers detect
      - semgrep run
      - semgrep normalize
      - gate evaluate
      - bundle validate
      - bundle project-agent-payload
      - bundle project-sarif
      - compatibility check
      - baseline compare-tests
      - baseline scan-packet-envelope
      - baseline compare-scan
      - baseline validate-ledger
  # 6d70e829 (l9-ci-sdk#107): packaged Semgrep rule precision fixes for
  # AST-LOGGING-001/002/003 and AST-ROUTING-004 (SDK ADR-0018: precision by
  # code position and dispatch), Biome `.l9` exclusion, and the SDK's adoption of
  # the l9.repo-execution/v2 make-v1 execution contract. No public API, CLI path,
  # integration-contract, artifact-protocol or schema change; requirements.txt is
  # byte-identical to bc678190, so requirements_sha256 is unchanged.
