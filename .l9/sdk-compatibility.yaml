  # Semgrep target only on files its scan reaches (#130: a language whose files
  # all sit under .semgrepignore'd or out-of-scope paths is not_applicable, so a
  # required instance can no longer scan zero files; the P0 behind every red
  # Cursor-Governance PR after #294); unfinished rule/file analysis counts as
  # incomplete coverage (#131); required central runs disable nosem and scan a
  # declared scope (#128); lock-owned tool pins aligned with Core's lock (#129).
  # No CLI path, integration-contract or artifact-protocol change (one new
