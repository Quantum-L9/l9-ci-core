      - semgrep normalize
      - semgrep consumer-run
      - gate evaluate
      - bundle validate
      - bundle project-agent-payload
      - bundle project-sarif
      - compatibility check
      - baseline compare-tests
      - baseline scan-packet-envelope
      - baseline compare-scan
      - baseline validate-ledger
  # 47ae3ac5 (l9-ci-sdk#140, #142 on 2796d7a4, SDK main ancestor): the
  # default. hardcoded-credential requires a secret-shaped value, not a name
  # (#140); archived code (**/_archived/**) is declared out of required scope
  # with its reason (#142). Deliberately before #134 (d655c806, tests in
  # required scope): the PIN-ADVANCE-2 canary (#319, run 44864948490) showed
  # 1d632037 turning pre-existing test-code findings into blockers in every
  # declared repository (SDK 104, CEG 91, EIE 19, Core 1, Cursor-Governance
  # +5). Pins past d655c806 wait for CENTRAL-DIFF (pre-existing findings warn,
  # new ones block). 1d632037 below stays admitted but is not the default. No
  # CLI path, integration-contract or artifact-protocol change; requirements
  # are byte-identical, so the runtime lock is unchanged. 2796d7a4 is the
  # tested rollback.
