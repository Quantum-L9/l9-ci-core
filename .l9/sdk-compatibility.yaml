  # Django subprocess-injection rule no longer fires on code that is not
  # Django (the finding that held every l9-ci-sdk PR red and one of
  # Cursor-Governance's blocking findings). An unreadable repository keeps
  # every framework-scoped finding. #137 adds a test witness only. No CLI
  # path, integration-contract or artifact-protocol change; requirements.txt
  # is byte-identical to fbe14fec, so requirements_sha256 and the runtime lock
