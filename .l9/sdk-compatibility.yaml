  # fbe14fec (l9-ci-sdk#133 on 9af1a202, SDK main): required central Semgrep
  # runs carry a declared analysis budget (B5) — 30 s per rule and file and
  # --timeout-threshold 0, so Semgrep no longer drops a file's remaining rules
  # after three 5 s timeouts and leaves a required instance incomplete (the
  # Cursor-Governance Python instance after 9af1a202). A pair that still times
  # out stays incomplete coverage. The scope evidence gains `analysis_budget`
  # (semgrep-scan-scope schema 1.1.0, the SDK's own record). #132 is an ADR
  # only. No CLI path, integration-contract or artifact-protocol change;
  # requirements.txt is byte-identical to 9af1a202, so requirements_sha256 and
  # the runtime lock are unchanged. 9af1a202 below is the tested rollback.
