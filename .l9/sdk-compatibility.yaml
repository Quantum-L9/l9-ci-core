supported:
  # 4a887396 (l9-ci-sdk main: #134, #135, #143, #136, #138, #139, #144 on
  # 47ae3ac5): the default from PIN-ADVANCE-3 step two, activated together
  # with Core's CENTRAL-DIFF wiring in org-ci.yml. #144 classifies findings
  # new or pre-existing against --baseline-commit (ADR 0023, bundle schema
  # 1.2.0; an unresolvable or incomplete baseline fails closed); Core passes
  # the first parent of the evaluated revision on pull_request, merge and
  # push (operator decision 2026-11-21, row 23). #138 adds the central
  # finding-waiver ledger (--waivers); #136 adds `semgrep consumer-run` for a
  # declared consumer rulepack (ADR 0021, a required CLI path); #134 puts
  # tests in required scope, whose pre-existing findings are reported as
  # advisory under the baseline (row 26). requirements.txt is byte-identical,
  # so the runtime lock is unchanged. 47ae3ac5 below is the tested rollback.
  - source: git
    repository: https://github.com/Quantum-L9/l9-ci-sdk.git
    revision: 4a887396990a59ffb4a7108790b2fa1005c7865d
    integration_contract: l9.integration-contract/v1
    requirements_sha256: 96cad34733f60567c110bc9b7a25679ae5d2c76a3107dad8e118868ab59b70e3
    runtime_locks:
      - cpython-3.12.14-linux-x86_64.txt
    artifact_protocols:
