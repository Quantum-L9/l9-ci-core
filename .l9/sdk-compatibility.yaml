schema: l9.sdk-compatibility/v1
metadata:
  status: authoritative
  consumer: Quantum-L9/l9-ci-core
  producer: Quantum-L9/l9-ci-sdk
default:
  source: git
  repository: https://github.com/Quantum-L9/l9-ci-sdk.git
  revision: b1a491414ed04bb18d665f8a8755de80947c8200
supported:
  # Current default: l9-ci-sdk PR-005A — adds deterministic
  # `bundle project-sarif` so Core can dogfood SDK-projected SARIF upload
  # without translating findings itself. Still carries the full v2
  # orchestration handoff (`semgrep run` + `gate evaluate`).
  - source: git
    repository: https://github.com/Quantum-L9/l9-ci-sdk.git
    revision: b1a491414ed04bb18d665f8a8755de80947c8200
    integration_contract: l9.integration-contract/v1
    artifact_protocols:
      - l9.finding-bundle/v1
      - l9.agent-review-payload/v1
      - l9.sarif-log/v1
    required_cli_paths:
      - semgrep run
      - semgrep normalize
      - gate evaluate
      - bundle validate
      - bundle project-agent-payload
      - bundle project-sarif
      - compatibility check
      - baseline compare-tests
      - baseline scan-packet-envelope
      - baseline compare-scan
      - baseline validate-ledger
  # Retained as a tested rollback: l9-ci-sdk v1.0.0 — prior default with
  # `semgrep run` + `gate evaluate`, but without `bundle project-sarif`.
  - source: git
    repository: https://github.com/Quantum-L9/l9-ci-sdk.git
    revision: f546f122d33601ea5a4b2592e3482c5c39eddd82
    integration_contract: l9.integration-contract/v1
    artifact_protocols:
      - l9.finding-bundle/v1
      - l9.agent-review-payload/v1
    required_cli_paths:
      - semgrep run
      - semgrep normalize
      - gate evaluate
      - bundle validate
      - bundle project-agent-payload
      - compatibility check
      - baseline compare-tests
      - baseline scan-packet-envelope
      - baseline compare-scan
      - baseline validate-ledger
  # Retained as a tested rollback: first revision to carry the full v2
  # orchestration handoff surface (`semgrep run` + `gate evaluate`).
  - source: git
    repository: https://github.com/Quantum-L9/l9-ci-sdk.git
    revision: 0c487747b0fcd172edaefe9e843dac818de8fc12
    integration_contract: l9.integration-contract/v1
    artifact_protocols:
      - l9.finding-bundle/v1
      - l9.agent-review-payload/v1
    required_cli_paths:
      - semgrep run
      - semgrep normalize
      - gate evaluate
      - bundle validate
      - bundle project-agent-payload
      - compatibility check
      - baseline compare-tests
      - baseline scan-packet-envelope
      - baseline compare-scan
      - baseline validate-ledger
policy:
  arbitrary_install_commands_allowed: false
  dependency_manifest_install_allowed: true
  floating_git_references_allowed: false
  short_git_revisions_allowed: false
  branches_allowed: false
  tags_allowed: false
  unlisted_revisions_allowed: false
  fallback_to_parent_allowed: false
  fallback_to_legacy_cli_allowed: false
