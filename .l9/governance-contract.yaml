schema: l9.core-governance-contract/v1
metadata:
  repository: Quantum-L9/l9-ci-core
  phase: central-orchestration
  status: authoritative

boundary:
  core_owns:
    - central governance defaults
    - execution-profile selection
    - provider enablement
    - provider requiredness
    - SDK policy-file selection
    - waiver lifecycle validation
    - promotion authorization
    - publication-mode selection
    - technical gate enforcement
  github_org_rulesets_own:
    - repository targeting
    - required-workflow enforcement
    - enforcement state
    - bypass principals
  sdk_owns:
    - repository capability detection
    - finding identity resolution
    - finding classification
    - policy interpretation
    - provider failure semantics
    - coverage semantics
    - technical gate evaluation
    - canonical bundle construction
    - canonical bundle validation
  consumer_metadata_may_supply:
    - owner
    - repo_class
    - centrally issued waiver references
  consumer_metadata_may_not_supply:
    - governance mode
    - provider enablement
    - provider requiredness
    - Core revision
    - SDK revision
    - tool versions
    - workflow permissions
    - organization policy

prohibited:
  - Core reading canonical findings to calculate a gate
  - Core translating finding severity
  - Core deriving rule identity
  - Core suppressing canonical findings
  - Core mutating a canonical bundle
  - Core converting an SDK contract failure into advisory success
  - Quantum-L9/.github distributing CI workflows or governance packs
  - consumer repositories weakening central organization policy

modes:
  blocking:
    description: >-
      A non-passing SDK technical gate fails the required Core workflow.
  advisory:
    description: >-
      Findings are published without blocking, but SDK contract and artifact
      failures remain fatal.
  shadow:
    description: >-
      Results are retained for evaluation and promotion evidence without
      becoming a blocking organization decision.
  disabled:
    description: >-
      The provider is not invoked.

failure_invariants:
  always_fatal:
    - invalid central governance configuration
    - unknown execution profile
    - unknown provider
    - malformed or expired waiver
    - unsupported SDK contract
    - invalid canonical bundle
    - artifact compatibility failure
    - SDK internal error
    - operational-limit failure
    - consumer metadata attempting unsupported authority
    - consumer repo_class conflicting with SDK capability detection

outputs:
  - resolved execution profile
  - resolved provider mode
  - resolved provider requiredness
  - resolved strictness
  - selected SDK policy path
  - applicable waiver identifiers
  - governance configuration digest
