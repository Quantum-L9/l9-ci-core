schema: l9.core-governance-contract/v1
metadata:
  repository: Quantum-L9/l9-ci-core
  phase: central-orchestration
  status: authoritative

boundary:
  core_owns:
    - central governance defaults
    - execution-profile selection
    - provider enablement
    - provider requiredness
    - SDK policy-file selection
    - waiver lifecycle validation
    - promotion authorization
    - publication-mode selection
    - technical gate enforcement
  github_org_rulesets_own:
    - repository targeting
    - required-workflow enforcement
    - enforcement state
    - bypass principals
  sdk_owns:
    - repository capability detection
    - finding identity resolution
    - finding classification
    - policy interpretation
    - provider failure semantics
    - coverage semantics
    - technical gate evaluation
    - canonical bundle construction
    - canonical bundle validation
  consumer_metadata_may_supply:
    - owner
    - repo_class
    - centrally issued waiver references
    - product_kind (a declared Quantum-L9/.github ProductKind)
  consumer_metadata_may_not_supply:
    - governance mode
    - provider enablement
    - provider requiredness
    - Core revision
    - SDK revision
    - tool versions
    - workflow permissions
    - organization policy

prohibited:
  - Core reading canonical findings to calculate a gate
  - Core translating finding severity
  - Core deriving rule identity
  - Core suppressing canonical findings
  - Core mutating a canonical bundle
  - Core converting an SDK contract failure into advisory success
  - Quantum-L9/.github distributing CI workflows or governance packs
  - consumer repositories weakening central organization policy

modes:
  blocking:
    description: >-
      A non-passing SDK technical gate fails the required Core workflow.
  advisory:
    description: >-
      Findings are published without blocking, but SDK contract and artifact
      failures remain fatal.
  shadow:
    description: >-
      Results are retained for evaluation and promotion evidence without
      becoming a blocking organization decision.
  disabled:
    description: >-
      The provider is not invoked.

failure_invariants:
  always_fatal:
    - invalid central governance configuration
    - unknown execution profile
    - unknown provider
    - malformed or expired waiver
    - unsupported SDK contract
    - invalid canonical bundle
    - artifact compatibility failure
    - SDK internal error
    - operational-limit failure
    - consumer metadata attempting unsupported authority
    - consumer repo_class conflicting with SDK capability detection

outputs:
  - resolved execution profile
  - resolved provider mode
  - resolved provider requiredness
  - resolved strictness
  - selected SDK policy path
  - applicable waiver identifiers
  - governance configuration digest

ci_runtime_invariants:
  - id: L9-CI-CORE-001
    statement: >-
      Core resolves provider requiredness and enforcement policy from SDK-detected
      capabilities, as well as immutable tool versions, event profiles and central
      configuration at the evaluated revision. A consumer may declare its native project
      facts but must not select, override, disable or shadow these central decisions.
  - id: L9-CI-CORE-002
    statement: >-
      For centrally governed tools, the effective configuration is selected from reviewed
      Core/SDK revision-bound sources at runtime, with an exact content digest.
      Consumer-stamped defaults are not required once the owning stamp and
      repository-execution contracts are safely migrated; genuine product settings remain
      product-owned.
  - id: L9-CI-CORE-003
    statement: >-
      Core must schedule every required provider/language instance selected by the SDK for
      the exact evaluated repository revision, account for each terminal status and enforce
      the applicable technical gate. Missing, skipped, timed-out, untrusted or unevaluated
      required instances cannot yield a passing required check.
  - id: L9-CI-CORE-004
    statement: >-
      A centrally changed tool, rulepack or enforcement policy is promoted only through
      pinned Core/SDK compatibility, representative known-bad and known-good tests, canary
      execution, integrated parity evidence and a reversible rollout. A consumer-local
      equivalent control remains until its central successor is proven.
  - id: L9-CI-CORE-005
    statement: >-
      Central CI must not move write-scoped SaaS, CodeQL or vendor publication credentials
      into untrusted read-only pull-request execution. Native providers may execute at their
      authorized owners and contribute exact-run evidence without Core or SDK impersonating
      their execution or authority.
  - id: L9-CI-CORE-006
    statement: >-
      Claims of fleet-wide required CI coverage require current effective GitHub ruleset
      targeting, branches, required-check freshness, bypass policy and execution
      observations for every in-scope repository. Other account owners are not covered by
      Quantum-L9 rulesets by implication.
