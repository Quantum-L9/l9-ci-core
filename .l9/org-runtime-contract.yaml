schema: l9.org-runtime-contract/v1
metadata:
  repository: Quantum-L9/l9-ci-core
  version: 2.0.0
  status: candidate
  campaign: l9-ci-central-orchestrator-v2
  updated: '2026-08-21'

principle: >-
  A Quantum-L9 repository may describe itself, but it may not define how
  Quantum-L9 CI governs it.

entrypoint:
  workflow: .github/workflows/org-ci.yml
  enforcement_mechanism: github_organization_required_workflow_ruleset
  native_events: [push, pull_request, merge_group]
  ruleset_events: [pull_request, merge_group]
  default_branch_event: push
  canary_event: workflow_dispatch
  compatibility_event: workflow_call
  consumer_copy_required: false
  consumer_core_pin_allowed: false
  push_branch_selector: none
  push_branch_selector_rationale: >-
    GitHub Actions cannot express "this repository's default branch"
    symbolically inside on.push.branches, and Quantum-L9 repositories do not
    all use main. Core therefore declares push unfiltered and leaves ref and
    repository selection to the organization ruleset. Core decides how a
    governed evaluation executes, never which repositories are governed.
  push_authority: >-
    A push trigger is an evaluation lane, not a trusted write lane. The push
    path holds contents:read, targets github.repository at github.sha from the
    GitHub event context only, and accepts no caller-supplied repository, ref,
    or SHA.
  lifecycle_logic_in_core: false
  lifecycle_logic_note: >-
    Core performs no genesis, lifecycle, or repository-age classification.
    Whether an observed push run is a genesis attestation is decided by the
    birth control plane from the run head SHA and the zero-parent root SHA.

inputs:
  event:
    type: string
    enum: [pull_request, push, merge, nightly, release, supply_chain]
    source: Core trigger mapping or compatibility invocation
  profile:
    type: string
    source: Core central governance
    required: false
    note: >-
      pull_request maps to pr_fast; merge_group and push both map to merge
  matrix_id:
    type: string
    required: false
  sdk_revision:
    type: string
    required: false
    note: >-
      Compatibility/canary override only. It must be a full 40-character SHA
      allowlisted by .l9/sdk-compatibility.yaml. Consumer repositories do not
      own this value in the organization-required workflow path.
  semgrep_version:
    type: string
    required: false
    note: Exact centrally selected Semgrep version.
  artifact_retention_days:
    type: number
    required: false

consumer_metadata:
  path: .l9/ci.json
  schema: .l9/ci-consumer.schema.json
  required: false
  allowed_fields:
    - schema
    - owner
    - repo_class
    - waiver_refs
  authority: descriptive_only
  may_not_control:
    - workflow source or revision
    - Core revision
    - SDK revision
    - provider enablement or requiredness
    - governance mode
    - tool versions
    - permissions
    - organization policy
    - required checks
  repo_class_behavior: >-
    repo_class is a consistency assertion against SDK repository capability
    detection. It cannot enable a capability that the SDK does not detect.

outputs:
  artifact_name: string
  technical_gate_status: [pass, fail, incomplete]
  mode: [blocking, advisory, shadow, disabled]
  sdk_revision: string
  enforcement_signal: github_required_workflow_job_conclusion

ownership:
  github_org_rulesets_own:
    - repository targeting
    - required-workflow enforcement
    - ruleset enforcement state
    - bypass principals
  core_owns:
    - the organization CI workflow source
    - runtime orchestration
    - security-sensitive execution composition
    - central governance defaults
    - execution-profile mapping
    - provider enablement and requiredness
    - immutable SDK provisioning and compatibility
    - exact tool-version selection
    - consumer metadata validation
    - artifact routing and retention
    - technical gate enforcement
    - read-only workflow summaries and artifact publication
  sdk_owns:
    - repository capability detection
    - provider execution
    - provider-native parsing
    - canonical evidence and findings
    - semantic validation
    - technical gate evaluation
    - deterministic projections
  consumer_owns:
    - source code
    - native project configuration
    - optional bounded ownership and repo-class pointers
  prohibited:
    - CI distribution from Quantum-L9/.github
    - copied L9 workflows in consumer repositories as an enforcement mechanism
    - copied L9 governance packs in consumer repositories
    - consumer-owned Core or SDK pins for organization enforcement
    - consumer weakening of centrally selected policy
    - a second organization CI control-plane repository
    - write-scoped publication from the pull_request required-workflow path

central_defaults:
  source: .github/actions/resolve-governance/defaults/
  transport: bundled_with_pinned_core_action
  consumer_workspace_dependency: false
  filenames:
    - execution-profiles.yaml
    - rule-modes.yaml
    - provider-requiredness.yaml
    - quality-thresholds.yaml
    - waivers.yaml
    - promotion-policy.yaml

pinning:
  required_workflow:
    selected_by: github_organization_ruleset
    consumer_selected: false
  core_internal_actions:
    policy: full-40-char-sha
    floating_references_allowed: false
  sdk_revision:
    policy: per .l9/sdk-compatibility.yaml
    floating_git_references_allowed: false
    branches_allowed: false
    tags_allowed: false
    short_git_revisions_allowed: false

validation:
  contract_tests:
    - tests/workflows/test_org_runtime_contract.py
    - tests/workflows/test_org_ci_event_resolution.py
    - tests/workflows/test_org_runtime_interface.py
    - tests/governance/test_org_governance_defaults.py
    - tests/governance/test_consumer_metadata.py
  admission: >-
    Claims must be re-derived from executable Core behavior. Repository-local
    tests cannot prove organization ruleset activation or a real remote run;
    those states remain UNKNOWN until GitHub evidence exists.
