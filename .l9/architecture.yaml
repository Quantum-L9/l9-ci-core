schema: l9.architecture-spec/v1
metadata:
  repository: Quantum-L9/l9-ci-core
  generation: 3
  phase: central-orchestration
  status: authoritative

identity:
  role: central-ci-orchestrator
  description: >-
    The single organization CI workflow source and orchestration authority for
    Quantum-L9 repositories. GitHub organization rulesets target repositories
    and require Core directly; CI is not distributed through Quantum-L9/.github
    or copied into consumers.

principle: >-
  A Quantum-L9 repository may describe itself, but it may not define how
  Quantum-L9 CI governs it.

dependency_direction:
  allowed:
    - l9-ci-core -> l9-ci-sdk
  prohibited:
    - l9-ci-sdk -> l9-ci-core

sdk:
  repository: Quantum-L9/l9-ci-sdk
  revision: b1a491414ed04bb18d665f8a8755de80947c8200
  integration_contract: l9.integration-contract/v1

owned_by_core:
  - organization CI workflow source
  - GitHub Actions orchestration
  - workflow permissions
  - central governance defaults
  - execution-profile mapping
  - provider enablement and requiredness
  - immutable SDK provisioning
  - exact CI tool-version selection
  - consumer metadata validation
  - artifact routing and retention
  - technical gate enforcement
  - GitHub check publication
  - workflow summaries and annotations
  - rollout-compatible public runtime interface

owned_by_github_org_rulesets:
  - repository targeting
  - required-workflow enforcement
  - enforcement state
  - bypass principals

owned_by_sdk:
  - repository capability detection
  - provider execution implementation
  - provider-native report parsing
  - canonical evidence
  - canonical findings
  - finding identity resolution
  - policy classification implementation
  - provider failure records
  - coverage records
  - canonical bundle construction
  - schema validation
  - semantic validation
  - deterministic serialization
  - agent and SARIF projections

consumer_repository_may_own:
  - source code
  - native project configuration
  - optional .l9/ci.json ownership pointer
  - optional repo_class consistency pointer
  - optional centrally issued waiver references

consumer_repository_may_not_own:
  - organization CI workflow implementation
  - Core or SDK revision for required organization CI
  - provider requiredness
  - governance mode
  - central tool versions
  - organization policy
  - workflow permissions
  - required-check definition

prohibited_architecture:
  - Quantum-L9/.github distributing CI workflows or governance packs
  - copied l9-analysis.yml as organization enforcement
  - copied L9 governance packs as organization enforcement
  - per-repository Core orchestration forks
  - a second L9 CI control-plane repository
  - Core parsing provider-native scanner reports
  - Core reconstructing canonical findings
  - SDK owning GitHub workflow permissions or organization rollout
