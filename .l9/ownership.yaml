schema: l9.ownership-spec/v1
repository: Quantum-L9/l9-ci-core

core_owns:
  orchestration:
    - organization required-workflow source
    - reusable and canary execution surfaces
    - event-to-profile mapping
    - job topology
    - concurrency
  governance:
    - central governance defaults
    - provider enablement and requiredness
    - execution mode
    - waiver validation
    - promotion policy
  security:
    - workflow permissions
    - trust-boundary enforcement
    - fork safety
    - immutable dependency selection
  provisioning:
    - SDK source selection
    - SDK revision validation
    - SDK runtime preparation
    - SDK public-contract probing
    - exact CI tool pins
  consumer_contract:
    - optional .l9/ci.json schema
    - consumer metadata validation
    - fail-closed consistency checks against SDK detection
  publication:
    - artifact retention
    - check publication
    - summaries
    - annotations

sdk_owns:
  analysis:
    - provider SPI
    - provider execution contract
    - provider-native report import
    - repository capability detection
  canonicalization:
    - evidence records
    - findings
    - classifications
    - coverage
    - provider failures
    - finding bundles
  semantics:
    - identity resolution
    - policy classification library
    - technical gate evaluation primitives
  artifacts:
    - schemas
    - schema validation
    - semantic validation
    - deterministic serialization
    - agent-review payload projection
    - SARIF projection

organization_rulesets_own:
  - repository targeting
  - required-workflow enforcement
  - enforcement state
  - bypass principals

consumer_repositories_own:
  - source code
  - native tool and project configuration
  - optional ownership/repo-class/waiver pointers

prohibited_in_core:
  - provider report parser
  - Semgrep JSON parser
  - canonical finding model
  - canonical evidence model
  - copied SDK schema
  - rule identity derivation
  - severity normalization
  - scanner adapter
  - AST parser
  - Tree-sitter grammar
  - repository graph engine
  - CI distribution through Quantum-L9/.github
  - consumer workflow seeding as organization enforcement

prohibited_in_consumers:
  - copied organization CI orchestration
  - organization governance mode selection
  - provider requiredness selection
  - Core or SDK version selection for required CI
  - central tool-version selection
  - workflow permission escalation
