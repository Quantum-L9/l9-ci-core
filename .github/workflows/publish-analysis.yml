---
name: Publish L9 analysis
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
      profile:
        type: string
        required: true
      mode:
        type: string
        required: true
      provider:
        type: string
        required: false
        default: semgrep
      matrix-id:
        type: string
        required: true
      sdk-revision:
        type: string
        required: false
        default: 0c487747b0fcd172edaefe9e843dac818de8fc12
      minimum-sdk-version:
        type: string
        required: false
        default: "1.0.0"
      governance-digest:
        type: string
        required: true
      repository-revision:
        type: string
        required: true
      workflow-result:
        description: SDK-derived success or failure conclusion.
        type: string
        required: true
      artifact-url:
        type: string
        required: false
        default: ""
    outputs:
      check-run-url:
        value: ${{ jobs.publish.outputs['check-run-url'] }}
permissions:
  actions: read
  checks: write
  contents: read
jobs:
  shadow:
    if: inputs.mode == 'shadow' || inputs.mode == 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record non-publication mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            shadow|disabled)
              echo "GitHub check publication disabled for mode ${MODE}"
              ;;
            *)
              echo "Unexpected mode" >&2
              exit 2
              ;;
          esac
  publish:
    if: inputs.mode == 'blocking' || inputs.mode == 'advisory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      check-run-url: ${{ steps.publish.outputs['check-run-url'] }}
    steps:
      - name: Checkout Core workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .l9/runtime/core-control-plane
          fetch-depth: 1
          persist-credentials: false
      - name: Download immutable analysis artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-name }}
          path: .l9/runtime/publication/download
      - id: locate
        name: Locate canonical artifacts
        shell: bash
        env:
          MATRIX_ID: ${{ inputs.matrix-id }}
        run: |
          set -euo pipefail
          if [[ ! "${MATRIX_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid matrix-id" >&2
            exit 2
          fi
          root=".l9/runtime/publication/download"
          bundle="${root}/l9/${MATRIX_ID}/finding-bundle.json"
          gate_result="${root}/l9/${MATRIX_ID}/gate-result.json"
          payload="${root}/l9/${MATRIX_ID}/agent-review-payload.json"
          manifest="${root}/metadata/${MATRIX_ID}/artifact-manifest.json"
          for artifact in \
            "${bundle}" \
            "${gate_result}" \
            "${payload}" \
            "${manifest}"
          do
            test -f "${artifact}"
          done
          {
            echo "bundle=${bundle}"
            echo "gate-result=${gate_result}"
            echo "payload=${payload}"
            echo "manifest=${manifest}"
          } >> "${GITHUB_OUTPUT}"
      - name: Verify manifest-bound gate result
        shell: bash
        env:
          MANIFEST: ${{ steps.locate.outputs.manifest }}
          GATE_RESULT: ${{ steps.locate.outputs['gate-result'] }}
          WORKFLOW_RESULT: ${{ inputs.workflow-result }}
        run: |
          set -euo pipefail
          case "${WORKFLOW_RESULT}" in
            success|failure)
              ;;
            *)
              echo "workflow-result must be success or failure" >&2
              exit 2
              ;;
          esac
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          from typing import Any
          manifest = Path(os.environ["MANIFEST"])
          gate_result = Path(os.environ["GATE_RESULT"])
          document: Any = json.loads(
              manifest.read_text(encoding="utf-8")
          )
          if not isinstance(document, dict):
              raise SystemExit("artifact manifest must be an object")
          artifacts = document.get("artifacts")
          if not isinstance(artifacts, dict):
              raise SystemExit("manifest artifacts must be an object")
          canonical = artifacts.get("canonical")
          if not isinstance(canonical, dict):
              raise SystemExit("manifest canonical section is missing")
          gate_entry = canonical.get("gate_result")
          if not isinstance(gate_entry, dict):
              raise SystemExit("manifest gate_result entry is missing")
          expected = gate_entry.get("sha256")
          actual = hashlib.sha256(
              gate_result.read_bytes()
          ).hexdigest()
          if expected != actual:
              raise SystemExit("gate-result digest does not match manifest")
          PY
      - id: sdk
        name: Provision immutable SDK
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/provision-sdk
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ inputs.sdk-revision }}
          runtime-directory: .l9/runtime/publication/sdk
      - name: Revalidate downloaded canonical bundle
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/validate-bundle
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: ${{ steps.locate.outputs.bundle }}
          minimum-sdk-version: ${{ inputs.minimum-sdk-version }}
      - id: render
        name: Render publication payload
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/render-publication
        with:
          agent-payload: ${{ steps.locate.outputs.payload }}
          profile: ${{ inputs.profile }}
          mode: ${{ inputs.mode }}
          provider: ${{ inputs.provider }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          governance-digest: ${{ inputs.governance-digest }}
          repository-revision: ${{ inputs.repository-revision }}
          workflow-result: ${{ inputs.workflow-result }}
          run-url: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
          artifact-url: ${{ inputs.artifact-url }}
          output: .l9/runtime/publication/publication.json
      - name: Write workflow summary
        shell: bash
        env:
          TITLE: ${{ steps.render.outputs.title }}
          SUMMARY: ${{ steps.render.outputs.summary }}
          CONCLUSION: ${{ steps.render.outputs.conclusion }}
        run: |
          {
            echo "# ${TITLE}"
            echo
            echo "${SUMMARY}"
            echo
            echo "**Conclusion:** \`${CONCLUSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - id: publish
        name: Publish GitHub check
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/publish-check
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publication: .l9/runtime/publication/publication.json
      - name: Record check URL
        shell: bash
        env:
          CHECK_URL: ${{ steps.publish.outputs['check-run-url'] }}
        run: |
          set -euo pipefail
          test -n "${CHECK_URL}"
          echo "Published check: ${CHECK_URL}"
