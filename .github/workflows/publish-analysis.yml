# Trusted check-publication capability. This workflow never checks out or
# executes the analyzed revision. It retrieves a verified artifact set, asks the
# pinned SDK to validate the bundle, renders and preflights locally, and only
# then performs one explicitly elected GitHub Checks write.
name: Publish L9 analysis check
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Exact current-run artifact name when no handoff is supplied.
        type: string
        required: false
        default: ""
      artifact-handoff:
        description: Optional canonical l9.core-artifact-handoff/v1 descriptor JSON.
        type: string
        required: false
        default: ""
      profile:
        type: string
        required: true
      mode:
        type: string
        required: true
      provider:
        type: string
        required: false
        default: semgrep
      matrix-id:
        type: string
        required: true
      sdk-revision:
        type: string
        required: false
        default: bc678190582694f6efee08b6b7ea39be7e09bd5c
      governance-digest:
        type: string
        required: true
      repository-revision:
        type: string
        required: true
      workflow-result:
        type: string
        required: true
      artifact-url:
        type: string
        required: false
        default: ""
      publish-check:
        description: Explicitly elect the GitHub check write.
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  publish-check:
    if: >-
      inputs.publish-check
      && (inputs.mode == 'blocking' || inputs.mode == 'advisory')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - id: artifacts
        name: Retrieve and verify immutable analysis artifact
        # CORE_ACTIONS_PIN; descriptor mode selects producer/run/artifact identity
        # from the closed handoff. Current-run exact-name mode remains compatible.
        uses: Quantum-L9/l9-ci-core/.github/actions/retrieve-artifacts@c6f256a1c06dcb837b377d58b0247e2892a3ef0f
        with:
          artifact-name: ${{ inputs.artifact-name }}
          handoff-descriptor: ${{ inputs.artifact-handoff }}
          token: ${{ github.token }}
          matrix-id: ${{ inputs.matrix-id }}
          provider: ${{ inputs.provider }}
          repository: ${{ github.repository }}
          repository-revision: ${{ inputs.repository-revision }}
          sdk-revision: ${{ inputs.sdk-revision }}
          destination: .l9/runtime/publication/download
      - id: sdk
        name: Provision immutable SDK
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ inputs.sdk-revision }}
      - name: Revalidate downloaded canonical bundle
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: ${{ steps.artifacts.outputs.bundle }}
      - id: render
        name: Render publication payload
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/render-publication@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          agent-payload: ${{ steps.artifacts.outputs.agent-payload }}
          gate-result: ${{ steps.artifacts.outputs.gate-result }}
          profile: ${{ inputs.profile }}
          mode: ${{ inputs.mode }}
          provider: ${{ inputs.provider }}
          sdk-revision: ${{ steps.sdk.outputs.sdk-revision }}
          governance-digest: ${{ inputs.governance-digest }}
          repository-revision: ${{ inputs.repository-revision }}
          workflow-result: ${{ inputs.workflow-result }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          artifact-url: ${{ inputs.artifact-url }}
          output: .l9/runtime/publication/publication.json
      - name: Preflight publication envelope
        # CORE_ACTIONS_PIN; no token means local validation only.
        uses: Quantum-L9/l9-ci-core/.github/actions/publish-check@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          repository: ${{ github.repository }}
          publication: .l9/runtime/publication/publication.json
          run-id: ${{ github.run_id }}
          matrix-id: ${{ inputs.matrix-id }}
          preflight-only: "true"
      - name: Write workflow summary
        env:
          TITLE: ${{ steps.render.outputs.title }}
          SUMMARY: ${{ steps.render.outputs.summary }}
          CONCLUSION: ${{ steps.render.outputs.conclusion }}
        run: |
          {
            echo "# ${TITLE}"
            echo
            echo "${SUMMARY}"
            echo
            echo "**Conclusion:** \`${CONCLUSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - id: publish
        name: Create or update GitHub check
        # CORE_ACTIONS_PIN; this is the job's only remote publication write.
        uses: Quantum-L9/l9-ci-core/.github/actions/publish-check@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publication: .l9/runtime/publication/publication.json
          run-id: ${{ github.run_id }}
          matrix-id: ${{ inputs.matrix-id }}
      - name: Record check URL
        env:
          CHECK_URL: ${{ steps.publish.outputs.check-run-url }}
          CHECK_OPERATION: ${{ steps.publish.outputs.check-run-operation }}
        run: |
          if [[ -n "${CHECK_URL}" ]]; then
            echo "${CHECK_OPERATION^} check: ${CHECK_URL}"
          fi

  no-publication:
    if: '!inputs.publish-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record no check election
        env:
          MODE: ${{ inputs.mode }}
        run: echo "No GitHub check publication capability elected for mode ${MODE}"

  suppressed:
    if: >-
      inputs.publish-check
      && (inputs.mode == 'shadow' || inputs.mode == 'disabled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Preserve non-publication mode
        env:
          MODE: ${{ inputs.mode }}
        run: echo "GitHub check publication suppressed for mode ${MODE}"

  invalid-mode:
    if: >-
      inputs.mode != 'blocking'
      && inputs.mode != 'advisory'
      && inputs.mode != 'shadow'
      && inputs.mode != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject unknown mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "Unsupported publication mode: ${MODE}" >&2
          exit 2
