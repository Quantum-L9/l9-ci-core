name: Publish L9 analysis
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
      profile:
        type: string
        required: true
      mode:
        type: string
        required: true
      provider:
        type: string
        required: false
        default: semgrep
      matrix-id:
        type: string
        required: true
      sdk-revision:
        type: string
        required: false
        default: bc678190582694f6efee08b6b7ea39be7e09bd5c
      governance-digest:
        type: string
        required: true
      repository-revision:
        type: string
        required: true
      workflow-result:
        type: string
        required: true
      artifact-url:
        type: string
        required: false
        default: ""
# Caller contract. GitHub validates a reusable-workflow graph before it
# schedules any job, and a called workflow can only keep or reduce the token
# permissions its caller granted — never elevate them. Every job that `uses:`
# this workflow (directly, or through analyze-semgrep.yml / nightly.yml, whose
# grants are the ceiling for the whole nested chain) must therefore grant at
# least the block below, `security-events: write` included. A caller that omits
# a scope does not get a degraded run: the run ends `startup_failure` with zero
# jobs and nothing executes (workflow audit 2026-09-13, F-001; enforced by
# tests/workflows/test_reusable_workflow_permission_chain.py).
permissions:
  actions: read
  checks: write
  contents: read
  # Required only to upload the SDK-projected SARIF to GitHub code scanning.
  security-events: write
jobs:
  shadow:
    if: inputs.mode == 'shadow' || inputs.mode == 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record non-publication mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            shadow|disabled)
              echo "GitHub check publication disabled for mode ${MODE}"
              ;;
            *)
              echo "Unexpected mode" >&2
              exit 2
              ;;
          esac
  publish:
    if: inputs.mode == 'blocking' || inputs.mode == 'advisory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin             "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin             "https://github.com/${REPOSITORY}.git"
      - id: artifacts
        name: Retrieve and verify immutable analysis artifact
        uses: Quantum-L9/l9-ci-core/.github/actions/retrieve-artifacts@def55c54ff4ba654c2ebea088dde71db0b5f7135
        with:
          artifact-name: ${{ inputs.artifact-name }}
          matrix-id: ${{ inputs.matrix-id }}
          provider: ${{ inputs.provider }}
          repository: ${{ github.repository }}
          repository-revision: ${{ inputs.repository-revision }}
          sdk-revision: ${{ inputs.sdk-revision }}
          destination: .l9/runtime/publication/download
      # This reusable workflow runs in the CALLER's checkout, so `uses: ./...`
      # local-action refs resolve against the consumer repo (which does not
      # vendor Core's actions) and fail. Reference Core's actions by their
      # fully-qualified pinned form instead; keep the pin on a released commit.
      - id: sdk
        name: Provision immutable SDK
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@def55c54ff4ba654c2ebea088dde71db0b5f7135
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ inputs.sdk-revision }}
      - name: Revalidate downloaded canonical bundle
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@def55c54ff4ba654c2ebea088dde71db0b5f7135
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: ${{ steps.artifacts.outputs.bundle }}
      - id: render
        name: Render publication payload
        uses: Quantum-L9/l9-ci-core/.github/actions/render-publication@402b604c7893ff5bf30e251beaf49d5cf230b63d
        with:
          agent-payload: ${{ steps.artifacts.outputs.agent-payload }}
          profile: ${{ inputs.profile }}
          mode: ${{ inputs.mode }}
          provider: ${{ inputs.provider }}
          sdk-revision: ${{ steps.sdk.outputs.sdk-revision }}
          governance-digest: ${{ inputs.governance-digest }}
          repository-revision: ${{ inputs.repository-revision }}
          workflow-result: ${{ inputs.workflow-result }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          artifact-url: ${{ inputs.artifact-url }}
          output: .l9/runtime/publication/publication.json
      # Validate every local envelope before the first remote publication side
      # effect. This parses only transport structure: finding semantics remain
      # exclusively in the validated SDK bundle and SDK-owned projections.
      - name: Preflight publication and SARIF envelopes
        uses: Quantum-L9/l9-ci-core/.github/actions/publish-check@def55c54ff4ba654c2ebea088dde71db0b5f7135
        with:
          repository: ${{ github.repository }}
          publication: .l9/runtime/publication/publication.json
          sarif: ${{ steps.artifacts.outputs.sarif }}
          run-id: ${{ github.run_id }}
          matrix-id: ${{ inputs.matrix-id }}
          preflight-only: "true"
      - name: Write workflow summary
        env:
          TITLE: ${{ steps.render.outputs.title }}
          SUMMARY: ${{ steps.render.outputs.summary }}
          CONCLUSION: ${{ steps.render.outputs.conclusion }}
        run: |
          {
            echo "# ${TITLE}"
            echo
            echo "${SUMMARY}"
            echo
            echo "**Conclusion:** \`${CONCLUSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload SDK-projected SARIF to code scanning
        if: steps.artifacts.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v3
        with:
          sarif_file: ${{ steps.artifacts.outputs.sarif }}
          # The SARIF is produced deterministically by the SDK for this exact
          # commit; label the code-scanning category by matrix so parallel
          # analyses do not overwrite each other's results.
          category: l9-${{ inputs.matrix-id }}
      - id: publish
        name: Create or update GitHub check
        uses: Quantum-L9/l9-ci-core/.github/actions/publish-check@def55c54ff4ba654c2ebea088dde71db0b5f7135
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publication: .l9/runtime/publication/publication.json
          run-id: ${{ github.run_id }}
          matrix-id: ${{ inputs.matrix-id }}
      - name: Record check URL
        env:
          CHECK_URL: ${{ steps.publish.outputs.check-run-url }}
          CHECK_OPERATION: ${{ steps.publish.outputs.check-run-operation }}
        run: |
          if [[ -n "${CHECK_URL}" ]]; then
            echo "${CHECK_OPERATION^} check: ${CHECK_URL}"
          fi
