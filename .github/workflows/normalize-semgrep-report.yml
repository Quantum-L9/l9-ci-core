name: Normalize Semgrep report
on:
  workflow_call:
    inputs:
      report-path:
        type: string
        required: true
      snapshot-id:
        type: string
        required: true
      matrix-id:
        type: string
        required: true
      provider-version:
        type: string
        required: false
        default: unknown
      repository-root:
        type: string
        required: false
        default: .
      identity-map:
        type: string
        required: false
        default: ""
      policy:
        type: string
        required: false
        default: ""
      strict:
        type: boolean
        required: false
        default: true
      required-provider:
        type: boolean
        required: false
        default: true
      dirty:
        type: string
        required: false
        default: unset
      minimum-sdk-version:
        type: string
        required: false
        default: ""
      retention-days:
        type: number
        required: false
        default: 14
    outputs:
      artifact-name:
        description: Uploaded Phase 2 artifact set name.
        value: ${{ jobs.normalize.outputs.artifact-name }}
      artifact-handoff:
        description: Canonical cross-run artifact handoff descriptor JSON.
        value: ${{ jobs.normalize.outputs.artifact-handoff }}
permissions:
  contents: read
concurrency:
  group: normalize-semgrep-${{ github.workflow }}-${{ github.ref }}-${{ inputs.matrix-id }}
  cancel-in-progress: true
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact-name }}
      artifact-handoff: ${{ steps.handoff.outputs.descriptor }}
      bundle-path: ${{ steps.route.outputs.bundle }}
      payload-path: ${{ steps.route.outputs.agent-payload }}
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin             "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin             "https://github.com/${REPOSITORY}.git"
      - id: names
        name: Resolve collision-safe paths
        env:
          MATRIX_ID: ${{ inputs.matrix-id }}
        run: |
          set -euo pipefail
          if [[ ! "${MATRIX_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid matrix-id" >&2
            exit 2
          fi
          work=".l9/runtime/phase-2/${MATRIX_ID}"
          artifact_name="l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${work}"
          {
            echo "work=${work}"
            echo "bundle=${work}/finding-bundle.json"
            echo "payload=${work}/agent-review-payload.json"
            echo "artifact-name=${artifact_name}"
          } >> "${GITHUB_OUTPUT}"
      - id: sdk
        name: Provision immutable SDK
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: 0c487747b0fcd172edaefe9e843dac818de8fc12  # supported rollback; default pin lives in sdk-compatibility.yaml
      - name: Normalize provider report
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-normalize
          input: ${{ inputs.report-path }}
          output: ${{ steps.names.outputs.bundle }}
          root: ${{ inputs.repository-root }}
          snapshot-id: ${{ inputs.snapshot-id }}
          provider-version: ${{ inputs.provider-version }}
          identity-map: ${{ inputs.identity-map }}
          policy: ${{ inputs.policy }}
          strict: ${{ inputs.strict }}
          required: ${{ inputs.required-provider }}
          dirty: ${{ inputs.dirty }}
          revision: ${{ github.sha }}
      - name: Validate canonical bundle
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: ${{ steps.names.outputs.bundle }}
          minimum-sdk-version: ${{ inputs.minimum-sdk-version }}
      - id: gate
        name: Evaluate gate
        run: |
          set -euo pipefail
          # The SDK is the gate-decision authority. The manifest requires the
          # canonical gate-result artifact; this step writes that file and
          # accepts the same 0/1/6 exits analyze-semgrep already records.
          args=(
            gate evaluate
            --bundle "${L9_BUNDLE}"
            --output "${L9_WORK}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *)
              echo "gate evaluate failed with unexpected exit ${exit_code}" >&2
              exit "${exit_code}"
              ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK gate verdict: ${status} (exit ${exit_code})"
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_WORK: ${{ steps.names.outputs.work }}
          L9_BUNDLE: ${{ steps.names.outputs.bundle }}
          L9_STRICT: ${{ inputs.strict }}
      - name: Project agent-review payload
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: ${{ steps.names.outputs.bundle }}
          output: ${{ steps.names.outputs.payload }}
          strict: ${{ inputs.strict }}
      - id: route
        name: Route artifacts
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          provider: semgrep
          matrix-id: ${{ inputs.matrix-id }}
          raw-report: ${{ inputs.report-path }}
          bundle: ${{ steps.names.outputs.bundle }}
          agent-payload: ${{ steps.names.outputs.payload }}
          destination-root: artifacts
      - name: Revalidate routed canonical bundle
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: ${{ steps.route.outputs.bundle }}
          minimum-sdk-version: ${{ inputs.minimum-sdk-version }}
      - name: Stage gate result
        env:
          L9_WORK: ${{ steps.names.outputs.work }}
          MATRIX_ID: ${{ inputs.matrix-id }}
        run: |
          set -euo pipefail
          cp "${L9_WORK}/gate-result.json" \
            "artifacts/l9/${MATRIX_ID}/gate-result.json"
      - name: Build artifact manifest
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          provider: semgrep
          matrix-id: ${{ inputs.matrix-id }}
          artifact-name: ${{ steps.names.outputs.artifact-name }}
          repository: ${{ github.repository }}
          repository-revision: ${{ github.sha }}
          sdk-revision: ${{ steps.sdk.outputs.sdk-revision }}
          artifact-root: artifacts
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs.agent-payload }}
          raw-directory: ${{ steps.route.outputs.raw-directory }}
          routing-record: ${{ steps.route.outputs.routing-record }}
          output: artifacts/metadata/${{ inputs.matrix-id }}/artifact-index.json
      - id: upload
        name: Upload Phase 2 artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 6
          overwrite: false
          include-hidden-files: true
      - id: handoff
        name: Create artifact handoff descriptor
        uses: Quantum-L9/l9-ci-core/.github/actions/create-artifact-handoff@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-name: ${{ steps.names.outputs.artifact-name }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
          provider: semgrep
          matrix-id: ${{ inputs.matrix-id }}
          repository: ${{ github.repository }}
          repository-revision: ${{ github.sha }}
          sdk-revision: ${{ steps.sdk.outputs.sdk-revision }}
          output: .l9/runtime/handoffs/${{ inputs.matrix-id }}.json
