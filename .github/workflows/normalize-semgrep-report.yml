---
name: Normalize Semgrep report
on:
  workflow_call:
    inputs:
      report-path:
        description: Report path in the caller checkout or downloaded artifact.
        type: string
        required: true
      report-artifact-name:
        description: Optional artifact containing the provider report.
        type: string
        required: false
        default: ""
      snapshot-id:
        type: string
        required: true
      matrix-id:
        type: string
        required: true
      provider-version:
        type: string
        required: false
        default: unknown
      repository-root:
        type: string
        required: false
        default: .
      repository-revision:
        description: Immutable caller revision represented by the bundle.
        type: string
        required: false
        default: ""
      identity-map:
        type: string
        required: false
        default: ""
      policy:
        type: string
        required: false
        default: ""
      strict:
        type: boolean
        required: false
        default: true
      required-provider:
        type: boolean
        required: false
        default: true
      dirty:
        type: string
        required: false
        default: unset
      sdk-revision:
        type: string
        required: false
        default: 0c487747b0fcd172edaefe9e843dac818de8fc12
      minimum-sdk-version:
        type: string
        required: false
        default: "1.0.0"
      retention-days:
        type: number
        required: false
        default: 14
    outputs:
      artifact-name:
        value: ${{ jobs.normalize.outputs['artifact-name'] }}
      bundle-path:
        value: ${{ jobs.normalize.outputs['bundle-path'] }}
      payload-path:
        value: ${{ jobs.normalize.outputs['payload-path'] }}
      gate-result-path:
        value: ${{ jobs.normalize.outputs['gate-result-path'] }}
      workflow-conclusion:
        value: ${{ jobs.normalize.outputs['workflow-conclusion'] }}
      sdk-revision:
        value: ${{ jobs.normalize.outputs['sdk-revision'] }}
permissions:
  contents: read
concurrency:
  group: >-
    normalize-semgrep-${{ github.workflow }}-${{ github.ref }}-${{
    inputs.matrix-id }}
  cancel-in-progress: true
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.names.outputs['artifact-name'] }}
      bundle-path: ${{ steps.route.outputs.bundle }}
      payload-path: ${{ steps.route.outputs['agent-payload'] }}
      gate-result-path: ${{ steps.route.outputs['gate-result'] }}
      workflow-conclusion: >-
        ${{ steps.gate.outputs['workflow-conclusion'] }}
      sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
    steps:
      - name: Checkout immutable caller revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.repository-revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout Core workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .l9/runtime/core-control-plane
          fetch-depth: 1
          persist-credentials: false
      - name: Download provider-report artifact
        if: ${{ inputs.report-artifact-name != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.report-artifact-name }}
          path: .l9/runtime/provider-input
      - id: report
        name: Resolve provider report
        shell: bash
        env:
          REPORT_PATH: ${{ inputs.report-path }}
          REPORT_ARTIFACT_NAME: ${{ inputs.report-artifact-name }}
        run: |
          set -euo pipefail
          if [ -n "${REPORT_ARTIFACT_NAME}" ]; then
            candidate=".l9/runtime/provider-input/${REPORT_PATH}"
          else
            candidate="${REPORT_PATH}"
          fi
          resolved="$(realpath -e "${candidate}")"
          case "${resolved}" in
            "${GITHUB_WORKSPACE}"/*)
              ;;
            *)
              echo "provider report escapes GITHUB_WORKSPACE" >&2
              exit 2
              ;;
          esac
          test -f "${resolved}"
          echo "report=${resolved}" >> "${GITHUB_OUTPUT}"
      - id: names
        name: Resolve collision-safe paths
        shell: bash
        env:
          MATRIX_ID: ${{ inputs.matrix-id }}
        run: |
          set -euo pipefail
          if [[ ! "${MATRIX_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid matrix-id" >&2
            exit 2
          fi
          work=".l9/runtime/phase-2/${MATRIX_ID}"
          artifact_name="l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${work}"
          {
            echo "work=${work}"
            echo "bundle=${work}/finding-bundle.json"
            echo "payload=${work}/agent-review-payload.json"
            echo "gate-result=${work}/gate-result.json"
            echo "artifact-name=${artifact_name}"
          } >> "${GITHUB_OUTPUT}"
      - id: sdk
        name: Provision immutable SDK
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/provision-sdk
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ inputs.sdk-revision }}
          runtime-directory: .l9/runtime/sdk
      - name: Normalize provider report
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/invoke-sdk
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-normalize
          input: ${{ steps.report.outputs.report }}
          output: ${{ steps.names.outputs.bundle }}
          root: ${{ inputs.repository-root }}
          snapshot-id: ${{ inputs.snapshot-id }}
          provider-version: ${{ inputs.provider-version }}
          identity-map: ${{ inputs.identity-map }}
          policy: ${{ inputs.policy }}
          strict: ${{ inputs.strict }}
          required: ${{ inputs.required-provider }}
          dirty: ${{ inputs.dirty }}
          revision: ${{ inputs.repository-revision || github.sha }}
      - name: Validate canonical bundle
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/validate-bundle
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: ${{ steps.names.outputs.bundle }}
          minimum-sdk-version: ${{ inputs.minimum-sdk-version }}
      - id: gate
        name: Evaluate canonical SDK gate
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/invoke-sdk
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: gate-evaluate
          input: ${{ steps.names.outputs.bundle }}
          output: ${{ steps.names.outputs['gate-result'] }}
          strict-unresolved: ${{ inputs.strict }}
      - name: Project agent-review payload
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/invoke-sdk
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: ${{ steps.names.outputs.bundle }}
          output: ${{ steps.names.outputs.payload }}
          strict: ${{ inputs.strict }}
      - id: route
        name: Route artifacts
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/route-artifacts
        with:
          provider: semgrep
          matrix-id: ${{ inputs.matrix-id }}
          raw-report: ${{ steps.report.outputs.report }}
          bundle: ${{ steps.names.outputs.bundle }}
          agent-payload: ${{ steps.names.outputs.payload }}
          gate-result: ${{ steps.names.outputs['gate-result'] }}
          destination-root: artifacts
      - name: Revalidate routed canonical bundle
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/validate-bundle
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: ${{ steps.route.outputs.bundle }}
          minimum-sdk-version: ${{ inputs.minimum-sdk-version }}
      - name: Build artifact manifest
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/build-artifact-manifest
        with:
          provider: semgrep
          matrix-id: ${{ inputs.matrix-id }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          gate-result: ${{ steps.route.outputs['gate-result'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          output: >-
            artifacts/metadata/${{ inputs.matrix-id }}/artifact-manifest.json
      - name: Upload Phase 2 artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ inputs.matrix-id }}/
            artifacts/l9/${{ inputs.matrix-id }}/
            artifacts/metadata/${{ inputs.matrix-id }}/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 6
          overwrite: false
          include-hidden-files: false
