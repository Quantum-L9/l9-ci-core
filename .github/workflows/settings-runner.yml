# Core-owned GitHub settings runner (engine: tools/l9_settings).
#
# GitHub settings as code (campaign L9-GITHUB-PRIVATE-01, lane R): the
# declaration lives in Quantum-L9/.github `settings/` (org.yml,
# repos/<repository>.yml, settings.schema.json). This reusable workflow reads
# it, reads live state through the GitHub REST API, prints the plan, and
# writes only when `dry-run` is false. It fails closed: a declared setting it
# cannot read stops the run before any write.
#
# It is SCHEDULED by the repository that holds the organization's repo-birth
# App credential, Quantum-L9/l9-repo-template (.github/workflows/
# settings-apply.yml there), exactly like release-runner.yml. No App, secret
# or environment is created for settings, and none lives in Core: every
# credentialed job names `environment: ${{ inputs.environment }}` (default
# repo-birth) and reads that CALLER environment's existing vars.BIRTH_APP_ID
# and secrets.BIRTH_APP_PRIVATE_KEY (the caller passes the secret by name).
#
# Authority: GITHUB_TOKEN stays contents:read. The declaration is read with a
# contents:read installation token scoped to Quantum-L9/.github alone. Live
# reads and writes use one installation token scoped to exactly the declared
# repositories with administration:write (repository settings, Actions
# permissions, environments, rulesets) and actions:read; secret VALUES are
# never read or written. Core is checked out at `core-ref`, the exact commit
# the caller pins in `uses:`, and the run refuses if the checkout differs.
name: Settings runner (Core)

on:
  workflow_call:
    inputs:
      repository:
        description: >-
          Plan or apply only this declared repository (name or owner/name).
          Empty covers every repository declared under settings/repos/.
        type: string
        required: false
        default: ""
      dry-run:
        description: Print the plan only. Writes happen only when this is false.
        type: boolean
        required: false
        default: true
      core-ref:
        description: >-
          The 40-hex Quantum-L9/l9-ci-core commit the caller pins in `uses:`.
          The engine is checked out at exactly this commit.
        type: string
        required: true
      environment:
        description: >-
          The caller-repository environment that holds vars.BIRTH_APP_ID and
          secrets.BIRTH_APP_PRIVATE_KEY.
        type: string
        required: false
        default: repo-birth
    secrets:
      BIRTH_APP_PRIVATE_KEY:
        description: >-
          Pass by name from the caller. The job names `environment`, so GitHub
          supplies the caller environment's secret of this name.
        required: false

permissions:
  contents: read

jobs:
  settings:
    name: Settings ${{ inputs.dry-run && 'plan' || 'apply' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    # One settings run at a time for the organization, never cancelled midway.
    concurrency:
      group: l9-settings
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: Quantum-L9/l9-ci-core
          ref: ${{ inputs.core-ref }}
          path: core
          persist-credentials: false
      # core-ref is caller-supplied; job.workflow_sha is the commit GitHub
      # resolved this reusable workflow from (the caller's `uses:` pin). Both
      # must name the same commit, so the engine that runs with the
      # administration token is exactly the pinned one.
      - name: Refuse a Core checkout that is not the pinned commit
        working-directory: core
        env:
          CORE_REF: ${{ inputs.core-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${CORE_REF}" =~ ^[0-9a-f]{40}$ ]] || { echo "core-ref must be a 40-hex commit: '${CORE_REF}'" >&2; exit 1; }
          [ "${WORKFLOW_SHA}" = "${CORE_REF}" ] || { echo "core-ref ${CORE_REF} != this workflow's commit '${WORKFLOW_SHA}' (the caller's uses: pin)" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "${CORE_REF}" ] || { echo "Core checkout $(git rev-parse HEAD) != core-ref ${CORE_REF}" >&2; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      # tools/l9_settings imports PyYAML and jsonschema; requirements-ci.txt
      # carries only PyYAML. This is the engine's whole closure, hash-locked.
      - name: Install Core-pinned declaration reader
        working-directory: core
        run: >-
          python -m pip install --quiet --disable-pip-version-check
          --require-hashes --only-binary :all: --requirement requirements-settings.txt
      - id: declaration-token
        name: Mint a contents:read token for Quantum-L9/.github alone
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BIRTH_APP_ID }}
          private-key: ${{ secrets.BIRTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github
          permission-contents: read
      - name: Check out the declaration (Quantum-L9/.github main)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: main
          path: dotgithub
          token: ${{ steps.declaration-token.outputs.token }}
          persist-credentials: false
      - id: declared
        name: Read the declared repositories
        working-directory: core
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
        run: >-
          python3 -m tools.l9_settings --settings ../dotgithub/settings
          --owner "${OWNER}" --repository "${REPOSITORY}" repositories
      - id: app
        name: Mint the settings token for exactly the declared repositories
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BIRTH_APP_ID }}
          private-key: ${{ secrets.BIRTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.declared.outputs.repositories }}
          permission-administration: write
          permission-actions: read
          permission-metadata: read
      - name: Plan (dry run) or apply
        working-directory: core
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
          STAGE: ${{ inputs.dry-run && 'plan' || 'apply' }}
        run: >-
          python3 -m tools.l9_settings --settings ../dotgithub/settings
          --owner "${OWNER}" --repository "${REPOSITORY}"
          "${STAGE}" --out "${RUNNER_TEMP}/l9-settings-plan.json"
