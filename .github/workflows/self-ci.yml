name: Core Phase 1 self-validation
on:
  pull_request:
  # Core main uses a merge queue (docs/release/rulesets/README.md, 2026-11-20
  # revision): every required check must also report on the merge group.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade --only-binary :all: pip
          pip install --only-binary :all: -r requirements-ci.txt
          pip install --only-binary :all: -r requirements-repo-runtime.txt
      # Resolve through the interpreter, not PATH, and assert what it resolved
      # before any gate runs — the same resolution `Repo.mk`'s `repo-check`
      # leaf applies to `make check`. Installing the pins is not the same as
      # executing them: a tool earlier on PATH decides which code runs, and a
      # nearby ruff minor passes cleanly while checking a different file set.
      - name: toolchain conformance
        run: python tools/check_toolchain_versions.py
      - name: ruff check
        run: python -m ruff check . --output-format=github
      - name: ruff format --check
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy --show-error-codes --pretty
  validate:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The listed modules import PyYAML and jsonschema, so this job installs
      # the same requirement files as the lint job and never the runner image's
      # ambient packages. The real ruff/mypy witness stays on Repository
      # contract through `make test`.
      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade --only-binary :all: pip
          pip install --only-binary :all: -r requirements-ci.txt
          pip install --only-binary :all: -r requirements-repo-runtime.txt
          pip install --require-hashes --only-binary :all: -r requirements-coverage.txt
      # Explicit census modules. An empty list must not fall through to
      # unittest's implicit discovery, and a missing file or a zero collection
      # fails the job before a green result is possible.
      - name: Run Phase 1 validation
        run: |
          set -euo pipefail
          modules=(
            tests/actions/test_check_toolchain_alignment.py
            tests/actions/test_detect_language.py
            tests/actions/test_install_biome.py
            tests/actions/test_install_consumer_ci.py
            tests/actions/test_install_semgrep.py
            tests/actions/test_license_policy.py
            tests/actions/test_run_biome_check.py
            tests/architecture/test_control_plane_boundary.py
            tests/architecture/test_external_action_pins.py
            tests/architecture/test_forbidden_sdk_ownership.py
            tests/artifacts/test_artifact_handoff.py
            tests/artifacts/test_artifact_integrity.py
            tests/artifacts/test_artifact_protocol.py
            tests/artifacts/test_retrieve_action.py
            tests/artifacts/test_route_artifacts.py
            tests/governance/test_constellation_scope.py
            tests/governance/test_consumer_metadata.py
            tests/governance/test_governance_boundary.py
            tests/governance/test_org_governance_defaults.py
            tests/governance/test_release_profile_strict.py
            tests/governance/test_resolve_governance.py
            tests/governance/test_self_analysis_governance_pack.py
            tests/governance/test_semgrep_policy_file_permissions.py
            tests/governance/test_semgrep_policy_logging.py
            tests/invocation/test_invoke_sdk.py
            tests/invocation/test_validate_bundle.py
            tests/provisioning/test_compatibility_manifest.py
            tests/provisioning/test_external_checkout.py
            tests/provisioning/test_private_repository_auth.py
            tests/provisioning/test_required_cli_probing.py
            tests/provisioning/test_runtime_directory_safety.py
            tests/provisioning/test_runtime_shim_path.py
            tests/provisioning/test_sdk_revision_validation.py
            tests/provisioning/test_sdk_runtime_lock.py
            tests/provisioning/test_sdk_source_validation.py
            tests/publication/test_publication_boundary.py
            tests/publication/test_publish_check.py
            tests/publication/test_render_publication.py
            tests/release/test_control_plane_attestation.py
            tests/release/test_release_contract.py
            tests/release/test_release_writers.py
            tests/release/test_validate_release_action.py
            tests/release_engine/test_contract_wiring.py
            tests/release_engine/test_integration.py
            tests/release_engine/test_runner.py
            tests/release_engine/test_units.py
            tests/settings_engine/test_engine.py
            tests/workflows/test_analyze_semgrep_event_class.py
            tests/workflows/test_artifact_handoff_producers.py
            tests/workflows/test_caller_profile_event_compatibility.py
            tests/workflows/test_compatibility_inputs.py
            tests/workflows/test_consumer_defaulting.py
            tests/workflows/test_container_release_action.py
            tests/workflows/test_org_ci_apt_archive_cache.py
            tests/workflows/test_org_ci_base_retarget.py
            tests/workflows/test_org_ci_event_resolution.py
            tests/workflows/test_org_ci_runtime_environment.py
            tests/workflows/test_org_ci_toolchain_steps.py
            tests/workflows/test_org_nightly_dispatch.py
            tests/workflows/test_org_policy_pin.py
            tests/workflows/test_org_repository_verification.py
            tests/workflows/test_org_runtime_contract.py
            tests/workflows/test_org_runtime_interface.py
            tests/workflows/test_phase_2_workflow.py
            tests/workflows/test_phase_3_workflows.py
            tests/workflows/test_phase_4_workflows.py
            tests/workflows/test_phase_scope.py
            tests/workflows/test_private_sdk_read_token.py
            tests/workflows/test_registry_required_mode.py
            tests/workflows/test_release_plane.py
            tests/workflows/test_release_runner_workflow.py
            tests/workflows/test_repository_execution_v2_bridge.py
            tests/workflows/test_reusable_workflow_outputs.py
            tests/workflows/test_reusable_workflow_permission_chain.py
            tests/workflows/test_sdk_contract_check_revision.py
            tests/workflows/test_sdk_contract_smoke_verdict.py
            tests/workflows/test_self_ci_gating.py
            tests/workflows/test_self_sonar.py
            tests/workflows/test_settings_runner_workflow.py
            tests/workflows/test_typescript_biome_convergence.py
            tests/workflows/test_workflow_integrity_clean.py
            tests/workflows/test_workflow_permissions.py
            tests/workflows/test_workflow_toolchain_pins.py
          )
          if [[ "${#modules[@]}" -eq 0 ]]; then
            echo "unit test collection is zero" >&2
            exit 1
          fi
          missing=0
          for module in "${modules[@]}"; do
            if [[ ! -f "${module}" ]]; then
              echo "missing listed test module: ${module}" >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          log="${RUNNER_TEMP:?}/unit-tests.log"
          status=0
          python -m coverage run --parallel-mode -m unittest "${modules[@]}" --verbose 2>&1 | tee "${log}" || status=$?
          if [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi
          ran="$(sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p' "${log}" | tail -n 1)"
          if [[ -z "${ran}" || "${ran}" -eq 0 ]]; then
            echo "unit test collection is zero" >&2
            exit 1
          fi
      # Core's Sonar analysis imports coverage from this run rather than running
      # the suite a second time. Written even when a test failed, so a missing
      # report is never mistaken for an unmeasured one.
      - name: Write coverage report
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m coverage combine
          python -m coverage xml -o coverage-reports/coverage-unit-tests.xml
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit-tests
          path: coverage-reports/coverage-unit-tests.xml
          if-no-files-found: error
          retention-days: 3
  # Core's own repository contract (.l9/repo-workflow.json, make-v1), executed
  # at the event revision through the Repo.mk repo-* leaves. Organization CI
  # only reaches Core's contract through its pinned repository verification,
  # so without this job a PR could break `make validate` and still merge green.
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      # A Core self-pin in a required-path workflow must name a commit main
      # contains; a squash merge orphans branch commits (AGENTS.md §34). Only
      # main's commit graph is fetched, no trees or blobs.
      - name: Core self-pins are ancestors of main
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --unshallow --filter=tree:0 --no-tags origin main
          python3 tools/check_core_pin_ancestry.py --main FETCH_HEAD
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: make setup
        run: make setup
      # Coverage measures the `make test` run below for Core's Sonar analysis
      # (requirements-coverage.txt); `make setup` itself is unchanged.
      - name: Install coverage
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary :all: -r requirements-coverage.txt
      - name: make validate
        run: make validate
      - name: make check
        run: make check
      # The same `make test` run, measured: Repo.mk's REPO_TEST_RUNNER is the only
      # thing that changes, so the phase still runs Core's own leaf.
      - name: make test
        env:
          REPO_TEST_RUNNER: python -m coverage run --parallel-mode -m unittest
        run: make test
      - name: Write coverage report
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m coverage combine
          python -m coverage xml -o coverage-reports/coverage-repository-contract.xml
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-repository-contract
          path: coverage-reports/coverage-repository-contract.xml
          if-no-files-found: error
          retention-days: 3
  # Core's own SonarQube Cloud analysis, with the coverage the two test jobs
  # above measured. The called workflow alone holds SONAR_TOKEN, runs no
  # repository code, and skips fork pull requests; it stays advisory.
  sonar:
    name: SonarQube Cloud
    needs: [validate, repository-contract]
    # Not on a merge group: the queue's temporary branch is not an analysis
    # target, and this check is advisory, never a queue requirement.
    if: ${{ !cancelled() && github.event_name != 'merge_group' }}
    permissions:
      contents: read
    uses: ./.github/workflows/self-sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
