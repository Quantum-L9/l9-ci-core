name: Core Phase 1 self-validation
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout and presets/python/.github/workflows/l9-lint-test.yml.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade --only-binary :all: pip
          pip install --only-binary :all: -r requirements-ci.txt
          pip install --only-binary :all: -r requirements-repo-runtime.txt
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy --show-error-codes --pretty
  validate:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout and presets/python/.github/workflows/l9-lint-test.yml.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - name: Emit checksum-manifest reconciliation hints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          manifest_path = root / "MANIFEST.sha256"
          manifest: dict[str, str] = {}
          for raw in manifest_path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              digest, name = line.split(None, 1)
              manifest[name.strip()] = digest

          tracked = {
              item
              for item in subprocess.check_output(
                  ["git", "ls-files"], text=True
              ).splitlines()
              if item and item != "MANIFEST.sha256"
          }

          for name, expected in sorted(manifest.items()):
              path = root / name
              if not path.is_file():
                  print(f"MANIFEST_DELETE {name}")
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  print(f"MANIFEST_SET {actual}  {name}")

          for name in sorted(tracked - set(manifest)):
              path = root / name
              if path.is_file():
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  print(f"MANIFEST_ADD {actual}  {name}")
          PY
      - name: Run Phase 1 validation
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            --start-directory tests \
            --pattern 'test_*.py' \
            --verbose
