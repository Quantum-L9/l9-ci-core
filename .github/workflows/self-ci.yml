name: Core Phase 1 self-validation
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout and presets/python/.github/workflows/l9-lint-test.yml.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade --only-binary :all: pip
          pip install --only-binary :all: -r requirements-ci.txt
          pip install --only-binary :all: -r requirements-repo-runtime.txt
      # Resolve through the interpreter, not PATH, and assert what it resolved
      # before any gate runs — the same resolution `Repo.mk`'s `repo-check`
      # leaf applies to `make check`. Installing the pins is not the same as
      # executing them: a tool earlier on PATH decides which code runs, and a
      # nearby ruff minor passes cleanly while checking a different file set.
      - name: toolchain conformance
        run: python tools/check_toolchain_versions.py
      - name: ruff check
        run: python -m ruff check . --output-format=github
      - name: ruff format --check
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy --show-error-codes --pretty
  validate:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout and presets/python/.github/workflows/l9-lint-test.yml.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - name: Run Phase 1 validation
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            --start-directory tests \
            --pattern 'test_*.py' \
            --verbose
