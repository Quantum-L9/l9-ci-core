# Full test-deep suite for Quantum-L9/l9-ci-core main.
#
# self-ci.yml keeps the required pull-request jobs on explicit module lists.
# This workflow is the self deep runner. It is not a required pull-request
# check and it is not a job inside self-ci.yml. The schedule is 07:17 UTC,
# separate from control-plane attestation at 04:17 UTC, and it stays until an
# apply path is observed. org-nightly-dispatch.yml uses the same cron for a
# plan that dispatches nothing; it does not run this suite.
#
# workflow_dispatch accepts only expected_sha, utc_slot, deep_contract,
# dispatch_key, and mode. Heavy steps run for the schedule, or for
# mode=apply after the SHA matches this ref. mode=plan records no suite.
# A SHA mismatch fails as STALE_SHA before checkout. Default mode is plan.
# This campaign's scheduler does not send apply.
#
# Change gate: a scheduled run skips the suite, with the reason in the step
# summary, when main's HEAD already has a successful scheduled run of this
# workflow (tools/nightly_apply.py receipt). Unreadable history runs the
# suite. That read is the only reason this job holds actions: read.
name: Nightly deep tests
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Lowercase 40-hex default-branch SHA
        required: true
        type: string
      utc_slot:
        description: UTC evaluation slot YYYY-MM-DD
        required: true
        type: string
      deep_contract:
        description: Deep-suite contract fingerprint
        required: true
        type: string
      dispatch_key:
        description: Canonical dispatch key
        required: true
        type: string
      mode:
        description: plan records no suite; apply is the only heavy mode
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
permissions:
  contents: read
concurrency:
  group: nightly-deep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-deep:
    name: Nightly deep tests
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
          && inputs.mode == 'apply')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require Core default branch main
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${REPOSITORY}" != "Quantum-L9/l9-ci-core" \
             || "${REF_NAME}" != "${DEFAULT_BRANCH}" \
             || "${DEFAULT_BRANCH}" != "main" ]]; then
            echo "nightly-deep runs only when the ref is Quantum-L9/l9-ci-core default branch main" >&2
            echo "repository=${REPOSITORY} ref=${REF_NAME} default_branch=${DEFAULT_BRANCH}" >&2
            exit 1
          fi
      - name: Reject an unadmitted dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OBSERVED_SHA: ${{ github.sha }}
          UTC_SLOT: ${{ inputs.utc_slot }}
          DEEP_CONTRACT: ${{ inputs.deep_contract }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys


          def finish(status, code, heavy):
              print(status)
              print("heavy_jobs=" + heavy)
              print("suite_pass=false")
              raise SystemExit(code)


          event = os.environ["EVENT_NAME"]
          mode = os.environ.get("MODE", "")
          expected = os.environ.get("EXPECTED_SHA", "")
          observed = os.environ.get("OBSERVED_SHA", "")
          slot = os.environ.get("UTC_SLOT", "")
          contract = os.environ.get("DEEP_CONTRACT", "")
          key = os.environ.get("DISPATCH_KEY", "")
          repository = os.environ.get("REPOSITORY", "")
          ref_name = os.environ.get("REF_NAME", "")
          default_branch = os.environ.get("DEFAULT_BRANCH", "")

          core_main = (
              repository == "Quantum-L9/l9-ci-core"
              and ref_name == default_branch
              and default_branch == "main"
          )

          if event == "schedule":
              if core_main:
                  finish("SELF_SCHEDULE", 0, "1")
              finish("REFUSED", 1, "0")
          if event != "workflow_dispatch":
              finish("REFUSED", 1, "0")
          if mode in ("", "plan"):
              finish("PLAN_ONLY", 0, "0")
          if mode != "apply":
              finish("REFUSED", 1, "0")
          if not core_main:
              finish("REFUSED", 1, "0")
          if slot == "" or contract == "" or key == "":
              finish("MALFORMED_INPUT", 1, "0")
          if re.fullmatch(r"[0-9a-f]{40}", expected) is None:
              finish("MALFORMED_SHA", 1, "0")
          if expected != observed:
              finish("STALE_SHA", 1, "0")
          finish("APPLY_ADMITTED", 0, "1")
          PY
      - name: Checkout immutable event revision
        if: >-
          github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch'
              && inputs.mode == 'apply'
              && inputs.expected_sha == github.sha)
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          echo "nightly-deep commit ${REVISION}"
      - name: Gate on a successful deep receipt
        id: receipt
        if: >-
          github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch'
              && inputs.mode == 'apply'
              && inputs.expected_sha == github.sha)
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          L9_RECEIPT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/nightly_apply.py receipt --sha "${SHA}" --run-id "${RUN_ID}"
      - name: Set up Python
        if: steps.receipt.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: make setup
        if: steps.receipt.outputs.run == 'true'
        run: |
          set -euo pipefail
          make setup
      - name: make test-deep
        if: steps.receipt.outputs.run == 'true'
        run: |
          set -euo pipefail
          make test-deep
  dispatch-plan:
    name: Dispatch plan
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record a plan with no suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OBSERVED_SHA: ${{ github.sha }}
          UTC_SLOT: ${{ inputs.utc_slot }}
          DEEP_CONTRACT: ${{ inputs.deep_contract }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys


          def finish(status, code, heavy):
              print(status)
              print("heavy_jobs=" + heavy)
              print("suite_pass=false")
              raise SystemExit(code)


          event = os.environ["EVENT_NAME"]
          mode = os.environ.get("MODE", "")
          expected = os.environ.get("EXPECTED_SHA", "")
          observed = os.environ.get("OBSERVED_SHA", "")
          slot = os.environ.get("UTC_SLOT", "")
          contract = os.environ.get("DEEP_CONTRACT", "")
          key = os.environ.get("DISPATCH_KEY", "")
          repository = os.environ.get("REPOSITORY", "")
          ref_name = os.environ.get("REF_NAME", "")
          default_branch = os.environ.get("DEFAULT_BRANCH", "")

          core_main = (
              repository == "Quantum-L9/l9-ci-core"
              and ref_name == default_branch
              and default_branch == "main"
          )

          if event == "schedule":
              if core_main:
                  finish("SELF_SCHEDULE", 0, "1")
              finish("REFUSED", 1, "0")
          if event != "workflow_dispatch":
              finish("REFUSED", 1, "0")
          if mode in ("", "plan"):
              finish("PLAN_ONLY", 0, "0")
          if mode != "apply":
              finish("REFUSED", 1, "0")
          if not core_main:
              finish("REFUSED", 1, "0")
          if slot == "" or contract == "" or key == "":
              finish("MALFORMED_INPUT", 1, "0")
          if re.fullmatch(r"[0-9a-f]{40}", expected) is None:
              finish("MALFORMED_SHA", 1, "0")
          if expected != observed:
              finish("STALE_SHA", 1, "0")
          finish("APPLY_ADMITTED", 0, "1")
          PY
