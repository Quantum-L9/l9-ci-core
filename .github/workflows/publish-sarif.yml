# Trusted SARIF-publication capability. This workflow never checks out or
# executes the analyzed revision. It retrieves a verified artifact set, asks the
# pinned SDK to validate the bundle, preflights the SDK projection, and only
# then performs one explicitly elected code-scanning upload.
name: Publish L9 analysis SARIF
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Exact current-run artifact name when no handoff is supplied.
        type: string
        required: false
        default: ""
      artifact-handoff:
        description: Optional canonical l9.core-artifact-handoff/v1 descriptor JSON.
        type: string
        required: false
        default: ""
      mode:
        type: string
        required: true
      provider:
        type: string
        required: false
        default: semgrep
      matrix-id:
        type: string
        required: true
      sdk-revision:
        type: string
        required: false
        default: bc678190582694f6efee08b6b7ea39be7e09bd5c
      repository-revision:
        type: string
        required: true
      publish-sarif:
        description: Explicitly elect the code-scanning SARIF write.
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  publish-sarif:
    if: >-
      inputs.publish-sarif
      && (inputs.mode == 'blocking' || inputs.mode == 'advisory')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - id: artifacts
        name: Retrieve and verify immutable analysis artifact
        # CORE_ACTIONS_PIN; descriptor mode selects producer/run/artifact identity
        # from the closed handoff. Current-run exact-name mode remains compatible.
        uses: Quantum-L9/l9-ci-core/.github/actions/retrieve-artifacts@c6f256a1c06dcb837b377d58b0247e2892a3ef0f
        with:
          artifact-name: ${{ inputs.artifact-name }}
          handoff-descriptor: ${{ inputs.artifact-handoff }}
          token: ${{ github.token }}
          matrix-id: ${{ inputs.matrix-id }}
          provider: ${{ inputs.provider }}
          repository: ${{ github.repository }}
          repository-revision: ${{ inputs.repository-revision }}
          sdk-revision: ${{ inputs.sdk-revision }}
          destination: .l9/runtime/publication/download
      - id: sdk
        name: Provision immutable SDK
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ inputs.sdk-revision }}
      - name: Revalidate downloaded canonical bundle
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: ${{ steps.artifacts.outputs.bundle }}
      - name: Require elected SARIF route
        env:
          SARIF: ${{ steps.artifacts.outputs.sarif }}
        run: |
          set -euo pipefail
          if [ -z "${SARIF}" ]; then
            echo "SARIF publication was elected but the verified artifact has no SARIF route" >&2
            exit 2
          fi
      - name: Preflight SARIF envelope
        # CORE_ACTIONS_PIN; parses transport structure only and has no write token.
        uses: Quantum-L9/l9-ci-core/.github/actions/publish-check@59cb364615ccd44d824bec6b71d49d2f93e465c9
        with:
          repository: ${{ github.repository }}
          publication: "sarif-only"
          sarif: ${{ steps.artifacts.outputs.sarif }}
          run-id: ${{ github.run_id }}
          matrix-id: ${{ inputs.matrix-id }}
          preflight-only: "true"
          preflight-sarif-only: "true"
      - name: Upload SDK-projected SARIF to code scanning
        # This is the job's only remote publication write.
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          sarif_file: ${{ steps.artifacts.outputs.sarif }}
          category: l9-${{ inputs.matrix-id }}

  no-publication:
    if: '!inputs.publish-sarif'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record no SARIF election
        env:
          MODE: ${{ inputs.mode }}
        run: echo "No SARIF publication capability elected for mode ${MODE}"

  suppressed:
    if: >-
      inputs.publish-sarif
      && (inputs.mode == 'shadow' || inputs.mode == 'disabled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Preserve non-publication mode
        env:
          MODE: ${{ inputs.mode }}
        run: echo "SARIF publication suppressed for mode ${MODE}"

  invalid-mode:
    if: >-
      inputs.mode != 'blocking'
      && inputs.mode != 'advisory'
      && inputs.mode != 'shadow'
      && inputs.mode != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject unknown mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "Unsupported publication mode: ${MODE}" >&2
          exit 2
