# GENERATED by tools/promotion_canary.py render from org-ci.yml. Do not edit:
# change org-ci.yml (or the tool) and run `python3 tools/promotion_canary.py
# render` with origin/main fetched. Core's unit tests
# (tests/workflows/test_promotion_canary.py, in self-ci) fail while this file
# and org-ci.yml disagree.
#
# Core's promotion canary (AGENTS.md §40). On a Core pull request that changes
# what the required check (org-ci.yml's `analyze` job) runs, every repository
# declared in .l9/promotion-canary.json is checked out at its current main
# head and judged at the pull request's pins (the `head` job) and, when the
# pull request changes the analyze steps, at the base's pins (the `base` job).
# Both are org-ci.yml's steps verbatim apart from the target identity.
# `Promotion canary (Core)` fails only when the pull request makes a repository
# worse. Head steps digest: b6b40b71a8b3abb88fc7539a897f6f281f74368ee1eaf79756050ff89a1ce4c0
name: Promotion canary (Core)
# One verdict per pushed head (row 22). `make pr` pushes and then edits the
# pull request's body; that `edited` run used to cancel the push run, whose
# verdict then posted a failing check for the same head. An edit that changes
# only the title or body is now a text edit: its own concurrency group (it
# never cancels the push run), no plan or legs, and a verdict job under
# another name that judges nothing, so it never posts a `Promotion canary
# (Core)` check, failing or skipped. Every other `edited` event, a base
# retarget included, is judged in full: the merge commit, and with it the
# plan, changed.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-promotion-canary-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) && '-text-edit' || '' }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan promotion canary
    if: ${{ !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      applies: ${{ steps.plan.outputs.applies }}
      differential: ${{ steps.plan.outputs.differential }}
      base-current: ${{ steps.plan.outputs['base-current'] }}
      head-current: ${{ steps.plan.outputs['head-current'] }}
      head-digest: ${{ steps.plan.outputs['head-digest'] }}
      base-digest: ${{ steps.plan.outputs['base-digest'] }}
      matrix: ${{ steps.plan.outputs.matrix }}
      admitted: ${{ steps.plan.outputs.admitted }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Plan the canary legs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          L9_CANARY_TOKEN: ${{ github.token }}
          L9_CANARY_PRIVATE_TOKEN: ${{ secrets.L9_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          python3 -I tools/promotion_canary.py plan ${FORCE}
      - name: Upload the pull request's SDK provisioner for the admitted leg
        if: steps.plan.outputs.admitted != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-admitted-core
          path: |
            .github/actions/provision-sdk/
            .l9/sdk-compatibility.yaml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  head__security:
    name: Canary ${{ matrix.repository }} security job
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job security .github/workflows/security.yml@da01ee359ee18c59ff98b119e5aa5ee609754b5d: begin ---
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        id: security__s0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect project languages
        id: security__detect
        run: |
          set -euo pipefail
          python_project=false
          node_project=false
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            python_project=true
          fi
          if [ -f "package.json" ]; then
            node_project=true
          fi
          echo "python=${python_project}" >> "$GITHUB_OUTPUT"
          echo "node=${node_project}" >> "$GITHUB_OUTPUT"
          echo "Detected: python=${python_project} node=${node_project}"
      - name: Secret scan (gitleaks)
        id: security__gitleaks
        env:
          GITLEAKS_LOG_OPTS: ''
          GITLEAKS_SCOPE: event
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          case "${GITLEAKS_SCOPE:-history}" in
            history) ;;
            event)
              if [ -z "${GITLEAKS_LOG_OPTS}" ]; then
                case "${EVENT_NAME}" in
                  pull_request|pull_request_target) GITLEAKS_LOG_OPTS="${PR_BASE}..${PR_HEAD}" ;;
                  merge_group) GITLEAKS_LOG_OPTS="${MERGE_GROUP_BASE}..${MERGE_GROUP_HEAD}" ;;
                  push)
                    if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                      GITLEAKS_LOG_OPTS="-1 ${EVENT_SHA}"
                    else
                      GITLEAKS_LOG_OPTS="${PUSH_BEFORE}..${EVENT_SHA}"
                    fi
                    ;;
                  *) ;;
                esac
              fi
              ;;
            *)
              echo "::error::gitleaks-scope must be history or event (got '${GITLEAKS_SCOPE}')"
              exit 2
              ;;
          esac
          # Rules: the Core preset (presets/security/.gitleaks.toml) is
          # gitleaks' own default rule set (`[extend] useDefault = true`). A
          # repository's own .gitleaks.toml is honoured on top of it: its rules
          # and allowlists apply, and when it does not already extend the
          # defaults it is made to, so no repository config can drop the Core
          # rules. A repository config that extends another file by `path`
          # cannot also extend the defaults (gitleaks allows one of the two),
          # so it is refused rather than scanned with fewer rules. Reviewed
          # false positives belong in .gitleaksignore, which gitleaks reads
          # from the scanned tree.
          config="${RUNNER_TEMP:-/tmp}/l9-gitleaks.toml"
          config_args=()
          if [ -f ".gitleaks.toml" ]; then
            python3 -I - ".gitleaks.toml" "${config}" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          source, target = Path(sys.argv[1]), Path(sys.argv[2])
          text = source.read_text(encoding="utf-8")
          try:
              extend = tomllib.loads(text).get("extend")
          except tomllib.TOMLDecodeError as error:
              sys.exit(f"::error::.gitleaks.toml is not valid TOML: {error}")
          if extend is None:
              text += (
                  "\n\n# Added by Core security.yml: keep the Core preset rules"
                  " (gitleaks defaults).\n[extend]\nuseDefault = true\n"
              )
          elif not isinstance(extend, dict) or "path" in extend:
              sys.exit(
                  "::error::.gitleaks.toml [extend] names a path; it cannot also"
                  " extend the Core preset rules (gitleaks allows path or"
                  " useDefault, not both). Inline the rules and use"
                  " `useDefault = true`."
              )
          elif extend.get("useDefault") is not True:
              sys.exit(
                  "::error::.gitleaks.toml [extend] must set useDefault = true"
                  " so the Core preset rules apply."
              )
          target.write_text(text, encoding="utf-8")
          PY
            config_args=(--config "${config}")
          fi
          range_args=()
          if [ -n "${GITLEAKS_LOG_OPTS}" ]; then
            # The range must resolve in this clone before gitleaks runs:
            # gitleaks exits 1 both for findings and for a git log error, so an
            # unresolvable range would otherwise read as a failed scan. The
            # options are word-split on purpose; they are git log arguments.
            # shellcheck disable=SC2086
            if ! git log --format=%H ${GITLEAKS_LOG_OPTS} -- > /dev/null; then
              echo "::error::gitleaks range '${GITLEAKS_LOG_OPTS}' does not resolve in this clone; fetch its history"
              exit 2
            fi
            range_args=(--log-opts="${GITLEAKS_LOG_OPTS}")
          fi
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          actual_sha="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Everything above is acquisition. A failure there ends the step with
          # no outcome, which the report labels not_executed. From here the
          # scanner itself runs and its exit code is the outcome.
          status=0
          /tmp/gitleaks git "${config_args[@]}" "${range_args[@]}" \
            --no-banner --redact --exit-code 1 . || status=$?
          case "${status}" in
            0) echo "outcome=executed_pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=executed_fail" >> "$GITHUB_OUTPUT" ;;
            *) echo "outcome=not_executed" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "${status}"
      - name: Set up Python
        id: security__s3
        if: steps.security__detect.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12
      - name: Python dependency audit (pip-audit)
        id: security__pip_audit
        if: steps.security__detect.outputs.python == 'true'
        env:
          L9_CI_INSTALL_COMMAND: ''
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          # Scope (operator decision 2026-11-21, row 23): a pull request,
          # merge group or push audits only when it changes a dependency
          # manifest or lock. Every other event audits. A range that cannot be
          # read audits too: not running needs a positive proof.
          is_sha() {
            local candidate="$1"
            [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]
          }
          base=""
          head=""
          case "${EVENT_NAME:-}" in
            pull_request|pull_request_target) base="${PR_BASE:-}"; head="${PR_HEAD:-}" ;;
            merge_group) base="${MERGE_GROUP_BASE:-}"; head="${MERGE_GROUP_HEAD:-}" ;;
            push) base="${PUSH_BEFORE:-}"; head="${EVENT_SHA:-}" ;;
            *) ;;
          esac
          if is_sha "${base}" && is_sha "${head}" \
            && [ "${base}" != "0000000000000000000000000000000000000000" ]; then
            # --no-renames: a renamed or deleted lock shows its old path too.
            if changed="$(git diff --no-renames --name-only "${base}" "${head}" --)"; then
              manifests='(^|/)(pyproject\.toml|uv\.lock|setup\.py|setup\.cfg|requirements[^/]*\.txt|constraints[^/]*\.txt|Pipfile(\.lock)?|poetry\.lock|pdm\.lock)$'
              if ! grep -Eq "${manifests}" <<< "${changed}"; then
                echo "pip-audit: no dependency manifest or lock changed in ${base}..${head}; nothing new to audit"
                echo "outcome=not_applicable (no dependency manifest or lock changed)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::warning::pip-audit: the change range ${base}..${head} cannot be read; auditing"
            fi
          fi
          python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
          pip install --only-binary :all: "pip-audit==2.9.0"
          if [ -n "$L9_CI_INSTALL_COMMAND" ]; then
            bash -c "$L9_CI_INSTALL_COMMAND" || echo "::notice::l9-ci install command failed; continuing"
          fi
          # The full resolved lock, not the runner's environment: uv.lock
          # exported with every dependency group, extra and workspace package
          # (the project's own workspace members are local code, not
          # packages, and are left out), else requirements.txt. uv is Core's
          # locked version (install-consumer-ci/toolchain-lock.json).
          locked=()
          if [ -f "uv.lock" ]; then
            pip install --only-binary :all: "uv==0.13.8"
            out="${RUNNER_TEMP:-/tmp}/l9-locked"
            mkdir -p "${out}"
            export_lock() {
              local name="$1"
              shift
              uv export --frozen --all-packages --no-emit-workspace --no-hashes \
                --format requirements.txt --output-file "${out}/${name}.txt" "$@" > /dev/null
            }
            if export_lock all --all-groups --all-extras; then
              locked+=("${out}/all.txt")
            elif python3 -I -c 'import sys, tomllib; sys.exit(0 if tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("uv", {}).get("conflicts") else 1)' 2> /dev/null; then
              # Declared conflicts ([tool.uv].conflicts) make the union of
              # every extra and group unresolvable by design. Each selection
              # is exported and audited on its own: the base set, then every
              # extra and every group. Any selection that cannot be exported
              # leaves the locked set unknown.
              echo "pip-audit: uv.lock declares conflicting extras or groups; auditing each selection"
              selections="$(python3 -I -c 'import tomllib; d = tomllib.load(open("pyproject.toml", "rb")); [print("extra", n) for n in d.get("project", {}).get("optional-dependencies", {})]; [print("group", n) for n in d.get("dependency-groups", {})]')"
              if ! export_lock base --no-default-groups; then
                echo "::error::pip-audit: the base set of uv.lock cannot be exported; the audit is incomplete"
                echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              locked+=("${out}/base.txt")
              while read -r kind name; do
                [ -n "${kind}" ] || continue
                if ! export_lock "${kind}-${name}" --no-default-groups "--${kind}" "${name}"; then
                  echo "::error::pip-audit: the ${kind} ${name} of uv.lock cannot be exported; the audit is incomplete"
                  echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                locked+=("${out}/${kind}-${name}.txt")
              done <<< "${selections}"
            else
              echo "::error::pip-audit: uv.lock cannot be exported; the locked set is unknown, so the audit is incomplete"
              echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f "requirements.txt" ]; then
            locked=("requirements.txt")
          else
            echo "::error::pip-audit: a Python project with no uv.lock or requirements.txt has no locked set to audit; the audit is incomplete"
            echo "outcome=not_executed (no lock file)" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Acquisition and the lock are settled; from here pip-audit runs.
          status=0
          # `--desc` takes an optional value; it is given explicitly so the
          # next argument is never read as that value (`--desc .` is a usage
          # error, exit 2, and audits nothing). An exported lock is fully
          # pinned, so it is audited as written (--no-deps).
          if [ "${locked[0]}" = "requirements.txt" ]; then
            pip-audit --desc on -r requirements.txt || status=$?
          else
            requirements=()
            for file in "${locked[@]}"; do
              requirements+=(-r "${file}")
            done
            pip-audit --desc on --no-deps "${requirements[@]}" || status=$?
          fi
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      # Advisory by existing policy: no Bandit result fails this job. The exit
      # code is still read, because "no findings", "findings" and "the scanner
      # did not complete" are three different facts. Bandit exits 0 with no
      # issue at the selected level, 1 with issues, and anything else when it
      # could not scan.
      - name: Python static security scan (bandit)
        id: security__bandit
        if: steps.security__detect.outputs.python == 'true'
        env:
          SOURCE_DIR: .
        run: |
          set -euo pipefail
          pip install --only-binary :all: "bandit==1.8.6"
          status=0
          bandit -r "$SOURCE_DIR" -ll -f screen \
            --exclude ./venv,./.venv,./tests,./build,./dist \
            || status=$?
          case "${status}" in
            0)
              outcome="executed_no_findings"
              echo "::notice::Bandit (advisory) completed with no findings at medium severity or above"
              ;;
            1)
              outcome="executed_findings"
              echo "::warning::Bandit (advisory) reported findings; an advisory scan does not fail this job"
              ;;
            *)
              outcome="not_executed"
              echo "::warning::Bandit (advisory) did not complete (exit ${status}); no Bandit result exists for this revision"
              ;;
          esac
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
      - name: Node dependency audit (npm audit)
        id: security__npm_audit
        if: steps.security__detect.outputs.node == 'true' && false
        run: |
          set -euo pipefail
          if [ ! -f "package-lock.json" ]; then
            echo "::error::run-npm-audit=true requires package-lock.json in the working directory"
            exit 1
          fi
          # The lockfile check above is a contract failure, not a scan: it
          # leaves no outcome. From here npm audit itself runs.
          status=0
          npm audit --audit-level=high || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      - name: Non-applicable gates
        id: security__s7
        if: steps.security__detect.outputs.python != 'true' && steps.security__detect.outputs.node != 'true'
        run: echo "::notice::No Python or Node project detected; only the secret scan ran"
      # One row per scan: what policy says about it and what actually happened.
      # Each scan step states its own outcome once its scanner has run. A step
      # that never ran, or that failed before its scanner ran, has no outcome
      # and is reported not_executed, never as a pass or as a scan failure.
      # The step runs from the workspace root: the job default is the caller's
      # working-directory, and if that does not exist no step could start there.
      - name: Report scan requiredness and outcomes
        id: security__s8
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          DETECT_OUTCOME: ${{ steps.security__detect.outcome }}
          PYTHON_PROJECT: ${{ steps.security__detect.outputs.python }}
          NODE_PROJECT: ${{ steps.security__detect.outputs.node }}
          NPM_AUDIT_REQUESTED: false
          GITLEAKS_STEP: ${{ steps.security__gitleaks.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.security__gitleaks.outputs.outcome }}
          PIP_AUDIT_STEP: ${{ steps.security__pip_audit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.security__pip_audit.outputs.outcome }}
          BANDIT_STEP: ${{ steps.security__bandit.outcome }}
          BANDIT_OUTCOME: ${{ steps.security__bandit.outputs.outcome }}
          NPM_AUDIT_STEP: ${{ steps.security__npm_audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.security__npm_audit.outputs.outcome }}
        run: |
          set -euo pipefail
          required_outcome() {
            local conclusion="$1"  # the step's conclusion
            local stated="$2"      # the outcome the step stated itself
            if [ -n "${stated}" ]; then
              echo "${stated}"
            elif [ "${conclusion}" = "failure" ]; then
              echo "not_executed (the step failed before its scanner ran)"
            else
              echo "not_executed"
            fi
          }
          gitleaks="$(required_outcome "${GITLEAKS_STEP}" "${GITLEAKS_OUTCOME}")"
          if [ "${DETECT_OUTCOME}" != "success" ]; then
            pip_audit="not_executed (language detection did not complete)"
            bandit="not_executed (language detection did not complete)"
            npm_audit="not_executed (language detection did not complete)"
          else
            if [ "${PYTHON_PROJECT}" = "true" ]; then
              pip_audit="$(required_outcome "${PIP_AUDIT_STEP}" "${PIP_AUDIT_OUTCOME}")"
              bandit="${BANDIT_OUTCOME:-not_executed}"
            else
              pip_audit="not_applicable (no Python project detected)"
              bandit="not_applicable (no Python project detected)"
            fi
            if [ "${NPM_AUDIT_REQUESTED}" != "true" ]; then
              npm_audit="not_run (run-npm-audit is false)"
            elif [ "${NODE_PROJECT}" != "true" ]; then
              npm_audit="not_applicable (no Node project detected)"
            else
              npm_audit="$(required_outcome "${NPM_AUDIT_STEP}" "${NPM_AUDIT_OUTCOME}")"
            fi
          fi
          npm_requiredness="not run"
          if [ "${NPM_AUDIT_REQUESTED}" = "true" ]; then
            npm_requiredness="required"
          fi
          {
            echo "### L9 Security scan outcomes"
            echo
            echo "| Scan | Requiredness | Outcome |"
            echo "| --- | --- | --- |"
            echo "| gitleaks | required | ${gitleaks} |"
            echo "| pip-audit | required when Python is detected | ${pip_audit} |"
            echo "| bandit | advisory | ${bandit} |"
            echo "| npm audit | ${npm_requiredness} | ${npm_audit} |"
            echo
            echo "Advisory, not_run, not_applicable and not_executed are not passes."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # --- inlined org-ci job security .github/workflows/security.yml@da01ee359ee18c59ff98b119e5aa5ee609754b5d: end ---
      - name: Record the security job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/security.result"
      - name: Upload the security job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-head-security-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/security.result
          if-no-files-found: error
          retention-days: 1

  head:
    name: Canary ${{ matrix.repository }}
    needs: [plan, head__security]
    if: ${{ !cancelled() && (needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- the security job's result for this repository (not part of org-ci.yml) ---
      - name: Download the security job result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A pattern, not a name: a missing result downloads nothing (a name
          # would fail the step), and the next step reads nothing as failure.
          pattern: canary-job-head-security-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job
          merge-multiple: true
      - name: Result of the security job
        id: security__result
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/canary-job/security.result"
          result=""
          if [ -f "${file}" ]; then
            result="$(tr -d '[:space:]' < "${file}")"
          fi
          case "${result}" in
            success|failure|cancelled) ;;
            *) result=failure ;;
          esac
          echo "security job: ${result}"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
      - id: runtime
        name: Resolve central runtime class
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_EVENT: ${{ inputs.event || '' }}
          INPUT_PROFILE: ${{ inputs.profile || '' }}
          INPUT_MATRIX_ID: canary-head-${{ matrix.slug }}
          INPUT_SDK_REVISION: ${{ inputs.sdk-revision || '' }}
          INPUT_SEMGREP_VERSION: ${{ inputs.semgrep-version || '1.171.0' }}
          INPUT_RETENTION: ${{ inputs.artifact-retention-days || 14 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          gh_event = os.environ["GH_EVENT"]
          requested_event = os.environ.get("INPUT_EVENT", "").strip()
          requested_profile = os.environ.get("INPUT_PROFILE", "").strip()

          allowed = {"pull_request", "push", "merge", "nightly", "release", "supply_chain"}
          fixed = {"pull_request": "pr_fast", "push": "merge", "merge": "merge"}
          native = {
              "pull_request": ("pull_request", "pr_fast"),
              "merge_group": ("merge", "merge"),
              "push": ("push", "merge"),
          }

          if gh_event == "workflow_dispatch":
              event_class = requested_event or "nightly"
              profile = requested_profile or event_class
          elif requested_event:
              # Reusable workflows retain the caller's event_name, so the
              # required event input—not `workflow_call`—identifies this path.
              event_class = requested_event
              if event_class not in allowed:
                  raise SystemExit(f"unsupported event class: {event_class}")
              expected_profile = fixed.get(event_class, event_class)
              profile = requested_profile or expected_profile
              if profile != expected_profile:
                  raise SystemExit(
                      "reusable profile claim "
                      f"{profile!r} does not match event {event_class!r}; "
                      f"expected {expected_profile!r}"
                  )
          elif gh_event in native:
              event_class, profile = native[gh_event]
          elif gh_event == "workflow_call":
              raise SystemExit("workflow_call requires event")
          else:
              raise SystemExit(f"unsupported trigger: {gh_event}")

          if event_class not in allowed:
              raise SystemExit(f"unsupported event class: {event_class}")
          matrix_id = os.environ.get("INPUT_MATRIX_ID", "org-semgrep")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", matrix_id):
              raise SystemExit("invalid matrix-id")
          sdk_revision = os.environ.get("INPUT_SDK_REVISION", "").strip()
          if sdk_revision and not re.fullmatch(r"[0-9a-f]{40}", sdk_revision):
              raise SystemExit("sdk-revision must be a full 40-character lowercase SHA")
          semgrep_version = os.environ.get("INPUT_SEMGREP_VERSION", "1.171.0").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", semgrep_version):
              raise SystemExit("semgrep-version must be an exact x.y.z version")
          retention = int(os.environ.get("INPUT_RETENTION", "14"))
          if not 1 <= retention <= 90:
              raise SystemExit("artifact-retention-days must be between 1 and 90")

          outputs = {
              "event-class": event_class,
              "profile": profile,
              "matrix-id": matrix_id,
              "sdk-revision": sdk_revision,
              "semgrep-version": semgrep_version,
              "artifact-retention-days": str(retention),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          PY

      # A pull-request scope failure stays a failure. An explicit full-suite
      # override is refused. Nothing here selects the deep suite, and a failed
      # scope does not fall through to one. This runs before checkout so the
      # apt cache still wraps repository verification directly.
      - name: Refuse a pull-request full-suite fallback
        if: >-
          github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
          || steps.runtime.outputs.event-class == 'pull_request'
          || steps.runtime.outputs.event-class == 'merge'
        env:
          # A reusable call keeps the caller's event_name. The class resolved
          # above is the pull-request or merge path this step is judging.
          GH_EVENT: ${{ steps.runtime.outputs.event-class }}
          FULL_SUITE_OVERRIDE: ${{ vars.L9_CI_FULL_SUITE || '' }}
          PR_SCOPE_STATUS: ${{ vars.L9_PR_SCOPE_STATUS || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys


          def finish(status, code):
              print(status)
              print("heavy=false")
              print("suite_pass=false")
              print("selected_suite=none")
              raise SystemExit(code)


          event = os.environ["GH_EVENT"]
          override = os.environ.get("FULL_SUITE_OVERRIDE", "").strip().lower()
          scope = os.environ.get("PR_SCOPE_STATUS", "").strip().lower()
          pr_events = ("pull_request", "merge_group", "merge")

          if event not in pr_events:
              finish("NOT_APPLICABLE", 0)
          if override not in ("", "0", "false", "no"):
              finish("POLICY_PR_DEEP_FORBIDDEN", 1)
          if scope in ("unknown", "failed", "unresolved", "pr_scope_unknown"):
              finish("PR_SCOPE_UNKNOWN", 1)
          finish("NO_FULL_SUITE_FALLBACK", 0)
          PY

      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          # Depth 2: a pull_request / merge_group revision is a merge commit,
          # and its base parent is what a consumer's merge-base check needs
          # once origin is reset to an anonymous URL below.
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      # Reports consumer declarations of Core-owned tools that drift from
      # Core's toolchain-lock.json, with file:line annotations, into
      # .l9/runtime/toolchain-alignment.json. Advisory: drift never fails the
      # job (housekeeping, operator decision 2026-11-20). The lock ships inside
      # this pinned Core revision.
      - id: toolchain
        name: Report toolchain alignment (advisory)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/check-toolchain-alignment@da01ee359ee18c59ff98b119e5aa5ee609754b5d

      - name: Validate native push event context
        if: github.event_name == 'push'
        env:
          EVENT_REPOSITORY: ${{ matrix.repository }}
          EVENT_SHA: ${{ matrix.revision }}
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
        run: |
          set -euo pipefail
          if [ "${EVENT_CLASS}" != "push" ]; then
            echo "::error::push trigger resolved to event class '${EVENT_CLASS}'" >&2
            exit 1
          fi
          if [ -z "${EVENT_REPOSITORY}" ]; then
            echo "::error::push execution has no repository identity" >&2
            exit 1
          fi
          if [ -z "${EVENT_SHA}" ]; then
            echo "::error::push execution has no immutable SHA" >&2
            exit 1
          fi
          case "${EVENT_SHA}" in
            *[!0-9a-f]* | "") sha_ok=false ;;
            ????????????????????????????????????????) sha_ok=true ;;
            *) sha_ok=false ;;
          esac
          if [ "${sha_ok}" != "true" ]; then
            echo "::error::push SHA is not a full 40-character revision" >&2
            exit 1
          fi
          echo "Native push evaluation target: ${EVENT_REPOSITORY}@${EVENT_SHA}"

      - id: consumer
        name: Resolve optional consumer metadata
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-consumer-metadata@da01ee359ee18c59ff98b119e5aa5ee609754b5d

      - id: gov
        name: Resolve central governance
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          profile: ${{ steps.runtime.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.runtime.outputs['event-class'] }}
          repository: ${{ matrix.repository }}
          ref: refs/heads/${{ matrix.branch }}
          product-kind: ${{ steps.consumer.outputs['product-kind'] }}

      - name: Validate consumer waiver pointers
        env:
          REQUESTED: ${{ steps.consumer.outputs['waiver-refs'] }}
          APPLICABLE: ${{ steps.gov.outputs['waiver-ids'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          requested = {item for item in os.environ.get("REQUESTED", "").split(",") if item}
          applicable = {item for item in os.environ.get("APPLICABLE", "").split(",") if item}
          unknown = sorted(requested - applicable)
          if unknown:
              raise SystemExit(f"consumer waiver_refs are not centrally applicable: {unknown}")
          PY

      - id: names
        name: Resolve artifact name
        env:
          MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - id: sdk
        name: Provision immutable SDK
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ steps.runtime.outputs['sdk-revision'] || '4a887396990a59ffb4a7108790b2fa1005c7865d' }}
          # AGENTS.md §27: l9-ci-sdk is private. Read-only org secret; the
          # action passes it to git only as a per-command header.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      - id: language
        name: Detect repository language (SDK)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN — detect-language (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/detect-language@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          repo-class: ${{ steps.consumer.outputs['repo-class'] }}
          root: .

      # L9-CI-CORE-003: every applicable provider/language instance is planned,
      # run and accounted for, so a second language is never silently dropped
      # in favour of the detected one. The SDK states the facts (capability
      # inventory of this exact snapshot, taken before repository verification
      # can touch the tree); requiredness is Core's (plan-required-instances).
      - id: inventory
        name: Inventory repository capabilities (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          directory=".l9/runtime/${L9_MATRIX_ID}/required-instances"
          mkdir -p "${directory}"
          "${L9_EXECUTABLE}" providers inventory --root . --format json \
            --consumer-rules --output "${directory}/inventory.json"
          echo "path=${directory}/inventory.json" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Plan required instances (Core)
        if: steps.inventory.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/plan-required-instances@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          inventory: ${{ steps.inventory.outputs.path }}
          repository: ${{ matrix.repository }}
          revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          required-providers: ${{ steps.gov.outputs['required-provider'] == 'true' && 'semgrep' || '' }}
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json

      # Core owns the consumer-facing Biome check end to end: the version is
      # the `biome` key of Core's toolchain lock, the binary is digest-locked,
      # and the run is blocking (findings annotate, then fail the step;
      # infrastructure failures are fatal). It is independent of Semgrep
      # governance; a consumer without biome.json or biome.jsonc is
      # not_applicable and nothing is downloaded.
      - id: biome
        name: Install Biome (digest-locked central pin)
        if: hashFiles('biome.json', 'biome.jsonc') != ''
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/install-biome@da01ee359ee18c59ff98b119e5aa5ee609754b5d

      - id: biome_check
        name: Run Biome check (blocking)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/run-biome-check@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.biome.outputs.executable }}
          provider-version: ${{ steps.biome.outputs['provider-version'] }}
          mode: blocking

      # SDK ADR 0023 (CENTRAL-DIFF): findings are classified new or
      # pre-existing against a baseline commit; only new blocking findings and
      # incomplete results fail, pre-existing ones are reported as advisory
      # with counts (docs/central-diff-baseline.md). pull_request and push
      # judge against the evaluated revision's first parent (on a pull
      # request GitHub's merge commit, so the target tip; on a push the
      # previous tip; fetched at depth 2 above), a merge group against
      # merge_group.base_sha; nightly, release and supply_chain pass none, so
      # the whole tree is judged by policy alone. It is resolved here, before
      # repository verification runs any consumer code, and held by a ref:
      # a consumer's make can rewrite .git (a re-shallowed checkout has no
      # HEAD^1), and nothing it does may move the baseline. A baseline that
      # does not resolve blocks; tracked changes or an incomplete baseline
      # scan make the SDK fail closed.
      - id: baseline
        name: Resolve the baseline commit (CENTRAL-DIFF)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          # A merge group's base (docs/central-diff-baseline.md): HEAD^1 is
          # that base only for the first group in the queue.
          MERGE_GROUP_BASE: ''
          REPOSITORY: ${{ matrix.repository }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          commit=""
          case "${EVENT_CLASS}" in
            merge)
              if [ -z "${POLICY}" ]; then
                echo "::notice::no SDK policy for this profile: findings are judged by policy alone"
              elif [ -n "${MERGE_GROUP_BASE}" ]; then
                if ! printf '%s' "${MERGE_GROUP_BASE}" | grep -Eq '^[0-9a-f]{40}$'; then
                  echo "::error::no baseline: merge group base '${MERGE_GROUP_BASE}' is not a full commit id"
                  exit 1
                fi
                auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
                if ! git -c protocol.version=2 \
                    -c "http.https://github.com/.extraheader=${auth_header}" \
                    fetch --depth=1 --no-tags "https://github.com/${REPOSITORY}.git" "${MERGE_GROUP_BASE}"; then
                  echo "::error::no baseline: the merge group base ${MERGE_GROUP_BASE} could not be fetched"
                  exit 1
                fi
                commit="$(git rev-parse --verify --quiet "${MERGE_GROUP_BASE}^{commit}")"
                if [ "${commit}" != "${MERGE_GROUP_BASE}" ]; then
                  echo "::error::no baseline: the merge group base ${MERGE_GROUP_BASE} does not resolve"
                  exit 1
                fi
                echo "Baseline commit: ${commit} (merge group base of $(git rev-parse HEAD))"
              elif commit="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
                echo "Baseline commit: ${commit} (first parent of $(git rev-parse HEAD))"
              else
                echo "::error::no baseline: the evaluated revision $(git rev-parse HEAD) has no fetched first parent"
                exit 1
              fi
              ;;
            pull_request|push)
              if [ -z "${POLICY}" ]; then
                echo "::notice::no SDK policy for this profile: findings are judged by policy alone"
              elif commit="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
                echo "Baseline commit: ${commit} (first parent of $(git rev-parse HEAD))"
              else
                # Operator decision 2026-11-21 (row 23): a run judges only the
                # code it brings in, so a baseline it cannot resolve blocks.
                echo "::error::no baseline: the evaluated revision $(git rev-parse HEAD) has no fetched first parent"
                exit 1
              fi
              ;;
            *)
              echo "Event class ${EVENT_CLASS}: no baseline, findings are judged by policy alone"
              ;;
          esac
          # The SDK refuses a baseline over tracked changes (ADR 0023); name
          # them here so a fail-closed baseline is explainable.
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -n "${commit}" ] && [ -n "${changed}" ]; then
            echo "::warning::tracked files differ from HEAD before the Semgrep scan; the baseline will fail closed:"
            printf '%s\n' "${changed}"
          fi
          if [ -n "${commit}" ]; then
            # A ref keeps the baseline reachable whatever the consumer's make
            # later does to the checkout's history; the shallow boundary and
            # HEAD are recorded so the step before Semgrep can restore and
            # check them.
            git update-ref refs/l9/central-diff-baseline "${commit}"
            state="${RUNNER_TEMP}/l9-central-diff"
            mkdir -p "${state}"
            shallow="$(git rev-parse --path-format=absolute --git-path shallow)"
            if [ -f "${shallow}" ]; then
              cp -- "${shallow}" "${state}/shallow"
            else
              : > "${state}/shallow"
            fi
            git rev-parse HEAD > "${state}/head"
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # Repository verification runs the consumer's `make setup`, which may
      # install OS packages with apt (e.g. Playwright's Chromium libraries and
      # fonts). Their downloaded .deb archives are cached per repository so an
      # unchanged package set is not re-fetched from the Ubuntu mirror on every
      # evaluation: Website-Bot's 21.1 MB took 7-8 minutes at ~45 kB/s on some
      # runs and 1 s on others. Only archives are cached, never installed
      # state, and apt verifies each cached .deb against the signed package
      # index before use, re-downloading any that do not match. Entries are
      # content-addressed (cache entries are immutable): restore never matches
      # exactly and takes the newest entry for this runner image, else this
      # image family; the save key is a digest of the archive set kept after
      # verification, so only a changed set stores a new entry.
      # Cache-service errors only warn, so this can never fail verification.
      - id: apt_archive_cache_dir
        name: Route apt package archives to the verification cache
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/l9-apt-archives"
          mkdir -p "${dir}/partial"
          if id _apt >/dev/null 2>&1; then
            sudo chown _apt "${dir}/partial"
          fi
          printf '%s\n' \
            "Dir::Cache::Archives \"${dir}/\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-l9-archive-cache >/dev/null
          family="l9-apt-archives-v1-${ImageOS:-unknown}-$(uname -m)-"
          image="${family}${ImageVersion:-unknown}-"
          {
            echo "path=${dir}"
            echo "family=${family}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - id: apt_archive_cache
        name: Restore cached apt package archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          # Never saved, so restore always resolves through the prefixes.
          key: ${{ steps.apt_archive_cache_dir.outputs.image }}restore
          restore-keys: |
            ${{ steps.apt_archive_cache_dir.outputs.image }}
            ${{ steps.apt_archive_cache_dir.outputs.family }}

      - id: repository_verify
        name: Run repository verification contract
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/run-repository-verification@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          workspace: .
          # AGENTS.md §27: held only by the registry snapshot and the composer
          # prefetch. Both run before and apart from the consumer's make
          # targets. The verify step does not receive the token.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}
          # Empty: the consumer's make runs under this run's own event. The
          # promotion canary sets push and the leg's branch, since its legs
          # check out a consumer's main head inside a Core pull_request run
          # (AGENTS.md §45, row 27).
          event-name: push
          event-ref: refs/heads/${{ matrix.branch }}

      # Keep only archives of package versions installed in this evaluation, so
      # superseded versions and packages a repository stopped installing drop
      # out instead of accumulating across images. The save key is a digest of
      # the kept set: an unchanged set matches the restored entry and stores
      # nothing, and a repository whose setup installs no OS packages keeps
      # nothing and stores nothing.
      - id: apt_archive_inventory
        name: Inventory apt package archives
        if: always() && steps.apt_archive_cache_dir.outcome == 'success'
        shell: bash
        env:
          ARCHIVE_DIR: ${{ steps.apt_archive_cache_dir.outputs.path }}
          IMAGE_PREFIX: ${{ steps.apt_archive_cache_dir.outputs.image }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in "${ARCHIVE_DIR}"/*.deb; do
            package="$(dpkg-deb -f "${archive}" Package)"
            version="$(dpkg-deb -f "${archive}" Version)"
            if ! dpkg-query -W -f='${Version}\n' "${package}" 2>/dev/null | grep -qxF -- "${version}"; then
              sudo rm -f -- "${archive}"
            fi
          done
          archives=("${ARCHIVE_DIR}"/*.deb)
          digest=""
          if [ "${#archives[@]}" -gt 0 ]; then
            digest="$(printf '%s\n' "${archives[@]##*/}" | LC_ALL=C sort | sha256sum | cut -c1-16)"
          fi
          {
            echo "count=${#archives[@]}"
            echo "key=${IMAGE_PREFIX}${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Save apt package archives
        if: always() && steps.apt_archive_inventory.outputs.count != '' && steps.apt_archive_inventory.outputs.count != '0' && steps.apt_archive_inventory.outputs.key != steps.apt_archive_cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          key: ${{ steps.apt_archive_inventory.outputs.key }}

      # Repository verification ran the consumer's make, which may rewrite the
      # checkout's history: on Cursor-Governance it re-shallowed it, leaving no
      # merge base, so Semgrep's baseline scan failed and every language run
      # was incomplete (#328). Restore the shallow boundary recorded before any
      # consumer code ran. The baseline is not changed here, only made
      # reachable again: HEAD must be the evaluated revision and must reach
      # the baseline, or the run blocks.
      - name: Restore the checkout history for the baseline scan (CENTRAL-DIFF)
        if: steps.baseline.outputs.commit != ''
        env:
          BASELINE: ${{ steps.baseline.outputs.commit }}
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/l9-central-diff"
          shallow="$(git rev-parse --path-format=absolute --git-path shallow)"
          if [ -s "${state}/shallow" ]; then
            cp -- "${state}/shallow" "${shallow}"
          else
            rm -f -- "${shallow}"
          fi
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "$(cat "${state}/head")" ]; then
            echo "::error::the consumer's make moved HEAD from $(cat "${state}/head") to ${head}; the baseline scan cannot judge this revision"
            exit 1
          fi
          if ! merge_base="$(git merge-base HEAD "${BASELINE}")"; then
            echo "::error::no baseline: ${BASELINE} has no merge base with ${head} after repository verification"
            exit 1
          fi
          echo "Baseline ${BASELINE} reachable from ${head} (merge base ${merge_base})"

      # The provider toolchain is a locked contract, not a resolution. Core
      # selects the setup-python action by full SHA, the interpreter by exact
      # version (major.minor.patch, so a patch release cannot float in), the
      # Semgrep version exactly, and the Semgrep dependency closure by digest
      # inside the pinned Core action. Those selections change only with a
      # Core revision; the hosted runner image underneath them is GitHub's,
      # not Core's (workflow audit 2026-09-13, F-005). The SDK venv provisioned
      # above is untouched; only the provider install rides this interpreter.
      - name: Set up locked Python for the central toolchain
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - id: semgrep
        name: Install Semgrep (hash-locked central pin)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN — verified executable is handed to the SDK provider run.
        uses: Quantum-L9/l9-ci-core/.github/actions/install-semgrep@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          semgrep-version: ${{ steps.runtime.outputs['semgrep-version'] }}

      - name: Run + normalize Semgrep (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-run
          language: ${{ steps.language.outputs.language }}
          raw-output: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          root: .
          snapshot-id: ${{ matrix.revision }}
          revision: ${{ matrix.revision }}
          provider-executable: ${{ steps.semgrep.outputs.executable }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs['required-provider'] }}
          policy: ${{ steps.gov.outputs['sdk-policy'] }}
          baseline-commit: ${{ steps.baseline.outputs.commit }}
          waivers: ${{ steps.gov.outputs['finding-waivers'] }}
          waiver-repository: ${{ matrix.repository }}
          # The Core-staged identity map for the detected language. Without it
          # a strict profile (`release`) cannot resolve third-party rule
          # identities and `semgrep run --strict` refuses the run outright.
          identity-map: ${{ steps.gov.outputs['identity-map-directory'] }}/${{ steps.language.outputs.language }}.yaml

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json

      - id: gate
        name: Evaluate SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
        run: |
          set -euo pipefail
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *) echo "gate evaluate failed with unexpected exit ${exit_code}" >&2; exit "${exit_code}" ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK technical gate: ${status} (exit ${exit_code})"

      - id: instances
        name: Run every planned instance (SDK)
        if: steps.plan.outcome == 'success'
        env:
          L9_INSTANCE_DIR: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_PROVIDER_EXECUTABLE: ${{ steps.semgrep.outputs.executable }}
          L9_PRIMARY_LANGUAGE: ${{ steps.language.outputs.language }}
          L9_PRIMARY_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
          L9_REQUIRED: ${{ steps.gov.outputs['required-provider'] }}
          L9_POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          L9_IDENTITY_DIR: ${{ steps.gov.outputs['identity-map-directory'] }}
          L9_BASELINE: ${{ steps.baseline.outputs.commit }}
          L9_WAIVERS: ${{ steps.gov.outputs['finding-waivers'] }}
          L9_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # One record per planned semgrep instance (l9.core-instance-result/v1). The
          # primary language already ran through the full pipeline above, so its gate
          # status is reused; every other planned language runs the SDK now. An instance
          # that cannot conclude gets no record, so the aggregate reports it incomplete,
          # and an SDK execution error (run, bundle validation, or a gate exit outside
          # 0/1/6) fails this step in every mode, exactly as it does for the primary
          # language's own steps: infrastructure failure is never advisory.
          env = os.environ
          directory = Path(env["L9_INSTANCE_DIR"])
          plan = json.loads((directory / "plan.json").read_text(encoding="utf-8"))
          results = directory / "results"
          results.mkdir(parents=True, exist_ok=True)
          executable = env["L9_EXECUTABLE"]
          provider_dir = str(Path(env["L9_PROVIDER_EXECUTABLE"]).parent)
          run_env = dict(env, PATH=provider_dir + os.pathsep + env.get("PATH", ""))
          gate_status = {0: "pass", 1: "fail", 6: "incomplete"}
          errors = []


          def record(target, status):
              body = {
                  "schema": "l9.core-instance-result/v1",
                  "repository": plan["repository"],
                  "provider": "semgrep",
                  "target": target,
                  "revision": plan["revision"],
                  "sdk_revision": plan["sdk_revision"],
                  "status": status,
              }
              kind, _, name = target.partition(":")
              stem = name if kind == "language" else kind + "-" + name
              path = results / ("semgrep-" + stem + ".json")
              path.write_text(json.dumps(body, indent=2) + "\n", encoding="utf-8")
              print("instance semgrep:" + target + ": " + status)


          def sdk(*args):
              return subprocess.run([executable, *args], env=run_env, check=False).returncode


          def shared(command):
              """The flags every instance run shares with the primary run."""
              command += ["--policy", env["L9_POLICY"]]
              if env.get("L9_WAIVERS"):
                  command += ["--waivers", env["L9_WAIVERS"], "--repository", env["L9_REPOSITORY"]]
              if env.get("L9_STRICT") == "true":
                  command.append("--strict")
              if env.get("L9_REQUIRED") == "true":
                  command.append("--required")
              return command


          def conclude(target, work, run):
              """Run, validate and gate one instance; record it or note the error."""
              bundle = str(work / "finding-bundle.json")
              work.mkdir(parents=True, exist_ok=True)
              code = sdk(*run, "--output", bundle)
              if code == 0:
                  code = sdk("bundle", "validate", bundle)
              if code != 0:
                  errors.append("instance semgrep:" + target + ": SDK run failed (exit " + str(code) + ")")
                  return
              gate = ["gate", "evaluate", "--bundle", bundle, "--output", str(work / "gate-result.json")]
              gate.append("--strict-unresolved" if env.get("L9_STRICT") == "true" else "--no-strict-unresolved")
              code = sdk(*gate)
              if code in gate_status:
                  record(target, gate_status[code])
              else:
                  errors.append("instance semgrep:" + target + ": gate exited " + str(code))


          for instance in plan["instances"]:
              if instance["provider"] != "semgrep" or instance["prerequisite"] != "applicable":
                  continue
              target = instance["target"]
              kind, _, name = target.partition(":")
              if kind == "consumer":
                  # The repository's declared consumer rulepack (SDK ADR 0021):
                  # its own execution and bundle; central evidence is untouched.
                  run = ["semgrep", "consumer-run", "--root", ".",
                         "--snapshot-id", plan["revision"], "--revision", plan["revision"]]
                  conclude(target, directory / ("consumer-" + name), shared(run))
                  continue
              if kind != "language" or name not in ("python", "typescript"):
                  continue
              if name == env.get("L9_PRIMARY_LANGUAGE"):
                  primary = env.get("L9_PRIMARY_STATUS", "")
                  if primary in ("pass", "fail", "incomplete"):
                      record(target, primary)
                  else:
                      print("instance semgrep:" + target + ": no primary gate status", file=sys.stderr)
                  continue
              run = [
                  "semgrep", "run", "--language", name,
                  "--root", ".", "--snapshot-id", plan["revision"],
                  "--revision", plan["revision"],
                  "--identity-map", str(Path(env["L9_IDENTITY_DIR"]) / (name + ".yaml")),
              ]
              shared(run)
              if env.get("L9_BASELINE"):
                  run += ["--baseline-commit", env["L9_BASELINE"]]
              conclude(target, directory / name, run)

          for error in errors:
              print("::error::" + error, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

      - id: aggregate
        name: Aggregate required instances (Core)
        if: always() && steps.plan.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/aggregate-required-instances@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          plan: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json
          results-directory: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/results
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/aggregate.json

      # CENTRAL-DIFF counts: each bundle the SDK classified against the
      # baseline carries one `baseline <sha>: N new, M pre-existing (K
      # blocking reported as advisory), U unknown` limitation (ADR 0023).
      # Pre-existing findings warn here; only new ones and incomplete results
      # fail, through the gate. Observational: it changes no verdict.
      - name: Report CENTRAL-DIFF pre-existing findings (advisory)
        if: always() && steps.baseline.outputs.commit != ''
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".l9/runtime", os.environ["L9_MATRIX_ID"])
          lines = []
          for bundle in sorted(root.rglob("finding-bundle.json")):
              try:
                  limitations = json.loads(bundle.read_text(encoding="utf-8")).get("limitations", [])
              except (OSError, ValueError):
                  continue
              for item in limitations:
                  if isinstance(item, str) and item.startswith("baseline "):
                      lines.append(str(bundle.parent.relative_to(root)) + ": " + item)
          for line in lines:
              print("::warning::CENTRAL-DIFF " + line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary and lines:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("### Pre-existing findings (CENTRAL-DIFF)\n\n")
                  stream.writelines("- " + line + "\n" for line in lines)
          PY

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - name: Project SARIF (SDK-owned)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-sarif
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          raw-report: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          sarif: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          destination-root: artifacts

      - name: Stage technical gate result
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"
          cp .l9/runtime/capabilities.json "artifacts/l9/${L9_MATRIX_ID}/repository-capabilities.json"

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          artifact-root: artifacts
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          routing-record: ${{ steps.route.outputs['routing-record'] }}
          output: artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/artifact-index.json

      - id: upload
        name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/l9/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/
          if-no-files-found: error
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      # Every planned instance's own bundle beside the central artifact set
      # (SDK ADR 0021, Core change 2): secondary languages and the declared
      # consumer rulepack, whose bundle names the consumer rule files and the
      # rules evaluated. A separate artifact, so the central set, its manifest
      # and its handoff are unchanged. .l9/runtime is untracked workspace
      # state written by this job only.
      - name: Upload instance bundles
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l9-instance-bundles-${{ steps.runtime.outputs['matrix-id'] }}-${{ github.run_attempt }}
          path: |
            .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      - id: handoff
        name: Create artifact handoff descriptor
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/create-artifact-handoff@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          workflow-head-sha: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          output: .l9/runtime/handoffs/${{ steps.runtime.outputs['matrix-id'] }}.json

      - name: Write central CI summary
        if: always()
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          PROFILE: ${{ steps.runtime.outputs.profile }}
          MODE: ${{ steps.gov.outputs.mode }}
          SDK_REVISION: ${{ steps.sdk.outputs['sdk-revision'] }}
          LANGUAGE: ${{ steps.language.outputs.language }}
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status || steps.repository_verify.outcome }}
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          INSTANCES_STATUS: ${{ steps.aggregate.outputs.status }}
          ARTIFACT_NAME: ${{ steps.names.outputs['artifact-name'] }}
          TOOLCHAIN_ALIGNMENT: ${{ steps.toolchain.outcome }}
          BIOME_STATUS: ${{ steps.biome_check.outputs.status || steps.biome_check.outcome }}
        run: |
          {
            echo "### L9 central CI"
            echo
            echo "- Event: \`${EVENT_CLASS:-unknown}\`"
            echo "- Profile: \`${PROFILE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- SDK revision: \`${SDK_REVISION:-unknown}\`"
            echo "- Detected language: \`${LANGUAGE:-unknown}\`"
            echo "- Repository verification: \`${REPOSITORY_VERIFY:-unavailable}\`"
            echo "- Technical gate: \`${GATE_STATUS:-unavailable}\`"
            echo "- Required instances: \`${INSTANCES_STATUS:-unavailable}\`"
            echo "- Artifact set: \`${ARTIFACT_NAME:-unavailable}\`"
            echo "- Toolchain alignment (advisory): \`${TOOLCHAIN_ALIGNMENT:-unavailable}\`"
            echo "- Biome (blocking): \`${BIOME_STATUS:-unavailable}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository verification
        # Contract and infrastructure failures are fatal on every profile,
        # including advisory nightly, release, and supply_chain (AGENTS.md §9).
        # Finding mode stays on the technical-gate step below.
        if: always()
        env:
          REPOSITORY_VERIFY_STATUS: ${{ steps.repository_verify.outputs.status }}
          REPOSITORY_VERIFY_MODE: ${{ steps.repository_verify.outputs.contract-mode }}
          REPOSITORY_VERIFY_FAILURE: ${{ steps.repository_verify.outputs.failure-kind }}
        run: |
          set -euo pipefail
          # An absent contract is tolerated only where Core's bundled policy
          # resolved migration mode; required mode accepts pass only.
          case "${REPOSITORY_VERIFY_MODE}:${REPOSITORY_VERIFY_STATUS}" in
            migration:pass|migration:not_applicable|required:pass) ;;
            *)
              echo "Blocking profile: repository verification did not pass (mode ${REPOSITORY_VERIFY_MODE:-unavailable}; status ${REPOSITORY_VERIFY_STATUS:-unavailable}; failure ${REPOSITORY_VERIFY_FAILURE:-unavailable})" >&2
              exit 1
              ;;
          esac

      # The verdict is the aggregate over every planned instance, the primary
      # language's gate among them. A required instance that is missing,
      # skipped or unfinished makes the aggregate incomplete (exit 6), never
      # pass; no aggregate at all is incomplete too.
      # Toolchain drift is housekeeping (operator decision 2026-11-20: only
      # checks that protect working or secure code block a merge). Each
      # declaration of a Core-owned tool that differs from toolchain-lock.json
      # is a warning at file:line and a line in the summary; it never fails
      # the job. align.py decides what drift is (the report's own status).
      - name: Report toolchain alignment drift (advisory)
        if: always()
        env:
          REPORT: .l9/runtime/toolchain-alignment.json
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
              status = report["status"]
              findings = report["findings"]
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f"::warning::toolchain alignment report unavailable ({error}); drift not reported")
          else:
              drift = [
                  item
                  for item in findings
                  if item.get("class") not in ("exact_match", "range_admits_lock")
              ]
              for item in drift:
                  print(
                      f"::warning file={item.get('path')},line={item.get('line')}::"
                      f"{item.get('tool')} {item.get('declared') or '(no version)'} "
                      f"is not Core's locked {item.get('lock')} ({item.get('class')})"
                  )
              line = f"- Toolchain drift (advisory): `{status}`, {len(drift)} declaration(s)"
              summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if summary:
                  with open(summary, "a", encoding="utf-8") as stream:
                      stream.write(line + "\n")
              print(line)
          PY

      - name: Enforce central mode on SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          AGGREGATE_EXIT: ${{ steps.aggregate.outputs['exit-code'] }}
          ACCOUNTED: ${{ steps.aggregate.outputs.accounted }}
          MODE: ${{ steps.gov.outputs.mode }}
        run: |
          set -euo pipefail
          status="${AGGREGATE_STATUS:-incomplete}"
          exit_code="${AGGREGATE_EXIT:-6}"
          echo "SDK technical gate (primary language): ${GATE_STATUS:-unavailable}"
          echo "Required instances: ${status} (exit ${exit_code}; accounted ${ACCOUNTED:-false}); central mode: ${MODE}"
          if [ "${status}" != "pass" ] && [ "${MODE}" = "blocking" ]; then
            echo "Blocking mode: failing job on required instances '${status}'" >&2
            exit "${exit_code}"
          fi

      # The security job's result, enforced in the required context. Anything
      # but success fails, skipped and cancelled included: an INCOMPLETE scan
      # never passes.
      - name: Enforce security scan (secrets, dependency audit)
        if: always()
        env:
          SECURITY_RESULT: ${{ steps.security__result.outputs.result }}
        run: |
          set -euo pipefail
          echo "Security scan (gitleaks, pip-audit; bandit advisory): ${SECURITY_RESULT:-unavailable}"
          if [ "${SECURITY_RESULT}" != "success" ]; then
            echo "::error title=Security scan::the security job concluded '${SECURITY_RESULT:-unavailable}'; a secret or a vulnerable dependency blocks the merge (see the security job)"
            exit 1
          fi
      # --- canary record (not part of org-ci.yml) ---
      - name: Record the canary leg
        if: always()
        env:
          SIDE: head
          DIGEST: b6b40b71a8b3abb88fc7539a897f6f281f74368ee1eaf79756050ff89a1ce4c0
          JOB_STATUS: ${{ job.status }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status }}
          MATRIX_ID: canary-head-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/promotion-canary"
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          blocking = set()
          runtime = Path(".l9/runtime", env["MATRIX_ID"])
          for path in sorted(runtime.rglob("gate-result.json")):
              try:
                  result = json.loads(path.read_text(encoding="utf-8"))
                  blocking.update(result["blocking_finding_ids"])
              except (OSError, ValueError, KeyError, TypeError):
                  pass
          verify = env.get("REPOSITORY_VERIFY", "")
          aggregate = env.get("AGGREGATE_STATUS", "")
          if env["JOB_STATUS"] == "success":
              status = "pass"
          elif env["JOB_STATUS"] == "cancelled":
              # Superseded by a newer run, or over the leg's time limit.
              status = "cancelled"
          elif aggregate == "incomplete":
              status = "incomplete"
          elif verify not in ("", "pass", "not_applicable"):
              status = "verification"
          elif aggregate == "fail":
              status = "findings"
          elif aggregate == "pass" and verify in ("pass", "not_applicable"):
              # Verified and analysed, then a later gate step failed.
              status = "enforcement"
          else:
              # The job failed before any verdict: infrastructure, not the
              # repository.
              status = "error"
          record = {
              "schema": "l9.promotion-canary-leg/v2",
              "side": env["SIDE"],
              "digest": env["DIGEST"],
              "repository": env["REPOSITORY"],
              "revision": env["REVISION"],
              "status": status,
              "job_status": env["JOB_STATUS"],
              "aggregate": aggregate,
              "repository_verification": verify,
              "blocking_finding_ids": sorted(blocking),
          }
          name = env["SIDE"] + "-" + env["SLUG"] + ".json"
          path = Path(env["RUNNER_TEMP"], "promotion-canary", name)
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record))
          PY

      - name: Upload the canary leg record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-canary-head-${{ matrix.slug }}
          path: ${{ runner.temp }}/promotion-canary/head-${{ matrix.slug }}.json
          # A leg that cannot write its record fails its job, and the verdict
          # then finds no record and blocks.
          if-no-files-found: error
          retention-days: 14

  admitted__security:
    name: Canary ${{ matrix.repository }} security job (admitted SDK)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true' && needs.plan.outputs.admitted != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job security .github/workflows/security.yml@da01ee359ee18c59ff98b119e5aa5ee609754b5d: begin ---
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        id: security__s0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect project languages
        id: security__detect
        run: |
          set -euo pipefail
          python_project=false
          node_project=false
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            python_project=true
          fi
          if [ -f "package.json" ]; then
            node_project=true
          fi
          echo "python=${python_project}" >> "$GITHUB_OUTPUT"
          echo "node=${node_project}" >> "$GITHUB_OUTPUT"
          echo "Detected: python=${python_project} node=${node_project}"
      - name: Secret scan (gitleaks)
        id: security__gitleaks
        env:
          GITLEAKS_LOG_OPTS: ''
          GITLEAKS_SCOPE: event
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          case "${GITLEAKS_SCOPE:-history}" in
            history) ;;
            event)
              if [ -z "${GITLEAKS_LOG_OPTS}" ]; then
                case "${EVENT_NAME}" in
                  pull_request|pull_request_target) GITLEAKS_LOG_OPTS="${PR_BASE}..${PR_HEAD}" ;;
                  merge_group) GITLEAKS_LOG_OPTS="${MERGE_GROUP_BASE}..${MERGE_GROUP_HEAD}" ;;
                  push)
                    if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                      GITLEAKS_LOG_OPTS="-1 ${EVENT_SHA}"
                    else
                      GITLEAKS_LOG_OPTS="${PUSH_BEFORE}..${EVENT_SHA}"
                    fi
                    ;;
                  *) ;;
                esac
              fi
              ;;
            *)
              echo "::error::gitleaks-scope must be history or event (got '${GITLEAKS_SCOPE}')"
              exit 2
              ;;
          esac
          # Rules: the Core preset (presets/security/.gitleaks.toml) is
          # gitleaks' own default rule set (`[extend] useDefault = true`). A
          # repository's own .gitleaks.toml is honoured on top of it: its rules
          # and allowlists apply, and when it does not already extend the
          # defaults it is made to, so no repository config can drop the Core
          # rules. A repository config that extends another file by `path`
          # cannot also extend the defaults (gitleaks allows one of the two),
          # so it is refused rather than scanned with fewer rules. Reviewed
          # false positives belong in .gitleaksignore, which gitleaks reads
          # from the scanned tree.
          config="${RUNNER_TEMP:-/tmp}/l9-gitleaks.toml"
          config_args=()
          if [ -f ".gitleaks.toml" ]; then
            python3 -I - ".gitleaks.toml" "${config}" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          source, target = Path(sys.argv[1]), Path(sys.argv[2])
          text = source.read_text(encoding="utf-8")
          try:
              extend = tomllib.loads(text).get("extend")
          except tomllib.TOMLDecodeError as error:
              sys.exit(f"::error::.gitleaks.toml is not valid TOML: {error}")
          if extend is None:
              text += (
                  "\n\n# Added by Core security.yml: keep the Core preset rules"
                  " (gitleaks defaults).\n[extend]\nuseDefault = true\n"
              )
          elif not isinstance(extend, dict) or "path" in extend:
              sys.exit(
                  "::error::.gitleaks.toml [extend] names a path; it cannot also"
                  " extend the Core preset rules (gitleaks allows path or"
                  " useDefault, not both). Inline the rules and use"
                  " `useDefault = true`."
              )
          elif extend.get("useDefault") is not True:
              sys.exit(
                  "::error::.gitleaks.toml [extend] must set useDefault = true"
                  " so the Core preset rules apply."
              )
          target.write_text(text, encoding="utf-8")
          PY
            config_args=(--config "${config}")
          fi
          range_args=()
          if [ -n "${GITLEAKS_LOG_OPTS}" ]; then
            # The range must resolve in this clone before gitleaks runs:
            # gitleaks exits 1 both for findings and for a git log error, so an
            # unresolvable range would otherwise read as a failed scan. The
            # options are word-split on purpose; they are git log arguments.
            # shellcheck disable=SC2086
            if ! git log --format=%H ${GITLEAKS_LOG_OPTS} -- > /dev/null; then
              echo "::error::gitleaks range '${GITLEAKS_LOG_OPTS}' does not resolve in this clone; fetch its history"
              exit 2
            fi
            range_args=(--log-opts="${GITLEAKS_LOG_OPTS}")
          fi
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          actual_sha="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Everything above is acquisition. A failure there ends the step with
          # no outcome, which the report labels not_executed. From here the
          # scanner itself runs and its exit code is the outcome.
          status=0
          /tmp/gitleaks git "${config_args[@]}" "${range_args[@]}" \
            --no-banner --redact --exit-code 1 . || status=$?
          case "${status}" in
            0) echo "outcome=executed_pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=executed_fail" >> "$GITHUB_OUTPUT" ;;
            *) echo "outcome=not_executed" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "${status}"
      - name: Set up Python
        id: security__s3
        if: steps.security__detect.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12
      - name: Python dependency audit (pip-audit)
        id: security__pip_audit
        if: steps.security__detect.outputs.python == 'true'
        env:
          L9_CI_INSTALL_COMMAND: ''
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          # Scope (operator decision 2026-11-21, row 23): a pull request,
          # merge group or push audits only when it changes a dependency
          # manifest or lock. Every other event audits. A range that cannot be
          # read audits too: not running needs a positive proof.
          is_sha() {
            local candidate="$1"
            [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]
          }
          base=""
          head=""
          case "${EVENT_NAME:-}" in
            pull_request|pull_request_target) base="${PR_BASE:-}"; head="${PR_HEAD:-}" ;;
            merge_group) base="${MERGE_GROUP_BASE:-}"; head="${MERGE_GROUP_HEAD:-}" ;;
            push) base="${PUSH_BEFORE:-}"; head="${EVENT_SHA:-}" ;;
            *) ;;
          esac
          if is_sha "${base}" && is_sha "${head}" \
            && [ "${base}" != "0000000000000000000000000000000000000000" ]; then
            # --no-renames: a renamed or deleted lock shows its old path too.
            if changed="$(git diff --no-renames --name-only "${base}" "${head}" --)"; then
              manifests='(^|/)(pyproject\.toml|uv\.lock|setup\.py|setup\.cfg|requirements[^/]*\.txt|constraints[^/]*\.txt|Pipfile(\.lock)?|poetry\.lock|pdm\.lock)$'
              if ! grep -Eq "${manifests}" <<< "${changed}"; then
                echo "pip-audit: no dependency manifest or lock changed in ${base}..${head}; nothing new to audit"
                echo "outcome=not_applicable (no dependency manifest or lock changed)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::warning::pip-audit: the change range ${base}..${head} cannot be read; auditing"
            fi
          fi
          python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
          pip install --only-binary :all: "pip-audit==2.9.0"
          if [ -n "$L9_CI_INSTALL_COMMAND" ]; then
            bash -c "$L9_CI_INSTALL_COMMAND" || echo "::notice::l9-ci install command failed; continuing"
          fi
          # The full resolved lock, not the runner's environment: uv.lock
          # exported with every dependency group, extra and workspace package
          # (the project's own workspace members are local code, not
          # packages, and are left out), else requirements.txt. uv is Core's
          # locked version (install-consumer-ci/toolchain-lock.json).
          locked=()
          if [ -f "uv.lock" ]; then
            pip install --only-binary :all: "uv==0.13.8"
            out="${RUNNER_TEMP:-/tmp}/l9-locked"
            mkdir -p "${out}"
            export_lock() {
              local name="$1"
              shift
              uv export --frozen --all-packages --no-emit-workspace --no-hashes \
                --format requirements.txt --output-file "${out}/${name}.txt" "$@" > /dev/null
            }
            if export_lock all --all-groups --all-extras; then
              locked+=("${out}/all.txt")
            elif python3 -I -c 'import sys, tomllib; sys.exit(0 if tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("uv", {}).get("conflicts") else 1)' 2> /dev/null; then
              # Declared conflicts ([tool.uv].conflicts) make the union of
              # every extra and group unresolvable by design. Each selection
              # is exported and audited on its own: the base set, then every
              # extra and every group. Any selection that cannot be exported
              # leaves the locked set unknown.
              echo "pip-audit: uv.lock declares conflicting extras or groups; auditing each selection"
              selections="$(python3 -I -c 'import tomllib; d = tomllib.load(open("pyproject.toml", "rb")); [print("extra", n) for n in d.get("project", {}).get("optional-dependencies", {})]; [print("group", n) for n in d.get("dependency-groups", {})]')"
              if ! export_lock base --no-default-groups; then
                echo "::error::pip-audit: the base set of uv.lock cannot be exported; the audit is incomplete"
                echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              locked+=("${out}/base.txt")
              while read -r kind name; do
                [ -n "${kind}" ] || continue
                if ! export_lock "${kind}-${name}" --no-default-groups "--${kind}" "${name}"; then
                  echo "::error::pip-audit: the ${kind} ${name} of uv.lock cannot be exported; the audit is incomplete"
                  echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                locked+=("${out}/${kind}-${name}.txt")
              done <<< "${selections}"
            else
              echo "::error::pip-audit: uv.lock cannot be exported; the locked set is unknown, so the audit is incomplete"
              echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f "requirements.txt" ]; then
            locked=("requirements.txt")
          else
            echo "::error::pip-audit: a Python project with no uv.lock or requirements.txt has no locked set to audit; the audit is incomplete"
            echo "outcome=not_executed (no lock file)" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Acquisition and the lock are settled; from here pip-audit runs.
          status=0
          # `--desc` takes an optional value; it is given explicitly so the
          # next argument is never read as that value (`--desc .` is a usage
          # error, exit 2, and audits nothing). An exported lock is fully
          # pinned, so it is audited as written (--no-deps).
          if [ "${locked[0]}" = "requirements.txt" ]; then
            pip-audit --desc on -r requirements.txt || status=$?
          else
            requirements=()
            for file in "${locked[@]}"; do
              requirements+=(-r "${file}")
            done
            pip-audit --desc on --no-deps "${requirements[@]}" || status=$?
          fi
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      # Advisory by existing policy: no Bandit result fails this job. The exit
      # code is still read, because "no findings", "findings" and "the scanner
      # did not complete" are three different facts. Bandit exits 0 with no
      # issue at the selected level, 1 with issues, and anything else when it
      # could not scan.
      - name: Python static security scan (bandit)
        id: security__bandit
        if: steps.security__detect.outputs.python == 'true'
        env:
          SOURCE_DIR: .
        run: |
          set -euo pipefail
          pip install --only-binary :all: "bandit==1.8.6"
          status=0
          bandit -r "$SOURCE_DIR" -ll -f screen \
            --exclude ./venv,./.venv,./tests,./build,./dist \
            || status=$?
          case "${status}" in
            0)
              outcome="executed_no_findings"
              echo "::notice::Bandit (advisory) completed with no findings at medium severity or above"
              ;;
            1)
              outcome="executed_findings"
              echo "::warning::Bandit (advisory) reported findings; an advisory scan does not fail this job"
              ;;
            *)
              outcome="not_executed"
              echo "::warning::Bandit (advisory) did not complete (exit ${status}); no Bandit result exists for this revision"
              ;;
          esac
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
      - name: Node dependency audit (npm audit)
        id: security__npm_audit
        if: steps.security__detect.outputs.node == 'true' && false
        run: |
          set -euo pipefail
          if [ ! -f "package-lock.json" ]; then
            echo "::error::run-npm-audit=true requires package-lock.json in the working directory"
            exit 1
          fi
          # The lockfile check above is a contract failure, not a scan: it
          # leaves no outcome. From here npm audit itself runs.
          status=0
          npm audit --audit-level=high || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      - name: Non-applicable gates
        id: security__s7
        if: steps.security__detect.outputs.python != 'true' && steps.security__detect.outputs.node != 'true'
        run: echo "::notice::No Python or Node project detected; only the secret scan ran"
      # One row per scan: what policy says about it and what actually happened.
      # Each scan step states its own outcome once its scanner has run. A step
      # that never ran, or that failed before its scanner ran, has no outcome
      # and is reported not_executed, never as a pass or as a scan failure.
      # The step runs from the workspace root: the job default is the caller's
      # working-directory, and if that does not exist no step could start there.
      - name: Report scan requiredness and outcomes
        id: security__s8
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          DETECT_OUTCOME: ${{ steps.security__detect.outcome }}
          PYTHON_PROJECT: ${{ steps.security__detect.outputs.python }}
          NODE_PROJECT: ${{ steps.security__detect.outputs.node }}
          NPM_AUDIT_REQUESTED: false
          GITLEAKS_STEP: ${{ steps.security__gitleaks.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.security__gitleaks.outputs.outcome }}
          PIP_AUDIT_STEP: ${{ steps.security__pip_audit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.security__pip_audit.outputs.outcome }}
          BANDIT_STEP: ${{ steps.security__bandit.outcome }}
          BANDIT_OUTCOME: ${{ steps.security__bandit.outputs.outcome }}
          NPM_AUDIT_STEP: ${{ steps.security__npm_audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.security__npm_audit.outputs.outcome }}
        run: |
          set -euo pipefail
          required_outcome() {
            local conclusion="$1"  # the step's conclusion
            local stated="$2"      # the outcome the step stated itself
            if [ -n "${stated}" ]; then
              echo "${stated}"
            elif [ "${conclusion}" = "failure" ]; then
              echo "not_executed (the step failed before its scanner ran)"
            else
              echo "not_executed"
            fi
          }
          gitleaks="$(required_outcome "${GITLEAKS_STEP}" "${GITLEAKS_OUTCOME}")"
          if [ "${DETECT_OUTCOME}" != "success" ]; then
            pip_audit="not_executed (language detection did not complete)"
            bandit="not_executed (language detection did not complete)"
            npm_audit="not_executed (language detection did not complete)"
          else
            if [ "${PYTHON_PROJECT}" = "true" ]; then
              pip_audit="$(required_outcome "${PIP_AUDIT_STEP}" "${PIP_AUDIT_OUTCOME}")"
              bandit="${BANDIT_OUTCOME:-not_executed}"
            else
              pip_audit="not_applicable (no Python project detected)"
              bandit="not_applicable (no Python project detected)"
            fi
            if [ "${NPM_AUDIT_REQUESTED}" != "true" ]; then
              npm_audit="not_run (run-npm-audit is false)"
            elif [ "${NODE_PROJECT}" != "true" ]; then
              npm_audit="not_applicable (no Node project detected)"
            else
              npm_audit="$(required_outcome "${NPM_AUDIT_STEP}" "${NPM_AUDIT_OUTCOME}")"
            fi
          fi
          npm_requiredness="not run"
          if [ "${NPM_AUDIT_REQUESTED}" = "true" ]; then
            npm_requiredness="required"
          fi
          {
            echo "### L9 Security scan outcomes"
            echo
            echo "| Scan | Requiredness | Outcome |"
            echo "| --- | --- | --- |"
            echo "| gitleaks | required | ${gitleaks} |"
            echo "| pip-audit | required when Python is detected | ${pip_audit} |"
            echo "| bandit | advisory | ${bandit} |"
            echo "| npm audit | ${npm_requiredness} | ${npm_audit} |"
            echo
            echo "Advisory, not_run, not_applicable and not_executed are not passes."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # --- inlined org-ci job security .github/workflows/security.yml@da01ee359ee18c59ff98b119e5aa5ee609754b5d: end ---
      - name: Record the security job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/security.result"
      - name: Upload the security job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-admitted-security-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/security.result
          if-no-files-found: error
          retention-days: 1

  admitted:
    name: Canary ${{ matrix.repository }} (admitted SDK)
    needs: [plan, admitted__security]
    if: ${{ !cancelled() && (needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true' && needs.plan.outputs.admitted != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- the security job's result for this repository (not part of org-ci.yml) ---
      - name: Download the security job result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A pattern, not a name: a missing result downloads nothing (a name
          # would fail the step), and the next step reads nothing as failure.
          pattern: canary-job-admitted-security-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job
          merge-multiple: true
      - name: Result of the security job
        id: security__result
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/canary-job/security.result"
          result=""
          if [ -f "${file}" ]; then
            result="$(tr -d '[:space:]' < "${file}")"
          fi
          case "${result}" in
            success|failure|cancelled) ;;
            *) result=failure ;;
          esac
          echo "security job: ${result}"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
      - id: runtime
        name: Resolve central runtime class
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_EVENT: ${{ inputs.event || '' }}
          INPUT_PROFILE: ${{ inputs.profile || '' }}
          INPUT_MATRIX_ID: canary-admitted-${{ matrix.slug }}
          INPUT_SDK_REVISION: ${{ inputs.sdk-revision || '' }}
          INPUT_SEMGREP_VERSION: ${{ inputs.semgrep-version || '1.171.0' }}
          INPUT_RETENTION: ${{ inputs.artifact-retention-days || 14 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          gh_event = os.environ["GH_EVENT"]
          requested_event = os.environ.get("INPUT_EVENT", "").strip()
          requested_profile = os.environ.get("INPUT_PROFILE", "").strip()

          allowed = {"pull_request", "push", "merge", "nightly", "release", "supply_chain"}
          fixed = {"pull_request": "pr_fast", "push": "merge", "merge": "merge"}
          native = {
              "pull_request": ("pull_request", "pr_fast"),
              "merge_group": ("merge", "merge"),
              "push": ("push", "merge"),
          }

          if gh_event == "workflow_dispatch":
              event_class = requested_event or "nightly"
              profile = requested_profile or event_class
          elif requested_event:
              # Reusable workflows retain the caller's event_name, so the
              # required event input—not `workflow_call`—identifies this path.
              event_class = requested_event
              if event_class not in allowed:
                  raise SystemExit(f"unsupported event class: {event_class}")
              expected_profile = fixed.get(event_class, event_class)
              profile = requested_profile or expected_profile
              if profile != expected_profile:
                  raise SystemExit(
                      "reusable profile claim "
                      f"{profile!r} does not match event {event_class!r}; "
                      f"expected {expected_profile!r}"
                  )
          elif gh_event in native:
              event_class, profile = native[gh_event]
          elif gh_event == "workflow_call":
              raise SystemExit("workflow_call requires event")
          else:
              raise SystemExit(f"unsupported trigger: {gh_event}")

          if event_class not in allowed:
              raise SystemExit(f"unsupported event class: {event_class}")
          matrix_id = os.environ.get("INPUT_MATRIX_ID", "org-semgrep")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", matrix_id):
              raise SystemExit("invalid matrix-id")
          sdk_revision = os.environ.get("INPUT_SDK_REVISION", "").strip()
          if sdk_revision and not re.fullmatch(r"[0-9a-f]{40}", sdk_revision):
              raise SystemExit("sdk-revision must be a full 40-character lowercase SHA")
          semgrep_version = os.environ.get("INPUT_SEMGREP_VERSION", "1.171.0").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", semgrep_version):
              raise SystemExit("semgrep-version must be an exact x.y.z version")
          retention = int(os.environ.get("INPUT_RETENTION", "14"))
          if not 1 <= retention <= 90:
              raise SystemExit("artifact-retention-days must be between 1 and 90")

          outputs = {
              "event-class": event_class,
              "profile": profile,
              "matrix-id": matrix_id,
              "sdk-revision": sdk_revision,
              "semgrep-version": semgrep_version,
              "artifact-retention-days": str(retention),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          PY

      # A pull-request scope failure stays a failure. An explicit full-suite
      # override is refused. Nothing here selects the deep suite, and a failed
      # scope does not fall through to one. This runs before checkout so the
      # apt cache still wraps repository verification directly.
      - name: Refuse a pull-request full-suite fallback
        if: >-
          github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
          || steps.runtime.outputs.event-class == 'pull_request'
          || steps.runtime.outputs.event-class == 'merge'
        env:
          # A reusable call keeps the caller's event_name. The class resolved
          # above is the pull-request or merge path this step is judging.
          GH_EVENT: ${{ steps.runtime.outputs.event-class }}
          FULL_SUITE_OVERRIDE: ${{ vars.L9_CI_FULL_SUITE || '' }}
          PR_SCOPE_STATUS: ${{ vars.L9_PR_SCOPE_STATUS || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys


          def finish(status, code):
              print(status)
              print("heavy=false")
              print("suite_pass=false")
              print("selected_suite=none")
              raise SystemExit(code)


          event = os.environ["GH_EVENT"]
          override = os.environ.get("FULL_SUITE_OVERRIDE", "").strip().lower()
          scope = os.environ.get("PR_SCOPE_STATUS", "").strip().lower()
          pr_events = ("pull_request", "merge_group", "merge")

          if event not in pr_events:
              finish("NOT_APPLICABLE", 0)
          if override not in ("", "0", "false", "no"):
              finish("POLICY_PR_DEEP_FORBIDDEN", 1)
          if scope in ("unknown", "failed", "unresolved", "pr_scope_unknown"):
              finish("PR_SCOPE_UNKNOWN", 1)
          finish("NO_FULL_SUITE_FALLBACK", 0)
          PY

      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          # Depth 2: a pull_request / merge_group revision is a merge commit,
          # and its base parent is what a consumer's merge-base check needs
          # once origin is reset to an anonymous URL below.
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      # Reports consumer declarations of Core-owned tools that drift from
      # Core's toolchain-lock.json, with file:line annotations, into
      # .l9/runtime/toolchain-alignment.json. Advisory: drift never fails the
      # job (housekeeping, operator decision 2026-11-20). The lock ships inside
      # this pinned Core revision.
      - id: toolchain
        name: Report toolchain alignment (advisory)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/check-toolchain-alignment@da01ee359ee18c59ff98b119e5aa5ee609754b5d

      - name: Validate native push event context
        if: github.event_name == 'push'
        env:
          EVENT_REPOSITORY: ${{ matrix.repository }}
          EVENT_SHA: ${{ matrix.revision }}
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
        run: |
          set -euo pipefail
          if [ "${EVENT_CLASS}" != "push" ]; then
            echo "::error::push trigger resolved to event class '${EVENT_CLASS}'" >&2
            exit 1
          fi
          if [ -z "${EVENT_REPOSITORY}" ]; then
            echo "::error::push execution has no repository identity" >&2
            exit 1
          fi
          if [ -z "${EVENT_SHA}" ]; then
            echo "::error::push execution has no immutable SHA" >&2
            exit 1
          fi
          case "${EVENT_SHA}" in
            *[!0-9a-f]* | "") sha_ok=false ;;
            ????????????????????????????????????????) sha_ok=true ;;
            *) sha_ok=false ;;
          esac
          if [ "${sha_ok}" != "true" ]; then
            echo "::error::push SHA is not a full 40-character revision" >&2
            exit 1
          fi
          echo "Native push evaluation target: ${EVENT_REPOSITORY}@${EVENT_SHA}"

      - id: consumer
        name: Resolve optional consumer metadata
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-consumer-metadata@da01ee359ee18c59ff98b119e5aa5ee609754b5d

      - id: gov
        name: Resolve central governance
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          profile: ${{ steps.runtime.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.runtime.outputs['event-class'] }}
          repository: ${{ matrix.repository }}
          ref: refs/heads/${{ matrix.branch }}
          product-kind: ${{ steps.consumer.outputs['product-kind'] }}

      - name: Validate consumer waiver pointers
        env:
          REQUESTED: ${{ steps.consumer.outputs['waiver-refs'] }}
          APPLICABLE: ${{ steps.gov.outputs['waiver-ids'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          requested = {item for item in os.environ.get("REQUESTED", "").split(",") if item}
          applicable = {item for item in os.environ.get("APPLICABLE", "").split(",") if item}
          unknown = sorted(requested - applicable)
          if unknown:
              raise SystemExit(f"consumer waiver_refs are not centrally applicable: {unknown}")
          PY

      - id: names
        name: Resolve artifact name
        env:
          MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # --- admitted SDK revision: provision-sdk from the pull request ---
      - name: Download the pull request's SDK provisioner
        if: steps.gov.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: canary-admitted-core
          path: ${{ runner.temp }}/canary-admitted-core
      - name: Select locked SDK runtime Python
        if: steps.gov.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - id: sdk
        if: steps.gov.outputs.enabled == 'true'
        shell: bash
        env:
          INPUT_SDK_SOURCE: git
          INPUT_SDK_REPOSITORY: https://github.com/Quantum-L9/l9-ci-sdk.git
          INPUT_SDK_REVISION: ${{ needs.plan.outputs.admitted }}
          INPUT_RUNTIME_DIRECTORY: .l9/runtime/sdk
          INPUT_GITHUB_READ_TOKEN: ${{ secrets.L9_GITHUB_READ_TOKEN }}
        run: python3 "${{ runner.temp }}/canary-admitted-core/.github/actions/provision-sdk/provision.py"

      - id: language
        name: Detect repository language (SDK)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN — detect-language (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/detect-language@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          repo-class: ${{ steps.consumer.outputs['repo-class'] }}
          root: .

      # L9-CI-CORE-003: every applicable provider/language instance is planned,
      # run and accounted for, so a second language is never silently dropped
      # in favour of the detected one. The SDK states the facts (capability
      # inventory of this exact snapshot, taken before repository verification
      # can touch the tree); requiredness is Core's (plan-required-instances).
      - id: inventory
        name: Inventory repository capabilities (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          directory=".l9/runtime/${L9_MATRIX_ID}/required-instances"
          mkdir -p "${directory}"
          "${L9_EXECUTABLE}" providers inventory --root . --format json \
            --consumer-rules --output "${directory}/inventory.json"
          echo "path=${directory}/inventory.json" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Plan required instances (Core)
        if: steps.inventory.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/plan-required-instances@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          inventory: ${{ steps.inventory.outputs.path }}
          repository: ${{ matrix.repository }}
          revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          required-providers: ${{ steps.gov.outputs['required-provider'] == 'true' && 'semgrep' || '' }}
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json

      # Core owns the consumer-facing Biome check end to end: the version is
      # the `biome` key of Core's toolchain lock, the binary is digest-locked,
      # and the run is blocking (findings annotate, then fail the step;
      # infrastructure failures are fatal). It is independent of Semgrep
      # governance; a consumer without biome.json or biome.jsonc is
      # not_applicable and nothing is downloaded.
      - id: biome
        name: Install Biome (digest-locked central pin)
        if: hashFiles('biome.json', 'biome.jsonc') != ''
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/install-biome@da01ee359ee18c59ff98b119e5aa5ee609754b5d

      - id: biome_check
        name: Run Biome check (blocking)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/run-biome-check@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.biome.outputs.executable }}
          provider-version: ${{ steps.biome.outputs['provider-version'] }}
          mode: blocking

      # SDK ADR 0023 (CENTRAL-DIFF): findings are classified new or
      # pre-existing against a baseline commit; only new blocking findings and
      # incomplete results fail, pre-existing ones are reported as advisory
      # with counts (docs/central-diff-baseline.md). pull_request and push
      # judge against the evaluated revision's first parent (on a pull
      # request GitHub's merge commit, so the target tip; on a push the
      # previous tip; fetched at depth 2 above), a merge group against
      # merge_group.base_sha; nightly, release and supply_chain pass none, so
      # the whole tree is judged by policy alone. It is resolved here, before
      # repository verification runs any consumer code, and held by a ref:
      # a consumer's make can rewrite .git (a re-shallowed checkout has no
      # HEAD^1), and nothing it does may move the baseline. A baseline that
      # does not resolve blocks; tracked changes or an incomplete baseline
      # scan make the SDK fail closed.
      - id: baseline
        name: Resolve the baseline commit (CENTRAL-DIFF)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          # A merge group's base (docs/central-diff-baseline.md): HEAD^1 is
          # that base only for the first group in the queue.
          MERGE_GROUP_BASE: ''
          REPOSITORY: ${{ matrix.repository }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          commit=""
          case "${EVENT_CLASS}" in
            merge)
              if [ -z "${POLICY}" ]; then
                echo "::notice::no SDK policy for this profile: findings are judged by policy alone"
              elif [ -n "${MERGE_GROUP_BASE}" ]; then
                if ! printf '%s' "${MERGE_GROUP_BASE}" | grep -Eq '^[0-9a-f]{40}$'; then
                  echo "::error::no baseline: merge group base '${MERGE_GROUP_BASE}' is not a full commit id"
                  exit 1
                fi
                auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
                if ! git -c protocol.version=2 \
                    -c "http.https://github.com/.extraheader=${auth_header}" \
                    fetch --depth=1 --no-tags "https://github.com/${REPOSITORY}.git" "${MERGE_GROUP_BASE}"; then
                  echo "::error::no baseline: the merge group base ${MERGE_GROUP_BASE} could not be fetched"
                  exit 1
                fi
                commit="$(git rev-parse --verify --quiet "${MERGE_GROUP_BASE}^{commit}")"
                if [ "${commit}" != "${MERGE_GROUP_BASE}" ]; then
                  echo "::error::no baseline: the merge group base ${MERGE_GROUP_BASE} does not resolve"
                  exit 1
                fi
                echo "Baseline commit: ${commit} (merge group base of $(git rev-parse HEAD))"
              elif commit="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
                echo "Baseline commit: ${commit} (first parent of $(git rev-parse HEAD))"
              else
                echo "::error::no baseline: the evaluated revision $(git rev-parse HEAD) has no fetched first parent"
                exit 1
              fi
              ;;
            pull_request|push)
              if [ -z "${POLICY}" ]; then
                echo "::notice::no SDK policy for this profile: findings are judged by policy alone"
              elif commit="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
                echo "Baseline commit: ${commit} (first parent of $(git rev-parse HEAD))"
              else
                # Operator decision 2026-11-21 (row 23): a run judges only the
                # code it brings in, so a baseline it cannot resolve blocks.
                echo "::error::no baseline: the evaluated revision $(git rev-parse HEAD) has no fetched first parent"
                exit 1
              fi
              ;;
            *)
              echo "Event class ${EVENT_CLASS}: no baseline, findings are judged by policy alone"
              ;;
          esac
          # The SDK refuses a baseline over tracked changes (ADR 0023); name
          # them here so a fail-closed baseline is explainable.
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -n "${commit}" ] && [ -n "${changed}" ]; then
            echo "::warning::tracked files differ from HEAD before the Semgrep scan; the baseline will fail closed:"
            printf '%s\n' "${changed}"
          fi
          if [ -n "${commit}" ]; then
            # A ref keeps the baseline reachable whatever the consumer's make
            # later does to the checkout's history; the shallow boundary and
            # HEAD are recorded so the step before Semgrep can restore and
            # check them.
            git update-ref refs/l9/central-diff-baseline "${commit}"
            state="${RUNNER_TEMP}/l9-central-diff"
            mkdir -p "${state}"
            shallow="$(git rev-parse --path-format=absolute --git-path shallow)"
            if [ -f "${shallow}" ]; then
              cp -- "${shallow}" "${state}/shallow"
            else
              : > "${state}/shallow"
            fi
            git rev-parse HEAD > "${state}/head"
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # Repository verification runs the consumer's `make setup`, which may
      # install OS packages with apt (e.g. Playwright's Chromium libraries and
      # fonts). Their downloaded .deb archives are cached per repository so an
      # unchanged package set is not re-fetched from the Ubuntu mirror on every
      # evaluation: Website-Bot's 21.1 MB took 7-8 minutes at ~45 kB/s on some
      # runs and 1 s on others. Only archives are cached, never installed
      # state, and apt verifies each cached .deb against the signed package
      # index before use, re-downloading any that do not match. Entries are
      # content-addressed (cache entries are immutable): restore never matches
      # exactly and takes the newest entry for this runner image, else this
      # image family; the save key is a digest of the archive set kept after
      # verification, so only a changed set stores a new entry.
      # Cache-service errors only warn, so this can never fail verification.
      - id: apt_archive_cache_dir
        name: Route apt package archives to the verification cache
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/l9-apt-archives"
          mkdir -p "${dir}/partial"
          if id _apt >/dev/null 2>&1; then
            sudo chown _apt "${dir}/partial"
          fi
          printf '%s\n' \
            "Dir::Cache::Archives \"${dir}/\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-l9-archive-cache >/dev/null
          family="l9-apt-archives-v1-${ImageOS:-unknown}-$(uname -m)-"
          image="${family}${ImageVersion:-unknown}-"
          {
            echo "path=${dir}"
            echo "family=${family}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - id: apt_archive_cache
        name: Restore cached apt package archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          # Never saved, so restore always resolves through the prefixes.
          key: ${{ steps.apt_archive_cache_dir.outputs.image }}restore
          restore-keys: |
            ${{ steps.apt_archive_cache_dir.outputs.image }}
            ${{ steps.apt_archive_cache_dir.outputs.family }}

      - id: repository_verify
        name: Run repository verification contract
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/run-repository-verification@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          workspace: .
          # AGENTS.md §27: held only by the registry snapshot and the composer
          # prefetch. Both run before and apart from the consumer's make
          # targets. The verify step does not receive the token.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}
          # Empty: the consumer's make runs under this run's own event. The
          # promotion canary sets push and the leg's branch, since its legs
          # check out a consumer's main head inside a Core pull_request run
          # (AGENTS.md §45, row 27).
          event-name: push
          event-ref: refs/heads/${{ matrix.branch }}

      # Keep only archives of package versions installed in this evaluation, so
      # superseded versions and packages a repository stopped installing drop
      # out instead of accumulating across images. The save key is a digest of
      # the kept set: an unchanged set matches the restored entry and stores
      # nothing, and a repository whose setup installs no OS packages keeps
      # nothing and stores nothing.
      - id: apt_archive_inventory
        name: Inventory apt package archives
        if: always() && steps.apt_archive_cache_dir.outcome == 'success'
        shell: bash
        env:
          ARCHIVE_DIR: ${{ steps.apt_archive_cache_dir.outputs.path }}
          IMAGE_PREFIX: ${{ steps.apt_archive_cache_dir.outputs.image }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in "${ARCHIVE_DIR}"/*.deb; do
            package="$(dpkg-deb -f "${archive}" Package)"
            version="$(dpkg-deb -f "${archive}" Version)"
            if ! dpkg-query -W -f='${Version}\n' "${package}" 2>/dev/null | grep -qxF -- "${version}"; then
              sudo rm -f -- "${archive}"
            fi
          done
          archives=("${ARCHIVE_DIR}"/*.deb)
          digest=""
          if [ "${#archives[@]}" -gt 0 ]; then
            digest="$(printf '%s\n' "${archives[@]##*/}" | LC_ALL=C sort | sha256sum | cut -c1-16)"
          fi
          {
            echo "count=${#archives[@]}"
            echo "key=${IMAGE_PREFIX}${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Save apt package archives
        if: always() && steps.apt_archive_inventory.outputs.count != '' && steps.apt_archive_inventory.outputs.count != '0' && steps.apt_archive_inventory.outputs.key != steps.apt_archive_cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          key: ${{ steps.apt_archive_inventory.outputs.key }}

      # Repository verification ran the consumer's make, which may rewrite the
      # checkout's history: on Cursor-Governance it re-shallowed it, leaving no
      # merge base, so Semgrep's baseline scan failed and every language run
      # was incomplete (#328). Restore the shallow boundary recorded before any
      # consumer code ran. The baseline is not changed here, only made
      # reachable again: HEAD must be the evaluated revision and must reach
      # the baseline, or the run blocks.
      - name: Restore the checkout history for the baseline scan (CENTRAL-DIFF)
        if: steps.baseline.outputs.commit != ''
        env:
          BASELINE: ${{ steps.baseline.outputs.commit }}
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/l9-central-diff"
          shallow="$(git rev-parse --path-format=absolute --git-path shallow)"
          if [ -s "${state}/shallow" ]; then
            cp -- "${state}/shallow" "${shallow}"
          else
            rm -f -- "${shallow}"
          fi
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "$(cat "${state}/head")" ]; then
            echo "::error::the consumer's make moved HEAD from $(cat "${state}/head") to ${head}; the baseline scan cannot judge this revision"
            exit 1
          fi
          if ! merge_base="$(git merge-base HEAD "${BASELINE}")"; then
            echo "::error::no baseline: ${BASELINE} has no merge base with ${head} after repository verification"
            exit 1
          fi
          echo "Baseline ${BASELINE} reachable from ${head} (merge base ${merge_base})"

      # The provider toolchain is a locked contract, not a resolution. Core
      # selects the setup-python action by full SHA, the interpreter by exact
      # version (major.minor.patch, so a patch release cannot float in), the
      # Semgrep version exactly, and the Semgrep dependency closure by digest
      # inside the pinned Core action. Those selections change only with a
      # Core revision; the hosted runner image underneath them is GitHub's,
      # not Core's (workflow audit 2026-09-13, F-005). The SDK venv provisioned
      # above is untouched; only the provider install rides this interpreter.
      - name: Set up locked Python for the central toolchain
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - id: semgrep
        name: Install Semgrep (hash-locked central pin)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN — verified executable is handed to the SDK provider run.
        uses: Quantum-L9/l9-ci-core/.github/actions/install-semgrep@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          semgrep-version: ${{ steps.runtime.outputs['semgrep-version'] }}

      - name: Run + normalize Semgrep (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-run
          language: ${{ steps.language.outputs.language }}
          raw-output: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          root: .
          snapshot-id: ${{ matrix.revision }}
          revision: ${{ matrix.revision }}
          provider-executable: ${{ steps.semgrep.outputs.executable }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs['required-provider'] }}
          policy: ${{ steps.gov.outputs['sdk-policy'] }}
          baseline-commit: ${{ steps.baseline.outputs.commit }}
          waivers: ${{ steps.gov.outputs['finding-waivers'] }}
          waiver-repository: ${{ matrix.repository }}
          # The Core-staged identity map for the detected language. Without it
          # a strict profile (`release`) cannot resolve third-party rule
          # identities and `semgrep run --strict` refuses the run outright.
          identity-map: ${{ steps.gov.outputs['identity-map-directory'] }}/${{ steps.language.outputs.language }}.yaml

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json

      - id: gate
        name: Evaluate SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
        run: |
          set -euo pipefail
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *) echo "gate evaluate failed with unexpected exit ${exit_code}" >&2; exit "${exit_code}" ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK technical gate: ${status} (exit ${exit_code})"

      - id: instances
        name: Run every planned instance (SDK)
        if: steps.plan.outcome == 'success'
        env:
          L9_INSTANCE_DIR: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_PROVIDER_EXECUTABLE: ${{ steps.semgrep.outputs.executable }}
          L9_PRIMARY_LANGUAGE: ${{ steps.language.outputs.language }}
          L9_PRIMARY_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
          L9_REQUIRED: ${{ steps.gov.outputs['required-provider'] }}
          L9_POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          L9_IDENTITY_DIR: ${{ steps.gov.outputs['identity-map-directory'] }}
          L9_BASELINE: ${{ steps.baseline.outputs.commit }}
          L9_WAIVERS: ${{ steps.gov.outputs['finding-waivers'] }}
          L9_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # One record per planned semgrep instance (l9.core-instance-result/v1). The
          # primary language already ran through the full pipeline above, so its gate
          # status is reused; every other planned language runs the SDK now. An instance
          # that cannot conclude gets no record, so the aggregate reports it incomplete,
          # and an SDK execution error (run, bundle validation, or a gate exit outside
          # 0/1/6) fails this step in every mode, exactly as it does for the primary
          # language's own steps: infrastructure failure is never advisory.
          env = os.environ
          directory = Path(env["L9_INSTANCE_DIR"])
          plan = json.loads((directory / "plan.json").read_text(encoding="utf-8"))
          results = directory / "results"
          results.mkdir(parents=True, exist_ok=True)
          executable = env["L9_EXECUTABLE"]
          provider_dir = str(Path(env["L9_PROVIDER_EXECUTABLE"]).parent)
          run_env = dict(env, PATH=provider_dir + os.pathsep + env.get("PATH", ""))
          gate_status = {0: "pass", 1: "fail", 6: "incomplete"}
          errors = []


          def record(target, status):
              body = {
                  "schema": "l9.core-instance-result/v1",
                  "repository": plan["repository"],
                  "provider": "semgrep",
                  "target": target,
                  "revision": plan["revision"],
                  "sdk_revision": plan["sdk_revision"],
                  "status": status,
              }
              kind, _, name = target.partition(":")
              stem = name if kind == "language" else kind + "-" + name
              path = results / ("semgrep-" + stem + ".json")
              path.write_text(json.dumps(body, indent=2) + "\n", encoding="utf-8")
              print("instance semgrep:" + target + ": " + status)


          def sdk(*args):
              return subprocess.run([executable, *args], env=run_env, check=False).returncode


          def shared(command):
              """The flags every instance run shares with the primary run."""
              command += ["--policy", env["L9_POLICY"]]
              if env.get("L9_WAIVERS"):
                  command += ["--waivers", env["L9_WAIVERS"], "--repository", env["L9_REPOSITORY"]]
              if env.get("L9_STRICT") == "true":
                  command.append("--strict")
              if env.get("L9_REQUIRED") == "true":
                  command.append("--required")
              return command


          def conclude(target, work, run):
              """Run, validate and gate one instance; record it or note the error."""
              bundle = str(work / "finding-bundle.json")
              work.mkdir(parents=True, exist_ok=True)
              code = sdk(*run, "--output", bundle)
              if code == 0:
                  code = sdk("bundle", "validate", bundle)
              if code != 0:
                  errors.append("instance semgrep:" + target + ": SDK run failed (exit " + str(code) + ")")
                  return
              gate = ["gate", "evaluate", "--bundle", bundle, "--output", str(work / "gate-result.json")]
              gate.append("--strict-unresolved" if env.get("L9_STRICT") == "true" else "--no-strict-unresolved")
              code = sdk(*gate)
              if code in gate_status:
                  record(target, gate_status[code])
              else:
                  errors.append("instance semgrep:" + target + ": gate exited " + str(code))


          for instance in plan["instances"]:
              if instance["provider"] != "semgrep" or instance["prerequisite"] != "applicable":
                  continue
              target = instance["target"]
              kind, _, name = target.partition(":")
              if kind == "consumer":
                  # The repository's declared consumer rulepack (SDK ADR 0021):
                  # its own execution and bundle; central evidence is untouched.
                  run = ["semgrep", "consumer-run", "--root", ".",
                         "--snapshot-id", plan["revision"], "--revision", plan["revision"]]
                  conclude(target, directory / ("consumer-" + name), shared(run))
                  continue
              if kind != "language" or name not in ("python", "typescript"):
                  continue
              if name == env.get("L9_PRIMARY_LANGUAGE"):
                  primary = env.get("L9_PRIMARY_STATUS", "")
                  if primary in ("pass", "fail", "incomplete"):
                      record(target, primary)
                  else:
                      print("instance semgrep:" + target + ": no primary gate status", file=sys.stderr)
                  continue
              run = [
                  "semgrep", "run", "--language", name,
                  "--root", ".", "--snapshot-id", plan["revision"],
                  "--revision", plan["revision"],
                  "--identity-map", str(Path(env["L9_IDENTITY_DIR"]) / (name + ".yaml")),
              ]
              shared(run)
              if env.get("L9_BASELINE"):
                  run += ["--baseline-commit", env["L9_BASELINE"]]
              conclude(target, directory / name, run)

          for error in errors:
              print("::error::" + error, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

      - id: aggregate
        name: Aggregate required instances (Core)
        if: always() && steps.plan.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/aggregate-required-instances@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          plan: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json
          results-directory: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/results
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/aggregate.json

      # CENTRAL-DIFF counts: each bundle the SDK classified against the
      # baseline carries one `baseline <sha>: N new, M pre-existing (K
      # blocking reported as advisory), U unknown` limitation (ADR 0023).
      # Pre-existing findings warn here; only new ones and incomplete results
      # fail, through the gate. Observational: it changes no verdict.
      - name: Report CENTRAL-DIFF pre-existing findings (advisory)
        if: always() && steps.baseline.outputs.commit != ''
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".l9/runtime", os.environ["L9_MATRIX_ID"])
          lines = []
          for bundle in sorted(root.rglob("finding-bundle.json")):
              try:
                  limitations = json.loads(bundle.read_text(encoding="utf-8")).get("limitations", [])
              except (OSError, ValueError):
                  continue
              for item in limitations:
                  if isinstance(item, str) and item.startswith("baseline "):
                      lines.append(str(bundle.parent.relative_to(root)) + ": " + item)
          for line in lines:
              print("::warning::CENTRAL-DIFF " + line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary and lines:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("### Pre-existing findings (CENTRAL-DIFF)\n\n")
                  stream.writelines("- " + line + "\n" for line in lines)
          PY

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - name: Project SARIF (SDK-owned)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-sarif
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          raw-report: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          sarif: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          destination-root: artifacts

      - name: Stage technical gate result
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"
          cp .l9/runtime/capabilities.json "artifacts/l9/${L9_MATRIX_ID}/repository-capabilities.json"

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          artifact-root: artifacts
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          routing-record: ${{ steps.route.outputs['routing-record'] }}
          output: artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/artifact-index.json

      - id: upload
        name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/l9/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/
          if-no-files-found: error
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      # Every planned instance's own bundle beside the central artifact set
      # (SDK ADR 0021, Core change 2): secondary languages and the declared
      # consumer rulepack, whose bundle names the consumer rule files and the
      # rules evaluated. A separate artifact, so the central set, its manifest
      # and its handoff are unchanged. .l9/runtime is untracked workspace
      # state written by this job only.
      - name: Upload instance bundles
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l9-instance-bundles-${{ steps.runtime.outputs['matrix-id'] }}-${{ github.run_attempt }}
          path: |
            .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      - id: handoff
        name: Create artifact handoff descriptor
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/create-artifact-handoff@da01ee359ee18c59ff98b119e5aa5ee609754b5d
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          workflow-head-sha: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          output: .l9/runtime/handoffs/${{ steps.runtime.outputs['matrix-id'] }}.json

      - name: Write central CI summary
        if: always()
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          PROFILE: ${{ steps.runtime.outputs.profile }}
          MODE: ${{ steps.gov.outputs.mode }}
          SDK_REVISION: ${{ steps.sdk.outputs['sdk-revision'] }}
          LANGUAGE: ${{ steps.language.outputs.language }}
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status || steps.repository_verify.outcome }}
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          INSTANCES_STATUS: ${{ steps.aggregate.outputs.status }}
          ARTIFACT_NAME: ${{ steps.names.outputs['artifact-name'] }}
          TOOLCHAIN_ALIGNMENT: ${{ steps.toolchain.outcome }}
          BIOME_STATUS: ${{ steps.biome_check.outputs.status || steps.biome_check.outcome }}
        run: |
          {
            echo "### L9 central CI"
            echo
            echo "- Event: \`${EVENT_CLASS:-unknown}\`"
            echo "- Profile: \`${PROFILE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- SDK revision: \`${SDK_REVISION:-unknown}\`"
            echo "- Detected language: \`${LANGUAGE:-unknown}\`"
            echo "- Repository verification: \`${REPOSITORY_VERIFY:-unavailable}\`"
            echo "- Technical gate: \`${GATE_STATUS:-unavailable}\`"
            echo "- Required instances: \`${INSTANCES_STATUS:-unavailable}\`"
            echo "- Artifact set: \`${ARTIFACT_NAME:-unavailable}\`"
            echo "- Toolchain alignment (advisory): \`${TOOLCHAIN_ALIGNMENT:-unavailable}\`"
            echo "- Biome (blocking): \`${BIOME_STATUS:-unavailable}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository verification
        # Contract and infrastructure failures are fatal on every profile,
        # including advisory nightly, release, and supply_chain (AGENTS.md §9).
        # Finding mode stays on the technical-gate step below.
        if: always()
        env:
          REPOSITORY_VERIFY_STATUS: ${{ steps.repository_verify.outputs.status }}
          REPOSITORY_VERIFY_MODE: ${{ steps.repository_verify.outputs.contract-mode }}
          REPOSITORY_VERIFY_FAILURE: ${{ steps.repository_verify.outputs.failure-kind }}
        run: |
          set -euo pipefail
          # An absent contract is tolerated only where Core's bundled policy
          # resolved migration mode; required mode accepts pass only.
          case "${REPOSITORY_VERIFY_MODE}:${REPOSITORY_VERIFY_STATUS}" in
            migration:pass|migration:not_applicable|required:pass) ;;
            *)
              echo "Blocking profile: repository verification did not pass (mode ${REPOSITORY_VERIFY_MODE:-unavailable}; status ${REPOSITORY_VERIFY_STATUS:-unavailable}; failure ${REPOSITORY_VERIFY_FAILURE:-unavailable})" >&2
              exit 1
              ;;
          esac

      # The verdict is the aggregate over every planned instance, the primary
      # language's gate among them. A required instance that is missing,
      # skipped or unfinished makes the aggregate incomplete (exit 6), never
      # pass; no aggregate at all is incomplete too.
      # Toolchain drift is housekeeping (operator decision 2026-11-20: only
      # checks that protect working or secure code block a merge). Each
      # declaration of a Core-owned tool that differs from toolchain-lock.json
      # is a warning at file:line and a line in the summary; it never fails
      # the job. align.py decides what drift is (the report's own status).
      - name: Report toolchain alignment drift (advisory)
        if: always()
        env:
          REPORT: .l9/runtime/toolchain-alignment.json
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
              status = report["status"]
              findings = report["findings"]
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f"::warning::toolchain alignment report unavailable ({error}); drift not reported")
          else:
              drift = [
                  item
                  for item in findings
                  if item.get("class") not in ("exact_match", "range_admits_lock")
              ]
              for item in drift:
                  print(
                      f"::warning file={item.get('path')},line={item.get('line')}::"
                      f"{item.get('tool')} {item.get('declared') or '(no version)'} "
                      f"is not Core's locked {item.get('lock')} ({item.get('class')})"
                  )
              line = f"- Toolchain drift (advisory): `{status}`, {len(drift)} declaration(s)"
              summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if summary:
                  with open(summary, "a", encoding="utf-8") as stream:
                      stream.write(line + "\n")
              print(line)
          PY

      - name: Enforce central mode on SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          AGGREGATE_EXIT: ${{ steps.aggregate.outputs['exit-code'] }}
          ACCOUNTED: ${{ steps.aggregate.outputs.accounted }}
          MODE: ${{ steps.gov.outputs.mode }}
        run: |
          set -euo pipefail
          status="${AGGREGATE_STATUS:-incomplete}"
          exit_code="${AGGREGATE_EXIT:-6}"
          echo "SDK technical gate (primary language): ${GATE_STATUS:-unavailable}"
          echo "Required instances: ${status} (exit ${exit_code}; accounted ${ACCOUNTED:-false}); central mode: ${MODE}"
          if [ "${status}" != "pass" ] && [ "${MODE}" = "blocking" ]; then
            echo "Blocking mode: failing job on required instances '${status}'" >&2
            exit "${exit_code}"
          fi

      # The security job's result, enforced in the required context. Anything
      # but success fails, skipped and cancelled included: an INCOMPLETE scan
      # never passes.
      - name: Enforce security scan (secrets, dependency audit)
        if: always()
        env:
          SECURITY_RESULT: ${{ steps.security__result.outputs.result }}
        run: |
          set -euo pipefail
          echo "Security scan (gitleaks, pip-audit; bandit advisory): ${SECURITY_RESULT:-unavailable}"
          if [ "${SECURITY_RESULT}" != "success" ]; then
            echo "::error title=Security scan::the security job concluded '${SECURITY_RESULT:-unavailable}'; a secret or a vulnerable dependency blocks the merge (see the security job)"
            exit 1
          fi
      # --- canary record (not part of org-ci.yml) ---
      - name: Record the canary leg
        if: always()
        env:
          SIDE: admitted
          DIGEST: b6b40b71a8b3abb88fc7539a897f6f281f74368ee1eaf79756050ff89a1ce4c0
          JOB_STATUS: ${{ job.status }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status }}
          MATRIX_ID: canary-admitted-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/promotion-canary"
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          blocking = set()
          runtime = Path(".l9/runtime", env["MATRIX_ID"])
          for path in sorted(runtime.rglob("gate-result.json")):
              try:
                  result = json.loads(path.read_text(encoding="utf-8"))
                  blocking.update(result["blocking_finding_ids"])
              except (OSError, ValueError, KeyError, TypeError):
                  pass
          verify = env.get("REPOSITORY_VERIFY", "")
          aggregate = env.get("AGGREGATE_STATUS", "")
          if env["JOB_STATUS"] == "success":
              status = "pass"
          elif env["JOB_STATUS"] == "cancelled":
              # Superseded by a newer run, or over the leg's time limit.
              status = "cancelled"
          elif aggregate == "incomplete":
              status = "incomplete"
          elif verify not in ("", "pass", "not_applicable"):
              status = "verification"
          elif aggregate == "fail":
              status = "findings"
          elif aggregate == "pass" and verify in ("pass", "not_applicable"):
              # Verified and analysed, then a later gate step failed.
              status = "enforcement"
          else:
              # The job failed before any verdict: infrastructure, not the
              # repository.
              status = "error"
          record = {
              "schema": "l9.promotion-canary-leg/v2",
              "side": env["SIDE"],
              "digest": env["DIGEST"],
              "repository": env["REPOSITORY"],
              "revision": env["REVISION"],
              "status": status,
              "job_status": env["JOB_STATUS"],
              "aggregate": aggregate,
              "repository_verification": verify,
              "blocking_finding_ids": sorted(blocking),
          }
          name = env["SIDE"] + "-" + env["SLUG"] + ".json"
          path = Path(env["RUNNER_TEMP"], "promotion-canary", name)
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record))
          PY

      - name: Upload the canary leg record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-canary-admitted-${{ matrix.slug }}
          path: ${{ runner.temp }}/promotion-canary/admitted-${{ matrix.slug }}.json
          # A leg that cannot write its record fails its job, and the verdict
          # then finds no record and blocks.
          if-no-files-found: error
          retention-days: 14

  # --- base pins leg: begin (rendered from origin/main's org-ci.yml) ---
  base__security:
    name: Canary ${{ matrix.repository }} security job (base pins)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job security .github/workflows/security.yml@14396e9deb6bc1db467fae57e7d1d7d7efd63426: begin ---
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        id: security__s0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect project languages
        id: security__detect
        run: |
          set -euo pipefail
          python_project=false
          node_project=false
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            python_project=true
          fi
          if [ -f "package.json" ]; then
            node_project=true
          fi
          echo "python=${python_project}" >> "$GITHUB_OUTPUT"
          echo "node=${node_project}" >> "$GITHUB_OUTPUT"
          echo "Detected: python=${python_project} node=${node_project}"
      - name: Secret scan (gitleaks)
        id: security__gitleaks
        env:
          GITLEAKS_LOG_OPTS: ''
          GITLEAKS_SCOPE: event
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          case "${GITLEAKS_SCOPE:-history}" in
            history) ;;
            event)
              if [ -z "${GITLEAKS_LOG_OPTS}" ]; then
                case "${EVENT_NAME}" in
                  pull_request|pull_request_target) GITLEAKS_LOG_OPTS="${PR_BASE}..${PR_HEAD}" ;;
                  merge_group) GITLEAKS_LOG_OPTS="${MERGE_GROUP_BASE}..${MERGE_GROUP_HEAD}" ;;
                  push)
                    if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                      GITLEAKS_LOG_OPTS="-1 ${EVENT_SHA}"
                    else
                      GITLEAKS_LOG_OPTS="${PUSH_BEFORE}..${EVENT_SHA}"
                    fi
                    ;;
                  *) ;;
                esac
              fi
              ;;
            *)
              echo "::error::gitleaks-scope must be history or event (got '${GITLEAKS_SCOPE}')"
              exit 2
              ;;
          esac
          # Rules: the Core preset (presets/security/.gitleaks.toml) is
          # gitleaks' own default rule set (`[extend] useDefault = true`). A
          # repository's own .gitleaks.toml is honoured on top of it: its rules
          # and allowlists apply, and when it does not already extend the
          # defaults it is made to, so no repository config can drop the Core
          # rules. A repository config that extends another file by `path`
          # cannot also extend the defaults (gitleaks allows one of the two),
          # so it is refused rather than scanned with fewer rules. Reviewed
          # false positives belong in .gitleaksignore, which gitleaks reads
          # from the scanned tree.
          config="${RUNNER_TEMP:-/tmp}/l9-gitleaks.toml"
          config_args=()
          if [ -f ".gitleaks.toml" ]; then
            python3 -I - ".gitleaks.toml" "${config}" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          source, target = Path(sys.argv[1]), Path(sys.argv[2])
          text = source.read_text(encoding="utf-8")
          try:
              extend = tomllib.loads(text).get("extend")
          except tomllib.TOMLDecodeError as error:
              sys.exit(f"::error::.gitleaks.toml is not valid TOML: {error}")
          if extend is None:
              text += (
                  "\n\n# Added by Core security.yml: keep the Core preset rules"
                  " (gitleaks defaults).\n[extend]\nuseDefault = true\n"
              )
          elif not isinstance(extend, dict) or "path" in extend:
              sys.exit(
                  "::error::.gitleaks.toml [extend] names a path; it cannot also"
                  " extend the Core preset rules (gitleaks allows path or"
                  " useDefault, not both). Inline the rules and use"
                  " `useDefault = true`."
              )
          elif extend.get("useDefault") is not True:
              sys.exit(
                  "::error::.gitleaks.toml [extend] must set useDefault = true"
                  " so the Core preset rules apply."
              )
          target.write_text(text, encoding="utf-8")
          PY
            config_args=(--config "${config}")
          fi
          range_args=()
          if [ -n "${GITLEAKS_LOG_OPTS}" ]; then
            # The range must resolve in this clone before gitleaks runs:
            # gitleaks exits 1 both for findings and for a git log error, so an
            # unresolvable range would otherwise read as a failed scan. The
            # options are word-split on purpose; they are git log arguments.
            # shellcheck disable=SC2086
            if ! git log --format=%H ${GITLEAKS_LOG_OPTS} -- > /dev/null; then
              echo "::error::gitleaks range '${GITLEAKS_LOG_OPTS}' does not resolve in this clone; fetch its history"
              exit 2
            fi
            range_args=(--log-opts="${GITLEAKS_LOG_OPTS}")
          fi
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          actual_sha="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Everything above is acquisition. A failure there ends the step with
          # no outcome, which the report labels not_executed. From here the
          # scanner itself runs and its exit code is the outcome.
          status=0
          /tmp/gitleaks git "${config_args[@]}" "${range_args[@]}" \
            --no-banner --redact --exit-code 1 . || status=$?
          case "${status}" in
            0) echo "outcome=executed_pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=executed_fail" >> "$GITHUB_OUTPUT" ;;
            *) echo "outcome=not_executed" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "${status}"
      - name: Set up Python
        id: security__s3
        if: steps.security__detect.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12
      - name: Python dependency audit (pip-audit)
        id: security__pip_audit
        if: steps.security__detect.outputs.python == 'true'
        env:
          L9_CI_INSTALL_COMMAND: ''
        run: |
          set -euo pipefail
          python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
          pip install --only-binary :all: "pip-audit==2.9.0"
          if [ -n "$L9_CI_INSTALL_COMMAND" ]; then
            bash -c "$L9_CI_INSTALL_COMMAND" || echo "::notice::l9-ci install command failed; continuing"
          fi
          # Installation above is acquisition; a failure there leaves no
          # outcome. From here pip-audit itself runs.
          # Audit the project, not the runner: plain `pip-audit` audits the
          # current environment, which on a fresh runner is the toolchain
          # itself. requirements.txt is audited when present, else the
          # pyproject.toml project; a setup.py-only project is installed by the
          # caller's install command and audited in the environment.
          status=0
          # `--desc` takes an optional value; it is given explicitly so the
          # next argument is never read as that value (`--desc .` is a usage
          # error, exit 2, and audits nothing).
          if [ -f "requirements.txt" ]; then
            pip-audit --desc on -r requirements.txt || status=$?
          elif [ -f "pyproject.toml" ]; then
            pip-audit --desc on . || status=$?
          else
            pip-audit --desc on || status=$?
          fi
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      # Advisory by existing policy: no Bandit result fails this job. The exit
      # code is still read, because "no findings", "findings" and "the scanner
      # did not complete" are three different facts. Bandit exits 0 with no
      # issue at the selected level, 1 with issues, and anything else when it
      # could not scan.
      - name: Python static security scan (bandit)
        id: security__bandit
        if: steps.security__detect.outputs.python == 'true'
        env:
          SOURCE_DIR: .
        run: |
          set -euo pipefail
          pip install --only-binary :all: "bandit==1.8.6"
          status=0
          bandit -r "$SOURCE_DIR" -ll -f screen \
            --exclude ./venv,./.venv,./tests,./build,./dist \
            || status=$?
          case "${status}" in
            0)
              outcome="executed_no_findings"
              echo "::notice::Bandit (advisory) completed with no findings at medium severity or above"
              ;;
            1)
              outcome="executed_findings"
              echo "::warning::Bandit (advisory) reported findings; an advisory scan does not fail this job"
              ;;
            *)
              outcome="not_executed"
              echo "::warning::Bandit (advisory) did not complete (exit ${status}); no Bandit result exists for this revision"
              ;;
          esac
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
      - name: Node dependency audit (npm audit)
        id: security__npm_audit
        if: steps.security__detect.outputs.node == 'true' && false
        run: |
          set -euo pipefail
          if [ ! -f "package-lock.json" ]; then
            echo "::error::run-npm-audit=true requires package-lock.json in the working directory"
            exit 1
          fi
          # The lockfile check above is a contract failure, not a scan: it
          # leaves no outcome. From here npm audit itself runs.
          status=0
          npm audit --audit-level=high || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      - name: Non-applicable gates
        id: security__s7
        if: steps.security__detect.outputs.python != 'true' && steps.security__detect.outputs.node != 'true'
        run: echo "::notice::No Python or Node project detected; only the secret scan ran"
      # One row per scan: what policy says about it and what actually happened.
      # Each scan step states its own outcome once its scanner has run. A step
      # that never ran, or that failed before its scanner ran, has no outcome
      # and is reported not_executed, never as a pass or as a scan failure.
      # The step runs from the workspace root: the job default is the caller's
      # working-directory, and if that does not exist no step could start there.
      - name: Report scan requiredness and outcomes
        id: security__s8
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          DETECT_OUTCOME: ${{ steps.security__detect.outcome }}
          PYTHON_PROJECT: ${{ steps.security__detect.outputs.python }}
          NODE_PROJECT: ${{ steps.security__detect.outputs.node }}
          NPM_AUDIT_REQUESTED: false
          GITLEAKS_STEP: ${{ steps.security__gitleaks.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.security__gitleaks.outputs.outcome }}
          PIP_AUDIT_STEP: ${{ steps.security__pip_audit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.security__pip_audit.outputs.outcome }}
          BANDIT_STEP: ${{ steps.security__bandit.outcome }}
          BANDIT_OUTCOME: ${{ steps.security__bandit.outputs.outcome }}
          NPM_AUDIT_STEP: ${{ steps.security__npm_audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.security__npm_audit.outputs.outcome }}
        run: |
          set -euo pipefail
          # $1 is the step conclusion, $2 the outcome the step stated itself.
          required_outcome() {
            if [ -n "$2" ]; then
              echo "$2"
            elif [ "$1" = "failure" ]; then
              echo "not_executed (the step failed before its scanner ran)"
            else
              echo "not_executed"
            fi
          }
          gitleaks="$(required_outcome "${GITLEAKS_STEP}" "${GITLEAKS_OUTCOME}")"
          if [ "${DETECT_OUTCOME}" != "success" ]; then
            pip_audit="not_executed (language detection did not complete)"
            bandit="not_executed (language detection did not complete)"
            npm_audit="not_executed (language detection did not complete)"
          else
            if [ "${PYTHON_PROJECT}" = "true" ]; then
              pip_audit="$(required_outcome "${PIP_AUDIT_STEP}" "${PIP_AUDIT_OUTCOME}")"
              bandit="${BANDIT_OUTCOME:-not_executed}"
            else
              pip_audit="not_applicable (no Python project detected)"
              bandit="not_applicable (no Python project detected)"
            fi
            if [ "${NPM_AUDIT_REQUESTED}" != "true" ]; then
              npm_audit="not_run (run-npm-audit is false)"
            elif [ "${NODE_PROJECT}" != "true" ]; then
              npm_audit="not_applicable (no Node project detected)"
            else
              npm_audit="$(required_outcome "${NPM_AUDIT_STEP}" "${NPM_AUDIT_OUTCOME}")"
            fi
          fi
          npm_requiredness="not run"
          if [ "${NPM_AUDIT_REQUESTED}" = "true" ]; then
            npm_requiredness="required"
          fi
          {
            echo "### L9 Security scan outcomes"
            echo
            echo "| Scan | Requiredness | Outcome |"
            echo "| --- | --- | --- |"
            echo "| gitleaks | required | ${gitleaks} |"
            echo "| pip-audit | required when Python is detected | ${pip_audit} |"
            echo "| bandit | advisory | ${bandit} |"
            echo "| npm audit | ${npm_requiredness} | ${npm_audit} |"
            echo
            echo "Advisory, not_run, not_applicable and not_executed are not passes."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # --- inlined org-ci job security .github/workflows/security.yml@14396e9deb6bc1db467fae57e7d1d7d7efd63426: end ---
      - name: Record the security job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/security.result"
      - name: Upload the security job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-base-security-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/security.result
          if-no-files-found: error
          retention-days: 1

  base:
    name: Canary ${{ matrix.repository }} (base pins)
    needs: [plan, base__security]
    if: ${{ !cancelled() && (needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- the security job's result for this repository (not part of org-ci.yml) ---
      - name: Download the security job result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A pattern, not a name: a missing result downloads nothing (a name
          # would fail the step), and the next step reads nothing as failure.
          pattern: canary-job-base-security-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job
          merge-multiple: true
      - name: Result of the security job
        id: security__result
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/canary-job/security.result"
          result=""
          if [ -f "${file}" ]; then
            result="$(tr -d '[:space:]' < "${file}")"
          fi
          case "${result}" in
            success|failure|cancelled) ;;
            *) result=failure ;;
          esac
          echo "security job: ${result}"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
      - id: runtime
        name: Resolve central runtime class
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_EVENT: ${{ inputs.event || '' }}
          INPUT_PROFILE: ${{ inputs.profile || '' }}
          INPUT_MATRIX_ID: canary-base-${{ matrix.slug }}
          INPUT_SDK_REVISION: ${{ inputs.sdk-revision || '' }}
          INPUT_SEMGREP_VERSION: ${{ inputs.semgrep-version || '1.171.0' }}
          INPUT_RETENTION: ${{ inputs.artifact-retention-days || 14 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          gh_event = os.environ["GH_EVENT"]
          requested_event = os.environ.get("INPUT_EVENT", "").strip()
          requested_profile = os.environ.get("INPUT_PROFILE", "").strip()

          allowed = {"pull_request", "push", "merge", "nightly", "release", "supply_chain"}
          fixed = {"pull_request": "pr_fast", "push": "merge", "merge": "merge"}
          native = {
              "pull_request": ("pull_request", "pr_fast"),
              "merge_group": ("merge", "merge"),
              "push": ("push", "merge"),
          }

          if gh_event == "workflow_dispatch":
              event_class = requested_event or "nightly"
              profile = requested_profile or event_class
          elif requested_event:
              # Reusable workflows retain the caller's event_name, so the
              # required event input—not `workflow_call`—identifies this path.
              event_class = requested_event
              if event_class not in allowed:
                  raise SystemExit(f"unsupported event class: {event_class}")
              expected_profile = fixed.get(event_class, event_class)
              profile = requested_profile or expected_profile
              if profile != expected_profile:
                  raise SystemExit(
                      "reusable profile claim "
                      f"{profile!r} does not match event {event_class!r}; "
                      f"expected {expected_profile!r}"
                  )
          elif gh_event in native:
              event_class, profile = native[gh_event]
          elif gh_event == "workflow_call":
              raise SystemExit("workflow_call requires event")
          else:
              raise SystemExit(f"unsupported trigger: {gh_event}")

          if event_class not in allowed:
              raise SystemExit(f"unsupported event class: {event_class}")
          matrix_id = os.environ.get("INPUT_MATRIX_ID", "org-semgrep")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", matrix_id):
              raise SystemExit("invalid matrix-id")
          sdk_revision = os.environ.get("INPUT_SDK_REVISION", "").strip()
          if sdk_revision and not re.fullmatch(r"[0-9a-f]{40}", sdk_revision):
              raise SystemExit("sdk-revision must be a full 40-character lowercase SHA")
          semgrep_version = os.environ.get("INPUT_SEMGREP_VERSION", "1.171.0").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", semgrep_version):
              raise SystemExit("semgrep-version must be an exact x.y.z version")
          retention = int(os.environ.get("INPUT_RETENTION", "14"))
          if not 1 <= retention <= 90:
              raise SystemExit("artifact-retention-days must be between 1 and 90")

          outputs = {
              "event-class": event_class,
              "profile": profile,
              "matrix-id": matrix_id,
              "sdk-revision": sdk_revision,
              "semgrep-version": semgrep_version,
              "artifact-retention-days": str(retention),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          PY

      # A pull-request scope failure stays a failure. An explicit full-suite
      # override is refused. Nothing here selects the deep suite, and a failed
      # scope does not fall through to one. This runs before checkout so the
      # apt cache still wraps repository verification directly.
      - name: Refuse a pull-request full-suite fallback
        if: >-
          github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
          || steps.runtime.outputs.event-class == 'pull_request'
          || steps.runtime.outputs.event-class == 'merge'
        env:
          # A reusable call keeps the caller's event_name. The class resolved
          # above is the pull-request or merge path this step is judging.
          GH_EVENT: ${{ steps.runtime.outputs.event-class }}
          FULL_SUITE_OVERRIDE: ${{ vars.L9_CI_FULL_SUITE || '' }}
          PR_SCOPE_STATUS: ${{ vars.L9_PR_SCOPE_STATUS || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys


          def finish(status, code):
              print(status)
              print("heavy=false")
              print("suite_pass=false")
              print("selected_suite=none")
              raise SystemExit(code)


          event = os.environ["GH_EVENT"]
          override = os.environ.get("FULL_SUITE_OVERRIDE", "").strip().lower()
          scope = os.environ.get("PR_SCOPE_STATUS", "").strip().lower()
          pr_events = ("pull_request", "merge_group", "merge")

          if event not in pr_events:
              finish("NOT_APPLICABLE", 0)
          if override not in ("", "0", "false", "no"):
              finish("POLICY_PR_DEEP_FORBIDDEN", 1)
          if scope in ("unknown", "failed", "unresolved", "pr_scope_unknown"):
              finish("PR_SCOPE_UNKNOWN", 1)
          finish("NO_FULL_SUITE_FALLBACK", 0)
          PY

      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          # Depth 2: a pull_request / merge_group revision is a merge commit,
          # and its base parent is what a consumer's merge-base check needs
          # once origin is reset to an anonymous URL below.
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      # Reports consumer declarations of Core-owned tools that drift from
      # Core's toolchain-lock.json, with file:line annotations, into
      # .l9/runtime/toolchain-alignment.json. Advisory: drift never fails the
      # job (housekeeping, operator decision 2026-11-20). The lock ships inside
      # this pinned Core revision.
      - id: toolchain
        name: Report toolchain alignment (advisory)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/check-toolchain-alignment@284a5eb6f55828ab37f992c783aa3ed2273f3213

      - name: Validate native push event context
        if: github.event_name == 'push'
        env:
          EVENT_REPOSITORY: ${{ matrix.repository }}
          EVENT_SHA: ${{ matrix.revision }}
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
        run: |
          set -euo pipefail
          if [ "${EVENT_CLASS}" != "push" ]; then
            echo "::error::push trigger resolved to event class '${EVENT_CLASS}'" >&2
            exit 1
          fi
          if [ -z "${EVENT_REPOSITORY}" ]; then
            echo "::error::push execution has no repository identity" >&2
            exit 1
          fi
          if [ -z "${EVENT_SHA}" ]; then
            echo "::error::push execution has no immutable SHA" >&2
            exit 1
          fi
          case "${EVENT_SHA}" in
            *[!0-9a-f]* | "") sha_ok=false ;;
            ????????????????????????????????????????) sha_ok=true ;;
            *) sha_ok=false ;;
          esac
          if [ "${sha_ok}" != "true" ]; then
            echo "::error::push SHA is not a full 40-character revision" >&2
            exit 1
          fi
          echo "Native push evaluation target: ${EVENT_REPOSITORY}@${EVENT_SHA}"

      - id: consumer
        name: Resolve optional consumer metadata
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-consumer-metadata@284a5eb6f55828ab37f992c783aa3ed2273f3213

      - id: gov
        name: Resolve central governance
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          profile: ${{ steps.runtime.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.runtime.outputs['event-class'] }}
          repository: ${{ matrix.repository }}
          ref: refs/heads/${{ matrix.branch }}
          product-kind: ${{ steps.consumer.outputs['product-kind'] }}

      - name: Validate consumer waiver pointers
        env:
          REQUESTED: ${{ steps.consumer.outputs['waiver-refs'] }}
          APPLICABLE: ${{ steps.gov.outputs['waiver-ids'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          requested = {item for item in os.environ.get("REQUESTED", "").split(",") if item}
          applicable = {item for item in os.environ.get("APPLICABLE", "").split(",") if item}
          unknown = sorted(requested - applicable)
          if unknown:
              raise SystemExit(f"consumer waiver_refs are not centrally applicable: {unknown}")
          PY

      - id: names
        name: Resolve artifact name
        env:
          MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - id: sdk
        name: Provision immutable SDK
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ steps.runtime.outputs['sdk-revision'] || '4a887396990a59ffb4a7108790b2fa1005c7865d' }}
          # AGENTS.md §27: l9-ci-sdk is private. Read-only org secret; the
          # action passes it to git only as a per-command header.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      - id: language
        name: Detect repository language (SDK)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN — detect-language (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/detect-language@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          repo-class: ${{ steps.consumer.outputs['repo-class'] }}
          root: .

      # L9-CI-CORE-003: every applicable provider/language instance is planned,
      # run and accounted for, so a second language is never silently dropped
      # in favour of the detected one. The SDK states the facts (capability
      # inventory of this exact snapshot, taken before repository verification
      # can touch the tree); requiredness is Core's (plan-required-instances).
      - id: inventory
        name: Inventory repository capabilities (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          directory=".l9/runtime/${L9_MATRIX_ID}/required-instances"
          mkdir -p "${directory}"
          "${L9_EXECUTABLE}" providers inventory --root . --format json \
            --consumer-rules --output "${directory}/inventory.json"
          echo "path=${directory}/inventory.json" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Plan required instances (Core)
        if: steps.inventory.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/plan-required-instances@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          inventory: ${{ steps.inventory.outputs.path }}
          repository: ${{ matrix.repository }}
          revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          required-providers: ${{ steps.gov.outputs['required-provider'] == 'true' && 'semgrep' || '' }}
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json

      # Core owns the consumer-facing Biome check end to end: the version is
      # the `biome` key of Core's toolchain lock, the binary is digest-locked,
      # and the run is blocking (findings annotate, then fail the step;
      # infrastructure failures are fatal). It is independent of Semgrep
      # governance; a consumer without biome.json or biome.jsonc is
      # not_applicable and nothing is downloaded.
      - id: biome
        name: Install Biome (digest-locked central pin)
        if: hashFiles('biome.json', 'biome.jsonc') != ''
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/install-biome@284a5eb6f55828ab37f992c783aa3ed2273f3213

      - id: biome_check
        name: Run Biome check (blocking)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/run-biome-check@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          executable: ${{ steps.biome.outputs.executable }}
          provider-version: ${{ steps.biome.outputs['provider-version'] }}
          mode: blocking

      # Repository verification runs the consumer's `make setup`, which may
      # install OS packages with apt (e.g. Playwright's Chromium libraries and
      # fonts). Their downloaded .deb archives are cached per repository so an
      # unchanged package set is not re-fetched from the Ubuntu mirror on every
      # evaluation: Website-Bot's 21.1 MB took 7-8 minutes at ~45 kB/s on some
      # runs and 1 s on others. Only archives are cached, never installed
      # state, and apt verifies each cached .deb against the signed package
      # index before use, re-downloading any that do not match. Entries are
      # content-addressed (cache entries are immutable): restore never matches
      # exactly and takes the newest entry for this runner image, else this
      # image family; the save key is a digest of the archive set kept after
      # verification, so only a changed set stores a new entry.
      # Cache-service errors only warn, so this can never fail verification.
      - id: apt_archive_cache_dir
        name: Route apt package archives to the verification cache
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/l9-apt-archives"
          mkdir -p "${dir}/partial"
          if id _apt >/dev/null 2>&1; then
            sudo chown _apt "${dir}/partial"
          fi
          printf '%s\n' \
            "Dir::Cache::Archives \"${dir}/\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-l9-archive-cache >/dev/null
          family="l9-apt-archives-v1-${ImageOS:-unknown}-$(uname -m)-"
          image="${family}${ImageVersion:-unknown}-"
          {
            echo "path=${dir}"
            echo "family=${family}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - id: apt_archive_cache
        name: Restore cached apt package archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          # Never saved, so restore always resolves through the prefixes.
          key: ${{ steps.apt_archive_cache_dir.outputs.image }}restore
          restore-keys: |
            ${{ steps.apt_archive_cache_dir.outputs.image }}
            ${{ steps.apt_archive_cache_dir.outputs.family }}

      - id: repository_verify
        name: Run repository verification contract
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/run-repository-verification@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          workspace: .
          # AGENTS.md §27: held only by the registry snapshot and the composer
          # prefetch. Both run before and apart from the consumer's make
          # targets. The verify step does not receive the token.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      # Keep only archives of package versions installed in this evaluation, so
      # superseded versions and packages a repository stopped installing drop
      # out instead of accumulating across images. The save key is a digest of
      # the kept set: an unchanged set matches the restored entry and stores
      # nothing, and a repository whose setup installs no OS packages keeps
      # nothing and stores nothing.
      - id: apt_archive_inventory
        name: Inventory apt package archives
        if: always() && steps.apt_archive_cache_dir.outcome == 'success'
        shell: bash
        env:
          ARCHIVE_DIR: ${{ steps.apt_archive_cache_dir.outputs.path }}
          IMAGE_PREFIX: ${{ steps.apt_archive_cache_dir.outputs.image }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in "${ARCHIVE_DIR}"/*.deb; do
            package="$(dpkg-deb -f "${archive}" Package)"
            version="$(dpkg-deb -f "${archive}" Version)"
            if ! dpkg-query -W -f='${Version}\n' "${package}" 2>/dev/null | grep -qxF -- "${version}"; then
              sudo rm -f -- "${archive}"
            fi
          done
          archives=("${ARCHIVE_DIR}"/*.deb)
          digest=""
          if [ "${#archives[@]}" -gt 0 ]; then
            digest="$(printf '%s\n' "${archives[@]##*/}" | LC_ALL=C sort | sha256sum | cut -c1-16)"
          fi
          {
            echo "count=${#archives[@]}"
            echo "key=${IMAGE_PREFIX}${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Save apt package archives
        if: always() && steps.apt_archive_inventory.outputs.count != '' && steps.apt_archive_inventory.outputs.count != '0' && steps.apt_archive_inventory.outputs.key != steps.apt_archive_cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          key: ${{ steps.apt_archive_inventory.outputs.key }}

      # The provider toolchain is a locked contract, not a resolution. Core
      # selects the setup-python action by full SHA, the interpreter by exact
      # version (major.minor.patch, so a patch release cannot float in), the
      # Semgrep version exactly, and the Semgrep dependency closure by digest
      # inside the pinned Core action. Those selections change only with a
      # Core revision; the hosted runner image underneath them is GitHub's,
      # not Core's (workflow audit 2026-09-13, F-005). The SDK venv provisioned
      # above is untouched; only the provider install rides this interpreter.
      # SDK ADR 0023 (CENTRAL-DIFF): findings are classified new or
      # pre-existing against a baseline commit; only new blocking findings and
      # incomplete results fail, pre-existing ones are reported as advisory
      # with counts. The baseline is the evaluated revision's first parent:
      # on a pull request or merge group GitHub's merge commit, so its first
      # parent is the target tip (the merge-base); on a push, the previous
      # tip (operator decision 2026-11-21, row 23: a run judges only the code
      # it brings in; this supersedes ADR 0023's "omit on push"). It is
      # fetched (depth 2 above). nightly, release and supply_chain pass none,
      # so the whole tree is judged by policy alone. A baseline that does not
      # resolve blocks here; tracked changes or an incomplete baseline scan
      # make the SDK fail closed.
      - id: baseline
        name: Resolve the baseline commit (CENTRAL-DIFF)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
        run: |
          set -euo pipefail
          commit=""
          case "${EVENT_CLASS}" in
            pull_request|merge|push)
              if [ -z "${POLICY}" ]; then
                echo "::notice::no SDK policy for this profile: findings are judged by policy alone"
              elif commit="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
                echo "Baseline commit: ${commit} (first parent of $(git rev-parse HEAD))"
              else
                # Operator decision 2026-11-21 (row 23): a run judges only the
                # code it brings in, so a baseline it cannot resolve blocks.
                echo "::error::no baseline: the evaluated revision $(git rev-parse HEAD) has no fetched first parent"
                exit 1
              fi
              ;;
            *)
              echo "Event class ${EVENT_CLASS}: no baseline, findings are judged by policy alone"
              ;;
          esac
          # The SDK refuses a baseline over tracked changes (ADR 0023); name
          # them here so a fail-closed baseline is explainable.
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -n "${commit}" ] && [ -n "${changed}" ]; then
            echo "::warning::tracked files differ from HEAD before the Semgrep scan; the baseline will fail closed:"
            printf '%s\n' "${changed}"
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Set up locked Python for the central toolchain
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - id: semgrep
        name: Install Semgrep (hash-locked central pin)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN — verified executable is handed to the SDK provider run.
        uses: Quantum-L9/l9-ci-core/.github/actions/install-semgrep@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          semgrep-version: ${{ steps.runtime.outputs['semgrep-version'] }}

      - name: Run + normalize Semgrep (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-run
          language: ${{ steps.language.outputs.language }}
          raw-output: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          root: .
          snapshot-id: ${{ matrix.revision }}
          revision: ${{ matrix.revision }}
          provider-executable: ${{ steps.semgrep.outputs.executable }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs['required-provider'] }}
          policy: ${{ steps.gov.outputs['sdk-policy'] }}
          baseline-commit: ${{ steps.baseline.outputs.commit }}
          waivers: ${{ steps.gov.outputs['finding-waivers'] }}
          waiver-repository: ${{ matrix.repository }}
          # The Core-staged identity map for the detected language. Without it
          # a strict profile (`release`) cannot resolve third-party rule
          # identities and `semgrep run --strict` refuses the run outright.
          identity-map: ${{ steps.gov.outputs['identity-map-directory'] }}/${{ steps.language.outputs.language }}.yaml

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json

      - id: gate
        name: Evaluate SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
        run: |
          set -euo pipefail
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *) echo "gate evaluate failed with unexpected exit ${exit_code}" >&2; exit "${exit_code}" ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK technical gate: ${status} (exit ${exit_code})"

      - id: instances
        name: Run every planned instance (SDK)
        if: steps.plan.outcome == 'success'
        env:
          L9_INSTANCE_DIR: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_PROVIDER_EXECUTABLE: ${{ steps.semgrep.outputs.executable }}
          L9_PRIMARY_LANGUAGE: ${{ steps.language.outputs.language }}
          L9_PRIMARY_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
          L9_REQUIRED: ${{ steps.gov.outputs['required-provider'] }}
          L9_POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          L9_IDENTITY_DIR: ${{ steps.gov.outputs['identity-map-directory'] }}
          L9_BASELINE: ${{ steps.baseline.outputs.commit }}
          L9_WAIVERS: ${{ steps.gov.outputs['finding-waivers'] }}
          L9_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # One record per planned semgrep instance (l9.core-instance-result/v1). The
          # primary language already ran through the full pipeline above, so its gate
          # status is reused; every other planned language runs the SDK now. An instance
          # that cannot conclude gets no record, so the aggregate reports it incomplete,
          # and an SDK execution error (run, bundle validation, or a gate exit outside
          # 0/1/6) fails this step in every mode, exactly as it does for the primary
          # language's own steps: infrastructure failure is never advisory.
          env = os.environ
          directory = Path(env["L9_INSTANCE_DIR"])
          plan = json.loads((directory / "plan.json").read_text(encoding="utf-8"))
          results = directory / "results"
          results.mkdir(parents=True, exist_ok=True)
          executable = env["L9_EXECUTABLE"]
          provider_dir = str(Path(env["L9_PROVIDER_EXECUTABLE"]).parent)
          run_env = dict(env, PATH=provider_dir + os.pathsep + env.get("PATH", ""))
          gate_status = {0: "pass", 1: "fail", 6: "incomplete"}
          errors = []


          def record(target, status):
              body = {
                  "schema": "l9.core-instance-result/v1",
                  "repository": plan["repository"],
                  "provider": "semgrep",
                  "target": target,
                  "revision": plan["revision"],
                  "sdk_revision": plan["sdk_revision"],
                  "status": status,
              }
              kind, _, name = target.partition(":")
              stem = name if kind == "language" else kind + "-" + name
              path = results / ("semgrep-" + stem + ".json")
              path.write_text(json.dumps(body, indent=2) + "\n", encoding="utf-8")
              print("instance semgrep:" + target + ": " + status)


          def sdk(*args):
              return subprocess.run([executable, *args], env=run_env, check=False).returncode


          def shared(command):
              """The flags every instance run shares with the primary run."""
              command += ["--policy", env["L9_POLICY"]]
              if env.get("L9_WAIVERS"):
                  command += ["--waivers", env["L9_WAIVERS"], "--repository", env["L9_REPOSITORY"]]
              if env.get("L9_STRICT") == "true":
                  command.append("--strict")
              if env.get("L9_REQUIRED") == "true":
                  command.append("--required")
              return command


          def conclude(target, work, run):
              """Run, validate and gate one instance; record it or note the error."""
              bundle = str(work / "finding-bundle.json")
              work.mkdir(parents=True, exist_ok=True)
              code = sdk(*run, "--output", bundle)
              if code == 0:
                  code = sdk("bundle", "validate", bundle)
              if code != 0:
                  errors.append("instance semgrep:" + target + ": SDK run failed (exit " + str(code) + ")")
                  return
              gate = ["gate", "evaluate", "--bundle", bundle, "--output", str(work / "gate-result.json")]
              gate.append("--strict-unresolved" if env.get("L9_STRICT") == "true" else "--no-strict-unresolved")
              code = sdk(*gate)
              if code in gate_status:
                  record(target, gate_status[code])
              else:
                  errors.append("instance semgrep:" + target + ": gate exited " + str(code))


          for instance in plan["instances"]:
              if instance["provider"] != "semgrep" or instance["prerequisite"] != "applicable":
                  continue
              target = instance["target"]
              kind, _, name = target.partition(":")
              if kind == "consumer":
                  # The repository's declared consumer rulepack (SDK ADR 0021):
                  # its own execution and bundle; central evidence is untouched.
                  run = ["semgrep", "consumer-run", "--root", ".",
                         "--snapshot-id", plan["revision"], "--revision", plan["revision"]]
                  conclude(target, directory / ("consumer-" + name), shared(run))
                  continue
              if kind != "language" or name not in ("python", "typescript"):
                  continue
              if name == env.get("L9_PRIMARY_LANGUAGE"):
                  primary = env.get("L9_PRIMARY_STATUS", "")
                  if primary in ("pass", "fail", "incomplete"):
                      record(target, primary)
                  else:
                      print("instance semgrep:" + target + ": no primary gate status", file=sys.stderr)
                  continue
              run = [
                  "semgrep", "run", "--language", name,
                  "--root", ".", "--snapshot-id", plan["revision"],
                  "--revision", plan["revision"],
                  "--identity-map", str(Path(env["L9_IDENTITY_DIR"]) / (name + ".yaml")),
              ]
              shared(run)
              if env.get("L9_BASELINE"):
                  run += ["--baseline-commit", env["L9_BASELINE"]]
              conclude(target, directory / name, run)

          for error in errors:
              print("::error::" + error, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

      - id: aggregate
        name: Aggregate required instances (Core)
        if: always() && steps.plan.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/aggregate-required-instances@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          plan: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json
          results-directory: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/results
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/aggregate.json

      # CENTRAL-DIFF counts: each bundle the SDK classified against the
      # baseline carries one `baseline <sha>: N new, M pre-existing (K
      # blocking reported as advisory), U unknown` limitation (ADR 0023).
      # Pre-existing findings warn here; only new ones and incomplete results
      # fail, through the gate. Observational: it changes no verdict.
      - name: Report CENTRAL-DIFF pre-existing findings (advisory)
        if: always() && steps.baseline.outputs.commit != ''
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".l9/runtime", os.environ["L9_MATRIX_ID"])
          lines = []
          for bundle in sorted(root.rglob("finding-bundle.json")):
              try:
                  limitations = json.loads(bundle.read_text(encoding="utf-8")).get("limitations", [])
              except (OSError, ValueError):
                  continue
              for item in limitations:
                  if isinstance(item, str) and item.startswith("baseline "):
                      lines.append(str(bundle.parent.relative_to(root)) + ": " + item)
          for line in lines:
              print("::warning::CENTRAL-DIFF " + line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary and lines:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("### Pre-existing findings (CENTRAL-DIFF)\n\n")
                  stream.writelines("- " + line + "\n" for line in lines)
          PY

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - name: Project SARIF (SDK-owned)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-sarif
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          raw-report: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          sarif: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          destination-root: artifacts

      - name: Stage technical gate result
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"
          cp .l9/runtime/capabilities.json "artifacts/l9/${L9_MATRIX_ID}/repository-capabilities.json"

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          artifact-root: artifacts
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          routing-record: ${{ steps.route.outputs['routing-record'] }}
          output: artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/artifact-index.json

      - id: upload
        name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/l9/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/
          if-no-files-found: error
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      # Every planned instance's own bundle beside the central artifact set
      # (SDK ADR 0021, Core change 2): secondary languages and the declared
      # consumer rulepack, whose bundle names the consumer rule files and the
      # rules evaluated. A separate artifact, so the central set, its manifest
      # and its handoff are unchanged. .l9/runtime is untracked workspace
      # state written by this job only.
      - name: Upload instance bundles
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l9-instance-bundles-${{ steps.runtime.outputs['matrix-id'] }}-${{ github.run_attempt }}
          path: |
            .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      - id: handoff
        name: Create artifact handoff descriptor
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/create-artifact-handoff@284a5eb6f55828ab37f992c783aa3ed2273f3213
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          workflow-head-sha: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          output: .l9/runtime/handoffs/${{ steps.runtime.outputs['matrix-id'] }}.json

      - name: Write central CI summary
        if: always()
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          PROFILE: ${{ steps.runtime.outputs.profile }}
          MODE: ${{ steps.gov.outputs.mode }}
          SDK_REVISION: ${{ steps.sdk.outputs['sdk-revision'] }}
          LANGUAGE: ${{ steps.language.outputs.language }}
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status || steps.repository_verify.outcome }}
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          INSTANCES_STATUS: ${{ steps.aggregate.outputs.status }}
          ARTIFACT_NAME: ${{ steps.names.outputs['artifact-name'] }}
          TOOLCHAIN_ALIGNMENT: ${{ steps.toolchain.outcome }}
          BIOME_STATUS: ${{ steps.biome_check.outputs.status || steps.biome_check.outcome }}
        run: |
          {
            echo "### L9 central CI"
            echo
            echo "- Event: \`${EVENT_CLASS:-unknown}\`"
            echo "- Profile: \`${PROFILE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- SDK revision: \`${SDK_REVISION:-unknown}\`"
            echo "- Detected language: \`${LANGUAGE:-unknown}\`"
            echo "- Repository verification: \`${REPOSITORY_VERIFY:-unavailable}\`"
            echo "- Technical gate: \`${GATE_STATUS:-unavailable}\`"
            echo "- Required instances: \`${INSTANCES_STATUS:-unavailable}\`"
            echo "- Artifact set: \`${ARTIFACT_NAME:-unavailable}\`"
            echo "- Toolchain alignment (advisory): \`${TOOLCHAIN_ALIGNMENT:-unavailable}\`"
            echo "- Biome (blocking): \`${BIOME_STATUS:-unavailable}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository verification
        # Contract and infrastructure failures are fatal on every profile,
        # including advisory nightly, release, and supply_chain (AGENTS.md §9).
        # Finding mode stays on the technical-gate step below.
        if: always()
        env:
          REPOSITORY_VERIFY_STATUS: ${{ steps.repository_verify.outputs.status }}
          REPOSITORY_VERIFY_MODE: ${{ steps.repository_verify.outputs.contract-mode }}
          REPOSITORY_VERIFY_FAILURE: ${{ steps.repository_verify.outputs.failure-kind }}
        run: |
          set -euo pipefail
          # An absent contract is tolerated only where Core's bundled policy
          # resolved migration mode; required mode accepts pass only.
          case "${REPOSITORY_VERIFY_MODE}:${REPOSITORY_VERIFY_STATUS}" in
            migration:pass|migration:not_applicable|required:pass) ;;
            *)
              echo "Blocking profile: repository verification did not pass (mode ${REPOSITORY_VERIFY_MODE:-unavailable}; status ${REPOSITORY_VERIFY_STATUS:-unavailable}; failure ${REPOSITORY_VERIFY_FAILURE:-unavailable})" >&2
              exit 1
              ;;
          esac

      # The verdict is the aggregate over every planned instance, the primary
      # language's gate among them. A required instance that is missing,
      # skipped or unfinished makes the aggregate incomplete (exit 6), never
      # pass; no aggregate at all is incomplete too.
      # Toolchain drift is housekeeping (operator decision 2026-11-20: only
      # checks that protect working or secure code block a merge). Each
      # declaration of a Core-owned tool that differs from toolchain-lock.json
      # is a warning at file:line and a line in the summary; it never fails
      # the job. align.py decides what drift is (the report's own status).
      - name: Report toolchain alignment drift (advisory)
        if: always()
        env:
          REPORT: .l9/runtime/toolchain-alignment.json
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
              status = report["status"]
              findings = report["findings"]
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f"::warning::toolchain alignment report unavailable ({error}); drift not reported")
          else:
              drift = [
                  item
                  for item in findings
                  if item.get("class") not in ("exact_match", "range_admits_lock")
              ]
              for item in drift:
                  print(
                      f"::warning file={item.get('path')},line={item.get('line')}::"
                      f"{item.get('tool')} {item.get('declared') or '(no version)'} "
                      f"is not Core's locked {item.get('lock')} ({item.get('class')})"
                  )
              line = f"- Toolchain drift (advisory): `{status}`, {len(drift)} declaration(s)"
              summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if summary:
                  with open(summary, "a", encoding="utf-8") as stream:
                      stream.write(line + "\n")
              print(line)
          PY

      - name: Enforce central mode on SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          AGGREGATE_EXIT: ${{ steps.aggregate.outputs['exit-code'] }}
          ACCOUNTED: ${{ steps.aggregate.outputs.accounted }}
          MODE: ${{ steps.gov.outputs.mode }}
        run: |
          set -euo pipefail
          status="${AGGREGATE_STATUS:-incomplete}"
          exit_code="${AGGREGATE_EXIT:-6}"
          echo "SDK technical gate (primary language): ${GATE_STATUS:-unavailable}"
          echo "Required instances: ${status} (exit ${exit_code}; accounted ${ACCOUNTED:-false}); central mode: ${MODE}"
          if [ "${status}" != "pass" ] && [ "${MODE}" = "blocking" ]; then
            echo "Blocking mode: failing job on required instances '${status}'" >&2
            exit "${exit_code}"
          fi

      # The security job's result, enforced in the required context. Anything
      # but success fails, skipped and cancelled included: an INCOMPLETE scan
      # never passes.
      - name: Enforce security scan (secrets, dependency audit)
        if: always()
        env:
          SECURITY_RESULT: ${{ steps.security__result.outputs.result }}
        run: |
          set -euo pipefail
          echo "Security scan (gitleaks, pip-audit; bandit advisory): ${SECURITY_RESULT:-unavailable}"
          if [ "${SECURITY_RESULT}" != "success" ]; then
            echo "::error title=Security scan::the security job concluded '${SECURITY_RESULT:-unavailable}'; a secret or a vulnerable dependency blocks the merge (see the security job)"
            exit 1
          fi
      # --- canary record (not part of org-ci.yml) ---
      - name: Record the canary leg
        if: always()
        env:
          SIDE: base
          DIGEST: aa947a731118f794041e85776ca39aad7761ec2ee5f74212047c2040e78470bb
          JOB_STATUS: ${{ job.status }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status }}
          MATRIX_ID: canary-base-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/promotion-canary"
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          blocking = set()
          runtime = Path(".l9/runtime", env["MATRIX_ID"])
          for path in sorted(runtime.rglob("gate-result.json")):
              try:
                  result = json.loads(path.read_text(encoding="utf-8"))
                  blocking.update(result["blocking_finding_ids"])
              except (OSError, ValueError, KeyError, TypeError):
                  pass
          verify = env.get("REPOSITORY_VERIFY", "")
          aggregate = env.get("AGGREGATE_STATUS", "")
          if env["JOB_STATUS"] == "success":
              status = "pass"
          elif env["JOB_STATUS"] == "cancelled":
              # Superseded by a newer run, or over the leg's time limit.
              status = "cancelled"
          elif aggregate == "incomplete":
              status = "incomplete"
          elif verify not in ("", "pass", "not_applicable"):
              status = "verification"
          elif aggregate == "fail":
              status = "findings"
          elif aggregate == "pass" and verify in ("pass", "not_applicable"):
              # Verified and analysed, then a later gate step failed.
              status = "enforcement"
          else:
              # The job failed before any verdict: infrastructure, not the
              # repository.
              status = "error"
          record = {
              "schema": "l9.promotion-canary-leg/v2",
              "side": env["SIDE"],
              "digest": env["DIGEST"],
              "repository": env["REPOSITORY"],
              "revision": env["REVISION"],
              "status": status,
              "job_status": env["JOB_STATUS"],
              "aggregate": aggregate,
              "repository_verification": verify,
              "blocking_finding_ids": sorted(blocking),
          }
          name = env["SIDE"] + "-" + env["SLUG"] + ".json"
          path = Path(env["RUNNER_TEMP"], "promotion-canary", name)
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record))
          PY

      - name: Upload the canary leg record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-canary-base-${{ matrix.slug }}
          path: ${{ runner.temp }}/promotion-canary/base-${{ matrix.slug }}.json
          # A leg that cannot write its record fails its job, and the verdict
          # then finds no record and blocks.
          if-no-files-found: error
          retention-days: 14

  # --- base pins leg: end ---

  verdict:
    name: ${{ (github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) && 'Promotion canary (text edit, no verdict)' || 'Promotion canary (Core)' }}
    needs: [plan, head, admitted, base]
    # Runs whatever the plan and legs concluded, a cancelled run included (a
    # job skipped by `if:` reports success on a required check, so the verdict
    # decides itself). It is the only gate: a leg is red exactly when its own
    # org-ci run is red, and the verdict judges that against the base pins. A
    # leg job that was cancelled or did not run when planned is incomplete
    # and blocks. A superseded run's verdict fails; the newer run's verdict,
    # which always follows, is the check that counts.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          persist-credentials: false
      - name: Download the canary leg records
        if: needs.plan.outputs.applies == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: promotion-canary-*
          path: ${{ runner.temp }}/promotion-canary
          merge-multiple: true
      - name: Judge the canary
        env:
          L9_CANARY_PLAN_RESULT: ${{ needs.plan.result }}
          L9_CANARY_TEXT_EDIT: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) }}
          L9_CANARY_APPLIES: ${{ needs.plan.outputs.applies }}
          L9_CANARY_DIFFERENTIAL: ${{ needs.plan.outputs.differential }}
          L9_CANARY_BASE_CURRENT: ${{ needs.plan.outputs['base-current'] }}
          L9_CANARY_HEAD_CURRENT: ${{ needs.plan.outputs['head-current'] }}
          L9_CANARY_HEAD_DIGEST: ${{ needs.plan.outputs['head-digest'] }}
          L9_CANARY_BASE_DIGEST: ${{ needs.plan.outputs['base-digest'] }}
          L9_CANARY_MATRIX: ${{ needs.plan.outputs.matrix }}
          L9_CANARY_ADMITTED: ${{ needs.plan.outputs.admitted }}
          L9_CANARY_RECORDS: ${{ runner.temp }}/promotion-canary
          L9_CANARY_HEAD_RESULT: ${{ needs.head.result }}
          L9_CANARY_BASE_RESULT: ${{ needs.base.result }}
          L9_CANARY_ADMITTED_RESULT: ${{ needs.admitted.result }}
        run: |
          set -euo pipefail
          python3 -I tools/promotion_canary.py verdict
