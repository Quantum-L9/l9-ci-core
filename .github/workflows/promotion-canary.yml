# GENERATED by tools/promotion_canary.py render from org-ci.yml and
# central-semgrep.yml. Do not edit: change either (or the tool) and run `python3 tools/promotion_canary.py
# render` with origin/main fetched. Core's unit tests
# (tests/workflows/test_promotion_canary.py, in self-ci) fail while this file
# and org-ci.yml disagree.
#
# Core's promotion canary (AGENTS.md §40). On a Core pull request that changes
# what the required check (org-ci.yml's `analyze` job) or the nightly Semgrep
# scan (central-semgrep.yml, docs/semgrep-runs-nightly.md) runs, every
# repository declared in .l9/promotion-canary.json is checked out at its
# current main head and judged at the pull request's pins (the `head` and
# `scan` jobs) and, when the pull request changes those steps, at the base's
# pins (the `base` and `scanbase` jobs). Each is its workflow's steps verbatim
# apart from the target identity; the scan legs are the nightly sink's scan
# without its publication, so a Semgrep change is proven before promotion.
# `Promotion canary (Core)` fails only when the pull request makes a repository
# worse. Head steps digest: 87fdaef7f40732e3fbb981c8c3b4d46baaba14572c95c1c6c3b8561d1e116334
name: Promotion canary (Core)
# One verdict per pushed head (row 22). `make pr` pushes and then edits the
# pull request's body; that `edited` run used to cancel the push run, whose
# verdict then posted a failing check for the same head. An edit that changes
# only the title or body is now a text edit: its own concurrency group (it
# never cancels the push run), no plan or legs, and a verdict job under
# another name that judges nothing, so it never posts a `Promotion canary
# (Core)` check, failing or skipped. Every other `edited` event, a base
# retarget included, is judged in full: the merge commit, and with it the
# plan, changed.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-promotion-canary-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) && '-text-edit' || '' }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan promotion canary
    if: ${{ !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      applies: ${{ steps.plan.outputs.applies }}
      differential: ${{ steps.plan.outputs.differential }}
      base-current: ${{ steps.plan.outputs['base-current'] }}
      head-current: ${{ steps.plan.outputs['head-current'] }}
      head-digest: ${{ steps.plan.outputs['head-digest'] }}
      base-digest: ${{ steps.plan.outputs['base-digest'] }}
      matrix: ${{ steps.plan.outputs.matrix }}
      admitted: ${{ steps.plan.outputs.admitted }}
      scan: ${{ steps.plan.outputs.scan }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Plan the canary legs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          L9_CANARY_TOKEN: ${{ github.token }}
          L9_CANARY_PRIVATE_TOKEN: ${{ secrets.L9_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          python3 -I tools/promotion_canary.py plan ${FORCE}
      - name: Upload the pull request's SDK provisioner for the admitted leg
        if: steps.plan.outputs.admitted != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-admitted-core
          path: |
            .github/actions/provision-sdk/
            .l9/sdk-compatibility.yaml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  head__gitleaks:
    name: Canary ${{ matrix.repository }} gitleaks job
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job gitleaks org-ci.yml: begin ---
      - name: Checkout (full history)
        id: gitleaks__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        id: gitleaks__gitleaks
        env:
          # Incoming code only: the commits the event adds (base..head for a
          # pull request or merge group, before..after for a push); every other
          # event scans the whole history.
          GITLEAKS_LOG_OPTS: ""
          GITLEAKS_SCOPE: event
          # `git`: the commits in scope. The nightly sink inlines this step
          # with `dir` (the whole tree of the default branch), findings
          # reported rather than failing (`GITLEAKS_FINDINGS_FAIL: "false"`)
          # and written as SARIF to GITLEAKS_SARIF for code scanning.
          GITLEAKS_TARGET: git
          GITLEAKS_FINDINGS_FAIL: "true"
          GITLEAKS_SARIF: ""
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          case "${GITLEAKS_SCOPE:-history}" in
            history) ;;
            event)
              if [ -z "${GITLEAKS_LOG_OPTS}" ]; then
                case "${EVENT_NAME}" in
                  pull_request|pull_request_target) GITLEAKS_LOG_OPTS="${PR_BASE}..${PR_HEAD}" ;;
                  merge_group) GITLEAKS_LOG_OPTS="${MERGE_GROUP_BASE}..${MERGE_GROUP_HEAD}" ;;
                  push)
                    if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                      GITLEAKS_LOG_OPTS="-1 ${EVENT_SHA}"
                    else
                      GITLEAKS_LOG_OPTS="${PUSH_BEFORE}..${EVENT_SHA}"
                    fi
                    ;;
                  *) ;;
                esac
              fi
              ;;
            *)
              echo "::error::gitleaks-scope must be history or event (got '${GITLEAKS_SCOPE}')"
              exit 2
              ;;
          esac
          # Rules written for the scan: `[extend] useDefault = true`, the Core
          # rules (presets/security/.gitleaks.toml, between its "Core rules"
          # markers; docs/gitleaks-core-rules.md), and the repository's
          # `[allowlist]` when it has one. A repository's `[[rules]]` and an
          # `[extend].path` are not copied and do not fail the job. Reviewed
          # false positives belong in .gitleaksignore, which gitleaks reads
          # from the scanned tree.
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          # gitleaks' default rules at that version. Checksum-pinned like
          # the binary. `[extend] useDefault = true` applies them.
          GITLEAKS_DEFAULTS_SHA256="8f393899dbdc67e4eae580909e496acab9cf3a75aacfb6fac56b6eb16bb9e051"
          config="${RUNNER_TEMP:-/tmp}/l9-gitleaks.toml"
          core_rules="${RUNNER_TEMP:-/tmp}/l9-gitleaks-core-rules.toml"
          defaults="${RUNNER_TEMP:-/tmp}/l9-gitleaks-defaults.toml"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${defaults}" \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          actual_defaults="$(sha256sum "${defaults}" | awk '{print $1}')"
          if [ "${actual_defaults}" != "${GITLEAKS_DEFAULTS_SHA256}" ]; then
            echo "::error::gitleaks default rules checksum mismatch: got ${actual_defaults}"
            exit 2
          fi
          cat > "${core_rules}" <<'TOML'
          [[rules]]
          id = "l9-openai-api-key"
          description = "OpenAI API key without the T3BlbkFJ marker (from Enrichment.Inference.Engine)"
          regex = '''\bsk-[a-zA-Z0-9]{20,}\b'''
          keywords = ["sk-"]

          [[rules]]
          id = "l9-openai-project-key"
          description = "OpenAI project or service key without the T3BlbkFJ marker (from Cognitive.Engine.Graphs)"
          regex = '''\bsk-(?:proj|svcacct|admin)-[a-zA-Z0-9_-]{80,}'''
          keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]

          [[rules]]
          id = "l9-api-key-assignment"
          description = "An API key or secret key assigned a literal of 20+ characters, at any entropy (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''(?i)(?:api[_-]?key|apikey|api[_-]?secret|secret[_-]?key)\s*[=:]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
          keywords = ["api_key", "api-key", "apikey", "api_secret", "api-secret", "secret_key", "secret-key", "secretkey"]

          [[rules]]
          id = "l9-slack-bot-token"
          description = "Slack bot token with any digit-group length (from Enrichment.Inference.Engine)"
          regex = '''xoxb-[0-9]{10,}-[0-9]{10,}-[a-zA-Z0-9]{20,}'''
          keywords = ["xoxb-"]

          [[rules]]
          id = "l9-private-key-header"
          description = "A private key header, even without a full body (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
          keywords = ["private key-----"]

          [[rules]]
          id = "l9-jwt"
          description = "A JSON Web Token with short segments (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''\beyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'''
          keywords = ["eyj"]

          [[rules]]
          id = "l9-perplexity-api-key"
          description = "Perplexity API key (from Enrichment.Inference.Engine)"
          regex = '''\bpplx-[a-zA-Z0-9]{40,}'''
          keywords = ["pplx-"]

          [[rules]]
          id = "l9-postgres-url-password"
          description = "PostgreSQL URL with an inline password (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''postgres(?:ql)?://[^:\s/@]+:([^@\s/]+)@[a-zA-Z0-9._-]+'''
          secretGroup = 1
          keywords = ["postgres://", "postgresql://"]

          [[rules]]
          id = "l9-redis-url-password"
          description = "Redis URL with an inline password (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''rediss?://[^:\s/@]*:([^@\s/]+)@[a-zA-Z0-9._-]+'''
          secretGroup = 1
          keywords = ["redis://", "rediss://"]

          [[rules]]
          id = "l9-neo4j-url-password"
          description = "Neo4j or Bolt URL with an inline password (from Cognitive.Engine.Graphs)"
          regex = '''(?:neo4j|bolt)(?:\+s(?:sc)?)?://[a-zA-Z0-9]+:([^@\s]+)@[a-zA-Z0-9._-]+'''
          secretGroup = 1
          keywords = ["neo4j://", "neo4j+s://", "neo4j+ssc://", "bolt://", "bolt+s://", "bolt+ssc://"]

          [[rules]]
          id = "l9-neo4j-password-assignment"
          description = "A Neo4j password assigned a literal (from Cognitive.Engine.Graphs)"
          regex = '''(?i)neo4j[_-]?password\s*[=:]\s*['"]?([a-zA-Z0-9!@#$%^&*()_+=-]{8,})['"]?'''
          secretGroup = 1
          keywords = ["neo4j_password", "neo4j-password", "neo4jpassword"]
          TOML
          python3 -I - ".gitleaks.toml" "${defaults}" "${core_rules}" "${config}" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          def emit_scalar(value):
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, str):
                  return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'
              if isinstance(value, list):
                  return "[" + ", ".join(emit_scalar(item) for item in value) + "]"
              raise TypeError(type(value).__name__)

          def emit_allowlist(table):
              if not isinstance(table, dict):
                  sys.exit("::error::.gitleaks.toml [allowlist] must be a table")
              lines = ["[allowlist]"]
              for key, value in table.items():
                  try:
                      lines.append(f"{key} = {emit_scalar(value)}")
                  except TypeError as error:
                      sys.exit(
                          f"::error::.gitleaks.toml allowlist.{key} cannot be copied ({error})"
                      )
              return "\n".join(lines) + "\n"

          source, defaults, core_path, target = (Path(arg) for arg in sys.argv[1:5])
          core_text = core_path.read_text(encoding="utf-8")
          if not core_text.endswith("\n"):
              core_text += "\n"
          core = tomllib.loads(core_text)["rules"]
          # The pinned defaults file is checksummed above. Read it so a missing file
          # fails here too. [extend] useDefault applies those rules; they are not copied.
          tomllib.loads(defaults.read_text(encoding="utf-8"))
          text = source.read_text(encoding="utf-8") if source.is_file() else ""
          data = {}
          if text.strip():
              try:
                  data = tomllib.loads(text)
              except tomllib.TOMLDecodeError as error:
                  sys.exit(f"::error::.gitleaks.toml is not valid TOML: {error}")
          if not isinstance(data, dict):
              sys.exit("::error::.gitleaks.toml must be a table")
          parts = ["[extend]\nuseDefault = true\n\n", core_text]
          allow = data.get("allowlist")
          if allow:
              parts.append("\n" + emit_allowlist(allow))
          produced = "".join(parts)
          tomllib.loads(produced)
          target.write_text(produced, encoding="utf-8")
          ignored = len(data.get("rules") or [])
          print(
              f"gitleaks rules: defaults + {len(core)} Core rule(s);"
              f" {ignored} repository rule(s) not copied"
          )
          PY
          config_args=(--config "${config}")
          case "${GITLEAKS_TARGET}" in
            git) ;;
            dir) GITLEAKS_LOG_OPTS="" ;;
            *)
              echo "::error::GITLEAKS_TARGET must be git or dir (got '${GITLEAKS_TARGET}')"
              exit 2
              ;;
          esac
          # With no range, scan the evaluated revision's own history (HEAD),
          # never every ref in the clone: gitleaks' default is `git log --all`,
          # and a fetch-depth 0 checkout holds every branch, so an unrelated
          # branch would decide this revision's verdict.
          if [ "${GITLEAKS_TARGET:-git}" = git ] && [ -z "${GITLEAKS_LOG_OPTS}" ]; then
            GITLEAKS_LOG_OPTS="HEAD"
          fi
          range_args=()
          if [ -n "${GITLEAKS_LOG_OPTS}" ]; then
            # The range must resolve in this clone before gitleaks runs:
            # gitleaks exits 1 both for findings and for a git log error, so an
            # unresolvable range would otherwise read as a failed scan. The
            # options are word-split on purpose; they are git log arguments.
            # shellcheck disable=SC2086
            if ! git log --format=%H ${GITLEAKS_LOG_OPTS} -- > /dev/null; then
              echo "::error::gitleaks range '${GITLEAKS_LOG_OPTS}' does not resolve in this clone; fetch its history"
              exit 2
            fi
            range_args=(--log-opts="${GITLEAKS_LOG_OPTS}")
          fi
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          actual_sha="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Everything above is acquisition. A failure there ends the step with
          # no outcome, which the report labels not_executed. From here the
          # scanner itself runs and its exit code is the outcome.
          status=0
          report="${RUNNER_TEMP:-/tmp}/gitleaks-report.json"
          /tmp/gitleaks "${GITLEAKS_TARGET}" "${config_args[@]}" "${range_args[@]}" \
            --no-banner --redact --exit-code 1 \
            --report-format json --report-path "${report}" . || status=$?
          case "${status}" in
            0) echo "outcome=executed_pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=executed_fail" >> "$GITHUB_OUTPUT" ;;
            *) echo "outcome=not_executed" >> "$GITHUB_OUTPUT" ;;
          esac
          # Signal law: every finding named by file, line, rule and commit,
          # never by its value (the report is redacted and the secret and
          # match fields are not read).
          scope_text="${GITLEAKS_LOG_OPTS:-the whole history}"
          [ "${GITLEAKS_TARGET}" = dir ] && scope_text="the whole tree"
          [ "${GITLEAKS_LOG_OPTS}" = HEAD ] && scope_text="the evaluated revision's history"
          SCOPE_TEXT="${scope_text}" STATUS="${status}" REPORT="${report}" \
            python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          status = int(env["STATUS"])
          try:
              findings = json.loads(Path(env["REPORT"]).read_text(encoding="utf-8")) or []
          except (OSError, ValueError):
              findings = []
          scope = env["SCOPE_TEXT"]
          label = "nightly, reported" if env.get("GITLEAKS_FINDINGS_FAIL") == "false" else "blocking"
          if status == 0:
              line = f"- gitleaks ({label}): pass: no secret in {scope}"
          elif status == 1:
              line = f"- gitleaks ({label}): findings: {len(findings)} secret(s) in {scope} (values never printed)"
          else:
              line = f"- gitleaks ({label}): error: gitleaks exited {status}; no result for {scope}"
          lines = [line]
          if findings:
              lines += ["", "| File | Line | Rule | Commit |", "|---|---|---|---|"]
          for item in findings[:20]:
              path = str(item.get("File", "")).replace(",", "%2C").replace(":", "%3A")
              rule = str(item.get("RuleID", ""))
              commit = str(item.get("Commit", ""))[:12]
              print(
                  f"::error file={path},line={item.get('StartLine', 1)},title=gitleaks {rule}::"
                  f"a {rule} secret is {'committed in ' + commit if commit else 'in the tree'}; the value is redacted"
              )
              lines.append(f"| `{item.get('File', '')}` | {item.get('StartLine', '')} | `{rule}` | `{commit}` |")
          if len(findings) > 20:
              lines.append(f"\n+{len(findings) - 20} more: see the job log")
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          if env.get("GITLEAKS_SARIF") and status in (0, 1):
              # Code scanning's copy (nightly): file, line and rule only.
              rules = sorted({str(item.get("RuleID", "")) for item in findings})
              sarif = {
                  "version": "2.1.0",
                  "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                  "runs": [{
                      "tool": {"driver": {
                          "name": "gitleaks",
                          "informationUri": "https://github.com/gitleaks/gitleaks",
                          "rules": [{"id": rule, "shortDescription": {"text": f"{rule} secret"}} for rule in rules],
                      }},
                      "results": [{
                          "ruleId": str(item.get("RuleID", "")),
                          "level": "error",
                          "message": {"text": f"a {item.get('RuleID', '')} secret is committed here; the value is redacted"},
                          "locations": [{"physicalLocation": {
                              "artifactLocation": {"uri": str(item.get("File", "")).removeprefix("./")},
                              "region": {"startLine": max(int(item.get("StartLine") or 1), 1)},
                          }}],
                      } for item in findings],
                  }],
              }
              Path(env["GITLEAKS_SARIF"]).parent.mkdir(parents=True, exist_ok=True)
              Path(env["GITLEAKS_SARIF"]).write_text(json.dumps(sarif, indent=2) + "\n", encoding="utf-8")
          if status == 1 and env.get("GITLEAKS_FINDINGS_FAIL") == "false":
              print(f"gitleaks: {len(findings)} secret(s) in {scope}, reported to code scanning")
          elif status == 1:
              print(f"::error title=gitleaks::{len(findings)} secret(s) in {scope}; each is annotated at its file and line")
          elif status != 0:
              print(f"::error title=gitleaks::gitleaks exited {status}: an infrastructure failure, not a finding")
          PY
          if [ "${status}" -eq 1 ] && [ "${GITLEAKS_FINDINGS_FAIL}" = "false" ]; then
            exit 0
          fi
          exit "${status}"
      # --- inlined org-ci job gitleaks org-ci.yml: end ---
      - name: Record the gitleaks job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/gitleaks.result"
      - name: Upload the gitleaks job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-head-gitleaks-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/gitleaks.result
          if-no-files-found: error
          retention-days: 1

  head__pip-audit:
    name: Canary ${{ matrix.repository }} pip-audit job
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job pip-audit org-ci.yml: begin ---
      - name: Checkout (full history)
        id: pip-audit__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect project languages
        id: pip-audit__detect
        run: |
          set -euo pipefail
          python_project=false
          node_project=false
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            python_project=true
          fi
          if [ -f "package.json" ]; then
            node_project=true
          fi
          echo "python=${python_project}" >> "$GITHUB_OUTPUT"
          echo "node=${node_project}" >> "$GITHUB_OUTPUT"
          echo "Detected: python=${python_project} node=${node_project}"
          if [ "${python_project}" != "true" ]; then
            echo "- pip-audit (blocking): not applicable: no Python project (no pyproject.toml, requirements.txt or setup.py)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Python
        id: pip-audit__s2
        if: steps.pip-audit__detect.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python dependency audit (pip-audit)
        id: pip-audit__pip_audit
        if: steps.pip-audit__detect.outputs.python == 'true'
        env:
          L9_CI_INSTALL_COMMAND: ""
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
          PIP_AUDIT_REPORT: ${{ runner.temp }}/pip-audit.json
        run: |
          set -euo pipefail
          # Scope (operator decision 2026-11-21, row 23): a pull request,
          # merge group or push audits only when it changes a dependency
          # manifest or lock. Every other event audits. A range that cannot be
          # read audits too: not running needs a positive proof.
          is_sha() {
            local candidate="$1"
            [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]
          }
          base=""
          head=""
          case "${EVENT_NAME:-}" in
            pull_request|pull_request_target) base="${PR_BASE:-}"; head="${PR_HEAD:-}" ;;
            merge_group) base="${MERGE_GROUP_BASE:-}"; head="${MERGE_GROUP_HEAD:-}" ;;
            push) base="${PUSH_BEFORE:-}"; head="${EVENT_SHA:-}" ;;
            *) ;;
          esac
          if is_sha "${base}" && is_sha "${head}" \
            && [ "${base}" != "0000000000000000000000000000000000000000" ]; then
            # --no-renames: a renamed or deleted lock shows its old path too.
            if changed="$(git diff --no-renames --name-only "${base}" "${head}" --)"; then
              manifests='(^|/)(pyproject\.toml|uv\.lock|setup\.py|setup\.cfg|requirements[^/]*\.txt|constraints[^/]*\.txt|Pipfile(\.lock)?|poetry\.lock|pdm\.lock)$'
              if ! grep -Eq "${manifests}" <<< "${changed}"; then
                echo "pip-audit: no dependency manifest or lock changed in ${base}..${head}; nothing new to audit"
                echo "outcome=not_applicable (no dependency manifest or lock changed)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::warning::pip-audit: the change range ${base}..${head} cannot be read; auditing"
            fi
          fi
          python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
          pip install --only-binary :all: "pip-audit==2.9.0"
          if [ -n "$L9_CI_INSTALL_COMMAND" ]; then
            bash -c "$L9_CI_INSTALL_COMMAND" || echo "::notice::l9-ci install command failed; continuing"
          fi
          # The full resolved lock, not the runner's environment: uv.lock
          # exported with every dependency group, extra and workspace package
          # (the project's own workspace members are local code, not
          # packages, and are left out), else requirements.txt. uv is Core's
          # locked version (install-consumer-ci/toolchain-lock.json).
          locked=()
          if [ -f "uv.lock" ]; then
            pip install --only-binary :all: "uv==0.13.8"
            out="${RUNNER_TEMP:-/tmp}/l9-locked"
            mkdir -p "${out}"
            export_lock() {
              local name="$1"
              shift
              echo "pip-audit: uv export --frozen --all-packages --no-emit-workspace --no-hashes --format requirements.txt $* (${name})"
              uv export --frozen --all-packages --no-emit-workspace --no-hashes \
                --format requirements.txt --output-file "${out}/${name}.txt" "$@" > /dev/null
            }
            if export_lock all --all-groups --all-extras; then
              locked+=("${out}/all.txt")
            elif python3 -I -c 'import sys, tomllib; sys.exit(0 if tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("uv", {}).get("conflicts") else 1)' 2> /dev/null; then
              # Declared conflicts ([tool.uv].conflicts) make the union of
              # every extra and group unresolvable by design. Each selection
              # is exported and audited on its own: the base set, then every
              # extra and every group. Any selection that cannot be exported
              # leaves the locked set unknown.
              echo "pip-audit: uv.lock declares conflicting extras or groups; auditing each selection"
              selections="$(python3 -I -c 'import tomllib; d = tomllib.load(open("pyproject.toml", "rb")); [print("extra", n) for n in d.get("project", {}).get("optional-dependencies", {})]; [print("group", n) for n in d.get("dependency-groups", {})]')"
              if ! export_lock base --no-default-groups; then
                echo "::error::pip-audit: the base set of uv.lock cannot be exported; the audit is incomplete"
                echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              locked+=("${out}/base.txt")
              while read -r kind name; do
                [ -n "${kind}" ] || continue
                if ! export_lock "${kind}-${name}" --no-default-groups "--${kind}" "${name}"; then
                  echo "::error::pip-audit: the ${kind} ${name} of uv.lock cannot be exported; the audit is incomplete"
                  echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                locked+=("${out}/${kind}-${name}.txt")
              done <<< "${selections}"
            else
              echo "::error::pip-audit: uv.lock cannot be exported; the locked set is unknown, so the audit is incomplete"
              echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f "requirements.txt" ]; then
            locked=("requirements.txt")
          else
            echo "::error::pip-audit: a Python project with no uv.lock or requirements.txt has no locked set to audit; the audit is incomplete"
            echo "outcome=not_executed (no lock file)" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # The audited set, named in the log: each file's pinned packages
          # and the total. A file the export did not write is not an empty
          # set; the audit is incomplete.
          total=0
          for file in "${locked[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "::error::pip-audit: ${file} was not written; the audit is incomplete"
              echo "outcome=not_executed (the locked set was not written)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            count="$(awk '/^[A-Za-z0-9][A-Za-z0-9._-]*(\[[^]]*\])?[[:space:]]*==/ { n++ } END { print n + 0 }' "${file}")"
            echo "pip-audit: auditing ${count} pinned package(s) from ${file}"
            total=$((total + count))
          done
          echo "pip-audit: ${total} pinned package(s) audited in all"
          echo "packages=${total}" >> "$GITHUB_OUTPUT"
          # Acquisition and the lock are settled; from here pip-audit runs.
          status=0
          report=()
          if [ -n "${PIP_AUDIT_REPORT:-}" ]; then
            report=(--format json --output "${PIP_AUDIT_REPORT}")
          fi
          # `--desc` takes an optional value; it is given explicitly so the
          # next argument is never read as that value (`--desc .` is a usage
          # error, exit 2, and audits nothing). An exported lock is fully
          # pinned, so it is audited as written (--no-deps).
          if [ "${locked[0]}" = "requirements.txt" ]; then
            pip-audit --desc on ${report[@]+"${report[@]}"} -r requirements.txt || status=$?
          else
            requirements=()
            for file in "${locked[@]}"; do
              requirements+=(-r "${file}")
            done
            pip-audit --desc on --no-deps ${report[@]+"${report[@]}"} "${requirements[@]}" || status=$?
          fi
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          # A caller that asked for a report judges the vulnerabilities it
          # lists (the nightly sink's ratchet): pip-audit's "vulnerabilities
          # found" exit (1) then ends this step cleanly. Any other failure
          # still fails it, and without a report path nothing changes.
          if [ -n "${PIP_AUDIT_REPORT:-}" ] && [ "${status}" -eq 1 ]; then
            echo "pip-audit: known vulnerabilities written to ${PIP_AUDIT_REPORT}; the caller judges them"
            exit 0
          fi
          exit "${status}"
      # The audit step ends cleanly on "vulnerabilities found" because it
      # wrote a report (the nightly sink inlines it the same way); this step
      # judges that report: a known vulnerability fails the check, named.
      - name: Judge the dependency audit
        id: pip-audit__pip_audit_verdict
        if: steps.pip-audit__detect.outputs.python == 'true' && steps.pip-audit__pip_audit.outcome == 'success'
        env:
          OUTCOME: ${{ steps.pip-audit__pip_audit.outputs.outcome }}
          REPORT: ${{ runner.temp }}/pip-audit.json
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          env = os.environ
          outcome = env.get("OUTCOME", "")
          summary = Path(env["GITHUB_STEP_SUMMARY"])
          if outcome.startswith("not_applicable"):
              summary.open("a", encoding="utf-8").write(
                  "- pip-audit (blocking): pass: dependencies unchanged (no manifest or lock changed)\n"
              )
              sys.exit(0)
          if outcome == "executed_pass":
              summary.open("a", encoding="utf-8").write("- pip-audit (blocking): pass: no known vulnerability\n")
              sys.exit(0)
          try:
              data = json.loads(Path(env["REPORT"]).read_text(encoding="utf-8"))
          except (OSError, ValueError) as error:
              sys.exit(f"::error title=pip-audit::pip-audit reported vulnerabilities but its report is unreadable ({error})")
          vulnerable = [
              (dep["name"], dep.get("version", "?"), vuln["id"])
              for dep in data.get("dependencies", [])
              for vuln in dep.get("vulns", [])
          ]
          lock = "uv.lock" if Path("uv.lock").is_file() else "requirements.txt"
          lines = [f"- pip-audit (blocking): findings: {len(vulnerable)} known vulnerability(ies)", "",
                   "| Package | Version | Advisory |", "|---|---|---|"]
          for name, version, ident in vulnerable[:20]:
              print(f"::error file={lock},title=pip-audit {ident}::{name} {version} has known vulnerability {ident}")
              lines.append(f"| `{name}` | {version} | {ident} |")
          if len(vulnerable) > 20:
              lines.append(f"\n+{len(vulnerable) - 20} more: see the job log")
          summary.open("a", encoding="utf-8").write("\n".join(lines) + "\n")
          print(f"::error title=pip-audit::{len(vulnerable)} known vulnerability(ies) in the locked dependencies; each is annotated")
          sys.exit(1)
          PY
      # --- inlined org-ci job pip-audit org-ci.yml: end ---
      - name: Record the pip-audit job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/pip-audit.result"
      - name: Upload the pip-audit job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-head-pip-audit-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/pip-audit.result
          if-no-files-found: error
          retention-days: 1

  head__npm-audit:
    name: Canary ${{ matrix.repository }} npm-audit job
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job npm-audit org-ci.yml: begin ---
      - name: Checkout (full history)
        id: npm-audit__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node dependency audit (npm audit)
        id: npm-audit__npm_audit
        env:
          # Opt-in, as before the split (operator, 2026-11-21: modes stay as
          # they are): org-ci never enabled it, so the check reports not
          # applicable until Core sets this to "true".
          L9_NPM_AUDIT: "false"
          EVENT_NAME: push
          PR_BASE: ''
          MERGE_GROUP_BASE: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          summary() { echo "- npm-audit (opt-in, blocking when enabled): $1" >> "$GITHUB_STEP_SUMMARY"; echo "npm-audit: $1"; }
          if [ "${L9_NPM_AUDIT}" != "true" ]; then
            summary "not applicable: npm audit is opt-in and not enabled"
            exit 0
          fi
          if [ ! -f package.json ]; then
            summary "not applicable: no Node project (no package.json)"
            exit 0
          fi
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          if [[ "${base}" =~ ^[0-9a-f]{40}$ ]] && [ -n "${base//0/}" ]; then
            if ! git diff --name-only "${base}" "${EVENT_SHA}" -- | grep -Eq '(^|/)(package\.json|package-lock\.json)$'; then
              summary "pass: dependencies unchanged (package.json and package-lock.json untouched)"
              exit 0
            fi
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error file=package.json,title=npm-audit::npm audit needs package-lock.json beside package.json"
            exit 1
          fi
          status=0
          npm audit --audit-level=high || status=$?
          if [ "${status}" -eq 0 ]; then
            summary "pass: no high or critical advisory"
          else
            summary "findings: npm audit exited ${status} at --audit-level=high"
            echo "::error file=package-lock.json,title=npm-audit::npm audit found high or critical advisories (exit ${status}); see the log"
          fi
          exit "${status}"

  # CodeQL is one org-wide check (operator, 2026-11-21; docs/codeql-check.md),
  # replacing per-repository CodeQL workflows and default setup. Read-only,
  # like every pull-request job here (L9-CI-CORE-005): nothing is uploaded on
  # a pull request. The languages the revision contains are analyzed, always
  # including `actions`, with build-mode none and the security-extended suite,
  # once at the evaluated revision and once at the event's base; only results
  # the base does not have are judged (rule, path and CodeQL's own
  # primaryLocationLineHash), and a new result at error level or security
  # severity high or above fails the check. An event with no base (a
  # dispatch, the nightly sink, the promotion canary) has nothing new: it
  # reports what it found and passes. The nightly sink runs the same steps on
  # the whole default branch and sends the SARIF to code scanning.
      # --- inlined org-ci job npm-audit org-ci.yml: end ---
      - name: Record the npm-audit job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/npm-audit.result"
      - name: Upload the npm-audit job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-head-npm-audit-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/npm-audit.result
          if-no-files-found: error
          retention-days: 1

  head__codeql:
    name: Canary ${{ matrix.repository }} codeql job
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job codeql org-ci.yml: begin ---
      - name: Checkout (full history)
        id: codeql__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve CodeQL's languages and base
        id: codeql__codeql_scope
        env:
          EVENT_NAME: push
          PR_BASE: ''
          MERGE_GROUP_BASE: ''
          PUSH_BEFORE: ''
        run: |
          set -euo pipefail
          # Languages CodeQL analyzes without a build (build-mode none), by the
          # files git tracks at the evaluated revision. `actions` runs in every
          # repository with a workflow or action file, which is every governed
          # one (org-ci reaches them through a workflow); CodeQL refuses a
          # database for a language with no source, so a repository without
          # one has no Actions code to scan.
          languages=""
          tracked="$(git ls-files)"
          has() { grep -Eqi "$1" <<< "${tracked}"; }
          if has '(^|/)\.github/workflows/[^/]+\.ya?ml$|(^|/)action\.ya?ml$'; then languages="actions"; fi
          if has '\.py$'; then languages="${languages} python"; fi
          if has '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$'; then languages="${languages} javascript"; fi
          if has '\.rb$'; then languages="${languages} ruby"; fi
          if has '\.java$'; then languages="${languages} java"; fi
          if has '\.cs$'; then languages="${languages} csharp"; fi
          if has '\.rs$'; then languages="${languages} rust"; fi
          case "${EVENT_NAME}" in
            pull_request|pull_request_target) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          if [[ "${base}" =~ ^[0-9a-f]{40}$ ]] && [ -n "${base//0/}" ]; then
            if ! git cat-file -e "${base}^{commit}" 2> /dev/null; then
              echo "::error title=CodeQL::the event's base ${base} is not in this clone; the check cannot tell what is new"
              exit 1
            fi
          else
            base=""
          fi
          languages="${languages# }"
          echo "languages=${languages}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "CodeQL languages: ${languages}; base: ${base:-none (nothing is new)}"
      - name: Install CodeQL (checksum-pinned bundle)
        id: codeql__codeql_install
        run: |
          set -euo pipefail
          CODEQL_VERSION="2.27.5"
          CODEQL_SHA256="141e6eb4e99c8498a1258e282e6f7b59c747b4b1a7eabc7cbf7d1aa92792edf0"
          bundle="${RUNNER_TEMP}/codeql-bundle.tar.zst"
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o "${bundle}" \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_VERSION}/codeql-bundle-linux64.tar.zst"
          actual="$(sha256sum "${bundle}" | awk '{print $1}')"
          if [ "${actual}" != "${CODEQL_SHA256}" ]; then
            echo "::error title=CodeQL::bundle checksum mismatch: got ${actual}"
            exit 1
          fi
          tar --zstd -xf "${bundle}" -C "${RUNNER_TEMP}"
          rm -f "${bundle}"
          "${RUNNER_TEMP}/codeql/codeql" version --format=terse
          echo "executable=${RUNNER_TEMP}/codeql/codeql" >> "$GITHUB_OUTPUT"
      - name: Analyze with CodeQL (security-extended)
        id: codeql__codeql_analyze
        env:
          CODEQL: ${{ steps.codeql__codeql_install.outputs.executable }}
          LANGUAGES: ${{ steps.codeql__codeql_scope.outputs.languages }}
          BASE: ${{ steps.codeql__codeql_scope.outputs.base }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/codeql-results"
          mkdir -p "${out}" "${RUNNER_TEMP}/codeql-db"
          sides=("head=${PWD}")
          if [ -n "${BASE}" ]; then
            git worktree add --detach "${RUNNER_TEMP}/codeql-base" "${BASE}" > /dev/null
            sides+=("base=${RUNNER_TEMP}/codeql-base")
          fi
          for side in "${sides[@]}"; do
            name="${side%%=*}"
            root="${side#*=}"
            for language in ${LANGUAGES}; do
              db="${RUNNER_TEMP}/codeql-db/${name}-${language}"
              status=0
              "${CODEQL}" database create "${db}" --language="${language}" \
                --build-mode=none --source-root="${root}" --threads=0 --overwrite > /dev/null || status=$?
              if [ "${status}" -eq 32 ]; then
                # CodeQL's "no source code seen" exit: the language has no code
                # on this side (a pull request adds the language): no results.
                echo "CodeQL ${name} ${language}: no source on this side; no results"
                printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"CodeQL","rules":[]}},"results":[]}]}\n' \
                  > "${out}/${name}-${language}.sarif"
                continue
              elif [ "${status}" -ne 0 ]; then
                echo "::error title=CodeQL::database create for ${language} (${name}) exited ${status}"
                exit "${status}"
              fi
              "${CODEQL}" database analyze "${db}" \
                "codeql/${language}-queries:codeql-suites/${language}-security-extended.qls" \
                --format=sarif-latest --sarif-category="/language:${language}" \
                --output="${out}/${name}-${language}.sarif" --threads=0 > /dev/null
              echo "CodeQL ${name} ${language}: analyzed"
            done
          done
          echo "directory=${out}" >> "$GITHUB_OUTPUT"
      - name: Judge new CodeQL results (blocking at error / high)
        id: codeql__codeql_verdict
        env:
          RESULTS: ${{ steps.codeql__codeql_analyze.outputs.directory }}
          LANGUAGES: ${{ steps.codeql__codeql_scope.outputs.languages }}
          BASE: ${{ steps.codeql__codeql_scope.outputs.base }}
          L9_CODEQL_MODE: blocking
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import collections
          import json
          import os
          import re
          import sys
          from pathlib import Path

          env = os.environ
          results = Path(env["RESULTS"])
          # SARIF message links ("[a user-provided value](1)") read as their text.
          link = re.compile(r"\[([^\]]*)\]\(\d+\)")
          base = env.get("BASE", "")
          blocking = env.get("L9_CODEQL_MODE", "blocking") == "blocking"


          def load(name):
              run = json.loads((results / name).read_text(encoding="utf-8"))["runs"][0]
              rules = {rule["id"]: rule for rule in run.get("tool", {}).get("driver", {}).get("rules", [])}
              found = []
              for result in run.get("results", []):
                  rule = rules.get(result.get("ruleId", ""), {})
                  location = (result.get("locations") or [{}])[0].get("physicalLocation", {})
                  level = result.get("level") or rule.get("defaultConfiguration", {}).get("level", "warning")
                  try:
                      severity = float(rule.get("properties", {}).get("security-severity", 0))
                  except (TypeError, ValueError):
                      severity = 0.0
                  found.append({
                      "rule": result.get("ruleId", ""),
                      "path": location.get("artifactLocation", {}).get("uri", ""),
                      "line": location.get("region", {}).get("startLine", 1),
                      "hash": result.get("partialFingerprints", {}).get("primaryLocationLineHash", ""),
                      "message": link.sub(r"\1", " ".join(result.get("message", {}).get("text", "").split())),
                      "level": level,
                      "severity": severity,
                      "blocks": level == "error" or severity >= 7.0,
                  })
              return found


          new, total = [], 0
          for language in env["LANGUAGES"].split():
              head = load(f"head-{language}.sarif")
              total += len(head)
              if not base:
                  continue
              known = collections.Counter(
                  (r["rule"], r["path"], r["hash"]) for r in load(f"base-{language}.sarif")
              )
              for result in head:
                  key = (result["rule"], result["path"], result["hash"])
                  if known[key]:
                      known[key] -= 1
                  else:
                      new.append({**result, "language": language})

          failing = [r for r in new if r["blocks"]]
          for r in new:
              kind = "error" if r["blocks"] and blocking else "warning"
              path = r["path"].replace(",", "%2C").replace(":", "%3A")
              print(f"::{kind} file={path},line={r['line']},title=CodeQL {r['rule']}::{r['message']}")
          mode = "blocking at error / high" if blocking else "advisory"
          if not base:
              head_line = f"- CodeQL ({mode}): no base for this event, so nothing is new; {total} result(s) on the whole tree"
          elif failing:
              head_line = f"- CodeQL ({mode}): findings: {len(failing)} new result(s) at error / high or above ({len(new)} new in all)"
          else:
              head_line = f"- CodeQL ({mode}): pass: {len(new)} new result(s), none at error / high or above"
          lines = [head_line, f"- languages: `{env['LANGUAGES']}`; base: `{base or 'none'}`"]
          if new:
              lines += ["", "| Severity | Rule | File | Line |", "|---|---|---|---|"]
              for r in sorted(new, key=lambda r: (not r["blocks"], -r["severity"]))[:20]:
                  grade = f"{r['level']} {r['severity']:g}" if r["severity"] else r["level"]
                  lines.append(f"| {grade} | `{r['rule']}` | `{r['path']}` | {r['line']} |")
              if len(new) > 20:
                  lines.append(f"\n+{len(new) - 20} more: see the annotations")
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          print(head_line)
          if failing and blocking:
              print(f"::error title=CodeQL::{len(failing)} new result(s) at error / high or above; each is annotated at its file and line")
              sys.exit(1)
          PY

  # actionlint is one org-wide check (operator, 2026-11-21;
  # docs/actionlint-check.md), blocking, always reporting. A pull request,
  # merge group or push is judged on the workflow files it changes; a change
  # to an action definition (action.yml / action.yaml) re-judges every
  # workflow, since actionlint checks a workflow's use of local actions
  # through them. An event with no base (a dispatch, the promotion canary)
  # judges every workflow and reports, never fails: it brings nothing in. The
  # nightly sink judges every workflow too, to code scanning. The version and
  # checksum are Core's toolchain lock
  # (toolchain-lock.json `actionlint`, locks/actionlint-<version>.json).
  # shellcheck and pyflakes are off: the runner image's copies are not
  # pinned, so findings would move with the image.
      # --- inlined org-ci job codeql org-ci.yml: end ---
      - name: Record the codeql job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/codeql.result"
      - name: Upload the codeql job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-head-codeql-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/codeql.result
          if-no-files-found: error
          retention-days: 1

  head__actionlint:
    name: Canary ${{ matrix.repository }} actionlint job
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job actionlint org-ci.yml: begin ---
      - name: Checkout (full history)
        id: actionlint__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve actionlint's scope
        id: actionlint__actionlint_scope
        env:
          EVENT_NAME: push
          PR_BASE: ''
          MERGE_GROUP_BASE: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          workflows='^\.github/workflows/[^/]+\.ya?ml$'
          actions='(^|/)action\.ya?ml$'
          list="${RUNNER_TEMP}/actionlint-files"
          git ls-files | grep -E "${workflows}" > "${list}.all" || true
          if [ ! -s "${list}.all" ]; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "actionlint: not applicable: no workflow files"
            echo "- actionlint (blocking): not applicable: no workflow files" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "${EVENT_NAME}" in
            pull_request|pull_request_target) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          scope="every workflow"
          judge="report"
          cp "${list}.all" "${list}"
          if [[ "${base}" =~ ^[0-9a-f]{40}$ ]] && [ -n "${base//0/}" ]; then
            judge="block"
            if ! changed="$(git diff --name-only --diff-filter=d "${base}" "${EVENT_SHA}" --)"; then
              echo "::error title=actionlint::the event's base ${base} is not in this clone; the check cannot tell what changed"
              exit 1
            fi
            if grep -Eq "${actions}" <<< "${changed}"; then
              scope="every workflow (an action definition changed)"
            else
              grep -E "${workflows}" <<< "${changed}" > "${list}" || true
              scope="the workflow files ${base:0:12}..${EVENT_SHA:0:12} changes"
              if [ ! -s "${list}" ]; then
                echo "applies=false" >> "$GITHUB_OUTPUT"
                echo "actionlint: no changed workflow or action files"
                echo "- actionlint (blocking): pass: no changed workflow or action files" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          {
            echo "applies=true"
            echo "files=${list}"
            echo "scope=${scope}"
            echo "judge=${judge}"
          } >> "$GITHUB_OUTPUT"
          echo "actionlint: $(wc -l < "${list}") workflow file(s): ${scope}"
      - name: Install actionlint (toolchain-locked)
        id: actionlint__actionlint_install
        if: steps.actionlint__actionlint_scope.outputs.applies == 'true'
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          actual="$(sha256sum "${archive}" | awk '{print $1}')"
          if [ "${actual}" != "${ACTIONLINT_SHA256}" ]; then
            echo "::error title=actionlint::checksum mismatch: got ${actual}"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint-bin" actionlint
          echo "executable=${RUNNER_TEMP}/actionlint-bin/actionlint" >> "$GITHUB_OUTPUT"
      - name: Run actionlint (blocking)
        id: actionlint__actionlint_check
        if: steps.actionlint__actionlint_scope.outputs.applies == 'true'
        env:
          ACTIONLINT: ${{ steps.actionlint__actionlint_install.outputs.executable }}
          FILES: ${{ steps.actionlint__actionlint_scope.outputs.files }}
          SCOPE: ${{ steps.actionlint__actionlint_scope.outputs.scope }}
          JUDGE: ${{ steps.actionlint__actionlint_scope.outputs.judge }}
          # The nightly sink inlines this step with findings reported rather
          # than failing, written as SARIF to ACTIONLINT_SARIF.
          ACTIONLINT_FINDINGS_FAIL: "true"
          ACTIONLINT_SARIF: ""
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/actionlint.json"
          mapfile -t files < "${FILES}"
          status=0
          # The repository's own .github/actionlint.yaml applies (actionlint
          # finds it from the working directory).
          "${ACTIONLINT}" -shellcheck= -pyflakes= -format '{{json .}}' "${files[@]}" > "${report}" || status=$?
          if [ "${status}" -gt 1 ]; then
            echo "::error title=actionlint::actionlint exited ${status}: the check did not complete"
            cat "${report}"
            exit "${status}"
          fi
          STATUS="${status}" REPORT="${report}" COUNT="${#files[@]}" python3 -I - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          env = os.environ
          try:
              findings = json.loads(Path(env["REPORT"]).read_text(encoding="utf-8") or "[]")
          except ValueError as error:
              sys.exit(f"::error title=actionlint::unreadable report ({error})")
          # Findings block only what an event brings in (a base exists); with
          # no base, and in the nightly sink, they are reported.
          nightly = env.get("ACTIONLINT_FINDINGS_FAIL") == "false"
          reported = nightly or env.get("JUDGE") != "block"
          label = "nightly, reported" if nightly else ("reported: no base" if reported else "blocking")
          scope = env["SCOPE"]
          if not findings:
              line = f"- actionlint ({label}): pass: {env['COUNT']} workflow file(s), {scope}"
          else:
              line = f"- actionlint ({label}): findings: {len(findings)} in {env['COUNT']} workflow file(s), {scope}"
          lines = [line]
          if findings:
              lines += ["", "| File | Line | Kind | Message |", "|---|---|---|---|"]
          for item in findings:
              path = str(item.get("filepath", "")).replace(",", "%2C").replace(":", "%3A")
              message = " ".join(str(item.get("message", "")).split())
              print(
                  f"::{'warning' if reported else 'error'} file={path},line={item.get('line', 1)},col={item.get('column', 1)},"
                  f"title=actionlint {item.get('kind', '')}::{message}"
              )
          for item in findings[:20]:
              message = " ".join(str(item.get("message", "")).split()).replace("|", "\\|")
              lines.append(f"| `{item.get('filepath', '')}` | {item.get('line', '')} | `{item.get('kind', '')}` | {message} |")
          if len(findings) > 20:
              lines.append(f"\n+{len(findings) - 20} more: see the annotations")
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          print(line)
          if env.get("ACTIONLINT_SARIF"):
              kinds = sorted({str(item.get("kind", "")) for item in findings})
              sarif = {
                  "version": "2.1.0",
                  "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                  "runs": [{
                      "tool": {"driver": {
                          "name": "actionlint",
                          "informationUri": "https://github.com/rhysd/actionlint",
                          "rules": [{"id": kind, "shortDescription": {"text": f"actionlint {kind} check"}} for kind in kinds],
                      }},
                      "results": [{
                          "ruleId": str(item.get("kind", "")),
                          "level": "error",
                          "message": {"text": " ".join(str(item.get("message", "")).split())},
                          "locations": [{"physicalLocation": {
                              "artifactLocation": {"uri": str(item.get("filepath", "")).removeprefix("./")},
                              "region": {
                                  "startLine": max(int(item.get("line") or 1), 1),
                                  "startColumn": max(int(item.get("column") or 1), 1),
                              },
                          }}],
                      } for item in findings],
                  }],
              }
              target = Path(env["ACTIONLINT_SARIF"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(sarif, indent=2) + "\n", encoding="utf-8")
          if findings and not reported:
              print(f"::error title=actionlint::{len(findings)} finding(s); each is annotated at its file and line")
              sys.exit(1)
          PY

  # Biome is its own check (operator, 2026-11-21; docs/biome-check.md). It runs
  # beside gitleaks, pip-audit, npm-audit and `analyze`, for every repository the organization
  # ruleset governs, and always reports: no biome.json / biome.jsonc is a
  # success that says "not applicable: no biome configuration"; a pull request
  # that changes no file in Biome's scope is a success that says so. A pull
  # request and a merge group are judged on the files they change, never on
  # the code already there (incoming code only); a push of the default branch
  # on the files the push changes; any other event (a dispatch, the nightly
  # sink, the promotion canary) on the whole tree. Findings are annotated at
  # their file and line by Biome's GitHub reporter, counted in the job summary
  # with the first of them, and fail the job: the mode is blocking.
      # --- inlined org-ci job actionlint org-ci.yml: end ---
      - name: Record the actionlint job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/actionlint.result"
      - name: Upload the actionlint job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-head-actionlint-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/actionlint.result
          if-no-files-found: error
          retention-days: 1

  head__biome:
    name: Canary ${{ matrix.repository }} biome job
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job biome org-ci.yml: begin ---
      - name: Checkout immutable event revision
        id: biome__s0
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      # What Biome judges: the files the event changes, or the whole tree.
      # `biome ci --changed --since` needs the merge base in local history,
      # which a shallow CI checkout cannot promise; a diff of the two fetched
      # commits names the same files exactly, and the paths go to `biome ci`,
      # which still applies the repository's own files.includes.
      - name: Resolve Biome's scope
        id: biome__biome_scope
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          EVENT_NAME: push
          PR_BASE: ''
          MERGE_GROUP_BASE: ''
          PUSH_BEFORE: ''
        run: |
          set -euo pipefail
          paths="${RUNNER_TEMP}/biome-paths"
          : > "${paths}"
          echo "paths=${paths}" >> "$GITHUB_OUTPUT"
          if [ ! -f biome.json ] && [ ! -f biome.jsonc ]; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "Biome: not applicable: no biome configuration"
            echo "- Biome (blocking): not applicable: no biome configuration (no biome.json or biome.jsonc at the repository root)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "applies=true" >> "$GITHUB_OUTPUT"
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          if [ "${EVENT_NAME}" = "push" ] && { [ -z "${base}" ] || [ -z "${base//0/}" ]; }; then
            # A new branch or a first push has no previous revision.
            base=""
          fi
          if [ -z "${base}" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "Biome scope: the whole tree (${EVENT_NAME})"
            exit 0
          fi
          if ! printf '%s' "${base}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Biome scope::the ${EVENT_NAME} base '${base}' is not a full commit id, so the changed files cannot be named"
            exit 1
          fi
          auth="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git -c "http.https://github.com/.extraheader=${auth}" \
                -c protocol.version=2 fetch -q --depth=1 origin "${base}"; then
              echo "::error title=Biome scope::the ${EVENT_NAME} base ${base} could not be fetched from ${REPOSITORY}, so the changed files cannot be named"
              exit 1
            fi
          fi
          git diff --name-only --diff-filter=d -z "${base}" "${REVISION}" > "${paths}"
          count="$(tr -cd '\0' < "${paths}" | wc -c | tr -d ' ')"
          echo "scope=changed" >> "$GITHUB_OUTPUT"
          echo "changed=${count}" >> "$GITHUB_OUTPUT"
          echo "Biome scope: ${count} file(s) the ${EVENT_NAME} changes since ${base}"

      - id: biome__biome
        name: Install Biome (digest-locked central pin)
        if: >-
          steps.biome__biome_scope.outputs.applies == 'true'
          && (steps.biome__biome_scope.outputs.scope == 'full' || steps.biome__biome_scope.outputs.changed != '0')
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/install-biome@2ee1720b9863bec15fdfebac13b220aeb699d781

      - name: Run Biome check (blocking)
        id: biome__biome_check
        if: steps.biome__biome_scope.outputs.applies == 'true'
        env:
          # Blocking here; the nightly sink renders this step advisory, so a
          # finding reaches code scanning instead of stopping the night.
          L9_BIOME_MODE: blocking
          L9_BIOME_EXECUTABLE: ${{ steps.biome__biome.outputs.executable }}
          L9_BIOME_VERSION: ${{ steps.biome__biome.outputs['provider-version'] }}
          L9_BIOME_SCOPE: ${{ steps.biome__biome_scope.outputs.scope }}
          L9_BIOME_PATHS: ${{ steps.biome__biome_scope.outputs.paths }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          env = os.environ
          temp = Path(env["RUNNER_TEMP"])
          summary = Path(env["GITHUB_STEP_SUMMARY"])
          scope = env.get("L9_BIOME_SCOPE", "")
          paths = [p for p in Path(env["L9_BIOME_PATHS"]).read_bytes().decode().split("\0") if p]
          mode = env.get("L9_BIOME_MODE", "blocking")
          if mode not in ("blocking", "advisory"):
              sys.exit(f"::error title=Biome::unknown mode {mode!r}: the check cannot decide")
          header = f"- Biome ({mode})"

          def write(lines):
              with summary.open("a", encoding="utf-8") as stream:
                  stream.write("\n".join(lines) + "\n")

          if scope == "changed" and not paths:
              print("Biome: no changed files in Biome's scope")
              write([f"{header}: pass: no changed files in Biome's scope"])
              sys.exit(0)
          executable = env.get("L9_BIOME_EXECUTABLE", "")
          if not executable or not Path(executable).is_file():
              sys.exit("::error title=Biome::the verified Biome executable is missing; the check cannot run")
          report = temp / "biome-report.json"
          sarif = temp / "biome.sarif"
          command = [
              executable, "ci", "--no-errors-on-unmatched",
              "--reporter=github",
              "--reporter=json", f"--reporter-file={report}",
              "--reporter=sarif", f"--reporter-file={sarif}",
          ]
          command += ["--", *paths] if scope == "changed" else ["."]
          code = subprocess.run(command, check=False).returncode
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
              counts = data["summary"]
              diagnostics = data.get("diagnostics", [])
          except (OSError, ValueError, KeyError) as error:
              sys.exit(
                  f"::error title=Biome::biome ci exited {code} and wrote no readable "
                  f"report ({error}): `{' '.join(command[:2])} ...` failed before judging any file"
              )
          checked = int(counts.get("changed", 0)) + int(counts.get("unchanged", 0))
          errors = int(counts.get("errors", 0))
          warnings = int(counts.get("warnings", 0))
          where = "the files this change touches" if scope == "changed" else "the whole tree"
          if scope == "changed" and checked == 0 and code == 0:
              print("Biome: no changed files in Biome's scope")
              write([f"{header}: pass: no changed files in Biome's scope ({len(paths)} changed file(s), none Biome handles)"])
              sys.exit(0)
          status = "pass" if code == 0 else "findings" if code == 1 else "error"
          lines = [
              f"{header}: {status}: {checked} file(s) of {where}, "
              f"{errors} error(s), {warnings} warning(s) (Biome {env.get('L9_BIOME_VERSION', '?')})"
          ]
          shown = [d for d in diagnostics if d.get("severity") in ("error", "fatal")][:20]
          if shown:
              lines += ["", "| File | Line | Rule | Message |", "|---|---|---|---|"]
              for item in shown:
                  location = item.get("location") or {}
                  # 0 is Biome's file-level position (a format diagnostic).
                  start = (location.get("start") or {}).get("line") or "—"
                  message = str(item.get("message", "")).replace("|", "\\|")[:200]
                  lines.append(
                      f"| `{location.get('path', '')}` | {start} | `{item.get('category', '')}` | {message} |"
                  )
              more = errors - len(shown)
              if more > 0:
                  lines.append(f"\n+{more} more error(s): see the annotations")
          write(lines)
          if code == 1 and mode == "advisory":
              print(f"Biome (advisory): {errors} error(s) in {where}; reported, not enforced")
              sys.exit(0)
          if code == 1:
              print(
                  f"::error title=Biome::{errors} error(s) in {where}; each is annotated at its "
                  "file and line above, and the first are listed in the job summary"
              )
          elif code != 0:
              print(f"::error title=Biome::biome ci exited {code}: an infrastructure failure, not a finding")
          sys.exit(code)
          PY
      # --- inlined org-ci job biome org-ci.yml: end ---
      - name: Record the biome job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/biome.result"
      - name: Upload the biome job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-head-biome-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/biome.result
          if-no-files-found: error
          retention-days: 1

  head:
    name: Canary ${{ matrix.repository }}
    needs: [plan, head__gitleaks, head__pip-audit, head__npm-audit, head__codeql, head__actionlint, head__biome]
    if: ${{ !cancelled() && (needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- the gitleaks job's result for this repository (not part of org-ci.yml) ---
      - name: Download the gitleaks job result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A pattern, not a name: a missing result downloads nothing (a name
          # would fail the step), and the next step reads nothing as failure.
          pattern: canary-job-head-gitleaks-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job
          merge-multiple: true
      - name: Result of the gitleaks job
        id: gitleaks__result
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/canary-job/gitleaks.result"
          result=""
          if [ -f "${file}" ]; then
            result="$(tr -d '[:space:]' < "${file}")"
          fi
          case "${result}" in
            success|failure|cancelled) ;;
            *) result=failure ;;
          esac
          echo "gitleaks job: ${result}"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
      # --- the pip-audit job's result for this repository (not part of org-ci.yml) ---
      - name: Download the pip-audit job result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # A pattern, not a name: a missing result downloads nothing (a name
          # would fail the step), and the next step reads nothing as failure.
          pattern: canary-job-head-pip-audit-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job
          merge-multiple: true
      - name: Result of the pip-audit job
        id: pip-audit__result
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/canary-job/pip-audit.result"
          result=""
          if [ -f "${file}" ]; then
            result="$(tr -d '[:space:]' < "${file}")"
          fi
          case "${result}" in
            success|failure|cancelled) ;;
            *) result=failure ;;
          esac
          echo "pip-audit job: ${result}"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
      # --- the npm-audit job's result for this repository (not part of org-ci.yml) ---
