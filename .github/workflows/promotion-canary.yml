      - id: runtime
        name: Resolve central runtime class
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_EVENT: ""
          INPUT_PROFILE: ""
          INPUT_MATRIX_ID: canary-head-${{ matrix.slug }}
          INPUT_SDK_REVISION: ""
          INPUT_SEMGREP_VERSION: "1.186.0"
          INPUT_RETENTION: "14"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          gh_event = os.environ["GH_EVENT"]
          requested_event = os.environ.get("INPUT_EVENT", "").strip()
          requested_profile = os.environ.get("INPUT_PROFILE", "").strip()

          allowed = {"pull_request", "push", "merge", "nightly", "release", "supply_chain"}
          fixed = {"pull_request": "pr_fast", "push": "merge", "merge": "merge"}
          native = {
              "pull_request": ("pull_request", "pr_fast"),
              "merge_group": ("merge", "merge"),
              "push": ("push", "merge"),
          }

          if gh_event == "workflow_dispatch":
              event_class = requested_event or "nightly"
              profile = requested_profile or event_class
          elif requested_event:
              # Reusable workflows retain the caller's event_name, so the
              # required event input—not `workflow_call`—identifies this path.
              event_class = requested_event
              if event_class not in allowed:
                  raise SystemExit(f"unsupported event class: {event_class}")
              expected_profile = fixed.get(event_class, event_class)
              profile = requested_profile or expected_profile
              if profile != expected_profile:
                  raise SystemExit(
                      "reusable profile claim "
                      f"{profile!r} does not match event {event_class!r}; "
                      f"expected {expected_profile!r}"
                  )
          elif gh_event in native:
              event_class, profile = native[gh_event]
          elif gh_event == "workflow_call":
              raise SystemExit("workflow_call requires event")
          else:
              raise SystemExit(f"unsupported trigger: {gh_event}")

          if event_class not in allowed:
              raise SystemExit(f"unsupported event class: {event_class}")
          matrix_id = os.environ.get("INPUT_MATRIX_ID", "org-semgrep")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", matrix_id):
              raise SystemExit("invalid matrix-id")
          sdk_revision = os.environ.get("INPUT_SDK_REVISION", "").strip()
          if sdk_revision and not re.fullmatch(r"[0-9a-f]{40}", sdk_revision):
              raise SystemExit("sdk-revision must be a full 40-character lowercase SHA")
          semgrep_version = os.environ.get("INPUT_SEMGREP_VERSION", "1.186.0").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", semgrep_version):
              raise SystemExit("semgrep-version must be an exact x.y.z version")
          retention = int(os.environ.get("INPUT_RETENTION", "14"))
          if not 1 <= retention <= 90:
              raise SystemExit("artifact-retention-days must be between 1 and 90")

          outputs = {
              "event-class": event_class,
              "profile": profile,
              "matrix-id": matrix_id,
              "sdk-revision": sdk_revision,
              "semgrep-version": semgrep_version,
              "artifact-retention-days": str(retention),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          PY

      # A pull-request scope failure stays a failure. An explicit full-suite
      # override is refused. Nothing here selects the deep suite, and a failed
      # scope does not fall through to one. This runs before checkout so the
      # apt cache still wraps repository verification directly.
      - name: Refuse a pull-request full-suite fallback
        if: >-
          github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
          || steps.runtime.outputs.event-class == 'pull_request'
          || steps.runtime.outputs.event-class == 'merge'
        env:
          # A reusable call keeps the caller's event_name. The class resolved
          # above is the pull-request or merge path this step is judging.
          GH_EVENT: ${{ steps.runtime.outputs.event-class }}
          FULL_SUITE_OVERRIDE: ${{ vars.L9_CI_FULL_SUITE || '' }}
          PR_SCOPE_STATUS: ${{ vars.L9_PR_SCOPE_STATUS || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys


          def finish(status, code):
              print(status)
              print("heavy=false")
              print("suite_pass=false")
              print("selected_suite=none")
              raise SystemExit(code)


          event = os.environ["GH_EVENT"]
          override = os.environ.get("FULL_SUITE_OVERRIDE", "").strip().lower()
          scope = os.environ.get("PR_SCOPE_STATUS", "").strip().lower()
          pr_events = ("pull_request", "merge_group", "merge")

          if event not in pr_events:
              finish("NOT_APPLICABLE", 0)
          if override not in ("", "0", "false", "no"):
              finish("POLICY_PR_DEEP_FORBIDDEN", 1)
          if scope in ("unknown", "failed", "unresolved", "pr_scope_unknown"):
              finish("PR_SCOPE_UNKNOWN", 1)
          finish("NO_FULL_SUITE_FALLBACK", 0)
          PY

      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          BEFORE: ''
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          # Depth 2: a pull_request / merge_group revision is a merge commit,
          # and its base parent is what a consumer's merge-base check needs
          # once origin is reset to an anonymous URL below.
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          # A multi-commit push is not in that depth. Fetch the previous
          # commit while the remote still has the checkout token, then drop
          # the token. The expense judge only diffs objects already local.
          if [[ "${BEFORE}" =~ ^[0-9a-f]{40}$ && "${BEFORE}" != 0000000000000000000000000000000000000000 ]]; then
            git -c protocol.version=2 fetch --depth=1 origin "${BEFORE}"
          fi
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      # Reports consumer declarations of Core-owned tools that drift from
      # Core's toolchain-lock.json, with file:line annotations, into
      # .l9/runtime/toolchain-alignment.json. Advisory: drift never fails the
      # job (housekeeping, operator decision 2026-11-20). The lock ships inside
      # this pinned Core revision.
      - id: toolchain
        name: Report toolchain alignment (advisory)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/check-toolchain-alignment@2ee1720b9863bec15fdfebac13b220aeb699d781

      # Trusted Core judge. The only source is this workflow revision's
      # tools/pr_expense_guard.py, checked out beside the consumer. The step
      # does not call a consumer-relative copy and does not paste the module.
      # receipt=static is not a hosted test receipt.
      - name: Judge pull-request test expense
        if: false
        env:
          GH_EVENT: ${{ steps.runtime.outputs.event-class }}
          GUARD_BEFORE: ''
          GUARD_WORKSPACE: ${{ github.workspace }}
          CORE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          sha_ok=false
          case "${CORE_SHA}" in
            *[!0-9a-f]* | "") sha_ok=false ;;
            ????????????????????????????????????????) sha_ok=true ;;
            *) sha_ok=false ;;
          esac
          if [ "${sha_ok}" != "true" ]; then
            echo "::error::workflow SHA is not a full lowercase revision" >&2
            exit 1
          fi
          core="${RUNNER_TEMP}/l9-ci-core-expense-guard"
          rm -rf "${core}"
          git init "${core}"
          git -C "${core}" remote add origin https://github.com/Quantum-L9/l9-ci-core.git
          git -C "${core}" -c protocol.version=2 fetch --depth=1 origin "${CORE_SHA}"
          git -C "${core}" checkout --detach FETCH_HEAD
          test -f "${core}/tools/pr_expense_guard.py"
          CORE_GUARD="${core}/tools/pr_expense_guard.py"
          export CORE_GUARD
          python3 -c 'import os, runpy; runpy.run_path(os.environ["CORE_GUARD"], run_name="__main__")'

      - name: Validate native push event context
        if: github.event_name == 'push'
        env:
          EVENT_REPOSITORY: ${{ matrix.repository }}
          EVENT_SHA: ${{ matrix.revision }}
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
        run: |
          set -euo pipefail
          if [ "${EVENT_CLASS}" != "push" ]; then
            echo "::error::push trigger resolved to event class '${EVENT_CLASS}'" >&2
            exit 1
          fi
          if [ -z "${EVENT_REPOSITORY}" ]; then
            echo "::error::push execution has no repository identity" >&2
            exit 1
          fi
          if [ -z "${EVENT_SHA}" ]; then
            echo "::error::push execution has no immutable SHA" >&2
            exit 1
          fi
          case "${EVENT_SHA}" in
            *[!0-9a-f]* | "") sha_ok=false ;;
            ????????????????????????????????????????) sha_ok=true ;;
            *) sha_ok=false ;;
          esac
          if [ "${sha_ok}" != "true" ]; then
            echo "::error::push SHA is not a full 40-character revision" >&2
            exit 1
          fi
          echo "Native push evaluation target: ${EVENT_REPOSITORY}@${EVENT_SHA}"

      - id: consumer
        name: Resolve optional consumer metadata
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-consumer-metadata@2ee1720b9863bec15fdfebac13b220aeb699d781

      - id: gov
        name: Resolve central governance
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          profile: ${{ steps.runtime.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.runtime.outputs['event-class'] }}
          repository: ${{ matrix.repository }}
          ref: refs/heads/${{ matrix.branch }}
          product-kind: ${{ steps.consumer.outputs['product-kind'] }}

      - name: Validate consumer waiver pointers
        env:
          REQUESTED: ${{ steps.consumer.outputs['waiver-refs'] }}
          APPLICABLE: ${{ steps.gov.outputs['waiver-ids'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          requested = {item for item in os.environ.get("REQUESTED", "").split(",") if item}
          applicable = {item for item in os.environ.get("APPLICABLE", "").split(",") if item}
          unknown = sorted(requested - applicable)
          if unknown:
              raise SystemExit(f"consumer waiver_refs are not centrally applicable: {unknown}")
          PY

      # Repository verification runs the consumer's `make setup`, which may
      # install OS packages with apt (e.g. Playwright's Chromium libraries and
      # fonts). Their downloaded .deb archives are cached per repository so an
      # unchanged package set is not re-fetched from the Ubuntu mirror on every
      # evaluation: Website-Bot's 21.1 MB took 7-8 minutes at ~45 kB/s on some
      # runs and 1 s on others. Only archives are cached, never installed
      # state, and apt verifies each cached .deb against the signed package
      # index before use, re-downloading any that do not match. Entries are
      # content-addressed (cache entries are immutable): restore never matches
      # exactly and takes the newest entry for this runner image, else this
      # image family; the save key is a digest of the archive set kept after
      # verification, so only a changed set stores a new entry.
      # Cache-service errors only warn, so this can never fail verification.
      - id: apt_archive_cache_dir
        name: Route apt package archives to the verification cache
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/l9-apt-archives"
          mkdir -p "${dir}/partial"
          if id _apt >/dev/null 2>&1; then
            sudo chown _apt "${dir}/partial"
          fi
          printf '%s\n' \
            "Dir::Cache::Archives \"${dir}/\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-l9-archive-cache >/dev/null
          family="l9-apt-archives-v1-${ImageOS:-unknown}-$(uname -m)-"
          image="${family}${ImageVersion:-unknown}-"
          {
            echo "path=${dir}"
            echo "family=${family}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - id: apt_archive_cache
        name: Restore cached apt package archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          # Never saved, so restore always resolves through the prefixes.
          key: ${{ steps.apt_archive_cache_dir.outputs.image }}restore
          restore-keys: |
            ${{ steps.apt_archive_cache_dir.outputs.image }}
            ${{ steps.apt_archive_cache_dir.outputs.family }}

      - id: repository_verify
        name: Run repository verification contract
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/run-repository-verification@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          workspace: .
          # AGENTS.md §27: held only by the registry snapshot and the composer
          # prefetch. Both run before and apart from the consumer's make
          # targets. The verify step does not receive the token.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}
          # Empty: the consumer's make runs under this run's own event. The
          # promotion canary sets push and the leg's branch, since its legs
          # check out a consumer's main head inside a Core pull_request run
          # (AGENTS.md §45, row 27).
          event-name: push
          event-ref: refs/heads/${{ matrix.branch }}

      # Keep only archives of package versions installed in this evaluation, so
      # superseded versions and packages a repository stopped installing drop
      # out instead of accumulating across images. The save key is a digest of
      # the kept set: an unchanged set matches the restored entry and stores
      # nothing, and a repository whose setup installs no OS packages keeps
      # nothing and stores nothing.
      - id: apt_archive_inventory
        name: Inventory apt package archives
        if: always() && steps.apt_archive_cache_dir.outcome == 'success'
        shell: bash
        env:
          ARCHIVE_DIR: ${{ steps.apt_archive_cache_dir.outputs.path }}
          IMAGE_PREFIX: ${{ steps.apt_archive_cache_dir.outputs.image }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in "${ARCHIVE_DIR}"/*.deb; do
            package="$(dpkg-deb -f "${archive}" Package)"
            version="$(dpkg-deb -f "${archive}" Version)"
            if ! dpkg-query -W -f='${Version}\n' "${package}" 2>/dev/null | grep -qxF -- "${version}"; then
              sudo rm -f -- "${archive}"
            fi
          done
          archives=("${ARCHIVE_DIR}"/*.deb)
          digest=""
          if [ "${#archives[@]}" -gt 0 ]; then
            digest="$(printf '%s\n' "${archives[@]##*/}" | LC_ALL=C sort | sha256sum | cut -c1-16)"
          fi
          {
            echo "count=${#archives[@]}"
            echo "key=${IMAGE_PREFIX}${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Save apt package archives
        if: always() && steps.apt_archive_inventory.outputs.count != '' && steps.apt_archive_inventory.outputs.count != '0' && steps.apt_archive_inventory.outputs.key != steps.apt_archive_cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          key: ${{ steps.apt_archive_inventory.outputs.key }}

      - name: Write central CI summary
        if: always()
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          PROFILE: ${{ steps.runtime.outputs.profile }}
          MODE: ${{ steps.gov.outputs.mode }}
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status || steps.repository_verify.outcome }}
          TOOLCHAIN_ALIGNMENT: ${{ steps.toolchain.outcome }}
        run: |
          {
            echo "### L9 central CI"
            echo
            echo "- Event: \`${EVENT_CLASS:-unknown}\`"
            echo "- Profile: \`${PROFILE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- Repository verification: \`${REPOSITORY_VERIFY:-unavailable}\`"
            echo "- Toolchain alignment (advisory): \`${TOOLCHAIN_ALIGNMENT:-unavailable}\`"
            echo "- Biome: its own check, \`Biome\` (docs/biome-check.md)"
            echo "- Semgrep: not run on pull requests; central-semgrep.yml runs it nightly (docs/semgrep-runs-nightly.md)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository verification
        # Contract and infrastructure failures are fatal on every profile,
        # including advisory nightly, release, and supply_chain (AGENTS.md §9).
        # Finding mode stays on the technical-gate step below.
        if: always()
        env:
          REPOSITORY_VERIFY_STATUS: ${{ steps.repository_verify.outputs.status }}
          REPOSITORY_VERIFY_MODE: ${{ steps.repository_verify.outputs.contract-mode }}
          REPOSITORY_VERIFY_FAILURE: ${{ steps.repository_verify.outputs.failure-kind }}
        run: |
          set -euo pipefail
          # An absent contract is tolerated only where Core's bundled policy
          # resolved migration mode; required mode accepts pass only.
          case "${REPOSITORY_VERIFY_MODE}:${REPOSITORY_VERIFY_STATUS}" in
            migration:pass|migration:not_applicable|required:pass) ;;
            *)
              echo "Blocking profile: repository verification did not pass (mode ${REPOSITORY_VERIFY_MODE:-unavailable}; status ${REPOSITORY_VERIFY_STATUS:-unavailable}; failure ${REPOSITORY_VERIFY_FAILURE:-unavailable})" >&2
              exit 1
              ;;
          esac

      # The verdict is the aggregate over every planned instance, the primary
      # language's gate among them. A required instance that is missing,
      # skipped or unfinished makes the aggregate incomplete (exit 6), never
      # pass; no aggregate at all is incomplete too.
      # Toolchain drift is housekeeping (operator decision 2026-11-20: only
      # checks that protect working or secure code block a merge). Each
      # declaration of a Core-owned tool that differs from toolchain-lock.json
      # is a warning at file:line and a line in the summary; it never fails
      # the job. align.py decides what drift is (the report's own status).
      - name: Report toolchain alignment drift (advisory)
        if: always()
        env:
          REPORT: .l9/runtime/toolchain-alignment.json
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
              status = report["status"]
              findings = report["findings"]
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f"::warning::toolchain alignment report unavailable ({error}); drift not reported")
          else:
              drift = [
                  item
                  for item in findings
                  if item.get("class") not in ("exact_match", "range_admits_lock")
              ]
              for item in drift:
                  print(
                      f"::warning file={item.get('path')},line={item.get('line')}::"
                      f"{item.get('tool')} {item.get('declared') or '(no version)'} "
                      f"is not Core's locked {item.get('lock')} ({item.get('class')})"
                  )
              line = f"- Toolchain drift (advisory): `{status}`, {len(drift)} declaration(s)"
              summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if summary:
                  with open(summary, "a", encoding="utf-8") as stream:
                      stream.write(line + "\n")
              print(line)
          PY
      # --- canary record (not part of org-ci.yml) ---
      - name: Record the canary leg
        if: always()
        env:
          SIDE: head
          DIGEST: 87fdaef7f40732e3fbb981c8c3b4d46baaba14572c95c1c6c3b8561d1e116334
          JOB_STATUS: ${{ job.status }}
          AGGREGATE_STATUS: ""
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status }}
          # org-ci.yml's own checks beside analyze (Biome): job=result pairs.
          INDEPENDENT: "gitleaks=${{ steps.gitleaks__result.outputs.result }},pip-audit=${{ steps.pip-audit__result.outputs.result }},npm-audit=${{ steps.npm-audit__result.outputs.result }},codeql=${{ steps.codeql__result.outputs.result }},actionlint=${{ steps.actionlint__result.outputs.result }},biome=${{ steps.biome__result.outputs.result }}"
          MATRIX_ID: canary-head-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/promotion-canary"
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          blocking = set()
          runtime = Path(".l9/runtime", env["MATRIX_ID"])
          for path in sorted(runtime.rglob("gate-result.json")):
              try:
                  result = json.loads(path.read_text(encoding="utf-8"))
                  blocking.update(result["blocking_finding_ids"])
              except (OSError, ValueError, KeyError, TypeError):
                  pass
          verify = env.get("REPOSITORY_VERIFY", "")
          aggregate = env.get("AGGREGATE_STATUS", "")
          if env["JOB_STATUS"] == "cancelled":
              # Superseded by a newer run, or over the leg's time limit.
              status = "cancelled"
          elif aggregate == "incomplete":
              # Before the job status: an advisory (nightly) scan that could
              # not conclude ends its job green.
              status = "incomplete"
          elif env["JOB_STATUS"] == "success" and aggregate == "fail":
              # An advisory run whose findings did not fail the job.
              status = "findings"
          elif env["JOB_STATUS"] == "success":
              status = "pass"
          elif verify not in ("", "pass", "not_applicable"):
              status = "verification"
          elif aggregate == "fail":
              status = "findings"
          elif aggregate == "pass" and verify in ("pass", "not_applicable"):
              # Verified and analysed, then a later gate step failed.
              status = "enforcement"
          else:
              # The job failed before any verdict: infrastructure, not the
              # repository.
              status = "error"
          independent = dict(
              item.split("=", 1) for item in env.get("INDEPENDENT", "").split(",") if "=" in item
          )
          if any(result == "cancelled" for result in independent.values()):
              status = "cancelled"
          elif status == "pass" and any(r != "success" for r in independent.values()):
              # A check of its own (Biome) failed while analyze passed.
              status = "checks"
          record = {
              "schema": "l9.promotion-canary-leg/v2",
              "side": env["SIDE"],
              "digest": env["DIGEST"],
              "repository": env["REPOSITORY"],
              "revision": env["REVISION"],
              "status": status,
              "job_status": env["JOB_STATUS"],
              "aggregate": aggregate,
              "repository_verification": verify,
              "independent_checks": independent,
              "blocking_finding_ids": sorted(blocking),
          }
          name = env["SIDE"] + "-" + env["SLUG"] + ".json"
          path = Path(env["RUNNER_TEMP"], "promotion-canary", name)
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record))
          PY

      - name: Upload the canary leg record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-canary-head-${{ matrix.slug }}
          path: ${{ runner.temp }}/promotion-canary/head-${{ matrix.slug }}.json
          # A leg that cannot write its record fails its job, and the verdict
          # then finds no record and blocks.
          if-no-files-found: error
          retention-days: 14

  scan:
    name: Canary ${{ matrix.repository }} (nightly scan)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: runtime
        name: Resolve central runtime class
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_EVENT: nightly
          INPUT_PROFILE: ""
          INPUT_MATRIX_ID: canary-scan-${{ matrix.slug }}
          INPUT_SDK_REVISION: ""
          INPUT_SEMGREP_VERSION: "1.186.0"
          INPUT_RETENTION: "14"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          gh_event = os.environ["GH_EVENT"]
          requested_event = os.environ.get("INPUT_EVENT", "").strip()
          requested_profile = os.environ.get("INPUT_PROFILE", "").strip()

          allowed = {"pull_request", "push", "merge", "nightly", "release", "supply_chain"}
          fixed = {"pull_request": "pr_fast", "push": "merge", "merge": "merge"}
          native = {
              "pull_request": ("pull_request", "pr_fast"),
              "merge_group": ("merge", "merge"),
              "push": ("push", "merge"),
          }

          if gh_event == "workflow_dispatch":
              event_class = requested_event or "nightly"
              profile = requested_profile or event_class
          elif requested_event:
              # Reusable workflows retain the caller's event_name, so the
              # required event input—not `workflow_call`—identifies this path.
              event_class = requested_event
              if event_class not in allowed:
                  raise SystemExit(f"unsupported event class: {event_class}")
              expected_profile = fixed.get(event_class, event_class)
              profile = requested_profile or expected_profile
              if profile != expected_profile:
                  raise SystemExit(
                      "reusable profile claim "
                      f"{profile!r} does not match event {event_class!r}; "
                      f"expected {expected_profile!r}"
                  )
          elif gh_event in native:
              event_class, profile = native[gh_event]
          elif gh_event == "workflow_call":
              raise SystemExit("workflow_call requires event")
          else:
              raise SystemExit(f"unsupported trigger: {gh_event}")

          if event_class not in allowed:
              raise SystemExit(f"unsupported event class: {event_class}")
          matrix_id = os.environ.get("INPUT_MATRIX_ID", "org-semgrep")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", matrix_id):
              raise SystemExit("invalid matrix-id")
          sdk_revision = os.environ.get("INPUT_SDK_REVISION", "").strip()
          if sdk_revision and not re.fullmatch(r"[0-9a-f]{40}", sdk_revision):
              raise SystemExit("sdk-revision must be a full 40-character lowercase SHA")
          semgrep_version = os.environ.get("INPUT_SEMGREP_VERSION", "1.186.0").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", semgrep_version):
              raise SystemExit("semgrep-version must be an exact x.y.z version")
          retention = int(os.environ.get("INPUT_RETENTION", "14"))
          if not 1 <= retention <= 90:
              raise SystemExit("artifact-retention-days must be between 1 and 90")

          outputs = {
              "event-class": event_class,
              "profile": profile,
              "matrix-id": matrix_id,
              "sdk-revision": sdk_revision,
              "semgrep-version": semgrep_version,
              "artifact-retention-days": str(retention),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          # Depth 2: a pull_request / merge_group revision is a merge commit,
          # and its base parent is what a consumer's merge-base check needs
          # once origin is reset to an anonymous URL below.
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - id: consumer
        name: Resolve optional consumer metadata
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-consumer-metadata@2ee1720b9863bec15fdfebac13b220aeb699d781

      - id: gov
        name: Resolve central governance
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          profile: ${{ steps.runtime.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.runtime.outputs['event-class'] }}
          repository: ${{ matrix.repository }}
          ref: refs/heads/${{ matrix.branch }}
          product-kind: ${{ steps.consumer.outputs['product-kind'] }}

      - name: Validate consumer waiver pointers
        env:
          REQUESTED: ${{ steps.consumer.outputs['waiver-refs'] }}
          APPLICABLE: ${{ steps.gov.outputs['waiver-ids'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          requested = {item for item in os.environ.get("REQUESTED", "").split(",") if item}
          applicable = {item for item in os.environ.get("APPLICABLE", "").split(",") if item}
          unknown = sorted(requested - applicable)
          if unknown:
              raise SystemExit(f"consumer waiver_refs are not centrally applicable: {unknown}")
          PY

      - id: names
        name: Resolve artifact name
        env:
          MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - id: sdk
        name: Provision immutable SDK
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ steps.runtime.outputs['sdk-revision'] || '4a887396990a59ffb4a7108790b2fa1005c7865d' }}
          # AGENTS.md §27: l9-ci-sdk is private. Read-only org secret; the
          # action passes it to git only as a per-command header.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      - id: language
        name: Detect repository language (SDK)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN — detect-language (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/detect-language@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          repo-class: ${{ steps.consumer.outputs['repo-class'] }}
          root: .

      # L9-CI-CORE-003: every applicable provider/language instance is planned,
      # run and accounted for, so a second language is never silently dropped
      # in favour of the detected one. The SDK states the facts (capability
      # inventory of this exact snapshot, taken before repository verification
      # can touch the tree); requiredness is Core's (plan-required-instances).
      - id: inventory
        name: Inventory repository capabilities (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          directory=".l9/runtime/${L9_MATRIX_ID}/required-instances"
          mkdir -p "${directory}"
          "${L9_EXECUTABLE}" providers inventory --root . --format json \
            --consumer-rules --output "${directory}/inventory.json"
          echo "path=${directory}/inventory.json" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Plan required instances (Core)
        if: steps.inventory.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/plan-required-instances@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          inventory: ${{ steps.inventory.outputs.path }}
          repository: ${{ matrix.repository }}
          revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          required-providers: ${{ steps.gov.outputs['required-provider'] == 'true' && 'semgrep' || '' }}
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json

      # The provider toolchain is a locked contract, not a resolution. Core
      # selects the setup-python action by full SHA, the interpreter by exact
      # version (major.minor.patch, so a patch release cannot float in), the
      # Semgrep version exactly, and the Semgrep dependency closure by digest
      # inside the pinned Core action. Those selections change only with a
      # Core revision; the hosted runner image underneath them is GitHub's,
      # not Core's (workflow audit 2026-09-13, F-005). The SDK venv provisioned
      # above is untouched; only the provider install rides this interpreter.
      - name: Set up locked Python for the central toolchain
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - id: semgrep
        name: Install Semgrep (hash-locked central pin)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN — verified executable is handed to the SDK provider run.
        uses: Quantum-L9/l9-ci-core/.github/actions/install-semgrep@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          semgrep-version: ${{ steps.runtime.outputs['semgrep-version'] }}

      - name: Run + normalize Semgrep (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-run
          language: ${{ steps.language.outputs.language }}
          raw-output: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          # A clean checkout of the evaluated revision: nothing ran in it.
          root: .
          snapshot-id: ${{ matrix.revision }}
          revision: ${{ matrix.revision }}
          provider-executable: ${{ steps.semgrep.outputs.executable }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs['required-provider'] }}
          policy: ${{ steps.gov.outputs['sdk-policy'] }}
          waivers: ${{ steps.gov.outputs['finding-waivers'] }}
          waiver-repository: ${{ matrix.repository }}
          # The Core-staged identity map for the detected language. Without it
          # a strict profile (`release`) cannot resolve third-party rule
          # identities and `semgrep run --strict` refuses the run outright.
          identity-map: ${{ steps.gov.outputs['identity-map-directory'] }}/${{ steps.language.outputs.language }}.yaml

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json

      - id: gate
        name: Evaluate SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
        run: |
          set -euo pipefail
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *) echo "gate evaluate failed with unexpected exit ${exit_code}" >&2; exit "${exit_code}" ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK technical gate: ${status} (exit ${exit_code})"

      - id: instances
        name: Run every planned instance (SDK)
        if: steps.plan.outcome == 'success'
        env:
          L9_INSTANCE_DIR: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances
          L9_SCAN_ROOT: .
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_PROVIDER_EXECUTABLE: ${{ steps.semgrep.outputs.executable }}
          L9_PRIMARY_LANGUAGE: ${{ steps.language.outputs.language }}
          L9_PRIMARY_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
          L9_REQUIRED: ${{ steps.gov.outputs['required-provider'] }}
          L9_POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          L9_IDENTITY_DIR: ${{ steps.gov.outputs['identity-map-directory'] }}
          L9_WAIVERS: ${{ steps.gov.outputs['finding-waivers'] }}
          L9_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # One record per planned semgrep instance (l9.core-instance-result/v1). The
          # primary language already ran through the full pipeline above, so its gate
          # status is reused; every other planned language runs the SDK now. An instance
          # that cannot conclude gets no record, so the aggregate reports it incomplete,
          # and an SDK execution error (run, bundle validation, or a gate exit outside
          # 0/1/6) fails this step in every mode, exactly as it does for the primary
          # language's own steps: infrastructure failure is never advisory.
          env = os.environ
          # Every path the SDK receives is absolute: the SDK runs Semgrep in
          # the scan root, which need not be the working directory, so a
          # relative output, policy or identity-map path would resolve under
          # the scan root and Semgrep would write no report there.
          directory = Path(env["L9_INSTANCE_DIR"]).resolve()
          # Every instance scans the clean checkout of the evaluated revision.
          scan_root = env.get("L9_SCAN_ROOT", "")
          if not scan_root:
              sys.exit("::error::no scan root: the instances cannot run")
          scan_root = str(Path(scan_root).resolve())
          plan = json.loads((directory / "plan.json").read_text(encoding="utf-8"))
          results = directory / "results"
          results.mkdir(parents=True, exist_ok=True)
          executable = env["L9_EXECUTABLE"]
          provider_dir = str(Path(env["L9_PROVIDER_EXECUTABLE"]).parent)
          run_env = dict(env, PATH=provider_dir + os.pathsep + env.get("PATH", ""))
          gate_status = {0: "pass", 1: "fail", 6: "incomplete"}
          errors = []


          def record(target, status):
              body = {
                  "schema": "l9.core-instance-result/v1",
                  "repository": plan["repository"],
                  "provider": "semgrep",
                  "target": target,
                  "revision": plan["revision"],
                  "sdk_revision": plan["sdk_revision"],
                  "status": status,
              }
              kind, _, name = target.partition(":")
              stem = name if kind == "language" else kind + "-" + name
              path = results / ("semgrep-" + stem + ".json")
              path.write_text(json.dumps(body, indent=2) + "\n", encoding="utf-8")
              print("instance semgrep:" + target + ": " + status)


          def sdk(*args):
              return subprocess.run([executable, *args], env=run_env, check=False).returncode


          def shared(command):
              """The flags every instance run shares with the primary run."""
              command += ["--policy", str(Path(env["L9_POLICY"]).resolve())]
              if env.get("L9_WAIVERS"):
                  command += ["--waivers", env["L9_WAIVERS"], "--repository", env["L9_REPOSITORY"]]
              if env.get("L9_STRICT") == "true":
                  command.append("--strict")
              if env.get("L9_REQUIRED") == "true":
                  command.append("--required")
              return command


          def conclude(target, work, run):
              """Run, validate and gate one instance; record it or note the error."""
              bundle = str(work / "finding-bundle.json")
              work.mkdir(parents=True, exist_ok=True)
              code = sdk(*run, "--output", bundle)
              if code == 0:
                  code = sdk("bundle", "validate", bundle)
              if code != 0:
                  errors.append("instance semgrep:" + target + ": SDK run failed (exit " + str(code) + ")")
                  return
              gate = ["gate", "evaluate", "--bundle", bundle, "--output", str(work / "gate-result.json")]
              gate.append("--strict-unresolved" if env.get("L9_STRICT") == "true" else "--no-strict-unresolved")
              code = sdk(*gate)
              if code in gate_status:
                  record(target, gate_status[code])
              else:
                  errors.append("instance semgrep:" + target + ": gate exited " + str(code))


          for instance in plan["instances"]:
              if instance["provider"] != "semgrep" or instance["prerequisite"] != "applicable":
                  continue
              target = instance["target"]
              kind, _, name = target.partition(":")
              if kind == "consumer":
                  # The repository's declared consumer rulepack (SDK ADR 0021):
                  # its own execution and bundle; central evidence is untouched.
                  run = ["semgrep", "consumer-run", "--root", scan_root,
                         "--snapshot-id", plan["revision"], "--revision", plan["revision"]]
                  conclude(target, directory / ("consumer-" + name), shared(run))
                  continue
              if kind != "language" or name not in ("python", "typescript"):
                  continue
              if name == env.get("L9_PRIMARY_LANGUAGE"):
                  primary = env.get("L9_PRIMARY_STATUS", "")
                  if primary in ("pass", "fail", "incomplete"):
                      record(target, primary)
                  else:
                      print("instance semgrep:" + target + ": no primary gate status", file=sys.stderr)
                  continue
              run = [
                  "semgrep", "run", "--language", name,
                  "--root", scan_root, "--snapshot-id", plan["revision"],
                  "--revision", plan["revision"],
                  "--identity-map", str(Path(env["L9_IDENTITY_DIR"]).resolve() / (name + ".yaml")),
              ]
              shared(run)
              conclude(target, directory / name, run)

          for error in errors:
              print("::error::" + error, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

      - id: aggregate
        name: Aggregate required instances (Core)
        if: always() && steps.plan.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/aggregate-required-instances@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          plan: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json
          results-directory: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/results
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/aggregate.json

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - name: Project SARIF (SDK-owned)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-sarif
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          raw-report: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          sarif: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          destination-root: artifacts

      - name: Stage technical gate result
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"
          cp .l9/runtime/capabilities.json "artifacts/l9/${L9_MATRIX_ID}/repository-capabilities.json"

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          artifact-root: artifacts
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          routing-record: ${{ steps.route.outputs['routing-record'] }}
          output: artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/artifact-index.json

      - id: upload
        name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/l9/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/
          if-no-files-found: error
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      # Every planned instance's own bundle beside the central artifact set
      # (SDK ADR 0021, Core change 2): secondary languages and the declared
      # consumer rulepack, whose bundle names the consumer rule files and the
      # rules evaluated. A separate artifact, so the central set, its manifest
      # and its handoff are unchanged. .l9/runtime is untracked workspace
      # state written by this job only.
      - name: Upload instance bundles
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l9-instance-bundles-${{ steps.runtime.outputs['matrix-id'] }}-${{ github.run_attempt }}
          path: |
            .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      - id: handoff
        name: Create artifact handoff descriptor
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/create-artifact-handoff@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          workflow-head-sha: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          output: .l9/runtime/handoffs/${{ steps.runtime.outputs['matrix-id'] }}.json

      - name: Write central Semgrep summary
        if: always()
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          PROFILE: ${{ steps.runtime.outputs.profile }}
          MODE: ${{ steps.gov.outputs.mode }}
          SDK_REVISION: ${{ steps.sdk.outputs['sdk-revision'] }}
          LANGUAGE: ${{ steps.language.outputs.language }}
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          INSTANCES_STATUS: ${{ steps.aggregate.outputs.status }}
          ARTIFACT_NAME: ${{ steps.names.outputs['artifact-name'] }}
        run: |
          {
            echo "### L9 central Semgrep"
            echo
            echo "- Event: \`${EVENT_CLASS:-unknown}\`"
            echo "- Profile: \`${PROFILE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- SDK revision: \`${SDK_REVISION:-unknown}\`"
            echo "- Detected language: \`${LANGUAGE:-unknown}\`"
            echo "- Technical gate: \`${GATE_STATUS:-unavailable}\`"
            echo "- Required instances: \`${INSTANCES_STATUS:-unavailable}\`"
            echo "- Artifact set: \`${ARTIFACT_NAME:-unavailable}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce central mode on SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          AGGREGATE_EXIT: ${{ steps.aggregate.outputs['exit-code'] }}
          ACCOUNTED: ${{ steps.aggregate.outputs.accounted }}
          MODE: ${{ steps.gov.outputs.mode }}
        run: |
          set -euo pipefail
          status="${AGGREGATE_STATUS:-incomplete}"
          exit_code="${AGGREGATE_EXIT:-6}"
          echo "SDK technical gate (primary language): ${GATE_STATUS:-unavailable}"
          echo "Required instances: ${status} (exit ${exit_code}; accounted ${ACCOUNTED:-false}); central mode: ${MODE}"
          if [ "${status}" != "pass" ] && [ "${MODE}" = "blocking" ]; then
            echo "Blocking mode: failing job on required instances '${status}'" >&2
            exit "${exit_code}"
          fi
      # --- canary record (not part of org-ci.yml) ---
      - name: Record the canary leg
        if: always()
        env:
          SIDE: scan
          DIGEST: 87fdaef7f40732e3fbb981c8c3b4d46baaba14572c95c1c6c3b8561d1e116334
          JOB_STATUS: ${{ job.status }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPOSITORY_VERIFY: ""
          # org-ci.yml's own checks beside analyze (Biome): job=result pairs.
          INDEPENDENT: ""
          MATRIX_ID: canary-scan-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/promotion-canary"
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          blocking = set()
          runtime = Path(".l9/runtime", env["MATRIX_ID"])
          for path in sorted(runtime.rglob("gate-result.json")):
              try:
                  result = json.loads(path.read_text(encoding="utf-8"))
                  blocking.update(result["blocking_finding_ids"])
              except (OSError, ValueError, KeyError, TypeError):
                  pass
          verify = env.get("REPOSITORY_VERIFY", "")
          aggregate = env.get("AGGREGATE_STATUS", "")
          if env["JOB_STATUS"] == "cancelled":
              # Superseded by a newer run, or over the leg's time limit.
              status = "cancelled"
          elif aggregate == "incomplete":
              # Before the job status: an advisory (nightly) scan that could
              # not conclude ends its job green.
              status = "incomplete"
          elif env["JOB_STATUS"] == "success" and aggregate == "fail":
              # An advisory run whose findings did not fail the job.
              status = "findings"
          elif env["JOB_STATUS"] == "success":
              status = "pass"
          elif verify not in ("", "pass", "not_applicable"):
              status = "verification"
          elif aggregate == "fail":
              status = "findings"
          elif aggregate == "pass" and verify in ("pass", "not_applicable"):
              # Verified and analysed, then a later gate step failed.
              status = "enforcement"
          else:
              # The job failed before any verdict: infrastructure, not the
              # repository.
              status = "error"
          independent = dict(
              item.split("=", 1) for item in env.get("INDEPENDENT", "").split(",") if "=" in item
          )
          if any(result == "cancelled" for result in independent.values()):
              status = "cancelled"
          elif status == "pass" and any(r != "success" for r in independent.values()):
              # A check of its own (Biome) failed while analyze passed.
              status = "checks"
          record = {
              "schema": "l9.promotion-canary-leg/v2",
              "side": env["SIDE"],
              "digest": env["DIGEST"],
              "repository": env["REPOSITORY"],
              "revision": env["REVISION"],
              "status": status,
              "job_status": env["JOB_STATUS"],
              "aggregate": aggregate,
              "repository_verification": verify,
              "independent_checks": independent,
              "blocking_finding_ids": sorted(blocking),
          }
          name = env["SIDE"] + "-" + env["SLUG"] + ".json"
          path = Path(env["RUNNER_TEMP"], "promotion-canary", name)
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record))
          PY

      - name: Upload the canary leg record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-canary-scan-${{ matrix.slug }}
          path: ${{ runner.temp }}/promotion-canary/scan-${{ matrix.slug }}.json
          # A leg that cannot write its record fails its job, and the verdict
          # then finds no record and blocks.
          if-no-files-found: error
          retention-days: 14

  admitted:
    name: Canary ${{ matrix.repository }} (admitted SDK, nightly scan)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs['head-current'] == 'true' && needs.plan.outputs.admitted != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: runtime
        name: Resolve central runtime class
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_EVENT: nightly
          INPUT_PROFILE: ""
          INPUT_MATRIX_ID: canary-admitted-${{ matrix.slug }}
          INPUT_SDK_REVISION: ""
          INPUT_SEMGREP_VERSION: "1.186.0"
          INPUT_RETENTION: "14"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          gh_event = os.environ["GH_EVENT"]
          requested_event = os.environ.get("INPUT_EVENT", "").strip()
          requested_profile = os.environ.get("INPUT_PROFILE", "").strip()

          allowed = {"pull_request", "push", "merge", "nightly", "release", "supply_chain"}
          fixed = {"pull_request": "pr_fast", "push": "merge", "merge": "merge"}
          native = {
              "pull_request": ("pull_request", "pr_fast"),
              "merge_group": ("merge", "merge"),
              "push": ("push", "merge"),
          }

          if gh_event == "workflow_dispatch":
              event_class = requested_event or "nightly"
              profile = requested_profile or event_class
          elif requested_event:
              # Reusable workflows retain the caller's event_name, so the
              # required event input—not `workflow_call`—identifies this path.
              event_class = requested_event
              if event_class not in allowed:
                  raise SystemExit(f"unsupported event class: {event_class}")
              expected_profile = fixed.get(event_class, event_class)
              profile = requested_profile or expected_profile
              if profile != expected_profile:
                  raise SystemExit(
                      "reusable profile claim "
                      f"{profile!r} does not match event {event_class!r}; "
                      f"expected {expected_profile!r}"
                  )
          elif gh_event in native:
              event_class, profile = native[gh_event]
          elif gh_event == "workflow_call":
              raise SystemExit("workflow_call requires event")
          else:
              raise SystemExit(f"unsupported trigger: {gh_event}")

          if event_class not in allowed:
              raise SystemExit(f"unsupported event class: {event_class}")
          matrix_id = os.environ.get("INPUT_MATRIX_ID", "org-semgrep")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", matrix_id):
              raise SystemExit("invalid matrix-id")
          sdk_revision = os.environ.get("INPUT_SDK_REVISION", "").strip()
          if sdk_revision and not re.fullmatch(r"[0-9a-f]{40}", sdk_revision):
              raise SystemExit("sdk-revision must be a full 40-character lowercase SHA")
          semgrep_version = os.environ.get("INPUT_SEMGREP_VERSION", "1.186.0").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", semgrep_version):
              raise SystemExit("semgrep-version must be an exact x.y.z version")
          retention = int(os.environ.get("INPUT_RETENTION", "14"))
          if not 1 <= retention <= 90:
              raise SystemExit("artifact-retention-days must be between 1 and 90")

          outputs = {
              "event-class": event_class,
              "profile": profile,
              "matrix-id": matrix_id,
              "sdk-revision": sdk_revision,
              "semgrep-version": semgrep_version,
              "artifact-retention-days": str(retention),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          # Depth 2: a pull_request / merge_group revision is a merge commit,
          # and its base parent is what a consumer's merge-base check needs
          # once origin is reset to an anonymous URL below.
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - id: consumer
        name: Resolve optional consumer metadata
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-consumer-metadata@2ee1720b9863bec15fdfebac13b220aeb699d781

      - id: gov
        name: Resolve central governance
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          profile: ${{ steps.runtime.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.runtime.outputs['event-class'] }}
          repository: ${{ matrix.repository }}
          ref: refs/heads/${{ matrix.branch }}
          product-kind: ${{ steps.consumer.outputs['product-kind'] }}

      - name: Validate consumer waiver pointers
        env:
          REQUESTED: ${{ steps.consumer.outputs['waiver-refs'] }}
          APPLICABLE: ${{ steps.gov.outputs['waiver-ids'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          requested = {item for item in os.environ.get("REQUESTED", "").split(",") if item}
          applicable = {item for item in os.environ.get("APPLICABLE", "").split(",") if item}
          unknown = sorted(requested - applicable)
          if unknown:
              raise SystemExit(f"consumer waiver_refs are not centrally applicable: {unknown}")
          PY

      - id: names
        name: Resolve artifact name
        env:
          MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # --- admitted SDK revision: provision-sdk from the pull request ---
      - name: Download the pull request's SDK provisioner
        if: steps.gov.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: canary-admitted-core
          path: ${{ runner.temp }}/canary-admitted-core
      - name: Select locked SDK runtime Python
        if: steps.gov.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - id: sdk
        if: steps.gov.outputs.enabled == 'true'
        shell: bash
        env:
          INPUT_SDK_SOURCE: git
          INPUT_SDK_REPOSITORY: https://github.com/Quantum-L9/l9-ci-sdk.git
          INPUT_SDK_REVISION: ${{ needs.plan.outputs.admitted }}
          INPUT_RUNTIME_DIRECTORY: .l9/runtime/sdk
          INPUT_GITHUB_READ_TOKEN: ${{ secrets.L9_GITHUB_READ_TOKEN }}
        run: python3 "${{ runner.temp }}/canary-admitted-core/.github/actions/provision-sdk/provision.py"

      - id: language
        name: Detect repository language (SDK)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN — detect-language (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/detect-language@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          repo-class: ${{ steps.consumer.outputs['repo-class'] }}
          root: .

      # L9-CI-CORE-003: every applicable provider/language instance is planned,
      # run and accounted for, so a second language is never silently dropped
      # in favour of the detected one. The SDK states the facts (capability
      # inventory of this exact snapshot, taken before repository verification
      # can touch the tree); requiredness is Core's (plan-required-instances).
      - id: inventory
        name: Inventory repository capabilities (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          directory=".l9/runtime/${L9_MATRIX_ID}/required-instances"
          mkdir -p "${directory}"
          "${L9_EXECUTABLE}" providers inventory --root . --format json \
            --consumer-rules --output "${directory}/inventory.json"
          echo "path=${directory}/inventory.json" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Plan required instances (Core)
        if: steps.inventory.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/plan-required-instances@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          inventory: ${{ steps.inventory.outputs.path }}
          repository: ${{ matrix.repository }}
          revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          required-providers: ${{ steps.gov.outputs['required-provider'] == 'true' && 'semgrep' || '' }}
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json

      # The provider toolchain is a locked contract, not a resolution. Core
      # selects the setup-python action by full SHA, the interpreter by exact
      # version (major.minor.patch, so a patch release cannot float in), the
      # Semgrep version exactly, and the Semgrep dependency closure by digest
      # inside the pinned Core action. Those selections change only with a
      # Core revision; the hosted runner image underneath them is GitHub's,
      # not Core's (workflow audit 2026-09-13, F-005). The SDK venv provisioned
      # above is untouched; only the provider install rides this interpreter.
      - name: Set up locked Python for the central toolchain
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - id: semgrep
        name: Install Semgrep (hash-locked central pin)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN — verified executable is handed to the SDK provider run.
        uses: Quantum-L9/l9-ci-core/.github/actions/install-semgrep@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          semgrep-version: ${{ steps.runtime.outputs['semgrep-version'] }}

      - name: Run + normalize Semgrep (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-run
          language: ${{ steps.language.outputs.language }}
          raw-output: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          # A clean checkout of the evaluated revision: nothing ran in it.
          root: .
          snapshot-id: ${{ matrix.revision }}
          revision: ${{ matrix.revision }}
          provider-executable: ${{ steps.semgrep.outputs.executable }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs['required-provider'] }}
          policy: ${{ steps.gov.outputs['sdk-policy'] }}
          waivers: ${{ steps.gov.outputs['finding-waivers'] }}
          waiver-repository: ${{ matrix.repository }}
          # The Core-staged identity map for the detected language. Without it
          # a strict profile (`release`) cannot resolve third-party rule
          # identities and `semgrep run --strict` refuses the run outright.
          identity-map: ${{ steps.gov.outputs['identity-map-directory'] }}/${{ steps.language.outputs.language }}.yaml

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json

      - id: gate
        name: Evaluate SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
        run: |
          set -euo pipefail
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *) echo "gate evaluate failed with unexpected exit ${exit_code}" >&2; exit "${exit_code}" ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK technical gate: ${status} (exit ${exit_code})"

      - id: instances
        name: Run every planned instance (SDK)
        if: steps.plan.outcome == 'success'
        env:
          L9_INSTANCE_DIR: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances
          L9_SCAN_ROOT: .
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_PROVIDER_EXECUTABLE: ${{ steps.semgrep.outputs.executable }}
          L9_PRIMARY_LANGUAGE: ${{ steps.language.outputs.language }}
          L9_PRIMARY_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
          L9_REQUIRED: ${{ steps.gov.outputs['required-provider'] }}
          L9_POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          L9_IDENTITY_DIR: ${{ steps.gov.outputs['identity-map-directory'] }}
          L9_WAIVERS: ${{ steps.gov.outputs['finding-waivers'] }}
          L9_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # One record per planned semgrep instance (l9.core-instance-result/v1). The
          # primary language already ran through the full pipeline above, so its gate
          # status is reused; every other planned language runs the SDK now. An instance
          # that cannot conclude gets no record, so the aggregate reports it incomplete,
          # and an SDK execution error (run, bundle validation, or a gate exit outside
          # 0/1/6) fails this step in every mode, exactly as it does for the primary
          # language's own steps: infrastructure failure is never advisory.
          env = os.environ
          # Every path the SDK receives is absolute: the SDK runs Semgrep in
          # the scan root, which need not be the working directory, so a
          # relative output, policy or identity-map path would resolve under
          # the scan root and Semgrep would write no report there.
          directory = Path(env["L9_INSTANCE_DIR"]).resolve()
          # Every instance scans the clean checkout of the evaluated revision.
          scan_root = env.get("L9_SCAN_ROOT", "")
          if not scan_root:
              sys.exit("::error::no scan root: the instances cannot run")
          scan_root = str(Path(scan_root).resolve())
          plan = json.loads((directory / "plan.json").read_text(encoding="utf-8"))
          results = directory / "results"
          results.mkdir(parents=True, exist_ok=True)
          executable = env["L9_EXECUTABLE"]
          provider_dir = str(Path(env["L9_PROVIDER_EXECUTABLE"]).parent)
          run_env = dict(env, PATH=provider_dir + os.pathsep + env.get("PATH", ""))
          gate_status = {0: "pass", 1: "fail", 6: "incomplete"}
          errors = []


          def record(target, status):
              body = {
                  "schema": "l9.core-instance-result/v1",
                  "repository": plan["repository"],
                  "provider": "semgrep",
                  "target": target,
                  "revision": plan["revision"],
                  "sdk_revision": plan["sdk_revision"],
                  "status": status,
              }
              kind, _, name = target.partition(":")
              stem = name if kind == "language" else kind + "-" + name
              path = results / ("semgrep-" + stem + ".json")
              path.write_text(json.dumps(body, indent=2) + "\n", encoding="utf-8")
              print("instance semgrep:" + target + ": " + status)


          def sdk(*args):
              return subprocess.run([executable, *args], env=run_env, check=False).returncode


          def shared(command):
              """The flags every instance run shares with the primary run."""
              command += ["--policy", str(Path(env["L9_POLICY"]).resolve())]
              if env.get("L9_WAIVERS"):
                  command += ["--waivers", env["L9_WAIVERS"], "--repository", env["L9_REPOSITORY"]]
              if env.get("L9_STRICT") == "true":
                  command.append("--strict")
              if env.get("L9_REQUIRED") == "true":
                  command.append("--required")
              return command


          def conclude(target, work, run):
              """Run, validate and gate one instance; record it or note the error."""
              bundle = str(work / "finding-bundle.json")
              work.mkdir(parents=True, exist_ok=True)
              code = sdk(*run, "--output", bundle)
              if code == 0:
                  code = sdk("bundle", "validate", bundle)
              if code != 0:
                  errors.append("instance semgrep:" + target + ": SDK run failed (exit " + str(code) + ")")
                  return
              gate = ["gate", "evaluate", "--bundle", bundle, "--output", str(work / "gate-result.json")]
              gate.append("--strict-unresolved" if env.get("L9_STRICT") == "true" else "--no-strict-unresolved")
              code = sdk(*gate)
              if code in gate_status:
                  record(target, gate_status[code])
              else:
                  errors.append("instance semgrep:" + target + ": gate exited " + str(code))


          for instance in plan["instances"]:
              if instance["provider"] != "semgrep" or instance["prerequisite"] != "applicable":
                  continue
              target = instance["target"]
              kind, _, name = target.partition(":")
              if kind == "consumer":
                  # The repository's declared consumer rulepack (SDK ADR 0021):
                  # its own execution and bundle; central evidence is untouched.
                  run = ["semgrep", "consumer-run", "--root", scan_root,
                         "--snapshot-id", plan["revision"], "--revision", plan["revision"]]
                  conclude(target, directory / ("consumer-" + name), shared(run))
                  continue
              if kind != "language" or name not in ("python", "typescript"):
                  continue
              if name == env.get("L9_PRIMARY_LANGUAGE"):
                  primary = env.get("L9_PRIMARY_STATUS", "")
                  if primary in ("pass", "fail", "incomplete"):
                      record(target, primary)
                  else:
                      print("instance semgrep:" + target + ": no primary gate status", file=sys.stderr)
                  continue
              run = [
                  "semgrep", "run", "--language", name,
                  "--root", scan_root, "--snapshot-id", plan["revision"],
                  "--revision", plan["revision"],
                  "--identity-map", str(Path(env["L9_IDENTITY_DIR"]).resolve() / (name + ".yaml")),
              ]
              shared(run)
              conclude(target, directory / name, run)

          for error in errors:
              print("::error::" + error, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

      - id: aggregate
        name: Aggregate required instances (Core)
        if: always() && steps.plan.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/aggregate-required-instances@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          plan: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json
          results-directory: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/results
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/aggregate.json

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - name: Project SARIF (SDK-owned)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-sarif
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          raw-report: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          sarif: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          destination-root: artifacts

      - name: Stage technical gate result
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"
          cp .l9/runtime/capabilities.json "artifacts/l9/${L9_MATRIX_ID}/repository-capabilities.json"

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          artifact-root: artifacts
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          routing-record: ${{ steps.route.outputs['routing-record'] }}
          output: artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/artifact-index.json

      - id: upload
        name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/l9/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/
          if-no-files-found: error
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      # Every planned instance's own bundle beside the central artifact set
      # (SDK ADR 0021, Core change 2): secondary languages and the declared
      # consumer rulepack, whose bundle names the consumer rule files and the
      # rules evaluated. A separate artifact, so the central set, its manifest
      # and its handoff are unchanged. .l9/runtime is untracked workspace
      # state written by this job only.
      - name: Upload instance bundles
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l9-instance-bundles-${{ steps.runtime.outputs['matrix-id'] }}-${{ github.run_attempt }}
          path: |
            .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      - id: handoff
        name: Create artifact handoff descriptor
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/create-artifact-handoff@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          repository: ${{ matrix.repository }}
          repository-revision: ${{ matrix.revision }}
          workflow-head-sha: ${{ matrix.revision }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          output: .l9/runtime/handoffs/${{ steps.runtime.outputs['matrix-id'] }}.json

      - name: Write central Semgrep summary
        if: always()
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          PROFILE: ${{ steps.runtime.outputs.profile }}
          MODE: ${{ steps.gov.outputs.mode }}
          SDK_REVISION: ${{ steps.sdk.outputs['sdk-revision'] }}
          LANGUAGE: ${{ steps.language.outputs.language }}
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          INSTANCES_STATUS: ${{ steps.aggregate.outputs.status }}
          ARTIFACT_NAME: ${{ steps.names.outputs['artifact-name'] }}
        run: |
          {
            echo "### L9 central Semgrep"
            echo
            echo "- Event: \`${EVENT_CLASS:-unknown}\`"
            echo "- Profile: \`${PROFILE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- SDK revision: \`${SDK_REVISION:-unknown}\`"
            echo "- Detected language: \`${LANGUAGE:-unknown}\`"
            echo "- Technical gate: \`${GATE_STATUS:-unavailable}\`"
            echo "- Required instances: \`${INSTANCES_STATUS:-unavailable}\`"
            echo "- Artifact set: \`${ARTIFACT_NAME:-unavailable}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce central mode on SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          AGGREGATE_EXIT: ${{ steps.aggregate.outputs['exit-code'] }}
          ACCOUNTED: ${{ steps.aggregate.outputs.accounted }}
          MODE: ${{ steps.gov.outputs.mode }}
        run: |
          set -euo pipefail
          status="${AGGREGATE_STATUS:-incomplete}"
          exit_code="${AGGREGATE_EXIT:-6}"
          echo "SDK technical gate (primary language): ${GATE_STATUS:-unavailable}"
          echo "Required instances: ${status} (exit ${exit_code}; accounted ${ACCOUNTED:-false}); central mode: ${MODE}"
          if [ "${status}" != "pass" ] && [ "${MODE}" = "blocking" ]; then
            echo "Blocking mode: failing job on required instances '${status}'" >&2
            exit "${exit_code}"
          fi
      # --- canary record (not part of org-ci.yml) ---
      - name: Record the canary leg
        if: always()
        env:
          SIDE: admitted
          DIGEST: 87fdaef7f40732e3fbb981c8c3b4d46baaba14572c95c1c6c3b8561d1e116334
          JOB_STATUS: ${{ job.status }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPOSITORY_VERIFY: ""
          # org-ci.yml's own checks beside analyze (Biome): job=result pairs.
          INDEPENDENT: ""
          MATRIX_ID: canary-admitted-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/promotion-canary"
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          blocking = set()
          runtime = Path(".l9/runtime", env["MATRIX_ID"])
          for path in sorted(runtime.rglob("gate-result.json")):
              try:
                  result = json.loads(path.read_text(encoding="utf-8"))
                  blocking.update(result["blocking_finding_ids"])
              except (OSError, ValueError, KeyError, TypeError):
                  pass
          verify = env.get("REPOSITORY_VERIFY", "")
          aggregate = env.get("AGGREGATE_STATUS", "")
          if env["JOB_STATUS"] == "cancelled":
              # Superseded by a newer run, or over the leg's time limit.
              status = "cancelled"
          elif aggregate == "incomplete":
              # Before the job status: an advisory (nightly) scan that could
              # not conclude ends its job green.
              status = "incomplete"
          elif env["JOB_STATUS"] == "success" and aggregate == "fail":
              # An advisory run whose findings did not fail the job.
              status = "findings"
          elif env["JOB_STATUS"] == "success":
              status = "pass"
          elif verify not in ("", "pass", "not_applicable"):
              status = "verification"
          elif aggregate == "fail":
              status = "findings"
          elif aggregate == "pass" and verify in ("pass", "not_applicable"):
              # Verified and analysed, then a later gate step failed.
              status = "enforcement"
          else:
              # The job failed before any verdict: infrastructure, not the
              # repository.
              status = "error"
          independent = dict(
              item.split("=", 1) for item in env.get("INDEPENDENT", "").split(",") if "=" in item
          )
          if any(result == "cancelled" for result in independent.values()):
              status = "cancelled"
          elif status == "pass" and any(r != "success" for r in independent.values()):
              # A check of its own (Biome) failed while analyze passed.
              status = "checks"
          record = {
              "schema": "l9.promotion-canary-leg/v2",
              "side": env["SIDE"],
              "digest": env["DIGEST"],
              "repository": env["REPOSITORY"],
              "revision": env["REVISION"],
              "status": status,
              "job_status": env["JOB_STATUS"],
              "aggregate": aggregate,
              "repository_verification": verify,
              "independent_checks": independent,
              "blocking_finding_ids": sorted(blocking),
          }
          name = env["SIDE"] + "-" + env["SLUG"] + ".json"
          path = Path(env["RUNNER_TEMP"], "promotion-canary", name)
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record))
          PY

      - name: Upload the canary leg record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-canary-admitted-${{ matrix.slug }}
          path: ${{ runner.temp }}/promotion-canary/admitted-${{ matrix.slug }}.json
          # A leg that cannot write its record fails its job, and the verdict
          # then finds no record and blocks.
          if-no-files-found: error
          retention-days: 14

  # --- base pins leg: begin (rendered from origin/main's org-ci.yml) ---
  base__gitleaks:
    name: Canary ${{ matrix.repository }} gitleaks job (base pins)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job gitleaks org-ci.yml: begin ---
      - name: Checkout (full history)
        id: gitleaks__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        id: gitleaks__gitleaks
        env:
          # Incoming code only: the commits the event adds (base..head for a
          # pull request or merge group, before..after for a push); every other
          # event scans the whole history.
          GITLEAKS_LOG_OPTS: ""
          GITLEAKS_SCOPE: event
          # `git`: the commits in scope. The nightly sink inlines this step
          # with `dir` (the whole tree of the default branch), findings
          # reported rather than failing (`GITLEAKS_FINDINGS_FAIL: "false"`)
          # and written as SARIF to GITLEAKS_SARIF for code scanning.
          GITLEAKS_TARGET: git
          GITLEAKS_FINDINGS_FAIL: "true"
          GITLEAKS_SARIF: ""
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          case "${GITLEAKS_SCOPE:-history}" in
            history) ;;
            event)
              if [ -z "${GITLEAKS_LOG_OPTS}" ]; then
                case "${EVENT_NAME}" in
                  pull_request|pull_request_target) GITLEAKS_LOG_OPTS="${PR_BASE}..${PR_HEAD}" ;;
                  merge_group) GITLEAKS_LOG_OPTS="${MERGE_GROUP_BASE}..${MERGE_GROUP_HEAD}" ;;
                  push)
                    if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                      GITLEAKS_LOG_OPTS="-1 ${EVENT_SHA}"
                    else
                      GITLEAKS_LOG_OPTS="${PUSH_BEFORE}..${EVENT_SHA}"
                    fi
                    ;;
                  *) ;;
                esac
              fi
              ;;
            *)
              echo "::error::gitleaks-scope must be history or event (got '${GITLEAKS_SCOPE}')"
              exit 2
              ;;
          esac
          # Rules: the Core preset (presets/security/.gitleaks.toml) is
          # gitleaks' own default rule set (`[extend] useDefault = true`). A
          # repository's own .gitleaks.toml is honoured on top of it: its rules
          # and allowlists apply, and when it does not already extend the
          # defaults it is made to, so no repository config can drop the Core
          # rules. A repository config that extends another file by `path`
          # cannot also extend the defaults (gitleaks allows one of the two),
          # so it is refused rather than scanned with fewer rules. Reviewed
          # false positives belong in .gitleaksignore, which gitleaks reads
          # from the scanned tree.
          config="${RUNNER_TEMP:-/tmp}/l9-gitleaks.toml"
          config_args=()
          if [ -f ".gitleaks.toml" ]; then
            python3 -I - ".gitleaks.toml" "${config}" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          source, target = Path(sys.argv[1]), Path(sys.argv[2])
          text = source.read_text(encoding="utf-8")
          try:
              extend = tomllib.loads(text).get("extend")
          except tomllib.TOMLDecodeError as error:
              sys.exit(f"::error::.gitleaks.toml is not valid TOML: {error}")
          if extend is None:
              text += (
                  "\n\n# Added by Core security.yml: keep the Core preset rules"
                  " (gitleaks defaults).\n[extend]\nuseDefault = true\n"
              )
          elif not isinstance(extend, dict) or "path" in extend:
              sys.exit(
                  "::error::.gitleaks.toml [extend] names a path; it cannot also"
                  " extend the Core preset rules (gitleaks allows path or"
                  " useDefault, not both). Inline the rules and use"
                  " `useDefault = true`."
              )
          elif extend.get("useDefault") is not True:
              sys.exit(
                  "::error::.gitleaks.toml [extend] must set useDefault = true"
                  " so the Core preset rules apply."
              )
          target.write_text(text, encoding="utf-8")
          PY
            config_args=(--config "${config}")
          fi
          case "${GITLEAKS_TARGET}" in
            git) ;;
            dir) GITLEAKS_LOG_OPTS="" ;;
            *)
              echo "::error::GITLEAKS_TARGET must be git or dir (got '${GITLEAKS_TARGET}')"
              exit 2
              ;;
          esac
          range_args=()
          if [ -n "${GITLEAKS_LOG_OPTS}" ]; then
            # The range must resolve in this clone before gitleaks runs:
            # gitleaks exits 1 both for findings and for a git log error, so an
            # unresolvable range would otherwise read as a failed scan. The
            # options are word-split on purpose; they are git log arguments.
            # shellcheck disable=SC2086
            if ! git log --format=%H ${GITLEAKS_LOG_OPTS} -- > /dev/null; then
              echo "::error::gitleaks range '${GITLEAKS_LOG_OPTS}' does not resolve in this clone; fetch its history"
              exit 2
            fi
            range_args=(--log-opts="${GITLEAKS_LOG_OPTS}")
          fi
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          actual_sha="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Everything above is acquisition. A failure there ends the step with
          # no outcome, which the report labels not_executed. From here the
          # scanner itself runs and its exit code is the outcome.
          status=0
          report="${RUNNER_TEMP:-/tmp}/gitleaks-report.json"
          /tmp/gitleaks "${GITLEAKS_TARGET}" "${config_args[@]}" "${range_args[@]}" \
            --no-banner --redact --exit-code 1 \
            --report-format json --report-path "${report}" . || status=$?
          case "${status}" in
            0) echo "outcome=executed_pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=executed_fail" >> "$GITHUB_OUTPUT" ;;
            *) echo "outcome=not_executed" >> "$GITHUB_OUTPUT" ;;
          esac
          # Signal law: every finding named by file, line, rule and commit,
          # never by its value (the report is redacted and the secret and
          # match fields are not read).
          scope_text="${GITLEAKS_LOG_OPTS:-the whole history}"
          [ "${GITLEAKS_TARGET}" = dir ] && scope_text="the whole tree"
          SCOPE_TEXT="${scope_text}" STATUS="${status}" REPORT="${report}" \
            python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          env = os.environ
          status = int(env["STATUS"])
          try:
              findings = json.loads(Path(env["REPORT"]).read_text(encoding="utf-8")) or []
          except (OSError, ValueError):
              findings = []
          scope = env["SCOPE_TEXT"]
          label = "nightly, reported" if env.get("GITLEAKS_FINDINGS_FAIL") == "false" else "blocking"
          if status == 0:
              line = f"- gitleaks ({label}): pass: no secret in {scope}"
          elif status == 1:
              line = f"- gitleaks ({label}): findings: {len(findings)} secret(s) in {scope} (values never printed)"
          else:
              line = f"- gitleaks ({label}): error: gitleaks exited {status}; no result for {scope}"
          lines = [line]
          if findings:
              lines += ["", "| File | Line | Rule | Commit |", "|---|---|---|---|"]
          for item in findings[:20]:
              path = str(item.get("File", "")).replace(",", "%2C").replace(":", "%3A")
              rule = str(item.get("RuleID", ""))
              commit = str(item.get("Commit", ""))[:12]
              print(
                  f"::error file={path},line={item.get('StartLine', 1)},title=gitleaks {rule}::"
                  f"a {rule} secret is {'committed in ' + commit if commit else 'in the tree'}; the value is redacted"
              )
              lines.append(f"| `{item.get('File', '')}` | {item.get('StartLine', '')} | `{rule}` | `{commit}` |")
          if len(findings) > 20:
              lines.append(f"\n+{len(findings) - 20} more: see the job log")
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          if env.get("GITLEAKS_SARIF") and status in (0, 1):
              # Code scanning's copy (nightly): file, line and rule only.
              rules = sorted({str(item.get("RuleID", "")) for item in findings})
              sarif = {
                  "version": "2.1.0",
                  "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                  "runs": [{
                      "tool": {"driver": {
                          "name": "gitleaks",
                          "informationUri": "https://github.com/gitleaks/gitleaks",
                          "rules": [{"id": rule, "shortDescription": {"text": f"{rule} secret"}} for rule in rules],
                      }},
                      "results": [{
                          "ruleId": str(item.get("RuleID", "")),
                          "level": "error",
                          "message": {"text": f"a {item.get('RuleID', '')} secret is committed here; the value is redacted"},
                          "locations": [{"physicalLocation": {
                              "artifactLocation": {"uri": str(item.get("File", "")).removeprefix("./")},
                              "region": {"startLine": max(int(item.get("StartLine") or 1), 1)},
                          }}],
                      } for item in findings],
                  }],
              }
              Path(env["GITLEAKS_SARIF"]).parent.mkdir(parents=True, exist_ok=True)
              Path(env["GITLEAKS_SARIF"]).write_text(json.dumps(sarif, indent=2) + "\n", encoding="utf-8")
          if status == 1 and env.get("GITLEAKS_FINDINGS_FAIL") == "false":
              print(f"gitleaks: {len(findings)} secret(s) in {scope}, reported to code scanning")
          elif status == 1:
              print(f"::error title=gitleaks::{len(findings)} secret(s) in {scope}; each is annotated at its file and line")
          elif status != 0:
              print(f"::error title=gitleaks::gitleaks exited {status}: an infrastructure failure, not a finding")
          PY
          if [ "${status}" -eq 1 ] && [ "${GITLEAKS_FINDINGS_FAIL}" = "false" ]; then
            exit 0
          fi
          exit "${status}"
      # --- inlined org-ci job gitleaks org-ci.yml: end ---
      - name: Record the gitleaks job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/gitleaks.result"
      - name: Upload the gitleaks job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-base-gitleaks-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/gitleaks.result
          if-no-files-found: error
          retention-days: 1

  base__pip-audit:
    name: Canary ${{ matrix.repository }} pip-audit job (base pins)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job pip-audit org-ci.yml: begin ---
      - name: Checkout (full history)
        id: pip-audit__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect project languages
        id: pip-audit__detect
        run: |
          set -euo pipefail
          python_project=false
          node_project=false
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            python_project=true
          fi
          if [ -f "package.json" ]; then
            node_project=true
          fi
          echo "python=${python_project}" >> "$GITHUB_OUTPUT"
          echo "node=${node_project}" >> "$GITHUB_OUTPUT"
          echo "Detected: python=${python_project} node=${node_project}"
          if [ "${python_project}" != "true" ]; then
            echo "- pip-audit (blocking): not applicable: no Python project (no pyproject.toml, requirements.txt or setup.py)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Python
        id: pip-audit__s2
        if: steps.pip-audit__detect.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python dependency audit (pip-audit)
        id: pip-audit__pip_audit
        if: steps.pip-audit__detect.outputs.python == 'true'
        env:
          L9_CI_INSTALL_COMMAND: ""
          EVENT_NAME: push
          PR_BASE: ''
          PR_HEAD: ''
          MERGE_GROUP_BASE: ''
          MERGE_GROUP_HEAD: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
          PIP_AUDIT_REPORT: ${{ runner.temp }}/pip-audit.json
        run: |
          set -euo pipefail
          # Scope (operator decision 2026-11-21, row 23): a pull request,
          # merge group or push audits only when it changes a dependency
          # manifest or lock. Every other event audits. A range that cannot be
          # read audits too: not running needs a positive proof.
          is_sha() {
            local candidate="$1"
            [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]
          }
          base=""
          head=""
          case "${EVENT_NAME:-}" in
            pull_request|pull_request_target) base="${PR_BASE:-}"; head="${PR_HEAD:-}" ;;
            merge_group) base="${MERGE_GROUP_BASE:-}"; head="${MERGE_GROUP_HEAD:-}" ;;
            push) base="${PUSH_BEFORE:-}"; head="${EVENT_SHA:-}" ;;
            *) ;;
          esac
          if is_sha "${base}" && is_sha "${head}" \
            && [ "${base}" != "0000000000000000000000000000000000000000" ]; then
            # --no-renames: a renamed or deleted lock shows its old path too.
            if changed="$(git diff --no-renames --name-only "${base}" "${head}" --)"; then
              manifests='(^|/)(pyproject\.toml|uv\.lock|setup\.py|setup\.cfg|requirements[^/]*\.txt|constraints[^/]*\.txt|Pipfile(\.lock)?|poetry\.lock|pdm\.lock)$'
              if ! grep -Eq "${manifests}" <<< "${changed}"; then
                echo "pip-audit: no dependency manifest or lock changed in ${base}..${head}; nothing new to audit"
                echo "outcome=not_applicable (no dependency manifest or lock changed)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::warning::pip-audit: the change range ${base}..${head} cannot be read; auditing"
            fi
          fi
          python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
          pip install --only-binary :all: "pip-audit==2.9.0"
          if [ -n "$L9_CI_INSTALL_COMMAND" ]; then
            bash -c "$L9_CI_INSTALL_COMMAND" || echo "::notice::l9-ci install command failed; continuing"
          fi
          # The full resolved lock, not the runner's environment: uv.lock
          # exported with every dependency group, extra and workspace package
          # (the project's own workspace members are local code, not
          # packages, and are left out), else requirements.txt. uv is Core's
          # locked version (install-consumer-ci/toolchain-lock.json).
          locked=()
          if [ -f "uv.lock" ]; then
            pip install --only-binary :all: "uv==0.13.8"
            out="${RUNNER_TEMP:-/tmp}/l9-locked"
            mkdir -p "${out}"
            export_lock() {
              local name="$1"
              shift
              echo "pip-audit: uv export --frozen --all-packages --no-emit-workspace --no-hashes --format requirements.txt $* (${name})"
              uv export --frozen --all-packages --no-emit-workspace --no-hashes \
                --format requirements.txt --output-file "${out}/${name}.txt" "$@" > /dev/null
            }
            if export_lock all --all-groups --all-extras; then
              locked+=("${out}/all.txt")
            elif python3 -I -c 'import sys, tomllib; sys.exit(0 if tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("uv", {}).get("conflicts") else 1)' 2> /dev/null; then
              # Declared conflicts ([tool.uv].conflicts) make the union of
              # every extra and group unresolvable by design. Each selection
              # is exported and audited on its own: the base set, then every
              # extra and every group. Any selection that cannot be exported
              # leaves the locked set unknown.
              echo "pip-audit: uv.lock declares conflicting extras or groups; auditing each selection"
              selections="$(python3 -I -c 'import tomllib; d = tomllib.load(open("pyproject.toml", "rb")); [print("extra", n) for n in d.get("project", {}).get("optional-dependencies", {})]; [print("group", n) for n in d.get("dependency-groups", {})]')"
              if ! export_lock base --no-default-groups; then
                echo "::error::pip-audit: the base set of uv.lock cannot be exported; the audit is incomplete"
                echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              locked+=("${out}/base.txt")
              while read -r kind name; do
                [ -n "${kind}" ] || continue
                if ! export_lock "${kind}-${name}" --no-default-groups "--${kind}" "${name}"; then
                  echo "::error::pip-audit: the ${kind} ${name} of uv.lock cannot be exported; the audit is incomplete"
                  echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                locked+=("${out}/${kind}-${name}.txt")
              done <<< "${selections}"
            else
              echo "::error::pip-audit: uv.lock cannot be exported; the locked set is unknown, so the audit is incomplete"
              echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f "requirements.txt" ]; then
            locked=("requirements.txt")
          else
            echo "::error::pip-audit: a Python project with no uv.lock or requirements.txt has no locked set to audit; the audit is incomplete"
            echo "outcome=not_executed (no lock file)" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # The audited set, named in the log: each file's pinned packages
          # and the total. A file the export did not write is not an empty
          # set; the audit is incomplete.
          total=0
          for file in "${locked[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "::error::pip-audit: ${file} was not written; the audit is incomplete"
              echo "outcome=not_executed (the locked set was not written)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            count="$(awk '/^[A-Za-z0-9][A-Za-z0-9._-]*(\[[^]]*\])?[[:space:]]*==/ { n++ } END { print n + 0 }' "${file}")"
            echo "pip-audit: auditing ${count} pinned package(s) from ${file}"
            total=$((total + count))
          done
          echo "pip-audit: ${total} pinned package(s) audited in all"
          echo "packages=${total}" >> "$GITHUB_OUTPUT"
          # Acquisition and the lock are settled; from here pip-audit runs.
          status=0
          report=()
          if [ -n "${PIP_AUDIT_REPORT:-}" ]; then
            report=(--format json --output "${PIP_AUDIT_REPORT}")
          fi
          # `--desc` takes an optional value; it is given explicitly so the
          # next argument is never read as that value (`--desc .` is a usage
          # error, exit 2, and audits nothing). An exported lock is fully
          # pinned, so it is audited as written (--no-deps).
          if [ "${locked[0]}" = "requirements.txt" ]; then
            pip-audit --desc on ${report[@]+"${report[@]}"} -r requirements.txt || status=$?
          else
            requirements=()
            for file in "${locked[@]}"; do
              requirements+=(-r "${file}")
            done
            pip-audit --desc on --no-deps ${report[@]+"${report[@]}"} "${requirements[@]}" || status=$?
          fi
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          # A caller that asked for a report judges the vulnerabilities it
          # lists (the nightly sink's ratchet): pip-audit's "vulnerabilities
          # found" exit (1) then ends this step cleanly. Any other failure
          # still fails it, and without a report path nothing changes.
          if [ -n "${PIP_AUDIT_REPORT:-}" ] && [ "${status}" -eq 1 ]; then
            echo "pip-audit: known vulnerabilities written to ${PIP_AUDIT_REPORT}; the caller judges them"
            exit 0
          fi
          exit "${status}"
      # The audit step ends cleanly on "vulnerabilities found" because it
      # wrote a report (the nightly sink inlines it the same way); this step
      # judges that report: a known vulnerability fails the check, named.
      - name: Judge the dependency audit
        id: pip-audit__pip_audit_verdict
        if: steps.pip-audit__detect.outputs.python == 'true' && steps.pip-audit__pip_audit.outcome == 'success'
        env:
          OUTCOME: ${{ steps.pip-audit__pip_audit.outputs.outcome }}
          REPORT: ${{ runner.temp }}/pip-audit.json
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          env = os.environ
          outcome = env.get("OUTCOME", "")
          summary = Path(env["GITHUB_STEP_SUMMARY"])
          if outcome.startswith("not_applicable"):
              summary.open("a", encoding="utf-8").write(
                  "- pip-audit (blocking): pass: dependencies unchanged (no manifest or lock changed)\n"
              )
              sys.exit(0)
          if outcome == "executed_pass":
              summary.open("a", encoding="utf-8").write("- pip-audit (blocking): pass: no known vulnerability\n")
              sys.exit(0)
          try:
              data = json.loads(Path(env["REPORT"]).read_text(encoding="utf-8"))
          except (OSError, ValueError) as error:
              sys.exit(f"::error title=pip-audit::pip-audit reported vulnerabilities but its report is unreadable ({error})")
          vulnerable = [
              (dep["name"], dep.get("version", "?"), vuln["id"])
              for dep in data.get("dependencies", [])
              for vuln in dep.get("vulns", [])
          ]
          lock = "uv.lock" if Path("uv.lock").is_file() else "requirements.txt"
          lines = [f"- pip-audit (blocking): findings: {len(vulnerable)} known vulnerability(ies)", "",
                   "| Package | Version | Advisory |", "|---|---|---|"]
          for name, version, ident in vulnerable[:20]:
              print(f"::error file={lock},title=pip-audit {ident}::{name} {version} has known vulnerability {ident}")
              lines.append(f"| `{name}` | {version} | {ident} |")
          if len(vulnerable) > 20:
              lines.append(f"\n+{len(vulnerable) - 20} more: see the job log")
          summary.open("a", encoding="utf-8").write("\n".join(lines) + "\n")
          print(f"::error title=pip-audit::{len(vulnerable)} known vulnerability(ies) in the locked dependencies; each is annotated")
          sys.exit(1)
          PY
      # --- inlined org-ci job pip-audit org-ci.yml: end ---
      - name: Record the pip-audit job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/pip-audit.result"
      - name: Upload the pip-audit job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-base-pip-audit-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/pip-audit.result
          if-no-files-found: error
          retention-days: 1

  base__npm-audit:
    name: Canary ${{ matrix.repository }} npm-audit job (base pins)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job npm-audit org-ci.yml: begin ---
      - name: Checkout (full history)
        id: npm-audit__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node dependency audit (npm audit)
        id: npm-audit__npm_audit
        env:
          # Opt-in, as before the split (operator, 2026-11-21: modes stay as
          # they are): org-ci never enabled it, so the check reports not
          # applicable until Core sets this to "true".
          L9_NPM_AUDIT: "false"
          EVENT_NAME: push
          PR_BASE: ''
          MERGE_GROUP_BASE: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          summary() { echo "- npm-audit (opt-in, blocking when enabled): $1" >> "$GITHUB_STEP_SUMMARY"; echo "npm-audit: $1"; }
          if [ "${L9_NPM_AUDIT}" != "true" ]; then
            summary "not applicable: npm audit is opt-in and not enabled"
            exit 0
          fi
          if [ ! -f package.json ]; then
            summary "not applicable: no Node project (no package.json)"
            exit 0
          fi
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          if [[ "${base}" =~ ^[0-9a-f]{40}$ ]] && [ -n "${base//0/}" ]; then
            if ! git diff --name-only "${base}" "${EVENT_SHA}" -- | grep -Eq '(^|/)(package\.json|package-lock\.json)$'; then
              summary "pass: dependencies unchanged (package.json and package-lock.json untouched)"
              exit 0
            fi
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error file=package.json,title=npm-audit::npm audit needs package-lock.json beside package.json"
            exit 1
          fi
          status=0
          npm audit --audit-level=high || status=$?
          if [ "${status}" -eq 0 ]; then
            summary "pass: no high or critical advisory"
          else
            summary "findings: npm audit exited ${status} at --audit-level=high"
            echo "::error file=package-lock.json,title=npm-audit::npm audit found high or critical advisories (exit ${status}); see the log"
          fi
          exit "${status}"

  # CodeQL is one org-wide check (operator, 2026-11-21; docs/codeql-check.md),
  # replacing per-repository CodeQL workflows and default setup. Read-only,
  # like every pull-request job here (L9-CI-CORE-005): nothing is uploaded on
  # a pull request. The languages the revision contains are analyzed, always
  # including `actions`, with build-mode none and the security-extended suite,
  # once at the evaluated revision and once at the event's base; only results
  # the base does not have are judged (rule, path and CodeQL's own
  # primaryLocationLineHash), and a new result at error level or security
  # severity high or above fails the check. An event with no base (a
  # dispatch, the nightly sink, the promotion canary) has nothing new: it
  # reports what it found and passes. The nightly sink runs the same steps on
  # the whole default branch and sends the SARIF to code scanning.
      # --- inlined org-ci job npm-audit org-ci.yml: end ---
      - name: Record the npm-audit job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/npm-audit.result"
      - name: Upload the npm-audit job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-base-npm-audit-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/npm-audit.result
          if-no-files-found: error
          retention-days: 1

  base__codeql:
    name: Canary ${{ matrix.repository }} codeql job (base pins)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job codeql org-ci.yml: begin ---
      - name: Checkout (full history)
        id: codeql__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve CodeQL's languages and base
        id: codeql__codeql_scope
        env:
          EVENT_NAME: push
          PR_BASE: ''
          MERGE_GROUP_BASE: ''
          PUSH_BEFORE: ''
        run: |
          set -euo pipefail
          # Languages CodeQL analyzes without a build (build-mode none), by the
          # files git tracks at the evaluated revision. `actions` runs in every
          # repository with a workflow or action file, which is every governed
          # one (org-ci reaches them through a workflow); CodeQL refuses a
          # database for a language with no source, so a repository without
          # one has no Actions code to scan.
          languages=""
          tracked="$(git ls-files)"
          has() { grep -Eqi "$1" <<< "${tracked}"; }
          if has '(^|/)\.github/workflows/[^/]+\.ya?ml$|(^|/)action\.ya?ml$'; then languages="actions"; fi
          if has '\.py$'; then languages="${languages} python"; fi
          if has '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$'; then languages="${languages} javascript"; fi
          if has '\.rb$'; then languages="${languages} ruby"; fi
          if has '\.java$'; then languages="${languages} java"; fi
          if has '\.cs$'; then languages="${languages} csharp"; fi
          if has '\.rs$'; then languages="${languages} rust"; fi
          case "${EVENT_NAME}" in
            pull_request|pull_request_target) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          if [[ "${base}" =~ ^[0-9a-f]{40}$ ]] && [ -n "${base//0/}" ]; then
            if ! git cat-file -e "${base}^{commit}" 2> /dev/null; then
              echo "::error title=CodeQL::the event's base ${base} is not in this clone; the check cannot tell what is new"
              exit 1
            fi
          else
            base=""
          fi
          languages="${languages# }"
          echo "languages=${languages}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "CodeQL languages: ${languages}; base: ${base:-none (nothing is new)}"
      - name: Install CodeQL (checksum-pinned bundle)
        id: codeql__codeql_install
        run: |
          set -euo pipefail
          CODEQL_VERSION="2.27.5"
          CODEQL_SHA256="141e6eb4e99c8498a1258e282e6f7b59c747b4b1a7eabc7cbf7d1aa92792edf0"
          bundle="${RUNNER_TEMP}/codeql-bundle.tar.zst"
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o "${bundle}" \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_VERSION}/codeql-bundle-linux64.tar.zst"
          actual="$(sha256sum "${bundle}" | awk '{print $1}')"
          if [ "${actual}" != "${CODEQL_SHA256}" ]; then
            echo "::error title=CodeQL::bundle checksum mismatch: got ${actual}"
            exit 1
          fi
          tar --zstd -xf "${bundle}" -C "${RUNNER_TEMP}"
          rm -f "${bundle}"
          "${RUNNER_TEMP}/codeql/codeql" version --format=terse
          echo "executable=${RUNNER_TEMP}/codeql/codeql" >> "$GITHUB_OUTPUT"
      - name: Analyze with CodeQL (security-extended)
        id: codeql__codeql_analyze
        env:
          CODEQL: ${{ steps.codeql__codeql_install.outputs.executable }}
          LANGUAGES: ${{ steps.codeql__codeql_scope.outputs.languages }}
          BASE: ${{ steps.codeql__codeql_scope.outputs.base }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/codeql-results"
          mkdir -p "${out}" "${RUNNER_TEMP}/codeql-db"
          sides=("head=${PWD}")
          if [ -n "${BASE}" ]; then
            git worktree add --detach "${RUNNER_TEMP}/codeql-base" "${BASE}" > /dev/null
            sides+=("base=${RUNNER_TEMP}/codeql-base")
          fi
          for side in "${sides[@]}"; do
            name="${side%%=*}"
            root="${side#*=}"
            for language in ${LANGUAGES}; do
              db="${RUNNER_TEMP}/codeql-db/${name}-${language}"
              status=0
              "${CODEQL}" database create "${db}" --language="${language}" \
                --build-mode=none --source-root="${root}" --threads=0 --overwrite > /dev/null || status=$?
              if [ "${status}" -eq 32 ]; then
                # CodeQL's "no source code seen" exit: the language has no code
                # on this side (a pull request adds the language): no results.
                echo "CodeQL ${name} ${language}: no source on this side; no results"
                printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"CodeQL","rules":[]}},"results":[]}]}\n' \
                  > "${out}/${name}-${language}.sarif"
                continue
              elif [ "${status}" -ne 0 ]; then
                echo "::error title=CodeQL::database create for ${language} (${name}) exited ${status}"
                exit "${status}"
              fi
              "${CODEQL}" database analyze "${db}" \
                "codeql/${language}-queries:codeql-suites/${language}-security-extended.qls" \
                --format=sarif-latest --sarif-category="/language:${language}" \
                --output="${out}/${name}-${language}.sarif" --threads=0 > /dev/null
              echo "CodeQL ${name} ${language}: analyzed"
            done
          done
          echo "directory=${out}" >> "$GITHUB_OUTPUT"
      - name: Judge new CodeQL results (blocking at error / high)
        id: codeql__codeql_verdict
        env:
          RESULTS: ${{ steps.codeql__codeql_analyze.outputs.directory }}
          LANGUAGES: ${{ steps.codeql__codeql_scope.outputs.languages }}
          BASE: ${{ steps.codeql__codeql_scope.outputs.base }}
          L9_CODEQL_MODE: blocking
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import collections
          import json
          import os
          import re
          import sys
          from pathlib import Path

          env = os.environ
          results = Path(env["RESULTS"])
          # SARIF message links ("[a user-provided value](1)") read as their text.
          link = re.compile(r"\[([^\]]*)\]\(\d+\)")
          base = env.get("BASE", "")
          blocking = env.get("L9_CODEQL_MODE", "blocking") == "blocking"


          def load(name):
              run = json.loads((results / name).read_text(encoding="utf-8"))["runs"][0]
              rules = {rule["id"]: rule for rule in run.get("tool", {}).get("driver", {}).get("rules", [])}
              found = []
              for result in run.get("results", []):
                  rule = rules.get(result.get("ruleId", ""), {})
                  location = (result.get("locations") or [{}])[0].get("physicalLocation", {})
                  level = result.get("level") or rule.get("defaultConfiguration", {}).get("level", "warning")
                  try:
                      severity = float(rule.get("properties", {}).get("security-severity", 0))
                  except (TypeError, ValueError):
                      severity = 0.0
                  found.append({
                      "rule": result.get("ruleId", ""),
                      "path": location.get("artifactLocation", {}).get("uri", ""),
                      "line": location.get("region", {}).get("startLine", 1),
                      "hash": result.get("partialFingerprints", {}).get("primaryLocationLineHash", ""),
                      "message": link.sub(r"\1", " ".join(result.get("message", {}).get("text", "").split())),
                      "level": level,
                      "severity": severity,
                      "blocks": level == "error" or severity >= 7.0,
                  })
              return found


          new, total = [], 0
          for language in env["LANGUAGES"].split():
              head = load(f"head-{language}.sarif")
              total += len(head)
              if not base:
                  continue
              known = collections.Counter(
                  (r["rule"], r["path"], r["hash"]) for r in load(f"base-{language}.sarif")
              )
              for result in head:
                  key = (result["rule"], result["path"], result["hash"])
                  if known[key]:
                      known[key] -= 1
                  else:
                      new.append({**result, "language": language})

          failing = [r for r in new if r["blocks"]]
          for r in new:
              kind = "error" if r["blocks"] and blocking else "warning"
              path = r["path"].replace(",", "%2C").replace(":", "%3A")
              print(f"::{kind} file={path},line={r['line']},title=CodeQL {r['rule']}::{r['message']}")
          mode = "blocking at error / high" if blocking else "advisory"
          if not base:
              head_line = f"- CodeQL ({mode}): no base for this event, so nothing is new; {total} result(s) on the whole tree"
          elif failing:
              head_line = f"- CodeQL ({mode}): findings: {len(failing)} new result(s) at error / high or above ({len(new)} new in all)"
          else:
              head_line = f"- CodeQL ({mode}): pass: {len(new)} new result(s), none at error / high or above"
          lines = [head_line, f"- languages: `{env['LANGUAGES']}`; base: `{base or 'none'}`"]
          if new:
              lines += ["", "| Severity | Rule | File | Line |", "|---|---|---|---|"]
              for r in sorted(new, key=lambda r: (not r["blocks"], -r["severity"]))[:20]:
                  grade = f"{r['level']} {r['severity']:g}" if r["severity"] else r["level"]
                  lines.append(f"| {grade} | `{r['rule']}` | `{r['path']}` | {r['line']} |")
              if len(new) > 20:
                  lines.append(f"\n+{len(new) - 20} more: see the annotations")
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          print(head_line)
          if failing and blocking:
              print(f"::error title=CodeQL::{len(failing)} new result(s) at error / high or above; each is annotated at its file and line")
              sys.exit(1)
          PY

  # actionlint is one org-wide check (operator, 2026-11-21;
  # docs/actionlint-check.md), blocking, always reporting. A pull request,
  # merge group or push is judged on the workflow files it changes; a change
  # to an action definition (action.yml / action.yaml) re-judges every
  # workflow, since actionlint checks a workflow's use of local actions
  # through them. An event with no base (a dispatch, the promotion canary)
  # judges every workflow and reports, never fails: it brings nothing in. The
  # nightly sink judges every workflow too, to code scanning. The version and
  # checksum are Core's toolchain lock
  # (toolchain-lock.json `actionlint`, locks/actionlint-<version>.json).
  # shellcheck and pyflakes are off: the runner image's copies are not
  # pinned, so findings would move with the image.
      # --- inlined org-ci job codeql org-ci.yml: end ---
      - name: Record the codeql job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/codeql.result"
      - name: Upload the codeql job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-base-codeql-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/codeql.result
          if-no-files-found: error
          retention-days: 1

  base__actionlint:
    name: Canary ${{ matrix.repository }} actionlint job (base pins)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job actionlint org-ci.yml: begin ---
      - name: Checkout (full history)
        id: actionlint__s0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          token: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve actionlint's scope
        id: actionlint__actionlint_scope
        env:
          EVENT_NAME: push
          PR_BASE: ''
          MERGE_GROUP_BASE: ''
          PUSH_BEFORE: ''
          EVENT_SHA: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          workflows='^\.github/workflows/[^/]+\.ya?ml$'
          actions='(^|/)action\.ya?ml$'
          list="${RUNNER_TEMP}/actionlint-files"
          git ls-files | grep -E "${workflows}" > "${list}.all" || true
          if [ ! -s "${list}.all" ]; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "actionlint: not applicable: no workflow files"
            echo "- actionlint (blocking): not applicable: no workflow files" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "${EVENT_NAME}" in
            pull_request|pull_request_target) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          scope="every workflow"
          judge="report"
          cp "${list}.all" "${list}"
          if [[ "${base}" =~ ^[0-9a-f]{40}$ ]] && [ -n "${base//0/}" ]; then
            judge="block"
            if ! changed="$(git diff --name-only --diff-filter=d "${base}" "${EVENT_SHA}" --)"; then
              echo "::error title=actionlint::the event's base ${base} is not in this clone; the check cannot tell what changed"
              exit 1
            fi
            if grep -Eq "${actions}" <<< "${changed}"; then
              scope="every workflow (an action definition changed)"
            else
              grep -E "${workflows}" <<< "${changed}" > "${list}" || true
              scope="the workflow files ${base:0:12}..${EVENT_SHA:0:12} changes"
              if [ ! -s "${list}" ]; then
                echo "applies=false" >> "$GITHUB_OUTPUT"
                echo "actionlint: no changed workflow or action files"
                echo "- actionlint (blocking): pass: no changed workflow or action files" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          {
            echo "applies=true"
            echo "files=${list}"
            echo "scope=${scope}"
            echo "judge=${judge}"
          } >> "$GITHUB_OUTPUT"
          echo "actionlint: $(wc -l < "${list}") workflow file(s): ${scope}"
      - name: Install actionlint (toolchain-locked)
        id: actionlint__actionlint_install
        if: steps.actionlint__actionlint_scope.outputs.applies == 'true'
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          actual="$(sha256sum "${archive}" | awk '{print $1}')"
          if [ "${actual}" != "${ACTIONLINT_SHA256}" ]; then
            echo "::error title=actionlint::checksum mismatch: got ${actual}"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint-bin" actionlint
          echo "executable=${RUNNER_TEMP}/actionlint-bin/actionlint" >> "$GITHUB_OUTPUT"
      - name: Run actionlint (blocking)
        id: actionlint__actionlint_check
        if: steps.actionlint__actionlint_scope.outputs.applies == 'true'
        env:
          ACTIONLINT: ${{ steps.actionlint__actionlint_install.outputs.executable }}
          FILES: ${{ steps.actionlint__actionlint_scope.outputs.files }}
          SCOPE: ${{ steps.actionlint__actionlint_scope.outputs.scope }}
          JUDGE: ${{ steps.actionlint__actionlint_scope.outputs.judge }}
          # The nightly sink inlines this step with findings reported rather
          # than failing, written as SARIF to ACTIONLINT_SARIF.
          ACTIONLINT_FINDINGS_FAIL: "true"
          ACTIONLINT_SARIF: ""
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/actionlint.json"
          mapfile -t files < "${FILES}"
          status=0
          # The repository's own .github/actionlint.yaml applies (actionlint
          # finds it from the working directory).
          "${ACTIONLINT}" -shellcheck= -pyflakes= -format '{{json .}}' "${files[@]}" > "${report}" || status=$?
          if [ "${status}" -gt 1 ]; then
            echo "::error title=actionlint::actionlint exited ${status}: the check did not complete"
            cat "${report}"
            exit "${status}"
          fi
          STATUS="${status}" REPORT="${report}" COUNT="${#files[@]}" python3 -I - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          env = os.environ
          try:
              findings = json.loads(Path(env["REPORT"]).read_text(encoding="utf-8") or "[]")
          except ValueError as error:
              sys.exit(f"::error title=actionlint::unreadable report ({error})")
          # Findings block only what an event brings in (a base exists); with
          # no base, and in the nightly sink, they are reported.
          nightly = env.get("ACTIONLINT_FINDINGS_FAIL") == "false"
          reported = nightly or env.get("JUDGE") != "block"
          label = "nightly, reported" if nightly else ("reported: no base" if reported else "blocking")
          scope = env["SCOPE"]
          if not findings:
              line = f"- actionlint ({label}): pass: {env['COUNT']} workflow file(s), {scope}"
          else:
              line = f"- actionlint ({label}): findings: {len(findings)} in {env['COUNT']} workflow file(s), {scope}"
          lines = [line]
          if findings:
              lines += ["", "| File | Line | Kind | Message |", "|---|---|---|---|"]
          for item in findings:
              path = str(item.get("filepath", "")).replace(",", "%2C").replace(":", "%3A")
              message = " ".join(str(item.get("message", "")).split())
              print(
                  f"::{'warning' if reported else 'error'} file={path},line={item.get('line', 1)},col={item.get('column', 1)},"
                  f"title=actionlint {item.get('kind', '')}::{message}"
              )
          for item in findings[:20]:
              message = " ".join(str(item.get("message", "")).split()).replace("|", "\\|")
              lines.append(f"| `{item.get('filepath', '')}` | {item.get('line', '')} | `{item.get('kind', '')}` | {message} |")
          if len(findings) > 20:
              lines.append(f"\n+{len(findings) - 20} more: see the annotations")
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          print(line)
          if env.get("ACTIONLINT_SARIF"):
              kinds = sorted({str(item.get("kind", "")) for item in findings})
              sarif = {
                  "version": "2.1.0",
                  "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                  "runs": [{
                      "tool": {"driver": {
                          "name": "actionlint",
                          "informationUri": "https://github.com/rhysd/actionlint",
                          "rules": [{"id": kind, "shortDescription": {"text": f"actionlint {kind} check"}} for kind in kinds],
                      }},
                      "results": [{
                          "ruleId": str(item.get("kind", "")),
                          "level": "error",
                          "message": {"text": " ".join(str(item.get("message", "")).split())},
                          "locations": [{"physicalLocation": {
                              "artifactLocation": {"uri": str(item.get("filepath", "")).removeprefix("./")},
                              "region": {
                                  "startLine": max(int(item.get("line") or 1), 1),
                                  "startColumn": max(int(item.get("column") or 1), 1),
                              },
                          }}],
                      } for item in findings],
                  }],
              }
              target = Path(env["ACTIONLINT_SARIF"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(sarif, indent=2) + "\n", encoding="utf-8")
          if findings and not reported:
              print(f"::error title=actionlint::{len(findings)} finding(s); each is annotated at its file and line")
              sys.exit(1)
          PY

  # Biome is its own check (operator, 2026-11-21; docs/biome-check.md). It runs
  # beside gitleaks, pip-audit, npm-audit and `analyze`, for every repository the organization
  # ruleset governs, and always reports: no biome.json / biome.jsonc is a
  # success that says "not applicable: no biome configuration"; a pull request
  # that changes no file in Biome's scope is a success that says so. A pull
  # request and a merge group are judged on the files they change, never on
  # the code already there (incoming code only); a push of the default branch
  # on the files the push changes; any other event (a dispatch, the nightly
  # sink, the promotion canary) on the whole tree. Findings are annotated at
  # their file and line by Biome's GitHub reporter, counted in the job summary
  # with the first of them, and fail the job: the mode is blocking.
      # --- inlined org-ci job actionlint org-ci.yml: end ---
      - name: Record the actionlint job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/actionlint.result"
      - name: Upload the actionlint job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-base-actionlint-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/actionlint.result
          if-no-files-found: error
          retention-days: 1

  base__biome:
    name: Canary ${{ matrix.repository }} biome job (base pins)
    needs: plan
    if: needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- inlined org-ci job biome org-ci.yml: begin ---
      - name: Checkout immutable event revision
        id: biome__s0
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      # What Biome judges: the files the event changes, or the whole tree.
      # `biome ci --changed --since` needs the merge base in local history,
      # which a shallow CI checkout cannot promise; a diff of the two fetched
      # commits names the same files exactly, and the paths go to `biome ci`,
      # which still applies the repository's own files.includes.
      - name: Resolve Biome's scope
        id: biome__biome_scope
        env:
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ matrix.revision }}
          TOKEN: ${{ matrix.private && secrets.L9_GITHUB_READ_TOKEN || github.token }}
          EVENT_NAME: push
          PR_BASE: ''
          MERGE_GROUP_BASE: ''
          PUSH_BEFORE: ''
        run: |
          set -euo pipefail
          paths="${RUNNER_TEMP}/biome-paths"
          : > "${paths}"
          echo "paths=${paths}" >> "$GITHUB_OUTPUT"
          if [ ! -f biome.json ] && [ ! -f biome.jsonc ]; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "Biome: not applicable: no biome configuration"
            echo "- Biome (blocking): not applicable: no biome configuration (no biome.json or biome.jsonc at the repository root)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "applies=true" >> "$GITHUB_OUTPUT"
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          if [ "${EVENT_NAME}" = "push" ] && { [ -z "${base}" ] || [ -z "${base//0/}" ]; }; then
            # A new branch or a first push has no previous revision.
            base=""
          fi
          if [ -z "${base}" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "Biome scope: the whole tree (${EVENT_NAME})"
            exit 0
          fi
          if ! printf '%s' "${base}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Biome scope::the ${EVENT_NAME} base '${base}' is not a full commit id, so the changed files cannot be named"
            exit 1
          fi
          auth="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git -c "http.https://github.com/.extraheader=${auth}" \
                -c protocol.version=2 fetch -q --depth=1 origin "${base}"; then
              echo "::error title=Biome scope::the ${EVENT_NAME} base ${base} could not be fetched from ${REPOSITORY}, so the changed files cannot be named"
              exit 1
            fi
          fi
          git diff --name-only --diff-filter=d -z "${base}" "${REVISION}" > "${paths}"
          count="$(tr -cd '\0' < "${paths}" | wc -c | tr -d ' ')"
          echo "scope=changed" >> "$GITHUB_OUTPUT"
          echo "changed=${count}" >> "$GITHUB_OUTPUT"
          echo "Biome scope: ${count} file(s) the ${EVENT_NAME} changes since ${base}"

      - id: biome__biome
        name: Install Biome (digest-locked central pin)
        if: >-
          steps.biome__biome_scope.outputs.applies == 'true'
          && (steps.biome__biome_scope.outputs.scope == 'full' || steps.biome__biome_scope.outputs.changed != '0')
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/install-biome@2ee1720b9863bec15fdfebac13b220aeb699d781

      - name: Run Biome check (blocking)
        id: biome__biome_check
        if: steps.biome__biome_scope.outputs.applies == 'true'
        env:
          # Blocking here; the nightly sink renders this step advisory, so a
          # finding reaches code scanning instead of stopping the night.
          L9_BIOME_MODE: blocking
          L9_BIOME_EXECUTABLE: ${{ steps.biome__biome.outputs.executable }}
          L9_BIOME_VERSION: ${{ steps.biome__biome.outputs['provider-version'] }}
          L9_BIOME_SCOPE: ${{ steps.biome__biome_scope.outputs.scope }}
          L9_BIOME_PATHS: ${{ steps.biome__biome_scope.outputs.paths }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          env = os.environ
          temp = Path(env["RUNNER_TEMP"])
          summary = Path(env["GITHUB_STEP_SUMMARY"])
          scope = env.get("L9_BIOME_SCOPE", "")
          paths = [p for p in Path(env["L9_BIOME_PATHS"]).read_bytes().decode().split("\0") if p]
          mode = env.get("L9_BIOME_MODE", "blocking")
          if mode not in ("blocking", "advisory"):
              sys.exit(f"::error title=Biome::unknown mode {mode!r}: the check cannot decide")
          header = f"- Biome ({mode})"

          def write(lines):
              with summary.open("a", encoding="utf-8") as stream:
                  stream.write("\n".join(lines) + "\n")

          if scope == "changed" and not paths:
              print("Biome: no changed files in Biome's scope")
              write([f"{header}: pass: no changed files in Biome's scope"])
              sys.exit(0)
          executable = env.get("L9_BIOME_EXECUTABLE", "")
          if not executable or not Path(executable).is_file():
              sys.exit("::error title=Biome::the verified Biome executable is missing; the check cannot run")
          report = temp / "biome-report.json"
          sarif = temp / "biome.sarif"
          command = [
              executable, "ci", "--no-errors-on-unmatched",
              "--reporter=github",
              "--reporter=json", f"--reporter-file={report}",
              "--reporter=sarif", f"--reporter-file={sarif}",
          ]
          command += ["--", *paths] if scope == "changed" else ["."]
          code = subprocess.run(command, check=False).returncode
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
              counts = data["summary"]
              diagnostics = data.get("diagnostics", [])
          except (OSError, ValueError, KeyError) as error:
              sys.exit(
                  f"::error title=Biome::biome ci exited {code} and wrote no readable "
                  f"report ({error}): `{' '.join(command[:2])} ...` failed before judging any file"
              )
          checked = int(counts.get("changed", 0)) + int(counts.get("unchanged", 0))
          errors = int(counts.get("errors", 0))
          warnings = int(counts.get("warnings", 0))
          where = "the files this change touches" if scope == "changed" else "the whole tree"
          if scope == "changed" and checked == 0 and code == 0:
              print("Biome: no changed files in Biome's scope")
              write([f"{header}: pass: no changed files in Biome's scope ({len(paths)} changed file(s), none Biome handles)"])
              sys.exit(0)
          status = "pass" if code == 0 else "findings" if code == 1 else "error"
          lines = [
              f"{header}: {status}: {checked} file(s) of {where}, "
              f"{errors} error(s), {warnings} warning(s) (Biome {env.get('L9_BIOME_VERSION', '?')})"
          ]
          shown = [d for d in diagnostics if d.get("severity") in ("error", "fatal")][:20]
          if shown:
              lines += ["", "| File | Line | Rule | Message |", "|---|---|---|---|"]
              for item in shown:
                  location = item.get("location") or {}
                  # 0 is Biome's file-level position (a format diagnostic).
                  start = (location.get("start") or {}).get("line") or "—"
                  message = str(item.get("message", "")).replace("|", "\\|")[:200]
                  lines.append(
                      f"| `{location.get('path', '')}` | {start} | `{item.get('category', '')}` | {message} |"
                  )
              more = errors - len(shown)
              if more > 0:
                  lines.append(f"\n+{more} more error(s): see the annotations")
          write(lines)
          if code == 1 and mode == "advisory":
              print(f"Biome (advisory): {errors} error(s) in {where}; reported, not enforced")
              sys.exit(0)
          if code == 1:
              print(
                  f"::error title=Biome::{errors} error(s) in {where}; each is annotated at its "
                  "file and line above, and the first are listed in the job summary"
              )
          elif code != 0:
              print(f"::error title=Biome::biome ci exited {code}: an infrastructure failure, not a finding")
          sys.exit(code)
          PY
      # --- inlined org-ci job biome org-ci.yml: end ---
      - name: Record the biome job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/canary-job"
          printf '%s\n' "${JOB_STATUS}" > "${RUNNER_TEMP}/canary-job/biome.result"
      - name: Upload the biome job result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-job-base-biome-${{ matrix.slug }}
          path: ${{ runner.temp }}/canary-job/biome.result
          if-no-files-found: error
          retention-days: 1

  base:
    name: Canary ${{ matrix.repository }} (base pins)
    needs: [plan, base__gitleaks, base__pip-audit, base__npm-audit, base__codeql, base__actionlint, base__biome]
    if: ${{ !cancelled() && (needs.plan.outputs.applies == 'true' && needs.plan.outputs.differential == 'true' && needs.plan.outputs['base-current'] == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # --- the gitleaks job's result for this repository (not part of org-ci.yml) ---
      - name: Download the gitleaks job result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
