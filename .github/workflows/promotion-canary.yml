          merge-multiple: true
      - name: Result of the npm-audit job
        id: npm-audit__result
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/canary-job/npm-audit.result"
          result=""
          if [ -f "${file}" ]; then
            result="$(tr -d '[:space:]' < "${file}")"
