# Self-only dogfood caller for the Core analysis kernel.
# Triggers on PRs/pushes to this repository and invokes analyze-semgrep.yml
# (workflow_call) so Core runs the same SDK-owned semgrep → gate → publish
# path offered to consumers. Not a reusable consumer surface.
name: Core self analysis
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-self-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (semgrep)
    uses: ./.github/workflows/analyze-semgrep.yml
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      # The profile must admit the event, or `resolve-governance` aborts with
      # "event <e> is not allowed for profile <p>". `pr_fast` declares only
      # `pull_request`, so a hardcoded value failed every push to main and
      # every manual dispatch. The mapping mirrors org-ci.yml's own resolver
      # so the dogfood caller and the organization surface agree on which
      # profile a given event runs under.
      profile: >-
        ${{ github.event_name == 'push' && 'merge'
         || github.event_name == 'workflow_dispatch' && 'nightly'
         || 'pr_fast' }}
      matrix-id: self-semgrep
      language: python
