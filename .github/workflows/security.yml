# L9 v1 compatibility kernel — Security scan (secrets + dependency audit).
# Restores the `security.yml@v1` reusable-workflow contract deleted in the v2
# rewrite (54a2f2f) so org-starter callers resolve again. Language-aware:
# Python gates run only when a Python project is detected. npm audit runs only
# when explicitly requested and fails if the Node project has no package-lock.
# Gates that do not apply emit a notice and pass. Contract: superset of the
# v0.1.0 inputs plus every input passed by the Quantum-L9/.github org-starter
# callers (run-npm-audit).
#
# Requiredness. This workflow is not the organization required
# check and runs only where a caller references it:
#   gitleaks   required: a finding or a scanner failure fails the job.
#   pip-audit  required when a Python project is detected, else not applicable.
#   bandit     advisory when a Python project is detected: it never fails the
#              job, so its outcome is reported, never implied by a green step.
#   npm audit  not run unless the caller sets run-npm-audit: true; then required.
# The final step writes one row per scan with its requiredness and its actual
# outcome. An advisory, skipped or not-executed scan is labelled as such there.
name: L9 Security
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: "3.12"
      source-dir:
        type: string
        required: false
        default: "."
      l9-ci-install-command:
        type: string
        required: false
        default: ""
      run-npm-audit:
        description: >
          Whether to run npm audit for a detected Node project. false always
          skips npm audit, even when package-lock.json exists. true requires a
          package-lock.json and runs npm audit at high severity.
        type: boolean
        required: false
        default: false
      working-directory:
        description: Working directory containing the project to scan.
        type: string
        required: false
        default: "."
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect project languages
        id: detect
        run: |
          set -euo pipefail
          python_project=false
          node_project=false
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            python_project=true
          fi
          if [ -f "package.json" ]; then
            node_project=true
          fi
          echo "python=${python_project}" >> "$GITHUB_OUTPUT"
          echo "node=${node_project}" >> "$GITHUB_OUTPUT"
          echo "Detected: python=${python_project} node=${node_project}"
      - name: Secret scan (gitleaks)
        id: gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          actual_sha="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Everything above is acquisition. A failure there ends the step with
          # no outcome, which the report labels not_executed. From here the
          # scanner itself runs and its exit code is the outcome.
          status=0
          if [ -f ".gitleaks.toml" ]; then
            /tmp/gitleaks git --config .gitleaks.toml --no-banner --redact --exit-code 1 . \
              || status=$?
          else
            /tmp/gitleaks git --no-banner --redact --exit-code 1 . || status=$?
          fi
          case "${status}" in
            0) echo "outcome=executed_pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=executed_fail" >> "$GITHUB_OUTPUT" ;;
            *) echo "outcome=not_executed" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "${status}"
      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Python dependency audit (pip-audit)
        id: pip_audit
        if: steps.detect.outputs.python == 'true'
        env:
          L9_CI_INSTALL_COMMAND: ${{ inputs.l9-ci-install-command }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
          pip install --only-binary :all: "pip-audit==2.9.0"
          if [ -n "$L9_CI_INSTALL_COMMAND" ]; then
            bash -c "$L9_CI_INSTALL_COMMAND" || echo "::notice::l9-ci install command failed; continuing"
          fi
          # Installation above is acquisition; a failure there leaves no
          # outcome. From here pip-audit itself runs.
          status=0
          pip-audit --desc || pip-audit --desc -r requirements.txt || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      # Advisory by existing policy: no Bandit result fails this job. The exit
      # code is still read, because "no findings", "findings" and "the scanner
      # did not complete" are three different facts. Bandit exits 0 with no
      # issue at the selected level, 1 with issues, and anything else when it
      # could not scan.
      - name: Python static security scan (bandit)
        id: bandit
        if: steps.detect.outputs.python == 'true'
        env:
          SOURCE_DIR: ${{ inputs.source-dir }}
        run: |
          set -euo pipefail
          pip install --only-binary :all: "bandit==1.8.6"
          status=0
          bandit -r "$SOURCE_DIR" -ll -f screen \
            --exclude ./venv,./.venv,./tests,./build,./dist \
            || status=$?
          case "${status}" in
            0)
              outcome="executed_no_findings"
              echo "::notice::Bandit (advisory) completed with no findings at medium severity or above"
              ;;
            1)
              outcome="executed_findings"
              echo "::warning::Bandit (advisory) reported findings; an advisory scan does not fail this job"
              ;;
            *)
              outcome="not_executed"
              echo "::warning::Bandit (advisory) did not complete (exit ${status}); no Bandit result exists for this revision"
              ;;
          esac
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
      - name: Node dependency audit (npm audit)
        id: npm_audit
        if: steps.detect.outputs.node == 'true' && inputs.run-npm-audit
        run: |
          set -euo pipefail
          if [ ! -f "package-lock.json" ]; then
            echo "::error::run-npm-audit=true requires package-lock.json in the working directory"
            exit 1
          fi
          # The lockfile check above is a contract failure, not a scan: it
          # leaves no outcome. From here npm audit itself runs.
          status=0
          npm audit --audit-level=high || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      - name: Non-applicable gates
        if: steps.detect.outputs.python != 'true' && steps.detect.outputs.node != 'true'
        run: echo "::notice::No Python or Node project detected; only the secret scan ran"
      # One row per scan: what policy says about it and what actually happened.
      # Each scan step states its own outcome once its scanner has run. A step
      # that never ran, or that failed before its scanner ran, has no outcome
      # and is reported not_executed, never as a pass or as a scan failure.
      # The step runs from the workspace root: the job default is the caller's
      # working-directory, and if that does not exist no step could start there.
      - name: Report scan requiredness and outcomes
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
          PYTHON_PROJECT: ${{ steps.detect.outputs.python }}
          NODE_PROJECT: ${{ steps.detect.outputs.node }}
          NPM_AUDIT_REQUESTED: ${{ inputs.run-npm-audit }}
          GITLEAKS_STEP: ${{ steps.gitleaks.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outputs.outcome }}
          PIP_AUDIT_STEP: ${{ steps.pip_audit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outputs.outcome }}
          BANDIT_STEP: ${{ steps.bandit.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outputs.outcome }}
          NPM_AUDIT_STEP: ${{ steps.npm_audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outputs.outcome }}
        run: |
          set -euo pipefail
          # $1 is the step conclusion, $2 the outcome the step stated itself.
          required_outcome() {
            if [ -n "$2" ]; then
              echo "$2"
            elif [ "$1" = "failure" ]; then
              echo "not_executed (the step failed before its scanner ran)"
            else
              echo "not_executed"
            fi
          }
          gitleaks="$(required_outcome "${GITLEAKS_STEP}" "${GITLEAKS_OUTCOME}")"
          if [ "${DETECT_OUTCOME}" != "success" ]; then
            pip_audit="not_executed (language detection did not complete)"
            bandit="not_executed (language detection did not complete)"
            npm_audit="not_executed (language detection did not complete)"
          else
            if [ "${PYTHON_PROJECT}" = "true" ]; then
              pip_audit="$(required_outcome "${PIP_AUDIT_STEP}" "${PIP_AUDIT_OUTCOME}")"
              bandit="${BANDIT_OUTCOME:-not_executed}"
            else
              pip_audit="not_applicable (no Python project detected)"
              bandit="not_applicable (no Python project detected)"
            fi
            if [ "${NPM_AUDIT_REQUESTED}" != "true" ]; then
              npm_audit="not_run (run-npm-audit is false)"
            elif [ "${NODE_PROJECT}" != "true" ]; then
              npm_audit="not_applicable (no Node project detected)"
            else
              npm_audit="$(required_outcome "${NPM_AUDIT_STEP}" "${NPM_AUDIT_OUTCOME}")"
            fi
          fi
          npm_requiredness="not run"
          if [ "${NPM_AUDIT_REQUESTED}" = "true" ]; then
            npm_requiredness="required"
          fi
          {
            echo "### L9 Security scan outcomes"
            echo
            echo "| Scan | Requiredness | Outcome |"
            echo "| --- | --- | --- |"
            echo "| gitleaks | required | ${gitleaks} |"
            echo "| pip-audit | required when Python is detected | ${pip_audit} |"
            echo "| bandit | advisory | ${bandit} |"
            echo "| npm audit | ${npm_requiredness} | ${npm_audit} |"
            echo
            echo "Advisory, not_run, not_applicable and not_executed are not passes."
          } | tee -a "$GITHUB_STEP_SUMMARY"
