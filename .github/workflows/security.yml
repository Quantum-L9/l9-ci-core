# L9 v1 compatibility kernel — Security scan (secrets + dependency audit).
# Restores the `security.yml@v1` reusable-workflow contract deleted in the v2
# rewrite (54a2f2f) so org-starter callers resolve again. Language-aware:
# Python gates run only when a Python project is detected. npm audit runs only
# when explicitly requested and fails if the Node project has no package-lock.
# Gates that do not apply emit a notice and pass. Contract: superset of the
# v0.1.0 inputs plus every input passed by the Quantum-L9/.github org-starter
# callers (run-npm-audit).
#
# Requiredness. This workflow is not the organization required
# check and runs only where a caller references it:
#   gitleaks   required: a finding or a scanner failure fails the job.
#   pip-audit  required when a Python project is detected, else not applicable.
#              It audits the full resolved lock (uv.lock exported with every
#              group, extra and workspace package; else requirements.txt); a
#              Python project with no lock is incomplete and fails. On a pull
#              request, merge group or push it runs only when a dependency
#              manifest or lock changed in the event's range (row 23); any
#              other event, or a range that cannot be read, audits.
#   bandit     advisory when a Python project is detected: it never fails the
#              job, so its outcome is reported, never implied by a green step.
#   npm audit  not run unless the caller sets run-npm-audit: true; then required.
# The final step writes one row per scan with its requiredness and its actual
# outcome. An advisory, skipped or not-executed scan is labelled as such there.
name: L9 Security
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: "3.12"
      source-dir:
        type: string
        required: false
        default: "."
      l9-ci-install-command:
        type: string
        required: false
        default: ""
      run-npm-audit:
        description: >
          Whether to run npm audit for a detected Node project. false always
          skips npm audit, even when package-lock.json exists. true requires a
          package-lock.json and runs npm audit at high severity.
        type: boolean
        required: false
        default: false
      working-directory:
        description: Working directory containing the project to scan.
        type: string
        required: false
        default: "."
      gitleaks-log-opts:
        description: >
          git log options limiting the commits gitleaks scans, e.g.
          "<base>..<head>" for a pull request. Empty scans the full history.
          The organization workflow passes the event's own commit range, so a
          consumer is judged on what it changes, not on its whole past.
        type: string
        required: false
        default: ""
      gitleaks-scope:
        description: >
          "history" (default) scans every commit. "event" scans only what the
          triggering event adds: base..head for a pull request or merge group,
          before..after for a push (the pushed commit alone for a new branch),
          and the full history for any other event. Ignored when
          gitleaks-log-opts is set.
        type: string
        required: false
        default: history
      pip-audit-report:
        description: >
          Path for pip-audit's JSON report. Empty (the default) writes none
          and pip-audit prints its usual table. The nightly findings sink
          (tools/nightly_sink.py) inlines this step with a path so it can
          count the known vulnerabilities of the full resolved lock.
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect project languages
        id: detect
        run: |
          set -euo pipefail
          python_project=false
          node_project=false
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            python_project=true
          fi
          if [ -f "package.json" ]; then
            node_project=true
          fi
          echo "python=${python_project}" >> "$GITHUB_OUTPUT"
          echo "node=${node_project}" >> "$GITHUB_OUTPUT"
          echo "Detected: python=${python_project} node=${node_project}"
      - name: Secret scan (gitleaks)
        id: gitleaks
        env:
          GITLEAKS_LOG_OPTS: ${{ inputs.gitleaks-log-opts }}
          GITLEAKS_SCOPE: ${{ inputs.gitleaks-scope }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${GITLEAKS_SCOPE:-history}" in
            history) ;;
            event)
              if [ -z "${GITLEAKS_LOG_OPTS}" ]; then
                case "${EVENT_NAME}" in
                  pull_request|pull_request_target) GITLEAKS_LOG_OPTS="${PR_BASE}..${PR_HEAD}" ;;
                  merge_group) GITLEAKS_LOG_OPTS="${MERGE_GROUP_BASE}..${MERGE_GROUP_HEAD}" ;;
                  push)
                    if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
                      GITLEAKS_LOG_OPTS="-1 ${EVENT_SHA}"
                    else
                      GITLEAKS_LOG_OPTS="${PUSH_BEFORE}..${EVENT_SHA}"
                    fi
                    ;;
                  *) ;;
                esac
              fi
              ;;
            *)
              echo "::error::gitleaks-scope must be history or event (got '${GITLEAKS_SCOPE}')"
              exit 2
              ;;
          esac
          # Rules: gitleaks' own defaults (`[extend] useDefault = true`) plus the
          # Core rules (presets/security/.gitleaks.toml, between its "Core
          # rules" markers; docs/gitleaks-core-rules.md), for every repository,
          # whatever its own configuration says. A repository's .gitleaks.toml
          # is honoured on top: its rules and allowlists apply. A repository
          # rule whose id is a gitleaks default or a Core rule would replace
          # that rule silently, so the merge refuses it by name (and a rule
          # defined twice). A config that extends another file by `path`
          # cannot also extend the defaults, so it is refused. Reviewed false
          # positives belong in .gitleaksignore, which gitleaks reads from the
          # scanned tree.
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          # gitleaks' default rules at that version, by id: the ids a
          # repository rule must not reuse. Checksum-pinned like the binary.
          GITLEAKS_DEFAULTS_SHA256="8f393899dbdc67e4eae580909e496acab9cf3a75aacfb6fac56b6eb16bb9e051"
          config="${RUNNER_TEMP:-/tmp}/l9-gitleaks.toml"
          core_rules="${RUNNER_TEMP:-/tmp}/l9-gitleaks-core-rules.toml"
          defaults="${RUNNER_TEMP:-/tmp}/l9-gitleaks-defaults.toml"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${defaults}" \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          actual_defaults="$(sha256sum "${defaults}" | awk '{print $1}')"
          if [ "${actual_defaults}" != "${GITLEAKS_DEFAULTS_SHA256}" ]; then
            echo "::error::gitleaks default rules checksum mismatch: got ${actual_defaults}"
            exit 2
          fi
          cat > "${core_rules}" <<'TOML'
          [[rules]]
          id = "l9-openai-api-key"
          description = "OpenAI API key without the T3BlbkFJ marker (from Enrichment.Inference.Engine)"
          regex = '''\bsk-[a-zA-Z0-9]{20,}\b'''
          keywords = ["sk-"]

          [[rules]]
          id = "l9-openai-project-key"
          description = "OpenAI project or service key without the T3BlbkFJ marker (from Cognitive.Engine.Graphs)"
          regex = '''\bsk-(?:proj|svcacct|admin)-[a-zA-Z0-9_-]{80,}'''
          keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]

          [[rules]]
          id = "l9-api-key-assignment"
          description = "An API key or secret key assigned a literal of 20+ characters, at any entropy (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''(?i)(?:api[_-]?key|apikey|api[_-]?secret|secret[_-]?key)\s*[=:]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
          keywords = ["api_key", "api-key", "apikey", "api_secret", "api-secret", "secret_key", "secret-key", "secretkey"]

          [[rules]]
          id = "l9-slack-bot-token"
          description = "Slack bot token with any digit-group length (from Enrichment.Inference.Engine)"
          regex = '''xoxb-[0-9]{10,}-[0-9]{10,}-[a-zA-Z0-9]{20,}'''
          keywords = ["xoxb-"]

          [[rules]]
          id = "l9-private-key-header"
          description = "A private key header, even without a full body (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
          keywords = ["private key-----"]

          [[rules]]
          id = "l9-jwt"
          description = "A JSON Web Token with short segments (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''\beyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'''
          keywords = ["eyj"]

          [[rules]]
          id = "l9-perplexity-api-key"
          description = "Perplexity API key (from Enrichment.Inference.Engine)"
          regex = '''\bpplx-[a-zA-Z0-9]{40,}'''
          keywords = ["pplx-"]

          [[rules]]
          id = "l9-postgres-url-password"
          description = "PostgreSQL URL with an inline password (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''postgres(?:ql)?://[^:\s/@]+:([^@\s/]+)@[a-zA-Z0-9._-]+'''
          secretGroup = 1
          keywords = ["postgres://", "postgresql://"]

          [[rules]]
          id = "l9-redis-url-password"
          description = "Redis URL with an inline password (from Enrichment.Inference.Engine, Cognitive.Engine.Graphs)"
          regex = '''rediss?://[^:\s/@]*:([^@\s/]+)@[a-zA-Z0-9._-]+'''
          secretGroup = 1
          keywords = ["redis://", "rediss://"]

          [[rules]]
          id = "l9-neo4j-url-password"
          description = "Neo4j or Bolt URL with an inline password (from Cognitive.Engine.Graphs)"
          regex = '''(?:neo4j|bolt)(?:\+s(?:sc)?)?://[a-zA-Z0-9]+:([^@\s]+)@[a-zA-Z0-9._-]+'''
          secretGroup = 1
          keywords = ["neo4j://", "neo4j+s://", "neo4j+ssc://", "bolt://", "bolt+s://", "bolt+ssc://"]

          [[rules]]
          id = "l9-neo4j-password-assignment"
          description = "A Neo4j password assigned a literal (from Cognitive.Engine.Graphs)"
          regex = '''(?i)neo4j[_-]?password\s*[=:]\s*['"]?([a-zA-Z0-9!@#$%^&*()_+=-]{8,})['"]?'''
          secretGroup = 1
          keywords = ["neo4j_password", "neo4j-password", "neo4jpassword"]
          TOML
          python3 -I - ".gitleaks.toml" "${defaults}" "${core_rules}" "${config}" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          source, defaults, core_path, target = (Path(arg) for arg in sys.argv[1:5])
          core_text = core_path.read_text(encoding="utf-8")
          core = tomllib.loads(core_text)["rules"]
          core_by_id = {rule["id"]: rule for rule in core}
          core_blocks = {
              tomllib.loads(block)["rules"][0]["id"]: block
              for block in re.split(r"(?m)^(?=\[\[rules\]\])", core_text)
              if block.startswith("[[rules]]")
          }
          default_ids = {rule["id"] for rule in tomllib.loads(defaults.read_text(encoding="utf-8"))["rules"]}
          text = source.read_text(encoding="utf-8") if source.is_file() else ""
          try:
              data = tomllib.loads(text)
          except tomllib.TOMLDecodeError as error:
              sys.exit(f"::error::.gitleaks.toml is not valid TOML: {error}")
          extend = data.get("extend")
          if extend is None:
              text += (
                  "\n\n# Added by Core: keep gitleaks' default rules.\n[extend]\nuseDefault = true\n"
              )
          elif not isinstance(extend, dict) or "path" in extend:
              sys.exit(
                  "::error::.gitleaks.toml [extend] names a path; it cannot also"
                  " extend the Core preset rules (gitleaks allows path or"
                  " useDefault, not both). Inline the rules and use"
                  " `useDefault = true`."
              )
          elif extend.get("useDefault") is not True:
              sys.exit(
                  "::error::.gitleaks.toml [extend] must set useDefault = true"
                  " so the Core preset rules apply."
              )
          lines = text.splitlines()


          def line_of(rule_id):
              pattern = re.compile(r"\s*id\s*=\s*[\"']" + re.escape(rule_id) + r"[\"']")
              return next((n for n, line in enumerate(lines, 1) if pattern.match(line)), 1)


          seen, present, collisions = set(), set(), []
          for rule in data.get("rules", []):
              rule_id = str(rule.get("id", ""))
              if core_by_id.get(rule_id) == rule and rule_id not in present:
                  # The stamped Core preset carries a Core rule as Core wrote it.
                  present.add(rule_id)
              elif rule_id in seen or rule_id in present:
                  collisions.append((rule_id, "is defined twice in .gitleaks.toml"))
              elif rule_id in core_by_id:
                  collisions.append((rule_id, "is a Core rule id (Core applies that rule to every repository)"))
              elif rule_id in default_ids:
                  collisions.append((rule_id, "is a gitleaks default rule id"))
              seen.add(rule_id)
          for rule_id, why in collisions:
              print(
                  f"::error file=.gitleaks.toml,line={line_of(rule_id)},title=gitleaks rule id collision::"
                  f"rule '{rule_id}' {why}; gitleaks would replace one with the other silently."
                  " Rename the repository rule, or delete it if a Core or default rule already covers it."
              )
          if collisions:
              sys.exit(f"::error::{len(collisions)} gitleaks rule id collision(s) in .gitleaks.toml; nothing was scanned")
          missing = [core_blocks[rule["id"]] for rule in core if rule["id"] not in present]
          if missing:
              text += "\n\n# Added by Core: the Core rules (presets/security/.gitleaks.toml).\n" + "".join(missing)
          tomllib.loads(text)
          target.write_text(text, encoding="utf-8")
          print(f"gitleaks rules: defaults + {len(core)} Core rule(s) + {len(seen) - len(present)} repository rule(s)")
          PY
          config_args=(--config "${config}")
          range_args=()
          if [ -n "${GITLEAKS_LOG_OPTS}" ]; then
            # The range must resolve in this clone before gitleaks runs:
            # gitleaks exits 1 both for findings and for a git log error, so an
            # unresolvable range would otherwise read as a failed scan. The
            # options are word-split on purpose; they are git log arguments.
            # shellcheck disable=SC2086
            if ! git log --format=%H ${GITLEAKS_LOG_OPTS} -- > /dev/null; then
              echo "::error::gitleaks range '${GITLEAKS_LOG_OPTS}' does not resolve in this clone; fetch its history"
              exit 2
            fi
            range_args=(--log-opts="${GITLEAKS_LOG_OPTS}")
          fi
          # HTTPS only, on every redirect too (the release redirects to a CDN).
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          actual_sha="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Everything above is acquisition. A failure there ends the step with
          # no outcome, which the report labels not_executed. From here the
          # scanner itself runs and its exit code is the outcome.
          status=0
          /tmp/gitleaks git "${config_args[@]}" "${range_args[@]}" \
            --no-banner --redact --exit-code 1 . || status=$?
          case "${status}" in
            0) echo "outcome=executed_pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=executed_fail" >> "$GITHUB_OUTPUT" ;;
            *) echo "outcome=not_executed" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "${status}"
      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Python dependency audit (pip-audit)
        id: pip_audit
        if: steps.detect.outputs.python == 'true'
        env:
          L9_CI_INSTALL_COMMAND: ${{ inputs.l9-ci-install-command }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PIP_AUDIT_REPORT: ${{ inputs.pip-audit-report }}
        run: |
          set -euo pipefail
          # Scope (operator decision 2026-11-21, row 23): a pull request,
          # merge group or push audits only when it changes a dependency
          # manifest or lock. Every other event audits. A range that cannot be
          # read audits too: not running needs a positive proof.
          is_sha() {
            local candidate="$1"
            [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]
          }
          base=""
          head=""
          case "${EVENT_NAME:-}" in
            pull_request|pull_request_target) base="${PR_BASE:-}"; head="${PR_HEAD:-}" ;;
            merge_group) base="${MERGE_GROUP_BASE:-}"; head="${MERGE_GROUP_HEAD:-}" ;;
            push) base="${PUSH_BEFORE:-}"; head="${EVENT_SHA:-}" ;;
            *) ;;
          esac
          if is_sha "${base}" && is_sha "${head}" \
            && [ "${base}" != "0000000000000000000000000000000000000000" ]; then
            # --no-renames: a renamed or deleted lock shows its old path too.
            if changed="$(git diff --no-renames --name-only "${base}" "${head}" --)"; then
              manifests='(^|/)(pyproject\.toml|uv\.lock|setup\.py|setup\.cfg|requirements[^/]*\.txt|constraints[^/]*\.txt|Pipfile(\.lock)?|poetry\.lock|pdm\.lock)$'
              if ! grep -Eq "${manifests}" <<< "${changed}"; then
                echo "pip-audit: no dependency manifest or lock changed in ${base}..${head}; nothing new to audit"
                echo "outcome=not_applicable (no dependency manifest or lock changed)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::warning::pip-audit: the change range ${base}..${head} cannot be read; auditing"
            fi
          fi
          python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
          pip install --only-binary :all: "pip-audit==2.9.0"
          if [ -n "$L9_CI_INSTALL_COMMAND" ]; then
            bash -c "$L9_CI_INSTALL_COMMAND" || echo "::notice::l9-ci install command failed; continuing"
          fi
          # The full resolved lock, not the runner's environment: uv.lock
          # exported with every dependency group, extra and workspace package
          # (the project's own workspace members are local code, not
          # packages, and are left out), else requirements.txt. uv is Core's
          # locked version (install-consumer-ci/toolchain-lock.json).
          locked=()
          if [ -f "uv.lock" ]; then
            pip install --only-binary :all: "uv==0.13.8"
            out="${RUNNER_TEMP:-/tmp}/l9-locked"
            mkdir -p "${out}"
            export_lock() {
              local name="$1"
              shift
              echo "pip-audit: uv export --frozen --all-packages --no-emit-workspace --no-hashes --format requirements.txt $* (${name})"
              uv export --frozen --all-packages --no-emit-workspace --no-hashes \
                --format requirements.txt --output-file "${out}/${name}.txt" "$@" > /dev/null
            }
            if export_lock all --all-groups --all-extras; then
              locked+=("${out}/all.txt")
            elif python3 -I -c 'import sys, tomllib; sys.exit(0 if tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("uv", {}).get("conflicts") else 1)' 2> /dev/null; then
              # Declared conflicts ([tool.uv].conflicts) make the union of
              # every extra and group unresolvable by design. Each selection
              # is exported and audited on its own: the base set, then every
              # extra and every group. Any selection that cannot be exported
              # leaves the locked set unknown.
              echo "pip-audit: uv.lock declares conflicting extras or groups; auditing each selection"
              selections="$(python3 -I -c 'import tomllib; d = tomllib.load(open("pyproject.toml", "rb")); [print("extra", n) for n in d.get("project", {}).get("optional-dependencies", {})]; [print("group", n) for n in d.get("dependency-groups", {})]')"
              if ! export_lock base --no-default-groups; then
                echo "::error::pip-audit: the base set of uv.lock cannot be exported; the audit is incomplete"
                echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              locked+=("${out}/base.txt")
              while read -r kind name; do
                [ -n "${kind}" ] || continue
                if ! export_lock "${kind}-${name}" --no-default-groups "--${kind}" "${name}"; then
                  echo "::error::pip-audit: the ${kind} ${name} of uv.lock cannot be exported; the audit is incomplete"
                  echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                locked+=("${out}/${kind}-${name}.txt")
              done <<< "${selections}"
            else
              echo "::error::pip-audit: uv.lock cannot be exported; the locked set is unknown, so the audit is incomplete"
              echo "outcome=not_executed (uv.lock could not be exported)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f "requirements.txt" ]; then
            locked=("requirements.txt")
          else
            echo "::error::pip-audit: a Python project with no uv.lock or requirements.txt has no locked set to audit; the audit is incomplete"
            echo "outcome=not_executed (no lock file)" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # The audited set, named in the log: each file's pinned packages
          # and the total. A file the export did not write is not an empty
          # set; the audit is incomplete.
          total=0
          for file in "${locked[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "::error::pip-audit: ${file} was not written; the audit is incomplete"
              echo "outcome=not_executed (the locked set was not written)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            count="$(awk '/^[A-Za-z0-9][A-Za-z0-9._-]*(\[[^]]*\])?[[:space:]]*==/ { n++ } END { print n + 0 }' "${file}")"
            echo "pip-audit: auditing ${count} pinned package(s) from ${file}"
            total=$((total + count))
          done
          echo "pip-audit: ${total} pinned package(s) audited in all"
          echo "packages=${total}" >> "$GITHUB_OUTPUT"
          # Acquisition and the lock are settled; from here pip-audit runs.
          status=0
          report=()
          if [ -n "${PIP_AUDIT_REPORT:-}" ]; then
            report=(--format json --output "${PIP_AUDIT_REPORT}")
          fi
          # `--desc` takes an optional value; it is given explicitly so the
          # next argument is never read as that value (`--desc .` is a usage
          # error, exit 2, and audits nothing). An exported lock is fully
          # pinned, so it is audited as written (--no-deps).
          if [ "${locked[0]}" = "requirements.txt" ]; then
            pip-audit --desc on ${report[@]+"${report[@]}"} -r requirements.txt || status=$?
          else
            requirements=()
            for file in "${locked[@]}"; do
              requirements+=(-r "${file}")
            done
            pip-audit --desc on --no-deps ${report[@]+"${report[@]}"} "${requirements[@]}" || status=$?
          fi
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          # A caller that asked for a report judges the vulnerabilities it
          # lists (the nightly sink's ratchet): pip-audit's "vulnerabilities
          # found" exit (1) then ends this step cleanly. Any other failure
          # still fails it, and without a report path nothing changes.
          if [ -n "${PIP_AUDIT_REPORT:-}" ] && [ "${status}" -eq 1 ]; then
            echo "pip-audit: known vulnerabilities written to ${PIP_AUDIT_REPORT}; the caller judges them"
            exit 0
          fi
          exit "${status}"
      # Advisory by existing policy: no Bandit result fails this job. The exit
      # code is still read, because "no findings", "findings" and "the scanner
      # did not complete" are three different facts. Bandit exits 0 with no
      # issue at the selected level, 1 with issues, and anything else when it
      # could not scan.
      - name: Python static security scan (bandit)
        id: bandit
        if: steps.detect.outputs.python == 'true'
        env:
          SOURCE_DIR: ${{ inputs.source-dir }}
        run: |
          set -euo pipefail
          pip install --only-binary :all: "bandit==1.8.6"
          status=0
          bandit -r "$SOURCE_DIR" -ll -f screen \
            --exclude ./venv,./.venv,./tests,./build,./dist \
            || status=$?
          case "${status}" in
            0)
              outcome="executed_no_findings"
              echo "::notice::Bandit (advisory) completed with no findings at medium severity or above"
              ;;
            1)
              outcome="executed_findings"
              echo "::warning::Bandit (advisory) reported findings; an advisory scan does not fail this job"
              ;;
            *)
              outcome="not_executed"
              echo "::warning::Bandit (advisory) did not complete (exit ${status}); no Bandit result exists for this revision"
              ;;
          esac
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
      - name: Node dependency audit (npm audit)
        id: npm_audit
        if: steps.detect.outputs.node == 'true' && inputs.run-npm-audit
        run: |
          set -euo pipefail
          if [ ! -f "package-lock.json" ]; then
            echo "::error::run-npm-audit=true requires package-lock.json in the working directory"
            exit 1
          fi
          # The lockfile check above is a contract failure, not a scan: it
          # leaves no outcome. From here npm audit itself runs.
          status=0
          npm audit --audit-level=high || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "outcome=executed_pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=executed_fail" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      - name: Non-applicable gates
        if: steps.detect.outputs.python != 'true' && steps.detect.outputs.node != 'true'
        run: echo "::notice::No Python or Node project detected; only the secret scan ran"
      # One row per scan: what policy says about it and what actually happened.
      # Each scan step states its own outcome once its scanner has run. A step
      # that never ran, or that failed before its scanner ran, has no outcome
      # and is reported not_executed, never as a pass or as a scan failure.
      # The step runs from the workspace root: the job default is the caller's
      # working-directory, and if that does not exist no step could start there.
      - name: Report scan requiredness and outcomes
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
          PYTHON_PROJECT: ${{ steps.detect.outputs.python }}
          NODE_PROJECT: ${{ steps.detect.outputs.node }}
          NPM_AUDIT_REQUESTED: ${{ inputs.run-npm-audit }}
          GITLEAKS_STEP: ${{ steps.gitleaks.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outputs.outcome }}
          PIP_AUDIT_STEP: ${{ steps.pip_audit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outputs.outcome }}
          BANDIT_STEP: ${{ steps.bandit.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outputs.outcome }}
          NPM_AUDIT_STEP: ${{ steps.npm_audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outputs.outcome }}
        run: |
          set -euo pipefail
          required_outcome() {
            local conclusion="$1"  # the step's conclusion
            local stated="$2"      # the outcome the step stated itself
            if [ -n "${stated}" ]; then
              echo "${stated}"
            elif [ "${conclusion}" = "failure" ]; then
              echo "not_executed (the step failed before its scanner ran)"
            else
              echo "not_executed"
            fi
          }
          gitleaks="$(required_outcome "${GITLEAKS_STEP}" "${GITLEAKS_OUTCOME}")"
          if [ "${DETECT_OUTCOME}" != "success" ]; then
            pip_audit="not_executed (language detection did not complete)"
            bandit="not_executed (language detection did not complete)"
            npm_audit="not_executed (language detection did not complete)"
          else
            if [ "${PYTHON_PROJECT}" = "true" ]; then
              pip_audit="$(required_outcome "${PIP_AUDIT_STEP}" "${PIP_AUDIT_OUTCOME}")"
              bandit="${BANDIT_OUTCOME:-not_executed}"
            else
              pip_audit="not_applicable (no Python project detected)"
              bandit="not_applicable (no Python project detected)"
            fi
            if [ "${NPM_AUDIT_REQUESTED}" != "true" ]; then
              npm_audit="not_run (run-npm-audit is false)"
            elif [ "${NODE_PROJECT}" != "true" ]; then
              npm_audit="not_applicable (no Node project detected)"
            else
              npm_audit="$(required_outcome "${NPM_AUDIT_STEP}" "${NPM_AUDIT_OUTCOME}")"
            fi
          fi
          npm_requiredness="not run"
          if [ "${NPM_AUDIT_REQUESTED}" = "true" ]; then
            npm_requiredness="required"
          fi
          {
            echo "### L9 Security scan outcomes"
            echo
            echo "| Scan | Requiredness | Outcome |"
            echo "| --- | --- | --- |"
            echo "| gitleaks | required | ${gitleaks} |"
            echo "| pip-audit | required when Python is detected | ${pip_audit} |"
            echo "| bandit | advisory | ${bandit} |"
            echo "| npm audit | ${npm_requiredness} | ${npm_audit} |"
            echo
            echo "Advisory, not_run, not_applicable and not_executed are not passes."
          } | tee -a "$GITHUB_STEP_SUMMARY"
