# L9 nightly kernel — ci_deep analysis plus language-aware full-tree tests.
#
# Filename stays nightly.yml so existing `uses: …/nightly.yml@<sha>` callers
# bump the pin; they do not rename. The v1 tests-and-freshness-only body is
# superseded: callers also get analyze-semgrep at profile: nightly (advisory).
# Gate_SDK-only jobs (spec grep, coverage %, release-identity) stay out.
#
# Nested analyze-semgrep.yml must be fully qualified. This reusable executes
# in the CALLER checkout, so `uses: ./…` would resolve against the consumer.
# The pin is CORE_ACTIONS_PIN — the same Core commit already duplicated on
# every action line inside analyze-semgrep.yml (grep: CORE_ACTIONS_PIN).
# Bump them together.
#
# workflow_call inputs stay a superset of the v1 / org-starter contract
# (python-version, run-extended-tests, …). language is additive and optional.
name: L9 Nightly
on:
  workflow_call:
    inputs:
      python-versions:
        type: string
        required: false
        default: '["3.12"]'
      prerelease-python-versions:
        type: string
        required: false
        default: '[]'
      python-version:
        type: string
        required: false
        default: "3.12"
      source-dir:
        type: string
        required: false
        default: "."
      test-dir:
        type: string
        required: false
        default: "tests"
      scripts-dir:
        type: string
        required: false
        default: "scripts"
      contracts-dir:
        type: string
        required: false
        default: "contracts"
      schema-path:
        type: string
        required: false
        default: ""
      requirements-file:
        type: string
        required: false
        default: "requirements.txt"
      package-name:
        type: string
        required: false
        default: ""
      enable-trufflehog:
        type: boolean
        required: false
        default: false
      l9-ci-install-command:
        type: string
        required: false
        default: ""
      run-extended-tests:
        type: boolean
        required: false
        default: false
      language:
        description: SDK semgrep language ruleset ("python" or "typescript").
        type: string
        required: false
        default: python
permissions:
  contents: read
  packages: read
jobs:
  analyze:
    name: Analyze (semgrep nightly)
    # CORE_ACTIONS_PIN
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@01f5b16b3520ce75c168c5720864dfeddd5423a9
    permissions:
      actions: read
      checks: write
      contents: read
    secrets: inherit
    with:
      profile: nightly
      matrix-id: nightly-semgrep
      language: ${{ inputs.language }}
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          persist-credentials: false
      - name: Detect project languages
        id: detect
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          set -euo pipefail
          python_project=false
          node_project=false
          if [ -f "pyproject.toml" ] || [ -f "$REQUIREMENTS_FILE" ] || [ -f "setup.py" ]; then
            python_project=true
          fi
          if [ -f "package.json" ]; then
            node_project=true
          fi
          echo "python=${python_project}" >> "$GITHUB_OUTPUT"
          echo "node=${node_project}" >> "$GITHUB_OUTPUT"
      # ---------- Python path ----------
      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Python full test run
        if: steps.detect.outputs.python == 'true'
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
          L9_CI_INSTALL_COMMAND: ${{ inputs.l9-ci-install-command }}
          TEST_DIR: ${{ inputs.test-dir }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==26.1.2"
          if [ -f "$REQUIREMENTS_FILE" ]; then
            pip install -r "$REQUIREMENTS_FILE"
          elif [ -f "pyproject.toml" ]; then
            pip install -e ".[dev]" || pip install -e .
          fi
          pip install "pytest==8.4.2"
          if [ -n "$L9_CI_INSTALL_COMMAND" ]; then
            bash -c "$L9_CI_INSTALL_COMMAND" || echo "::notice::l9-ci install command failed; continuing"
          fi
          if [ -d "$TEST_DIR" ]; then
            pytest "$TEST_DIR" -q
          else
            echo "::notice::Test directory '$TEST_DIR' not found; skipping pytest"
          fi
      - name: Python dependency freshness report
        if: steps.detect.outputs.python == 'true'
        run: |
          report="$(pip list --outdated || true)"
          printf '%s\n' "${report}"
      # ---------- Node path ----------
      - name: Set up Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          always-auth: true
      - name: Node full test run
        if: steps.detect.outputs.node == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f "pnpm-lock.yaml" ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            corepack enable && yarn install --frozen-lockfile
          else
            npm install
          fi
          if node -e "const s=(require('./package.json').scripts||{});process.exit(s.test?0:1)"; then
            npm test
          elif ls vitest.config.* >/dev/null 2>&1; then
            npx vitest run
          else
            echo "::notice::No test script found; skipping Node tests"
          fi
      - name: Node dependency freshness report
        if: steps.detect.outputs.node == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          report="$(npm outdated || true)"
          printf '%s\n' "${report}"
      # ---------- Extended tests ----------
      - name: Extended tests
        if: inputs.run-extended-tests
        env:
          TEST_DIR: ${{ inputs.test-dir }}
        run: |
          set -euo pipefail
          if [ -f "package.json" ] && node -e "const s=(require('./package.json').scripts||{});process.exit(s['test:extended']?0:1)"; then
            npm run test:extended
          elif [ -d "$TEST_DIR/extended" ]; then
            echo "::notice::Extended test directory found; already covered by the full test run"
          else
            echo "::notice::No extended test target defined; skipping"
          fi
      # ---------- Neither ----------
      - name: Non-applicable pipeline
        if: steps.detect.outputs.python != 'true' && steps.detect.outputs.node != 'true'
        run: echo "::notice::No Python or Node project detected; nothing to validate"
  summary:
    name: Nightly summary
    runs-on: ubuntu-latest
    needs: [analyze, nightly]
    if: always()
    steps:
      - name: Report analyze + tests + freshness
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          NIGHTLY_RESULT: ${{ needs.nightly.result }}
        run: |
          set -euo pipefail
          printf 'analyze=%s nightly=%s\n' "${ANALYZE_RESULT}" "${NIGHTLY_RESULT}"
          echo "::notice::Analyze is advisory on profile nightly; findings publish and do not fail this summary."
          if [ "${NIGHTLY_RESULT}" != "success" ]; then
            echo "Hard test/install failure in the nightly job." >&2
            exit 1
          fi
          if [ "${ANALYZE_RESULT}" = "cancelled" ]; then
            echo "Analyze job was cancelled." >&2
            exit 1
          fi
