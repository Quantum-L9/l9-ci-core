# Core's own toolchain, audited for known vulnerabilities.
#
# Core pins the tools every governed repository runs
# (.github/actions/install-consumer-ci/toolchain-lock.json), and nothing else
# audits them: a consumer's lock export leaves them out by design, and Core's
# own lock holds two packages. tools/audit_core_toolchain.py resolves every
# Python tool of that lock, with its dependencies at the versions Core's
# installs actually use, into pinned requirement files; pip-audit audits them
# as written (--disable-pip --no-deps). The log names the package count.
#
# Core's one exceptions file (install-semgrep/audit-exceptions.yaml) may except
# an advisory on one package@version, with a concrete reason it is not
# reachable in Core's use, for at most 14 days. The judge reads pip-audit's
# JSON (run without any ignore) and fails on an open finding, a stale,
# expired or malformed exception, or a pin pip-audit did not audit; the log
# names "<n> pinned package(s) audited, <m> finding(s) excepted, <k> open".
# pip-audit's human-readable report passes each exception as --ignore-vuln.
#
# On a pull request or merge group it audits when the change touches the
# toolchain lock, an install it audits (its requirements or its installer), or
# this audit, and a known
# vulnerability blocks; any other change reports not applicable and passes, so
# the check always reports. It runs nightly and by dispatch regardless, where
# a known vulnerability fails the run: the failed run, its summary and the
# pip-audit JSON artifact are the report. Core's toolchain is not part of any
# repository's nightly-sink scan (a consumer's lock export excludes it), so
# nothing here is tracked twice.
name: Core toolchain audit
on:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-toolchain-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Core toolchain audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Decide whether the change touches the audited toolchain
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # The lock, every install it audits (its requirements and its installer:
          # install-consumer-ci, install-semgrep, and security.yml for bandit and
          # pip-audit), and this audit.
          watched='^(\.github/actions/install-consumer-ci/(toolchain-lock\.json|core-owned-tools\.json|requirements-consumer-ci\.txt|install\.sh)|\.github/actions/install-semgrep/(locks/.*|install\.sh|action\.ya?ml|audit-exceptions\.yaml)|\.github/actions/install-consumer-ci/action\.ya?ml|\.github/workflows/(security|self-toolchain-audit)\.yml|tools/audit_core_toolchain\.py)$'
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            *)
              echo "Event ${EVENT_NAME}: the toolchain is audited"
              echo "applies=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # A range that cannot be read is audited: skipping needs a proof.
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] \
            || ! changed="$(git diff --no-renames --name-only "${base}" HEAD --)"; then
            echo "::warning::the change range cannot be read; auditing the toolchain"
            echo "applies=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq "${watched}" <<< "${changed}"; then
            echo "The change touches the audited toolchain:"
            grep -E "${watched}" <<< "${changed}"
            echo "applies=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not applicable: the change touches no audited toolchain file"
            echo "applies=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.applies == 'true'
        with:
          python-version: "3.12.14"
      - name: Install Core's pinned uv and pip-audit
        if: steps.scope.outputs.applies == 'true'
        run: |
          set -euo pipefail
          # The versions are the toolchain lock's own, not repeated here.
          read -r uv_version audit_version < <(python3 -I -c 'import json; lock = json.load(open(".github/actions/install-consumer-ci/toolchain-lock.json")); print(lock["uv"], lock["pip-audit"])')
          python -m pip install --only-binary :all: "uv==${uv_version}" "pip-audit==${audit_version}"
      - name: Resolve the pinned toolchain
        if: steps.scope.outputs.applies == 'true'
        run: |
          set -euo pipefail
          python3 -I tools/audit_core_toolchain.py resolve --uv uv --output-dir "${RUNNER_TEMP}/toolchain-audit"
      - name: Audit the pinned toolchain (pip-audit)
        if: steps.scope.outputs.applies == 'true'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/toolchain-audit"
          today="$(date -u +%F)"
          # Malformed or expired exceptions fail here, before any audit.
          # (A command substitution, not process substitution, so set -e sees it.)
          excepted="$(python3 -I tools/audit_core_toolchain.py exceptions --today "${today}")"
          ignores=()
          while read -r advisory; do
            if [ -n "${advisory}" ]; then
              ignores+=(--ignore-vuln "${advisory}")
            fi
          done <<< "${excepted}"
          echo "toolchain audit: $(( ${#ignores[@]} / 2 )) excepted advisory id(s) passed as --ignore-vuln"
          status=0
          for layer in "${out}"/layer-*.txt; do
            echo "pip-audit: auditing $(grep -c '==' "${layer}") pinned package(s) from ${layer}"
            # As written: every pin is exact, so nothing is resolved again.
            # The JSON holds every finding (no ignore); the judge decides.
            rc=0
            pip-audit --desc on --disable-pip --no-deps -r "${layer}" \
              --format json --output "${layer%.txt}.json" || rc=$?
            if [ "${rc}" -gt 1 ] || [ ! -s "${layer%.txt}.json" ]; then
              echo "::error::pip-audit could not audit ${layer} (exit ${rc})"
              exit 2
            fi
            # Human-readable: open findings only (exceptions passed as --ignore-vuln).
            pip-audit --desc off --disable-pip --no-deps -r "${layer}" "${ignores[@]}" || status=1
          done
          python3 -I tools/audit_core_toolchain.py judge --today "${today}" --reports "${out}" | tee "${out}/verdict.txt" || status=$?
          if [ "${status}" -ne 0 ]; then
            echo "::error title=Core toolchain audit::a Core-pinned tool, or a dependency at the version Core installs, has an open known vulnerability, or an exception is stale, expired or malformed (see the verdict above and the toolchain-audit artifact)"
            {
              echo "### Core toolchain audit"
              echo
              tail -n 1 "${out}/verdict.txt"
              echo
              echo "An open finding or a stale, expired or malformed exception. See this run's log and the \`toolchain-audit\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -n 1 "${out}/verdict.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the toolchain audit
        if: always() && steps.scope.outputs.applies == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolchain-audit
          path: ${{ runner.temp }}/toolchain-audit/
          if-no-files-found: ignore
          retention-days: 14
