# Central Quantum-L9 CI entrypoint (l9.org-runtime-contract/v1).
#
# This workflow is the organization enforcement surface. GitHub organization
# rulesets may require this workflow directly across targeted repositories.
# Consumer repositories do not copy L9 workflows, governance packs, Core pins,
# SDK pins, or enforcement modes.
#
# Authority split:
#   GitHub org rulesets own repository targeting and required-workflow enforcement.
#   Core owns orchestration, organization governance defaults, permissions,
#     immutable SDK provisioning, artifact routing, enforcement, and publication.
#   SDK owns repository capability detection, provider execution, canonical
#     evidence/findings, technical gate evaluation, and deterministic projections.
#   Consumer repositories may own optional .l9/ci.json metadata containing only
#     owner, repo_class, and waiver_refs pointers. Metadata cannot weaken policy.
#
# This required-workflow surface stays read-only on pull_request. Its GitHub job
# conclusion is the enforcement signal. Write-scoped custom check/SARIF publication
# remains outside this untrusted PR trigger and can be reintroduced through a
# trusted post-analysis lane when Assurance is the authoritative decision source.
#
# `push` is a first-class canonical event, declared without a `branches:` selector.
# GitHub Actions cannot express "this repository's default branch" symbolically in
# `on.push.branches`, and Quantum-L9 repositories do not all use `main`; hardcoding
# a branch name here would silently exclude them.
#
# The trigger is therefore broad and the ref decision is made at runtime, where the
# repository's own `default_branch` is readable from the event payload. A push is
# evaluated only on the branch that repository itself declares default, so a repo
# on `trunk` or `master` is governed exactly like one on `main` and no branch name
# is written into Core. Feature-branch pushes skip before a runner is claimed;
# their pull_request evaluation is unaffected. This gates a ref against a property
# the repository states about itself — it does not decide which repositories are
# governed, which remains the organization ruleset's.
#
# A push resolves to event class `push` and execution profile `merge`, the same
# analysis engine the merge queue uses. It carries no new authority: the job stays
# `contents: read`, the target is `github.repository` at `github.sha` from the
# GitHub event context only, and no caller-supplied repository, ref, or SHA can
# redirect it. A push trigger is an evaluation lane, not a trusted write lane.
#
# Core deliberately holds no lifecycle or genesis logic. Whether an observed push
# run is a genesis attestation is decided by the birth control plane, by comparing
# the run's head SHA against its expected zero-parent root SHA. Core stays generic.
name: Organization CI (Core)

#
# `pull_request` declares `edited` in addition to GitHub's default activity
# types (`opened`, `synchronize`, `reopened`). Retargeting a pull request's
# base, for example onto `main` after its stacked parent merges, emits only
# `edited` with `github.event.changes.base` present. Without `edited`, the
# required check is never evaluated against the new base. That leaves the
# pull request blocked, or holding a verdict computed for a base it no longer
# targets (Quantum-L9/Cursor-Governance#956).
#
# A title or body `edited` event is deliberately NOT skipped. A job skipped by
# `if:` reports Success, and GitHub states that it "will not prevent a pull
# request from merging, even if it is a required check". A skip on a title
# edit would therefore post a passing required check on the same
# head SHA as an earlier failing run, so anyone able to edit a title could
# clear a required failure. Every `edited` event re-evaluates the same
# immutable head SHA. The cost is one analysis per edit, and the verdict is
# never masked.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:
    inputs:
      event:
        description: Manual execution class. Defaults to nightly/advisory.
        type: choice
        options: [nightly, release, supply_chain]
        required: false
        default: nightly
      profile:
        description: Optional centrally defined profile for manual execution.
        type: string
        required: false
        default: ""
      matrix-id:
        description: Stable artifact matrix identifier.
        type: string
        required: false
        default: org-semgrep
      sdk-revision:
        description: Optional allowlisted full SDK SHA for canary testing.
        type: string
        required: false
        default: ""
      semgrep-version:
        description: Exact Semgrep pin.
        type: string
        required: false
        default: "1.186.0"
      artifact-retention-days:
        type: number
        required: false
        default: 14
  workflow_call:
    inputs:
      event:
        description: Governance event class.
        type: string
        required: true
      profile:
        description: Optional centrally defined profile.
        type: string
        required: false
        default: ""
      matrix-id:
        description: Stable artifact matrix identifier.
        type: string
        required: false
        default: org-semgrep
      sdk-revision:
        description: Optional allowlisted full SDK SHA.
        type: string
        required: false
        default: ""
      semgrep-version:
        description: Exact Semgrep pin.
        type: string
        required: false
        default: "1.186.0"
      artifact-retention-days:
        type: number
        required: false
        default: 14
    outputs:
      artifact-name:
        description: Uploaded analysis artifact set name.
        value: ${{ jobs.analyze.outputs.artifact-name }}
      artifact-handoff:
        description: Canonical cross-run artifact handoff descriptor JSON.
        value: ${{ jobs.analyze.outputs.artifact-handoff }}
      gate-status:
        description: SDK technical gate result (pass, fail, incomplete).
        value: ${{ jobs.analyze.outputs.gate-status }}
      mode:
        description: Resolved central governance mode.
        value: ${{ jobs.analyze.outputs.mode }}
      enabled:
        description: Whether central governance enabled this provider.
        value: ${{ jobs.analyze.outputs.enabled }}
      sdk-revision:
        description: Provisioned immutable SDK revision.
        value: ${{ jobs.analyze.outputs.sdk-revision }}
    secrets:
      L9_GITHUB_READ_TOKEN:
        description: Read-only org token for the private l9-ci-sdk (AGENTS.md §27). Optional.
        required: false
# Keyed by repository, revision, and event family so a pull_request evaluation and
# a push evaluation of the same tree never collapse into one another. Queued, never
# cancelled: a canonical evaluation of an immutable SHA must complete and stay
# citable, so a later event cannot revoke an in-flight attestation of that revision.
concurrency:
  group: >-
    l9-core-${{ github.repository }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Secret scan (gitleaks, the consumer's .gitleaks.toml layered on the Core
  # preset), Python dependency audit (pip-audit) and advisory bandit, scoped to
  # what the event changed (L2-closeout item 1). Its result is enforced inside
  # the required job below, so the one required context carries it: a secret or
  # a vulnerable dependency blocks, bandit never does. The same ref gate as
  # `analyze`, so a narrowed native push runs neither.
  security:
    if: >-
      github.event_name != 'push'
      || inputs.event != ''
      || github.ref_name == github.event.repository.default_branch
    # Inherits the workflow's `contents: read`; security.yml asks for no more.
    # CORE_ACTIONS_PIN — security.yml at #334's merge revision: #329's HTTPS-only
    # gitleaks download, #330's full-lock pip-audit and #334's printed uv export
    # and audited package count (AGENTS.md §16)
    uses: Quantum-L9/l9-ci-core/.github/workflows/security.yml@802ffda7da59892cce9107f865d9d9afb99f7739
    with:
      gitleaks-scope: event

  analyze:
    # The required check name. Its one source is .l9/org-runtime-contract.yaml
    # (entrypoint.required_check.name); tests/workflows/test_required_check_name.py
    # holds this value equal to it, and the organization ruleset must list it.
    name: Analyze (central Core)
    # `analyze` waits for `security` and runs whatever its result (!cancelled()),
    # then enforces it in its last step. GitHub skips a job whose dependency
    # failed unless its `if` says otherwise, and a skipped required check would
    # read as passing.
    needs: security
    # Non-push triggers are unaffected. A reusable invocation always carries the
    # required `event` input, so a caller that is itself on a push keeps its own
    # governed evaluation instead of inheriting this ref gate. Only a native push
    # is narrowed, and only to the repository's self-declared default branch.
    if: >-
      !cancelled()
      && (github.event_name != 'push'
      || inputs.event != ''
      || github.ref_name == github.event.repository.default_branch)
    # An explicit Ubuntu release family, never `-latest`. `ubuntu-24.04` fixes
    # the OS family so a `-latest` family jump cannot re-base the fleet's
    # evaluation; GitHub still rolls hosted image builds within that family on
    # its own schedule, which Core does not control. What Core does control is
    # the toolchain below: the setup-python action SHA, the exact Python
    # version, the exact Semgrep version, and the hash-locked Semgrep
    # dependency bytes (workflow audit 2026-09-13, F-005).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      event-class: ${{ steps.runtime.outputs.event-class }}
      profile: ${{ steps.runtime.outputs.profile }}
      matrix-id: ${{ steps.runtime.outputs.matrix-id }}
      mode: ${{ steps.gov.outputs.mode }}
      enabled: ${{ steps.gov.outputs.enabled }}
      governance-digest: ${{ steps.gov.outputs['governance-digest'] }}
      artifact-name: ${{ steps.names.outputs['artifact-name'] }}
      artifact-handoff: ${{ steps.handoff.outputs.descriptor }}
      sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
      gate-status: ${{ steps.gate.outputs['gate-status'] }}
      language: ${{ steps.language.outputs.language }}
    steps:
      - id: runtime
        name: Resolve central runtime class
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_EVENT: ${{ inputs.event || '' }}
          INPUT_PROFILE: ${{ inputs.profile || '' }}
          INPUT_MATRIX_ID: ${{ inputs.matrix-id || 'org-semgrep' }}
          INPUT_SDK_REVISION: ${{ inputs.sdk-revision || '' }}
          INPUT_SEMGREP_VERSION: ${{ inputs.semgrep-version || '1.186.0' }}
          INPUT_RETENTION: ${{ inputs.artifact-retention-days || 14 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          gh_event = os.environ["GH_EVENT"]
          requested_event = os.environ.get("INPUT_EVENT", "").strip()
          requested_profile = os.environ.get("INPUT_PROFILE", "").strip()

          allowed = {"pull_request", "push", "merge", "nightly", "release", "supply_chain"}
          fixed = {"pull_request": "pr_fast", "push": "merge", "merge": "merge"}
          native = {
              "pull_request": ("pull_request", "pr_fast"),
              "merge_group": ("merge", "merge"),
              "push": ("push", "merge"),
          }

          if gh_event == "workflow_dispatch":
              event_class = requested_event or "nightly"
              profile = requested_profile or event_class
          elif requested_event:
              # Reusable workflows retain the caller's event_name, so the
              # required event input—not `workflow_call`—identifies this path.
              event_class = requested_event
              if event_class not in allowed:
                  raise SystemExit(f"::error::unsupported event class: {event_class}")
              expected_profile = fixed.get(event_class, event_class)
              profile = requested_profile or expected_profile
              if profile != expected_profile:
                  raise SystemExit(
                      "::error::reusable profile claim "
                      f"{profile!r} does not match event {event_class!r}; "
                      f"expected {expected_profile!r}"
                  )
          elif gh_event in native:
              event_class, profile = native[gh_event]
          elif gh_event == "workflow_call":
              raise SystemExit("::error::workflow_call requires event")
          else:
              raise SystemExit(f"::error::unsupported trigger: {gh_event}")

          if event_class not in allowed:
              raise SystemExit(f"::error::unsupported event class: {event_class}")
          matrix_id = os.environ.get("INPUT_MATRIX_ID", "org-semgrep")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", matrix_id):
              raise SystemExit("::error::invalid matrix-id")
          sdk_revision = os.environ.get("INPUT_SDK_REVISION", "").strip()
          if sdk_revision and not re.fullmatch(r"[0-9a-f]{40}", sdk_revision):
              raise SystemExit("::error::sdk-revision must be a full 40-character lowercase SHA")
          semgrep_version = os.environ.get("INPUT_SEMGREP_VERSION", "1.186.0").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", semgrep_version):
              raise SystemExit("::error::semgrep-version must be an exact x.y.z version")
          retention = int(os.environ.get("INPUT_RETENTION", "14"))
          if not 1 <= retention <= 90:
              raise SystemExit("::error::artifact-retention-days must be between 1 and 90")

          outputs = {
              "event-class": event_class,
              "profile": profile,
              "matrix-id": matrix_id,
              "sdk-revision": sdk_revision,
              "semgrep-version": semgrep_version,
              "artifact-retention-days": str(retention),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          PY

      # A pull-request scope failure stays a failure. An explicit full-suite
      # override is refused. Nothing here selects the deep suite, and a failed
      # scope does not fall through to one. This runs before checkout so the
      # apt cache still wraps repository verification directly.
      - name: Refuse a pull-request full-suite fallback
        if: >-
          github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
          || steps.runtime.outputs.event-class == 'pull_request'
          || steps.runtime.outputs.event-class == 'merge'
        env:
          # A reusable call keeps the caller's event_name. The class resolved
          # above is the pull-request or merge path this step is judging.
          GH_EVENT: ${{ steps.runtime.outputs.event-class }}
          FULL_SUITE_OVERRIDE: ${{ vars.L9_CI_FULL_SUITE || '' }}
          PR_SCOPE_STATUS: ${{ vars.L9_PR_SCOPE_STATUS || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys


          def finish(status, code):
              print(status)
              print("heavy=false")
              print("suite_pass=false")
              print("selected_suite=none")
              if code:
                  # Signal law: name the refusal, not only an exit code. Last, so
                  # the first stdout line stays the status the caller reads.
                  print(f"::error title=Pull-request scope::{status}")
              raise SystemExit(code)


          event = os.environ["GH_EVENT"]
          override = os.environ.get("FULL_SUITE_OVERRIDE", "").strip().lower()
          scope = os.environ.get("PR_SCOPE_STATUS", "").strip().lower()
          pr_events = ("pull_request", "merge_group", "merge")

          if event not in pr_events:
              finish("NOT_APPLICABLE", 0)
          if override not in ("", "0", "false", "no"):
              finish("POLICY_PR_DEEP_FORBIDDEN", 1)
          if scope in ("unknown", "failed", "unresolved", "pr_scope_unknown"):
              finish("PR_SCOPE_UNKNOWN", 1)
          finish("NO_FULL_SUITE_FALLBACK", 0)
          PY

      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          # Depth 2: a pull_request / merge_group revision is a merge commit,
          # and its base parent is what a consumer's merge-base check needs
          # once origin is reset to an anonymous URL below.
          git -c protocol.version=2 fetch --depth=2 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      # Reports consumer declarations of Core-owned tools that drift from
      # Core's toolchain-lock.json, with file:line annotations, into
      # .l9/runtime/toolchain-alignment.json. Advisory: drift never fails the
      # job (housekeeping, operator decision 2026-11-20). The lock ships inside
      # this pinned Core revision.
      - id: toolchain
        name: Report toolchain alignment (advisory)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/check-toolchain-alignment@2ee1720b9863bec15fdfebac13b220aeb699d781

      - name: Validate native push event context
        if: github.event_name == 'push'
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
        run: |
          set -euo pipefail
          if [ "${EVENT_CLASS}" != "push" ]; then
            echo "::error::push trigger resolved to event class '${EVENT_CLASS}'" >&2
            exit 1
          fi
          if [ -z "${EVENT_REPOSITORY}" ]; then
            echo "::error::push execution has no repository identity" >&2
            exit 1
          fi
          if [ -z "${EVENT_SHA}" ]; then
            echo "::error::push execution has no immutable SHA" >&2
            exit 1
          fi
          case "${EVENT_SHA}" in
            *[!0-9a-f]* | "") sha_ok=false ;;
            ????????????????????????????????????????) sha_ok=true ;;
            *) sha_ok=false ;;
          esac
          if [ "${sha_ok}" != "true" ]; then
            echo "::error::push SHA is not a full 40-character revision" >&2
            exit 1
          fi
          echo "Native push evaluation target: ${EVENT_REPOSITORY}@${EVENT_SHA}"

      - id: consumer
        name: Resolve optional consumer metadata
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-consumer-metadata@2ee1720b9863bec15fdfebac13b220aeb699d781

      - id: gov
        name: Resolve central governance
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          profile: ${{ steps.runtime.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.runtime.outputs['event-class'] }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          product-kind: ${{ steps.consumer.outputs['product-kind'] }}

      - name: Validate consumer waiver pointers
        env:
          REQUESTED: ${{ steps.consumer.outputs['waiver-refs'] }}
          APPLICABLE: ${{ steps.gov.outputs['waiver-ids'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          requested = {item for item in os.environ.get("REQUESTED", "").split(",") if item}
          applicable = {item for item in os.environ.get("APPLICABLE", "").split(",") if item}
          unknown = sorted(requested - applicable)
          if unknown:
              raise SystemExit(f"::error::consumer waiver_refs are not centrally applicable: {unknown}")
          PY

      - id: names
        name: Resolve artifact name
        env:
          MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - id: sdk
        name: Provision immutable SDK
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ steps.runtime.outputs['sdk-revision'] || '4a887396990a59ffb4a7108790b2fa1005c7865d' }}
          # AGENTS.md §27: l9-ci-sdk is private. Read-only org secret; the
          # action passes it to git only as a per-command header.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      - id: language
        name: Detect repository language (SDK)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN — detect-language (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/detect-language@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          repo-class: ${{ steps.consumer.outputs['repo-class'] }}
          root: .

      # L9-CI-CORE-003: every applicable provider/language instance is planned,
      # run and accounted for, so a second language is never silently dropped
      # in favour of the detected one. The SDK states the facts (capability
      # inventory of this exact snapshot, taken before repository verification
      # can touch the tree); requiredness is Core's (plan-required-instances).
      - id: inventory
        name: Inventory repository capabilities (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          directory=".l9/runtime/${L9_MATRIX_ID}/required-instances"
          mkdir -p "${directory}"
          "${L9_EXECUTABLE}" providers inventory --root . --format json \
            --consumer-rules --output "${directory}/inventory.json"
          echo "path=${directory}/inventory.json" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Plan required instances (Core)
        if: steps.inventory.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/plan-required-instances@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          inventory: ${{ steps.inventory.outputs.path }}
          repository: ${{ github.repository }}
          revision: ${{ github.sha }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          required-providers: ${{ steps.gov.outputs['required-provider'] == 'true' && 'semgrep' || '' }}
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json

      # Core owns the consumer-facing Biome check end to end: the version is
      # the `biome` key of Core's toolchain lock, the binary is digest-locked,
      # and the run is blocking (findings annotate, then fail the step;
      # infrastructure failures are fatal). It is independent of Semgrep
      # governance; a consumer without biome.json or biome.jsonc is
      # not_applicable and nothing is downloaded.
      - id: biome
        name: Install Biome (digest-locked central pin)
        if: hashFiles('biome.json', 'biome.jsonc') != ''
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/install-biome@2ee1720b9863bec15fdfebac13b220aeb699d781

      - id: biome_check
        name: Run Biome check (blocking)
        # CORE_ACTIONS_PIN — toolchain SSOT actions (#227 merge revision, AGENTS.md §18)
        uses: Quantum-L9/l9-ci-core/.github/actions/run-biome-check@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.biome.outputs.executable }}
          provider-version: ${{ steps.biome.outputs['provider-version'] }}
          mode: blocking

      # SDK ADR 0023 (CENTRAL-DIFF): findings are classified new or
      # pre-existing against a baseline commit; only new blocking findings and
      # incomplete results fail, pre-existing ones are reported as advisory
      # with counts (docs/central-diff-baseline.md). pull_request and push
      # judge against the evaluated revision's first parent (on a pull
      # request GitHub's merge commit, so the target tip; on a push the
      # previous tip; fetched at depth 2 above), a merge group against
      # merge_group.base_sha; nightly, release and supply_chain pass none, so
      # the whole tree is judged by policy alone. It is resolved here, before
      # repository verification runs any consumer code, and held by a ref:
      # a consumer's make can rewrite .git (a re-shallowed checkout has no
      # HEAD^1), and nothing it does may move the baseline. A baseline that
      # does not resolve blocks; tracked changes or an incomplete baseline
      # scan make the SDK fail closed.
      - id: baseline
        name: Resolve the baseline commit (CENTRAL-DIFF)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          # A merge group's base (docs/central-diff-baseline.md): HEAD^1 is
          # that base only for the first group in the queue.
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=""
          case "${EVENT_CLASS}" in
            merge)
              if [ -z "${POLICY}" ]; then
                echo "::notice::no SDK policy for this profile: findings are judged by policy alone"
              elif [ -n "${MERGE_GROUP_BASE}" ]; then
                if ! printf '%s' "${MERGE_GROUP_BASE}" | grep -Eq '^[0-9a-f]{40}$'; then
                  echo "::error::no baseline: merge group base '${MERGE_GROUP_BASE}' is not a full commit id"
                  exit 1
                fi
                auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
                if ! git -c protocol.version=2 \
                    -c "http.https://github.com/.extraheader=${auth_header}" \
                    fetch --depth=1 --no-tags "https://github.com/${REPOSITORY}.git" "${MERGE_GROUP_BASE}"; then
                  echo "::error::no baseline: the merge group base ${MERGE_GROUP_BASE} could not be fetched"
                  exit 1
                fi
                commit="$(git rev-parse --verify --quiet "${MERGE_GROUP_BASE}^{commit}")"
                if [ "${commit}" != "${MERGE_GROUP_BASE}" ]; then
                  echo "::error::no baseline: the merge group base ${MERGE_GROUP_BASE} does not resolve"
                  exit 1
                fi
                echo "Baseline commit: ${commit} (merge group base of $(git rev-parse HEAD))"
              elif commit="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
                echo "Baseline commit: ${commit} (first parent of $(git rev-parse HEAD))"
              else
                echo "::error::no baseline: the evaluated revision $(git rev-parse HEAD) has no fetched first parent"
                exit 1
              fi
              ;;
            pull_request|push)
              if [ -z "${POLICY}" ]; then
                echo "::notice::no SDK policy for this profile: findings are judged by policy alone"
              elif commit="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
                echo "Baseline commit: ${commit} (first parent of $(git rev-parse HEAD))"
              else
                # Operator decision 2026-11-21 (row 23): a run judges only the
                # code it brings in, so a baseline it cannot resolve blocks.
                echo "::error::no baseline: the evaluated revision $(git rev-parse HEAD) has no fetched first parent"
                exit 1
              fi
              ;;
            *)
              echo "Event class ${EVENT_CLASS}: no baseline, findings are judged by policy alone"
              ;;
          esac
          # No consumer code has run yet, so the checkout should be clean. The
          # scan itself uses a clean tree of the evaluated commit (the
          # scan-tree step), so a change here is named but cannot bias it.
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -n "${commit}" ] && [ -n "${changed}" ]; then
            echo "::warning::tracked files differ from HEAD before repository verification:"
            printf '%s\n' "${changed}"
          fi
          if [ -n "${commit}" ]; then
            # A ref keeps the baseline reachable whatever the consumer's make
            # later does to the checkout's history; the shallow boundary and
            # HEAD are recorded so the step before Semgrep can restore and
            # check them.
            git update-ref refs/l9/central-diff-baseline "${commit}"
            state="${RUNNER_TEMP}/l9-central-diff"
            mkdir -p "${state}"
            shallow="$(git rev-parse --path-format=absolute --git-path shallow)"
            if [ -f "${shallow}" ]; then
              cp -- "${shallow}" "${state}/shallow"
            else
              : > "${state}/shallow"
            fi
            git rev-parse HEAD > "${state}/head"
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # Repository verification runs the consumer's `make setup`, which may
      # install OS packages with apt (e.g. Playwright's Chromium libraries and
      # fonts). Their downloaded .deb archives are cached per repository so an
      # unchanged package set is not re-fetched from the Ubuntu mirror on every
      # evaluation: Website-Bot's 21.1 MB took 7-8 minutes at ~45 kB/s on some
      # runs and 1 s on others. Only archives are cached, never installed
      # state, and apt verifies each cached .deb against the signed package
      # index before use, re-downloading any that do not match. Entries are
      # content-addressed (cache entries are immutable): restore never matches
      # exactly and takes the newest entry for this runner image, else this
      # image family; the save key is a digest of the archive set kept after
      # verification, so only a changed set stores a new entry.
      # Cache-service errors only warn, so this can never fail verification.
      - id: apt_archive_cache_dir
        name: Route apt package archives to the verification cache
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/l9-apt-archives"
          mkdir -p "${dir}/partial"
          if id _apt >/dev/null 2>&1; then
            sudo chown _apt "${dir}/partial"
          fi
          printf '%s\n' \
            "Dir::Cache::Archives \"${dir}/\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-l9-archive-cache >/dev/null
          family="l9-apt-archives-v1-${ImageOS:-unknown}-$(uname -m)-"
          image="${family}${ImageVersion:-unknown}-"
          {
            echo "path=${dir}"
            echo "family=${family}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - id: apt_archive_cache
        name: Restore cached apt package archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          # Never saved, so restore always resolves through the prefixes.
          key: ${{ steps.apt_archive_cache_dir.outputs.image }}restore
          restore-keys: |
            ${{ steps.apt_archive_cache_dir.outputs.image }}
            ${{ steps.apt_archive_cache_dir.outputs.family }}

      - id: repository_verify
        name: Run repository verification contract
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/run-repository-verification@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          workspace: .
          # AGENTS.md §27: held only by the registry snapshot and the composer
          # prefetch. Both run before and apart from the consumer's make
          # targets. The verify step does not receive the token.
          github-read-token: ${{ secrets.L9_GITHUB_READ_TOKEN }}
          # Empty: the consumer's make runs under this run's own event. The
          # promotion canary sets push and the leg's branch, since its legs
          # check out a consumer's main head inside a Core pull_request run
          # (AGENTS.md §45, row 27).
          event-name: ''
          event-ref: ''

      # Keep only archives of package versions installed in this evaluation, so
      # superseded versions and packages a repository stopped installing drop
      # out instead of accumulating across images. The save key is a digest of
      # the kept set: an unchanged set matches the restored entry and stores
      # nothing, and a repository whose setup installs no OS packages keeps
      # nothing and stores nothing.
      - id: apt_archive_inventory
        name: Inventory apt package archives
        if: always() && steps.apt_archive_cache_dir.outcome == 'success'
        shell: bash
        env:
          ARCHIVE_DIR: ${{ steps.apt_archive_cache_dir.outputs.path }}
          IMAGE_PREFIX: ${{ steps.apt_archive_cache_dir.outputs.image }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in "${ARCHIVE_DIR}"/*.deb; do
            package="$(dpkg-deb -f "${archive}" Package)"
            version="$(dpkg-deb -f "${archive}" Version)"
            if ! dpkg-query -W -f='${Version}\n' "${package}" 2>/dev/null | grep -qxF -- "${version}"; then
              sudo rm -f -- "${archive}"
            fi
          done
          archives=("${ARCHIVE_DIR}"/*.deb)
          digest=""
          if [ "${#archives[@]}" -gt 0 ]; then
            digest="$(printf '%s\n' "${archives[@]##*/}" | LC_ALL=C sort | sha256sum | cut -c1-16)"
          fi
          {
            echo "count=${#archives[@]}"
            echo "key=${IMAGE_PREFIX}${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Save apt package archives
        if: always() && steps.apt_archive_inventory.outputs.count != '' && steps.apt_archive_inventory.outputs.count != '0' && steps.apt_archive_inventory.outputs.key != steps.apt_archive_cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt_archive_cache_dir.outputs.path }}/*.deb
          key: ${{ steps.apt_archive_inventory.outputs.key }}

      # Repository verification ran the consumer's make, which may rewrite the
      # checkout's history: on Cursor-Governance it re-shallowed it, leaving no
      # merge base, so Semgrep's baseline scan failed and every language run
      # was incomplete (#328). Restore the shallow boundary recorded before any
      # consumer code ran. The baseline is not changed here, only made
      # reachable again: HEAD must be the evaluated revision and must reach
      # the baseline, or the run blocks.
      - name: Restore the checkout history for the baseline scan (CENTRAL-DIFF)
        if: steps.baseline.outputs.commit != ''
        env:
          BASELINE: ${{ steps.baseline.outputs.commit }}
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/l9-central-diff"
          shallow="$(git rev-parse --path-format=absolute --git-path shallow)"
          if [ -s "${state}/shallow" ]; then
            cp -- "${state}/shallow" "${shallow}"
          else
            rm -f -- "${shallow}"
          fi
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "$(cat "${state}/head")" ]; then
            echo "::error::the consumer's make moved HEAD from $(cat "${state}/head") to ${head}; the baseline scan cannot judge this revision"
            exit 1
          fi
          if ! merge_base="$(git merge-base HEAD "${BASELINE}")"; then
            echo "::error::no baseline: ${BASELINE} has no merge base with ${head} after repository verification"
            exit 1
          fi
          echo "Baseline ${BASELINE} reachable from ${head} (merge base ${merge_base})"

      # The scan judges the committed code under review, never the work tree
      # the consumer's make left behind (operator decision 2026-11-21: the
      # check fails only when the repository does). Semgrep, its CENTRAL-DIFF
      # baseline and every planned instance run in a clean worktree of the
      # evaluated commit, inside .l9/runtime (untracked runtime state), so a
      # make that rewrites a tracked file can neither break nor bias the scan.
      # Each tracked file the verification changed is still named, as an
      # advisory warning and in the summary, so the consumer can fix its
      # test hygiene; it is not a finding and does not block.
      - id: scan_tree
        name: Check out a clean scan tree of the evaluated commit
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mutated=()
          while IFS= read -r -d '' entry; do
            path="${entry:3}"
            mutated+=("${path}")
            echo "::warning file=${path}::repository verification (make setup/validate/check/test) changed this tracked file; the scan uses a clean tree of ${REVISION} (advisory, not a finding)"
          done < <(git status --porcelain=v1 -z --untracked-files=no --no-renames)
          if [ "${#mutated[@]}" -gt 0 ]; then
            # Signal law (L9-SIGNAL-001): name the producer, the paths and the
            # change itself, so the consumer can fix its test hygiene without
            # re-running: the diff stat, then the first 40 lines per file.
            diffs="${RUNNER_TEMP:-/tmp}/l9-verification-diff"
            mkdir -p "${diffs}"
            git diff --stat -- "${mutated[@]}" > "${diffs}/stat"
            echo "Repository verification (make setup/validate/check/test) changed ${#mutated[@]} tracked file(s):"
            cat "${diffs}/stat"
            {
              echo "### Tracked files changed by repository verification (advisory)"
              echo
              echo "Producer: repository verification (make setup/validate/check/test)."
              echo "The scan used a clean tree of \`${REVISION}\`, so these changes are not judged."
              echo
              echo "~~~~"
              cat "${diffs}/stat"
              echo "~~~~"
              for path in "${mutated[@]}"; do
                git diff -- "${path}" > "${diffs}/one"
                echo
                echo "<details><summary><code>${path}</code> (first 40 lines of the diff)</summary>"
                echo
                echo "~~~~diff"
                head -n 40 "${diffs}/one"
                echo "~~~~"
                echo "</details>"
              done
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          tree=".l9/runtime/${L9_MATRIX_ID}/scan-tree"
          git worktree add --detach --force "${tree}" "${REVISION}"
          if [ "$(git -C "${tree}" rev-parse HEAD)" != "${REVISION}" ]; then
            echo "::error::the scan tree is not at the evaluated revision ${REVISION}"
            exit 1
          fi
          if [ -n "$(git -C "${tree}" status --porcelain --untracked-files=no)" ]; then
            echo "::error::the scan tree of ${REVISION} is not clean"
            exit 1
          fi
          {
            echo "root=${tree}"
            echo "mutated-count=${#mutated[@]}"
            echo "mutated-files=$(IFS=,; echo "${mutated[*]}")"
          } >> "$GITHUB_OUTPUT"

      # The provider toolchain is a locked contract, not a resolution. Core
      # selects the setup-python action by full SHA, the interpreter by exact
      # version (major.minor.patch, so a patch release cannot float in), the
      # Semgrep version exactly, and the Semgrep dependency closure by digest
      # inside the pinned Core action. Those selections change only with a
      # Core revision; the hosted runner image underneath them is GitHub's,
      # not Core's (workflow audit 2026-09-13, F-005). The SDK venv provisioned
      # above is untouched; only the provider install rides this interpreter.
      - name: Set up locked Python for the central toolchain
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - id: semgrep
        name: Install Semgrep (hash-locked central pin)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN — verified executable is handed to the SDK provider run.
        uses: Quantum-L9/l9-ci-core/.github/actions/install-semgrep@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          semgrep-version: ${{ steps.runtime.outputs['semgrep-version'] }}

      - name: Run + normalize Semgrep (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-run
          language: ${{ steps.language.outputs.language }}
          raw-output: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          # The clean tree of the evaluated commit (scan-tree step).
          root: ${{ steps.scan_tree.outputs.root }}
          snapshot-id: ${{ github.sha }}
          revision: ${{ github.sha }}
          provider-executable: ${{ steps.semgrep.outputs.executable }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs['required-provider'] }}
          policy: ${{ steps.gov.outputs['sdk-policy'] }}
          baseline-commit: ${{ steps.baseline.outputs.commit }}
          waivers: ${{ steps.gov.outputs['finding-waivers'] }}
          waiver-repository: ${{ github.repository }}
          # The Core-staged identity map for the detected language. Without it
          # a strict profile (`release`) cannot resolve third-party rule
          # identities and `semgrep run --strict` refuses the run outright.
          identity-map: ${{ steps.gov.outputs['identity-map-directory'] }}/${{ steps.language.outputs.language }}.yaml

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json

      - id: gate
        name: Evaluate SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
        run: |
          set -euo pipefail
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *) echo "::error title=SDK technical gate::gate evaluate failed with unexpected exit ${exit_code}"; exit "${exit_code}" ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK technical gate: ${status} (exit ${exit_code})"

      - id: instances
        name: Run every planned instance (SDK)
        if: steps.plan.outcome == 'success'
        env:
          L9_INSTANCE_DIR: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances
          L9_SCAN_ROOT: ${{ steps.scan_tree.outputs.root }}
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_PROVIDER_EXECUTABLE: ${{ steps.semgrep.outputs.executable }}
          L9_PRIMARY_LANGUAGE: ${{ steps.language.outputs.language }}
          L9_PRIMARY_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
          L9_REQUIRED: ${{ steps.gov.outputs['required-provider'] }}
          L9_POLICY: ${{ steps.gov.outputs['sdk-policy'] }}
          L9_IDENTITY_DIR: ${{ steps.gov.outputs['identity-map-directory'] }}
          L9_BASELINE: ${{ steps.baseline.outputs.commit }}
          L9_WAIVERS: ${{ steps.gov.outputs['finding-waivers'] }}
          L9_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # One record per planned semgrep instance (l9.core-instance-result/v1). The
          # primary language already ran through the full pipeline above, so its gate
          # status is reused; every other planned language runs the SDK now. An instance
          # that cannot conclude gets no record, so the aggregate reports it incomplete,
          # and an SDK execution error (run, bundle validation, or a gate exit outside
          # 0/1/6) fails this step in every mode, exactly as it does for the primary
          # language's own steps: infrastructure failure is never advisory.
          env = os.environ
          directory = Path(env["L9_INSTANCE_DIR"])
          # Every instance scans the clean tree of the evaluated commit, never
          # the work tree the verification may have changed (scan-tree step).
          scan_root = env.get("L9_SCAN_ROOT", "")
          if not scan_root:
              sys.exit("::error::no clean scan tree: the instances cannot run")
          plan = json.loads((directory / "plan.json").read_text(encoding="utf-8"))
          results = directory / "results"
          results.mkdir(parents=True, exist_ok=True)
          executable = env["L9_EXECUTABLE"]
          provider_dir = str(Path(env["L9_PROVIDER_EXECUTABLE"]).parent)
          run_env = dict(env, PATH=provider_dir + os.pathsep + env.get("PATH", ""))
          gate_status = {0: "pass", 1: "fail", 6: "incomplete"}
          errors = []


          def record(target, status):
              body = {
                  "schema": "l9.core-instance-result/v1",
                  "repository": plan["repository"],
                  "provider": "semgrep",
                  "target": target,
                  "revision": plan["revision"],
                  "sdk_revision": plan["sdk_revision"],
                  "status": status,
              }
              kind, _, name = target.partition(":")
              stem = name if kind == "language" else kind + "-" + name
              path = results / ("semgrep-" + stem + ".json")
              path.write_text(json.dumps(body, indent=2) + "\n", encoding="utf-8")
              print("instance semgrep:" + target + ": " + status)


          def sdk(*args):
              return subprocess.run([executable, *args], env=run_env, check=False).returncode


          def shared(command):
              """The flags every instance run shares with the primary run."""
              command += ["--policy", env["L9_POLICY"]]
              if env.get("L9_WAIVERS"):
                  command += ["--waivers", env["L9_WAIVERS"], "--repository", env["L9_REPOSITORY"]]
              if env.get("L9_STRICT") == "true":
                  command.append("--strict")
              if env.get("L9_REQUIRED") == "true":
                  command.append("--required")
              return command


          def conclude(target, work, run):
              """Run, validate and gate one instance; record it or note the error."""
              bundle = str(work / "finding-bundle.json")
              work.mkdir(parents=True, exist_ok=True)
              code = sdk(*run, "--output", bundle)
              if code == 0:
                  code = sdk("bundle", "validate", bundle)
              if code != 0:
                  errors.append("instance semgrep:" + target + ": SDK run failed (exit " + str(code) + ")")
                  return
              gate = ["gate", "evaluate", "--bundle", bundle, "--output", str(work / "gate-result.json")]
              gate.append("--strict-unresolved" if env.get("L9_STRICT") == "true" else "--no-strict-unresolved")
              code = sdk(*gate)
              if code in gate_status:
                  record(target, gate_status[code])
              else:
                  errors.append("instance semgrep:" + target + ": gate exited " + str(code))


          for instance in plan["instances"]:
              if instance["provider"] != "semgrep" or instance["prerequisite"] != "applicable":
                  continue
              target = instance["target"]
              kind, _, name = target.partition(":")
              if kind == "consumer":
                  # The repository's declared consumer rulepack (SDK ADR 0021):
                  # its own execution and bundle; central evidence is untouched.
                  run = ["semgrep", "consumer-run", "--root", scan_root,
                         "--snapshot-id", plan["revision"], "--revision", plan["revision"]]
                  conclude(target, directory / ("consumer-" + name), shared(run))
                  continue
              if kind != "language" or name not in ("python", "typescript"):
                  continue
              if name == env.get("L9_PRIMARY_LANGUAGE"):
                  primary = env.get("L9_PRIMARY_STATUS", "")
                  if primary in ("pass", "fail", "incomplete"):
                      record(target, primary)
                  else:
                      print("instance semgrep:" + target + ": no primary gate status", file=sys.stderr)
                  continue
              run = [
                  "semgrep", "run", "--language", name,
                  "--root", scan_root, "--snapshot-id", plan["revision"],
                  "--revision", plan["revision"],
                  "--identity-map", str(Path(env["L9_IDENTITY_DIR"]) / (name + ".yaml")),
              ]
              shared(run)
              if env.get("L9_BASELINE"):
                  run += ["--baseline-commit", env["L9_BASELINE"]]
              conclude(target, directory / name, run)

          for error in errors:
              print("::error::" + error, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

      - id: aggregate
        name: Aggregate required instances (Core)
        if: always() && steps.plan.outcome == 'success'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/aggregate-required-instances@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          plan: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/plan.json
          results-directory: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/results
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/aggregate.json

      # CENTRAL-DIFF counts: each bundle the SDK classified against the
      # baseline carries one `baseline <sha>: N new, M pre-existing (K
      # blocking reported as advisory), U unknown` limitation (ADR 0023).
      # Pre-existing findings warn here; only new ones and incomplete results
      # fail, through the gate. Observational: it changes no verdict.
      - name: Report CENTRAL-DIFF pre-existing findings (advisory)
        if: always() && steps.baseline.outputs.commit != ''
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".l9/runtime", os.environ["L9_MATRIX_ID"])
          lines = []
          for bundle in sorted(root.rglob("finding-bundle.json")):
              try:
                  limitations = json.loads(bundle.read_text(encoding="utf-8")).get("limitations", [])
              except (OSError, ValueError):
                  continue
              for item in limitations:
                  if isinstance(item, str) and item.startswith("baseline "):
                      lines.append(str(bundle.parent.relative_to(root)) + ": " + item)
          for line in lines:
              print("::warning::CENTRAL-DIFF " + line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary and lines:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("### Pre-existing findings (CENTRAL-DIFF)\n\n")
                  stream.writelines("- " + line + "\n" for line in lines)
          PY

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - name: Project SARIF (SDK-owned)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-sarif
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          raw-report: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          sarif: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          destination-root: artifacts

      - name: Stage technical gate result
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"
          cp .l9/runtime/capabilities.json "artifacts/l9/${L9_MATRIX_ID}/repository-capabilities.json"

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          repository: ${{ github.repository }}
          repository-revision: ${{ github.sha }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          artifact-root: artifacts
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          routing-record: ${{ steps.route.outputs['routing-record'] }}
          output: artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/artifact-index.json

      - id: upload
        name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/l9/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/
          if-no-files-found: error
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      # Every planned instance's own bundle beside the central artifact set
      # (SDK ADR 0021, Core change 2): secondary languages and the declared
      # consumer rulepack, whose bundle names the consumer rule files and the
      # rules evaluated. A separate artifact, so the central set, its manifest
      # and its handoff are unchanged. .l9/runtime is untracked workspace
      # state written by this job only.
      - name: Upload instance bundles
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l9-instance-bundles-${{ steps.runtime.outputs['matrix-id'] }}-${{ github.run_attempt }}
          path: |
            .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/required-instances/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      - id: handoff
        name: Create artifact handoff descriptor
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/create-artifact-handoff@2ee1720b9863bec15fdfebac13b220aeb699d781
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          repository: ${{ github.repository }}
          repository-revision: ${{ github.sha }}
          workflow-head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          output: .l9/runtime/handoffs/${{ steps.runtime.outputs['matrix-id'] }}.json

      - name: Write central CI summary
        if: always()
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          PROFILE: ${{ steps.runtime.outputs.profile }}
          MODE: ${{ steps.gov.outputs.mode }}
          SDK_REVISION: ${{ steps.sdk.outputs['sdk-revision'] }}
          LANGUAGE: ${{ steps.language.outputs.language }}
          REPOSITORY_VERIFY: ${{ steps.repository_verify.outputs.status || steps.repository_verify.outcome }}
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          INSTANCES_STATUS: ${{ steps.aggregate.outputs.status }}
          ARTIFACT_NAME: ${{ steps.names.outputs['artifact-name'] }}
          TOOLCHAIN_ALIGNMENT: ${{ steps.toolchain.outcome }}
          BIOME_STATUS: ${{ steps.biome_check.outputs.status || steps.biome_check.outcome }}
          MUTATED_COUNT: ${{ steps.scan_tree.outputs['mutated-count'] }}
          MUTATED_FILES: ${{ steps.scan_tree.outputs['mutated-files'] }}
        run: |
          {
            echo "### L9 central CI"
            echo
            echo "- Event: \`${EVENT_CLASS:-unknown}\`"
            echo "- Profile: \`${PROFILE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- SDK revision: \`${SDK_REVISION:-unknown}\`"
            echo "- Detected language: \`${LANGUAGE:-unknown}\`"
            echo "- Repository verification: \`${REPOSITORY_VERIFY:-unavailable}\`"
            echo "- Technical gate: \`${GATE_STATUS:-unavailable}\`"
            echo "- Required instances: \`${INSTANCES_STATUS:-unavailable}\`"
            echo "- Artifact set: \`${ARTIFACT_NAME:-unavailable}\`"
            echo "- Toolchain alignment (advisory): \`${TOOLCHAIN_ALIGNMENT:-unavailable}\`"
            echo "- Biome (blocking): \`${BIOME_STATUS:-unavailable}\`"
            echo "- Tracked files changed by verification (advisory; the scan used a clean tree): \`${MUTATED_COUNT:-unavailable}\`${MUTATED_FILES:+ (${MUTATED_FILES})}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository verification
        # Contract and infrastructure failures are fatal on every profile,
        # including advisory nightly, release, and supply_chain (AGENTS.md §9).
        # Finding mode stays on the technical-gate step below.
        if: always()
        env:
          REPOSITORY_VERIFY_STATUS: ${{ steps.repository_verify.outputs.status }}
          REPOSITORY_VERIFY_MODE: ${{ steps.repository_verify.outputs.contract-mode }}
          REPOSITORY_VERIFY_FAILURE: ${{ steps.repository_verify.outputs.failure-kind }}
        run: |
          set -euo pipefail
          # An absent contract is tolerated only where Core's bundled policy
          # resolved migration mode; required mode accepts pass only.
          case "${REPOSITORY_VERIFY_MODE}:${REPOSITORY_VERIFY_STATUS}" in
            migration:pass|migration:not_applicable|required:pass) ;;
            *)
              # Signal law (L9-SIGNAL-001): name the phase, the command, its
              # exit code and the tail of its output, not only a status.
              # The verification step writes the failed command to a sidecar
              # in RUNNER_TEMP (its typed outputs are frozen).
              sidecar="${RUNNER_TEMP}/l9-repository-verification-failure.json"
              tail_file="${RUNNER_TEMP}/l9-repository-verification-tail.txt"
              subject="mode ${REPOSITORY_VERIFY_MODE:-unavailable}; status ${REPOSITORY_VERIFY_STATUS:-unavailable}; failure ${REPOSITORY_VERIFY_FAILURE:-unavailable}"
              # The sidecar names this workspace's own failure, never one a
              # test wrote while running the verifier on a temporary tree.
              named=""
              if [ -s "${sidecar}" ]; then
                named="$(python3 -I -c 'import json,os,sys; d=json.load(open(sys.argv[1])); ok=os.path.realpath(d.get("workspace","")) == os.path.realpath(sys.argv[2]); print("phase %s: `%s` exited %s" % (d["phase"] or "unknown", d["command"], d["exit"]) if ok else "")' "${sidecar}" "${GITHUB_WORKSPACE:-${PWD}}")"
              fi
              if [ -n "${named}" ]; then
                subject="${named} (${subject})"
              else
                subject="${subject}; the cause is named in the 'Run repository verification contract' step log"
              fi
              if [ -n "${named}" ] && [ -s "${tail_file}" ]; then
                echo "Last lines of the failed command:"
                cat -- "${tail_file}"
                {
                  echo "### Repository verification failed"
                  echo
                  echo "${subject}"
                  echo
                  echo "~~~~"
                  cat -- "${tail_file}"
                  echo "~~~~"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi
              echo "::error title=Repository verification::${subject}"
              exit 1
              ;;
          esac

      # The verdict is the aggregate over every planned instance, the primary
      # language's gate among them. A required instance that is missing,
      # skipped or unfinished makes the aggregate incomplete (exit 6), never
      # pass; no aggregate at all is incomplete too.
      # Toolchain drift is housekeeping (operator decision 2026-11-20: only
      # checks that protect working or secure code block a merge). Each
      # declaration of a Core-owned tool that differs from toolchain-lock.json
      # is a warning at file:line and a line in the summary; it never fails
      # the job. align.py decides what drift is (the report's own status).
      - name: Report toolchain alignment drift (advisory)
        if: always()
        env:
          REPORT: .l9/runtime/toolchain-alignment.json
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
              status = report["status"]
              findings = report["findings"]
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f"::warning::toolchain alignment report unavailable ({error}); drift not reported")
          else:
              drift = [
                  item
                  for item in findings
                  if item.get("class") not in ("exact_match", "range_admits_lock")
              ]
              for item in drift:
                  print(
                      f"::warning file={item.get('path')},line={item.get('line')}::"
                      f"{item.get('tool')} {item.get('declared') or '(no version)'} "
                      f"is not Core's locked {item.get('lock')} ({item.get('class')})"
                  )
              line = f"- Toolchain drift (advisory): `{status}`, {len(drift)} declaration(s)"
              summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if summary:
                  with open(summary, "a", encoding="utf-8") as stream:
                      stream.write(line + "\n")
              print(line)
          PY

      - name: Enforce central mode on SDK technical gate
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          AGGREGATE_EXIT: ${{ steps.aggregate.outputs['exit-code'] }}
          ACCOUNTED: ${{ steps.aggregate.outputs.accounted }}
          MODE: ${{ steps.gov.outputs.mode }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          L9_PRIMARY_LANGUAGE: ${{ steps.language.outputs.language }}
          # Snippets come from the clean tree of the evaluated commit.
          L9_SCAN_ROOT: ${{ steps.scan_tree.outputs.root }}
        run: |
          set -euo pipefail
          status="${AGGREGATE_STATUS:-incomplete}"
          exit_code="${AGGREGATE_EXIT:-6}"
          echo "SDK technical gate (primary language): ${GATE_STATUS:-unavailable}"
          echo "Required instances: ${status} (exit ${exit_code}; accounted ${ACCOUNTED:-false}); central mode: ${MODE}"
          if [ "${status}" != "pass" ]; then
            # Signal law (L9-SIGNAL-001): name every instance that did not
            # pass, its reasons, and each blocking finding by rule and
            # file:line, so the verdict is actionable without a re-run.
            python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          CAP = 20
          env = os.environ
          runtime = Path(".l9/runtime", env["L9_MATRIX_ID"])
          instances = runtime / "required-instances"
          primary = env.get("L9_PRIMARY_LANGUAGE", "")
          lines = []


          def escape(text, prop=False):
              text = str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return text.replace(":", "%3A").replace(",", "%2C") if prop else text


          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None


          def directory(instance):
              kind, _, name = instance.partition(":")[2].partition(":")
              if kind == "language" and name == primary:
                  return runtime
              return instances / (name if kind == "language" else kind + "-" + name)


          def emit(props, message):
              line = "::error " + ",".join(f"{k}={escape(v, True)}" for k, v in props.items()) + "::" + escape(message)
              print(line)
              lines.append(message)


          # Providers whose findings are secrets: never print their source.
          SENSITIVE = {"gitleaks", "trufflehog", "detect-secrets"}
          snippets = []


          def snippet(path, start, end, provider):
              """The offending lines and 2 either side, numbered, marked."""
              root = Path(env.get("L9_SCAN_ROOT") or ".")
              try:
                  source = (root / path).read_text(encoding="utf-8", errors="replace").splitlines()
              except OSError:
                  return [f"    (source unavailable: {path})"]
              first, last = max(1, start - 2), min(len(source), end + 2)
              rendered = []
              for number in range(first, last + 1):
                  marker = ">" if start <= number <= end else " "
                  text = source[number - 1]
                  if provider in SENSITIVE and marker == ">":
                      text = "*" * 8 + " (masked: secret finding)"
                  elif provider in SENSITIVE:
                      continue
                  rendered.append(f"{marker} {number:>5} | {text}")
              return rendered


          aggregate = load(instances / "aggregate.json") or {}
          if not aggregate:
              emit({"title": "Required instances"}, "no aggregate was written: the planned instances did not all run")
          named = 0
          hidden = 0
          for instance in aggregate.get("instances", []):
              if instance.get("status") == "pass":
                  continue
              ident = instance.get("id", "?")
              emit({"title": f"Required instance {ident}"}, f"{instance.get('status')}: {instance.get('reason', '')}")
              where = directory(ident)
              gate = load(where / "gate-result.json") or {}
              bundle = load(where / "finding-bundle.json") or {}
              for reason in gate.get("reasons", []):
                  emit({"title": f"Gate {ident}"}, reason)
              for failure in bundle.get("provider_failures", []):
                  emit({"title": f"Provider {failure.get('provider_id', '?')} ({ident})"},
                       f"{failure.get('failure_type', '?')}: {failure.get('message', '')}")
              findings = {f.get("finding_id"): f for f in bundle.get("findings", [])}
              for kind in ("blocking_finding_ids", "unresolved_finding_ids"):
                  for finding_id in gate.get(kind, []):
                      if named >= CAP:
                          hidden += 1
                          continue
                      finding = findings.get(finding_id, {})
                      rule = finding.get("canonical_rule_id") or finding.get("provider_rule_id") or finding_id
                      where_ = (finding.get("locations") or [{}])[0]
                      props = {"title": f"{rule} ({kind.split('_')[0]}, {ident})"}
                      path = where_.get("normalized_path")
                      if path:
                          start = int(where_.get("start_line") or 1)
                          end = int(where_.get("end_line") or start)
                          props = {"file": path, "line": start, "endLine": end, **props}
                          provider = finding.get("provider_id", "")
                          snippets.append((f"{path}:{start} {rule}", snippet(path, start, end, provider)))
                      emit(props, finding.get("message") or finding_id)
                      named += 1
          if hidden:
              emit({"title": "Required instances"}, f"+{hidden} more finding(s) not listed; see the instance bundles artifact")
          for heading, body in snippets:
              print(f"::group::{heading}")
              print("\n".join(body))
              print("::endgroup::")
          summary = env.get("GITHUB_STEP_SUMMARY")
          if summary and lines:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("\n### Why the required instances did not pass\n\n")
                  stream.writelines(f"- {line}\n" for line in lines)
                  for heading, body in snippets:
                      stream.write(f"\n`{heading}`\n\n~~~~\n" + "\n".join(body) + "\n~~~~\n")
          PY
          fi
          if [ "${status}" != "pass" ] && [ "${MODE}" = "blocking" ]; then
            echo "::error title=Required instances::${status} (exit ${exit_code}); the instances, reasons and findings are named above"
            exit "${exit_code}"
          fi

      # The security job's result, enforced in the required context. Anything
      # but success fails, skipped and cancelled included: an INCOMPLETE scan
      # never passes.
      - name: Enforce security scan (secrets, dependency audit)
        if: always()
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          echo "Security scan (gitleaks, pip-audit; bandit advisory): ${SECURITY_RESULT:-unavailable}"
          if [ "${SECURITY_RESULT}" != "success" ]; then
            echo "::error title=Security scan::the security job concluded '${SECURITY_RESULT:-unavailable}'; a secret or a vulnerable dependency blocks the merge (see the security job)"
            exit 1
          fi
