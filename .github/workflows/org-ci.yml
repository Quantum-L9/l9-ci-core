# Central Quantum-L9 CI entrypoint (l9.org-runtime-contract/v1).
#
# This workflow is the organization enforcement surface. GitHub organization
# rulesets may require this workflow directly across targeted repositories.
# Consumer repositories do not copy L9 workflows, governance packs, Core pins,
# SDK pins, or enforcement modes.
#
# Authority split:
#   GitHub org rulesets own repository targeting and required-workflow enforcement.
#   Core owns orchestration, organization governance defaults, permissions,
#     immutable SDK provisioning, artifact routing, enforcement, and publication.
#   SDK owns repository capability detection, provider execution, canonical
#     evidence/findings, technical gate evaluation, and deterministic projections.
#   Consumer repositories may own optional .l9/ci.json metadata containing only
#     owner, repo_class, and waiver_refs pointers. Metadata cannot weaken policy.
#
# This required-workflow surface stays read-only on pull_request. Its GitHub job
# conclusion is the enforcement signal. Write-scoped custom check/SARIF publication
# remains outside this untrusted PR trigger and can be reintroduced through a
# trusted post-analysis lane when Assurance is the authoritative decision source.
#
# `push` is a first-class canonical event, declared without a `branches:` selector.
# GitHub Actions cannot express "this repository's default branch" symbolically in
# `on.push.branches`, and Quantum-L9 repositories do not all use `main`; hardcoding
# a branch name here would silently exclude them.
#
# The trigger is therefore broad and the ref decision is made at runtime, where the
# repository's own `default_branch` is readable from the event payload. A push is
# evaluated only on the branch that repository itself declares default, so a repo
# on `trunk` or `master` is governed exactly like one on `main` and no branch name
# is written into Core. Feature-branch pushes skip before a runner is claimed;
# their pull_request evaluation is unaffected. This gates a ref against a property
# the repository states about itself — it does not decide which repositories are
# governed, which remains the organization ruleset's.
#
# A push resolves to event class `push` and execution profile `merge`, the same
# analysis engine the merge queue uses. It carries no new authority: the job stays
# `contents: read`, the target is `github.repository` at `github.sha` from the
# GitHub event context only, and no caller-supplied repository, ref, or SHA can
# redirect it. A push trigger is an evaluation lane, not a trusted write lane.
#
# Core deliberately holds no lifecycle or genesis logic. Whether an observed push
# run is a genesis attestation is decided by the birth control plane, by comparing
# the run's head SHA against its expected zero-parent root SHA. Core stays generic.
name: Organization CI (Core)

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      event:
        description: Manual execution class. Defaults to nightly/advisory.
        type: choice
        options: [nightly, release, supply_chain]
        required: false
        default: nightly
      profile:
        description: Optional centrally defined profile for manual execution.
        type: string
        required: false
        default: ""
      matrix-id:
        description: Stable artifact matrix identifier.
        type: string
        required: false
        default: org-semgrep
      sdk-revision:
        description: Optional allowlisted full SDK SHA for canary testing.
        type: string
        required: false
        default: ""
      semgrep-version:
        description: Exact Semgrep pin.
        type: string
        required: false
        default: "1.171.0"
      artifact-retention-days:
        type: number
        required: false
        default: 14
  workflow_call:
    inputs:
      event:
        description: Governance event class.
        type: string
        required: true
      profile:
        description: Optional centrally defined profile.
        type: string
        required: false
        default: ""
      matrix-id:
        description: Stable artifact matrix identifier.
        type: string
        required: false
        default: org-semgrep
      sdk-revision:
        description: Optional allowlisted full SDK SHA.
        type: string
        required: false
        default: ""
      semgrep-version:
        description: Exact Semgrep pin.
        type: string
        required: false
        default: "1.171.0"
      artifact-retention-days:
        type: number
        required: false
        default: 14
    outputs:
      artifact-name:
        description: Uploaded analysis artifact set name.
        value: ${{ jobs.analyze.outputs.artifact-name }}
      gate-status:
        description: SDK technical gate result (pass, fail, incomplete).
        value: ${{ jobs.analyze.outputs.gate-status }}
      mode:
        description: Resolved central governance mode.
        value: ${{ jobs.analyze.outputs.mode }}
      enabled:
        description: Whether central governance enabled this provider.
        value: ${{ jobs.analyze.outputs.enabled }}
      sdk-revision:
        description: Provisioned immutable SDK revision.
        value: ${{ jobs.analyze.outputs.sdk-revision }}

# Keyed by repository, revision, and event family so a pull_request evaluation and
# a push evaluation of the same tree never collapse into one another. Queued, never
# cancelled: a canonical evaluation of an immutable SHA must complete and stay
# citable, so a later event cannot revoke an in-flight attestation of that revision.
concurrency:
  group: >-
    l9-core-${{ github.repository }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (central Core)
    # Non-push triggers are unaffected. A reusable invocation always carries the
    # required `event` input, so a caller that is itself on a push keeps its own
    # governed evaluation instead of inheriting this ref gate. Only a native push
    # is narrowed, and only to the repository's self-declared default branch.
    if: >-
      github.event_name != 'push'
      || inputs.event != ''
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      event-class: ${{ steps.runtime.outputs.event-class }}
      profile: ${{ steps.runtime.outputs.profile }}
      matrix-id: ${{ steps.runtime.outputs.matrix-id }}
      mode: ${{ steps.gov.outputs.mode }}
      enabled: ${{ steps.gov.outputs.enabled }}
      governance-digest: ${{ steps.gov.outputs['governance-digest'] }}
      artifact-name: ${{ steps.names.outputs['artifact-name'] }}
      sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
      gate-status: ${{ steps.gate.outputs['gate-status'] }}
      language: ${{ steps.language.outputs.language }}
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - id: runtime
        name: Resolve central runtime class
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_EVENT: ${{ inputs.event || '' }}
          INPUT_PROFILE: ${{ inputs.profile || '' }}
          INPUT_MATRIX_ID: ${{ inputs.matrix-id || 'org-semgrep' }}
          INPUT_SDK_REVISION: ${{ inputs.sdk-revision || '' }}
          INPUT_SEMGREP_VERSION: ${{ inputs.semgrep-version || '1.171.0' }}
          INPUT_RETENTION: ${{ inputs.artifact-retention-days || 14 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          gh_event = os.environ["GH_EVENT"]
          requested_event = os.environ.get("INPUT_EVENT", "").strip()
          requested_profile = os.environ.get("INPUT_PROFILE", "").strip()

          if gh_event == "pull_request":
              event_class, profile = "pull_request", "pr_fast"
          elif gh_event == "merge_group":
              event_class, profile = "merge", "merge"
          elif gh_event == "push":
              event_class, profile = "push", "merge"
          elif gh_event == "workflow_dispatch":
              event_class = requested_event or "nightly"
              profile = requested_profile or event_class
          elif gh_event == "workflow_call":
              if not requested_event:
                  raise SystemExit("workflow_call requires event")
              event_class = requested_event
              fixed = {"pull_request": "pr_fast", "push": "merge", "merge": "merge"}
              profile = fixed.get(event_class, requested_profile or event_class)
          else:
              raise SystemExit(f"unsupported trigger: {gh_event}")

          allowed = {"pull_request", "push", "merge", "nightly", "release", "supply_chain"}
          if event_class not in allowed:
              raise SystemExit(f"unsupported event class: {event_class}")
          matrix_id = os.environ.get("INPUT_MATRIX_ID", "org-semgrep")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", matrix_id):
              raise SystemExit("invalid matrix-id")
          sdk_revision = os.environ.get("INPUT_SDK_REVISION", "").strip()
          if sdk_revision and not re.fullmatch(r"[0-9a-f]{40}", sdk_revision):
              raise SystemExit("sdk-revision must be a full 40-character lowercase SHA")
          semgrep_version = os.environ.get("INPUT_SEMGREP_VERSION", "1.171.0").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", semgrep_version):
              raise SystemExit("semgrep-version must be an exact x.y.z version")
          retention = int(os.environ.get("INPUT_RETENTION", "14"))
          if not 1 <= retention <= 90:
              raise SystemExit("artifact-retention-days must be between 1 and 90")

          outputs = {
              "event-class": event_class,
              "profile": profile,
              "matrix-id": matrix_id,
              "sdk-revision": sdk_revision,
              "semgrep-version": semgrep_version,
              "artifact-retention-days": str(retention),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Validate native push event context
        if: github.event_name == 'push'
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
        run: |
          set -euo pipefail
          if [ "${EVENT_CLASS}" != "push" ]; then
            echo "::error::push trigger resolved to event class '${EVENT_CLASS}'" >&2
            exit 1
          fi
          if [ -z "${EVENT_REPOSITORY}" ]; then
            echo "::error::push execution has no repository identity" >&2
            exit 1
          fi
          if [ -z "${EVENT_SHA}" ]; then
            echo "::error::push execution has no immutable SHA" >&2
            exit 1
          fi
          case "${EVENT_SHA}" in
            *[!0-9a-f]* | "") sha_ok=false ;;
            ????????????????????????????????????????) sha_ok=true ;;
            *) sha_ok=false ;;
          esac
          if [ "${sha_ok}" != "true" ]; then
            echo "::error::push SHA is not a full 40-character revision" >&2
            exit 1
          fi
          echo "Native push evaluation target: ${EVENT_REPOSITORY}@${EVENT_SHA}"

      - id: consumer
        name: Resolve optional consumer metadata
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-consumer-metadata@2aa859c8018d67778e4efb256b888c7b18045445

      - id: gov
        name: Resolve central governance
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@2aa859c8018d67778e4efb256b888c7b18045445
        with:
          profile: ${{ steps.runtime.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.runtime.outputs['event-class'] }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          governance-root: "@core-defaults"

      - name: Validate consumer waiver pointers
        env:
          REQUESTED: ${{ steps.consumer.outputs['waiver-refs'] }}
          APPLICABLE: ${{ steps.gov.outputs['waiver-ids'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          requested = {item for item in os.environ.get("REQUESTED", "").split(",") if item}
          applicable = {item for item in os.environ.get("APPLICABLE", "").split(",") if item}
          unknown = sorted(requested - applicable)
          if unknown:
              raise SystemExit(f"consumer waiver_refs are not centrally applicable: {unknown}")
          PY

      - id: names
        name: Resolve artifact name
        env:
          MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - id: sdk
        name: Provision immutable SDK
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@2aa859c8018d67778e4efb256b888c7b18045445
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ steps.runtime.outputs['sdk-revision'] || '7d7762eae5e1a12fdc66276975e2949891762a20' }}

      - id: language
        name: Detect repository language (SDK)
        if: steps.gov.outputs.enabled == 'true'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          REPO_CLASS: ${{ steps.consumer.outputs['repo-class'] }}
        run: |
          set -euo pipefail
          mkdir -p .l9/runtime
          "${L9_EXECUTABLE}" providers detect --root . --format json > .l9/runtime/capabilities.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(".l9/runtime/capabilities.json").read_text(encoding="utf-8"))
          languages = set(payload["result"]["capabilities"]["languages"])
          repo_class = os.environ.get("REPO_CLASS", "auto")
          has_python = "python" in languages
          has_typescript = bool({"typescript", "javascript"} & languages)
          if repo_class == "python":
              if not has_python:
                  raise SystemExit("consumer repo_class=python conflicts with SDK capability detection")
              language = "python"
          elif repo_class == "typescript":
              if not has_typescript:
                  raise SystemExit("consumer repo_class=typescript conflicts with SDK capability detection")
              language = "typescript"
          elif has_python and not has_typescript:
              language = "python"
          elif has_typescript and not has_python:
              language = "typescript"
          else:
              raise SystemExit(
                  "SDK capability detection is ambiguous; set repo_class in optional .l9/ci.json"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"language={language}\n")
          print(f"SDK-detected CI language: {language}; languages={sorted(languages)}")
          PY

      - name: Install Semgrep (exact central pin)
        if: steps.gov.outputs.enabled == 'true'
        env:
          L9_SEMGREP_VERSION: ${{ steps.runtime.outputs['semgrep-version'] }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip "semgrep==${L9_SEMGREP_VERSION}"

      - name: Run + normalize Semgrep (SDK)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2aa859c8018d67778e4efb256b888c7b18045445
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-run
          language: ${{ steps.language.outputs.language }}
          raw-output: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          root: .
          snapshot-id: ${{ github.sha }}
          revision: ${{ github.sha }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs['required-provider'] }}
          policy: ${{ steps.gov.outputs['sdk-policy'] }}

      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@2aa859c8018d67778e4efb256b888c7b18045445
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json

      - id: gate
        name: Evaluate SDK technical gate
        if: steps.gov.outputs.enabled == 'true'
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
        run: |
          set -euo pipefail
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *) echo "gate evaluate failed with unexpected exit ${exit_code}" >&2; exit "${exit_code}" ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK technical gate: ${status} (exit ${exit_code})"

      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2aa859c8018d67778e4efb256b888c7b18045445
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}

      - name: Project SARIF (SDK-owned)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@2aa859c8018d67778e4efb256b888c7b18045445
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-sarif
          input: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          output: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          strict: ${{ steps.gov.outputs.strict }}

      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@2aa859c8018d67778e4efb256b888c7b18045445
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          raw-report: artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/report.json
          bundle: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/agent-review-payload.json
          sarif: .l9/runtime/${{ steps.runtime.outputs['matrix-id'] }}/results.sarif
          destination-root: artifacts

      - name: Stage technical gate result
        if: steps.gov.outputs.enabled == 'true'
        env:
          L9_MATRIX_ID: ${{ steps.runtime.outputs['matrix-id'] }}
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"
          cp .l9/runtime/capabilities.json "artifacts/l9/${L9_MATRIX_ID}/repository-capabilities.json"

      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@2aa859c8018d67778e4efb256b888c7b18045445
        with:
          provider: semgrep
          matrix-id: ${{ steps.runtime.outputs['matrix-id'] }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          output: artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/artifact-manifest.json

      - name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/l9/${{ steps.runtime.outputs['matrix-id'] }}/
            artifacts/metadata/${{ steps.runtime.outputs['matrix-id'] }}/
          if-no-files-found: error
          retention-days: ${{ steps.runtime.outputs['artifact-retention-days'] }}

      - name: Write central CI summary
        if: always()
        env:
          EVENT_CLASS: ${{ steps.runtime.outputs['event-class'] }}
          PROFILE: ${{ steps.runtime.outputs.profile }}
          MODE: ${{ steps.gov.outputs.mode }}
          SDK_REVISION: ${{ steps.sdk.outputs['sdk-revision'] }}
          LANGUAGE: ${{ steps.language.outputs.language }}
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          ARTIFACT_NAME: ${{ steps.names.outputs['artifact-name'] }}
        run: |
          {
            echo "### L9 central CI"
            echo
            echo "- Event: \`${EVENT_CLASS:-unknown}\`"
            echo "- Profile: \`${PROFILE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- SDK revision: \`${SDK_REVISION:-unknown}\`"
            echo "- Detected language: \`${LANGUAGE:-unknown}\`"
            echo "- Technical gate: \`${GATE_STATUS:-unavailable}\`"
            echo "- Artifact set: \`${ARTIFACT_NAME:-unavailable}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce central mode on SDK technical gate
        if: steps.gov.outputs.enabled == 'true'
        env:
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          GATE_EXIT: ${{ steps.gate.outputs['gate-exit-code'] }}
          MODE: ${{ steps.gov.outputs.mode }}
        run: |
          set -euo pipefail
          echo "SDK technical gate: ${GATE_STATUS} (exit ${GATE_EXIT}); central mode: ${MODE}"
          if [ "${GATE_STATUS}" != "pass" ] && [ "${MODE}" = "blocking" ]; then
            echo "Blocking mode: failing job on SDK technical gate '${GATE_STATUS}'" >&2
            exit "${GATE_EXIT}"
          fi
