# Core-owned end-to-end semgrep analysis kernel (v2 orchestration handoff).
#
# This is THE reusable analysis workflow consumers call. It owns the entire
# chain Core is responsible for — governance resolution, SDK provisioning,
# provider execution via the SDK, canonical-bundle validation, SDK gate
# evaluation, agent-payload projection, artifact routing + manifest + upload,
# and GitHub-check publication — so consumer repositories (including
# l9-ci-sdk itself) carry only a thin trigger-and-call stub.
#
# Division of authority (per the SDK integration contract,
# l9.integration-contract/v1):
#   SDK owns  — provider execution (`l9-ci semgrep run` executes semgrep AND
#               normalizes the raw report into the canonical bundle in one
#               SDK-owned process), schema/semantic validation, agent-payload
#               projection, and the gate decision (`l9-ci gate evaluate` is
#               the single gate-decision authority; its exit code and emitted
#               gate-result artifact ARE the verdict).
#   Core owns — orchestration, governance/profile resolution, workflow
#               permissions, artifact upload/retention, and publishing the
#               SDK's verdict as a GitHub check. Core never reconstructs or
#               overrides the SDK's gate decision.
#
# Gate wiring: the `gate` step runs `l9-ci gate evaluate` against the
# validated bundle, captures the canonical gate-result artifact into the
# uploaded artifact set, and records the SDK exit code. The job fails on the
# SDK's non-zero gate exit ONLY in blocking mode, and only AFTER the artifact
# set (including gate-result.json) has been uploaded — so evidence always
# lands even when the gate fails. In advisory/shadow modes the gate outcome
# is published but never fails the job.
#
# Action references are fully qualified and pinned: this reusable workflow
# executes in the CALLER's checkout, so `uses: ./...` local-action refs would
# resolve against the consumer repo (which does not vendor Core's actions)
# and fail. The nested `publish-analysis.yml` call uses the local `./` form,
# which GitHub resolves against the same commit of THIS repository.
# `uses:` does not support expression interpolation, so the Core SHA is
# duplicated literally on every pinned line — update all together when
# bumping (grep: CORE_ACTIONS_PIN).
name: Analyze (semgrep)
on:
  workflow_call:
    inputs:
      profile:
        description: >
          Optional Core execution-profile override. Omit to derive the profile
          from the triggering event using Core's bundled governance defaults.
        type: string
        required: false
        default: ""
      event:
        description: >
          Optional governance event class override for reusable callers. Empty
          derives from the triggering event; workflow_dispatch defaults to the
          nightly class. Release and supply-chain callers should pass their
          explicit class so a manual dispatch is not misclassified as nightly.
        type: string
        required: false
        default: ""
      matrix-id:
        description: Optional artifact matrix identifier.
        type: string
        required: false
        default: pr-semgrep
      language:
        description: >
          Optional compatibility assertion (python or typescript). Core always
          uses SDK capability detection; this value cannot select a language.
        type: string
        required: false
        default: ""
      semgrep-version:
        description: >
          Exact semgrep pin (not a range) — a semgrep minor/patch bump can
          add or remove findings and must be a reviewed, deliberate change.
        type: string
        required: false
        default: "1.171.0"
      sdk-revision:
        description: >
          Full 40-character immutable l9-ci-sdk commit SHA. Empty means the
          Core pin (.l9/sdk-compatibility.yaml default). Any explicit value
          must be listed in that compatibility allowlist.
        type: string
        required: false
        default: ""
      artifact-retention-days:
        type: number
        required: false
        default: 14
    outputs:
      artifact-name:
        description: Uploaded analysis artifact set name.
        value: ${{ jobs.analyze.outputs.artifact-name }}
      artifact-handoff:
        description: Canonical cross-run artifact handoff descriptor JSON.
        value: ${{ jobs.analyze.outputs.artifact-handoff }}
      gate-status:
        description: SDK gate verdict (pass, fail, incomplete).
        value: ${{ jobs.analyze.outputs.gate-status }}
      gate-exit-code:
        description: Raw `l9-ci gate evaluate` exit code.
        value: ${{ jobs.analyze.outputs.gate-exit-code }}
      mode:
        description: Resolved governance mode (blocking, advisory, shadow, disabled).
        value: ${{ jobs.analyze.outputs.mode }}
      enabled:
        description: Whether governance enabled this profile/provider.
        value: ${{ jobs.analyze.outputs.enabled }}
      profile:
        description: Core-resolved execution profile.
        value: ${{ jobs.analyze.outputs.profile }}
      language:
        description: SDK-detected Semgrep language (python, typescript, or none).
        value: ${{ jobs.analyze.outputs.language }}
      sdk-revision:
        description: Provisioned immutable SDK revision.
        value: ${{ jobs.analyze.outputs.sdk-revision }}
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (semgrep -> SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.contract.outputs.profile }}
      mode: ${{ steps.gov.outputs.mode }}
      enabled: ${{ steps.gov.outputs.enabled }}
      language: ${{ steps.language.outputs.language }}
      governance-digest: ${{ steps.gov.outputs['governance-digest'] }}
      artifact-name: ${{ steps.names.outputs['artifact-name'] }}
      artifact-handoff: ${{ steps.handoff.outputs.descriptor }}
      sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
      gate-status: ${{ steps.gate.outputs['gate-status'] }}
      gate-exit-code: ${{ steps.gate.outputs['gate-exit-code'] }}
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password is what GitHub's
          # git-over-HTTPS transport accepts (Bearer is API-only); the header is
          # scoped to github.com so it is not replayed to another host on a
          # redirect. Mirrors actions/checkout and presets/python/.github/workflows/l9-lint-test.yml.
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=${auth_header}" \
              fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - id: contract
        name: Resolve Core execution defaults
        env:
          EVENT_OVERRIDE: ${{ inputs.event }}
          PROFILE_OVERRIDE: ${{ inputs.profile }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_event="${EVENT_OVERRIDE:-${TRIGGER_EVENT}}"
          case "${source_event}" in
            pull_request)
              event="pull_request"
              default_profile="pr_fast"
              ;;
            push)
              event="push"
              default_profile="merge"
              ;;
            merge_group|merge)
              event="merge"
              default_profile="merge"
              ;;
            schedule|workflow_dispatch|nightly)
              event="nightly"
              default_profile="nightly"
              ;;
            release)
              event="release"
              default_profile="release"
              ;;
            supply_chain)
              event="supply_chain"
              default_profile="supply_chain"
              ;;
            *)
              echo "Core does not define a default profile for event ${source_event}" >&2
              exit 2
              ;;
          esac
          profile="${PROFILE_OVERRIDE:-${default_profile}}"
          {
            echo "event=${event}"
            echo "profile=${profile}"
          } >> "${GITHUB_OUTPUT}"
      - id: gov
        name: Resolve governance (Core)
        # CORE_ACTIONS_PIN; this revision exports identity-map-directory and
        # includes the bundled map bytes in governance-digest.
        uses: Quantum-L9/l9-ci-core/.github/actions/resolve-governance@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          profile: ${{ steps.contract.outputs.profile }}
          provider: semgrep
          event-name: ${{ steps.contract.outputs.event }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
      - id: names
        name: Resolve artifact name
        env:
          MATRIX_ID: ${{ inputs.matrix-id }}
        run: |
          set -euo pipefail
          if [[ ! "${MATRIX_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid matrix-id" >&2
            exit 2
          fi
          echo "artifact-name=l9-semgrep-${MATRIX_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"
      - id: sdk
        name: Provision immutable SDK
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/provision-sdk@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          sdk-source: git
          sdk-repository: https://github.com/Quantum-L9/l9-ci-sdk.git
          sdk-revision: ${{ inputs.sdk-revision || 'bc678190582694f6efee08b6b7ea39be7e09bd5c' }}
      - id: language
        name: Detect repository language (SDK)
        if: steps.gov.outputs.enabled == 'true'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/detect-language@645ea6e5d4ef78735605e6df4ed10d4388921e07
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          root: .
      - name: Validate compatibility language assertion
        if: steps.gov.outputs.enabled == 'true' && inputs.language != ''
        env:
          ASSERTED_LANGUAGE: ${{ inputs.language }}
          DETECTED_LANGUAGE: ${{ steps.language.outputs.language }}
        run: |
          set -euo pipefail
          case "${ASSERTED_LANGUAGE}" in
            python|typescript) ;;
            *)
              echo "language must be python or typescript when supplied" >&2
              exit 2
              ;;
          esac
          if [ "${ASSERTED_LANGUAGE}" != "${DETECTED_LANGUAGE}" ]; then
            echo "language assertion ${ASSERTED_LANGUAGE} disagrees with SDK capability detection ${DETECTED_LANGUAGE}" >&2
            exit 2
          fi
      # The lock resolves its closure for one exact interpreter, so the
      # interpreter has to be selected as deliberately as the packages are.
      # Without this the runner's default `python` decides which
      # marker-selected wheels the digests are checked against, and
      # `--require-hashes --only-binary` turns that drift into a hard failure.
      # The previous raw `pip install` tolerated it by re-resolving silently;
      # adopting the locked closure without its precondition would trade a
      # silent defect for an availability one. Mirrors org-ci.yml.
      - name: Set up locked Python for the central toolchain
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - id: semgrep
        name: Install Semgrep (hash-locked central pin)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN — its verified executable is handed to semgrep-run.
        # `semgrep==X` alone pins one package and lets pip re-resolve the rest
        # of the closure against whatever PyPI and the runner image offer that
        # day, which is how this analysis could change behaviour without a Core
        # source revision changing. The action ships a hash-locked closure and
        # fails closed on a version it has no lock for. org-ci.yml already
        # installs Semgrep this way; this is the same mechanism, not a second.
        uses: Quantum-L9/l9-ci-core/.github/actions/install-semgrep@def55c54ff4ba654c2ebea088dde71db0b5f7135
        with:
          semgrep-version: ${{ inputs.semgrep-version }}
      - name: Run + normalize semgrep (SDK)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        # `l9-ci semgrep run` (via invoke-sdk) runs Semgrep with the SDK's
        # packaged ruleset while Core passes the one verified provider binary.
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: semgrep-run
          language: ${{ steps.language.outputs.language }}
          raw-output: artifacts/raw/semgrep/${{ inputs.matrix-id }}/report.json
          output: .l9/runtime/${{ inputs.matrix-id }}/finding-bundle.json
          root: .
          snapshot-id: ${{ github.sha }}
          revision: ${{ github.sha }}
          provider-executable: ${{ steps.semgrep.outputs.executable }}
          strict: ${{ steps.gov.outputs.strict }}
          required: ${{ steps.gov.outputs['required-provider'] }}
          policy: ${{ steps.gov.outputs['sdk-policy'] }}
          identity-map: ${{ steps.gov.outputs['identity-map-directory'] }}/${{ steps.language.outputs.language }}.yaml
      - name: Validate canonical bundle
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/validate-bundle@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          bundle: .l9/runtime/${{ inputs.matrix-id }}/finding-bundle.json
      - id: gate
        name: Evaluate gate (SDK verdict)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        run: |
          set -euo pipefail
          # The SDK is the single gate-decision authority. Capture its
          # canonical gate-result artifact and exit code; enforcement is
          # deferred to the final assert step so the artifact set (with the
          # gate result inside) is always uploaded first.
          args=(
            gate evaluate
            --bundle ".l9/runtime/${L9_MATRIX_ID}/finding-bundle.json"
            --output ".l9/runtime/${L9_MATRIX_ID}/gate-result.json"
          )
          if [ "${L9_STRICT:-}" = "true" ]; then
            args+=(--strict-unresolved)
          else
            args+=(--no-strict-unresolved)
          fi
          exit_code=0
          "${L9_EXECUTABLE}" "${args[@]}" || exit_code=$?
          case "${exit_code}" in
            0) status="pass" ;;
            1) status="fail" ;;
            6) status="incomplete" ;;
            *)
              echo "gate evaluate failed with unexpected exit ${exit_code}" >&2
              exit "${exit_code}"
              ;;
          esac
          {
            echo "gate-status=${status}"
            echo "gate-exit-code=${exit_code}"
          } >> "$GITHUB_OUTPUT"
          echo "SDK gate verdict: ${status} (exit ${exit_code})"
        env:
          L9_EXECUTABLE: ${{ steps.sdk.outputs.executable }}
          L9_MATRIX_ID: ${{ inputs.matrix-id }}
          L9_STRICT: ${{ steps.gov.outputs.strict }}
      - name: Project agent-review payload
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          operation: bundle-project-agent-payload
          input: .l9/runtime/${{ inputs.matrix-id }}/finding-bundle.json
          output: .l9/runtime/${{ inputs.matrix-id }}/agent-review-payload.json
          strict: ${{ steps.gov.outputs.strict }}
      - name: Project SARIF (SDK-owned)
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/invoke-sdk@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          executable: ${{ steps.sdk.outputs.executable }}
          # The SDK deterministically projects the canonical bundle to SARIF;
          # Core never translates findings or uploads raw provider JSON as SARIF.
          operation: bundle-project-sarif
          input: .l9/runtime/${{ inputs.matrix-id }}/finding-bundle.json
          output: .l9/runtime/${{ inputs.matrix-id }}/results.sarif
          strict: ${{ steps.gov.outputs.strict }}
      - id: route
        name: Route artifacts
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/route-artifacts@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          provider: semgrep
          matrix-id: ${{ inputs.matrix-id }}
          raw-report: artifacts/raw/semgrep/${{ inputs.matrix-id }}/report.json
          bundle: .l9/runtime/${{ inputs.matrix-id }}/finding-bundle.json
          agent-payload: .l9/runtime/${{ inputs.matrix-id }}/agent-review-payload.json
          sarif: .l9/runtime/${{ inputs.matrix-id }}/results.sarif
          destination-root: artifacts
      - name: Stage gate result with canonical artifacts
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          L9_MATRIX_ID: ${{ inputs.matrix-id }}
        run: |
          set -euo pipefail
          cp ".l9/runtime/${L9_MATRIX_ID}/gate-result.json" \
            "artifacts/l9/${L9_MATRIX_ID}/gate-result.json"
      - name: Build artifact manifest
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/build-artifact-manifest@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          provider: semgrep
          matrix-id: ${{ inputs.matrix-id }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          repository: ${{ github.repository }}
          repository-revision: ${{ github.sha }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          artifact-root: artifacts
          bundle: ${{ steps.route.outputs.bundle }}
          agent-payload: ${{ steps.route.outputs['agent-payload'] }}
          raw-directory: ${{ steps.route.outputs['raw-directory'] }}
          routing-record: ${{ steps.route.outputs['routing-record'] }}
          output: artifacts/metadata/${{ inputs.matrix-id }}/artifact-index.json
      - id: upload
        name: Upload analysis artifact set
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.names.outputs['artifact-name'] }}
          path: |
            artifacts/raw/semgrep/${{ inputs.matrix-id }}/
            artifacts/l9/${{ inputs.matrix-id }}/
            artifacts/metadata/${{ inputs.matrix-id }}/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
      - id: handoff
        name: Create artifact handoff descriptor
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        # CORE_ACTIONS_PIN
        uses: Quantum-L9/l9-ci-core/.github/actions/create-artifact-handoff@05e842683d54a54ad074d9f4f9105813c42b6954
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-name: ${{ steps.names.outputs['artifact-name'] }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
          provider: semgrep
          matrix-id: ${{ inputs.matrix-id }}
          repository: ${{ github.repository }}
          repository-revision: ${{ github.sha }}
          sdk-revision: ${{ steps.sdk.outputs['sdk-revision'] }}
          output: .l9/runtime/handoffs/${{ inputs.matrix-id }}.json
      - name: Enforce SDK gate verdict
        if: steps.gov.outputs.enabled == 'true' && steps.language.outputs.language != 'none'
        env:
          GATE_STATUS: ${{ steps.gate.outputs['gate-status'] }}
          GATE_EXIT: ${{ steps.gate.outputs['gate-exit-code'] }}
          MODE: ${{ steps.gov.outputs.mode }}
        run: |
          set -euo pipefail
          echo "SDK gate verdict: ${GATE_STATUS} (exit ${GATE_EXIT}); mode: ${MODE}"
          if [ "${GATE_STATUS}" != "pass" ] && [ "${MODE}" = "blocking" ]; then
            echo "Blocking mode: failing job on SDK gate verdict '${GATE_STATUS}'" >&2
            exit "${GATE_EXIT}"
          fi
  publish:
    name: Publish analysis (Core)
    needs: analyze
    if: needs.analyze.outputs.enabled == 'true' && needs.analyze.outputs.language != 'none'
    # Nested local reusable-workflow call: resolved against the same commit
    # of THIS repository, so publish-analysis.yml and its own pinned action
    # refs travel together with this file.
    uses: ./.github/workflows/publish-analysis.yml
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      artifact-name: ${{ needs.analyze.outputs['artifact-name'] }}
      profile: ${{ needs.analyze.outputs.profile }}
      mode: ${{ needs.analyze.outputs.mode }}
      provider: semgrep
      matrix-id: ${{ inputs.matrix-id }}
      sdk-revision: ${{ needs.analyze.outputs['sdk-revision'] }}
      governance-digest: ${{ needs.analyze.outputs['governance-digest'] }}
      repository-revision: ${{ github.sha }}
      workflow-result: ${{ needs.analyze.result }}
