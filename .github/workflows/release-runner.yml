# Core-owned release runner (docs/RELEASING.md §4; .l9/release-plane.yaml
# consumer_release_engine).
#
# Organization CI (org-ci.yml) runs in consumer repositories only on
# pull_request, so a version bump merged to a consumer's default branch cannot
# release from inside it (operator evidence 2026-11-15). The release engine and
# this workflow live in Core. It is a reusable workflow: Core runs it for
# every current member of the L9 repository registry that declares
# .l9/release.json, but it is SCHEDULED by the repository that holds the
# organization's repo-birth App credential, Quantum-L9/l9-repo-template
# (.github/workflows/release-schedule.yml there). No credential is created for
# releases and none lives in Core (operator decision 2026-11-15).
#
# Credential resolution (GitHub docs, verified 2026-11-15):
#   - reusable workflows: "the github context is always associated with the
#     caller workflow"; "To use an environment secret in a reusable workflow,
#     set environment on the job in the reusable workflow ... The caller
#     workflow must still pass the secret" ("Use secrets: inherit or pass the
#     secret by name"; this workflow declares BIRTH_APP_PRIVATE_KEY so the
#     caller passes exactly that one secret by name);
#   - variables: "For reusable workflows, the variables from the caller
#     workflow's repository are used."
# So every credentialed job below names `environment: ${{ inputs.environment }}`
# (default repo-birth) and reads that CALLER environment's existing
# vars.BIRTH_APP_ID and secrets.BIRTH_APP_PRIVATE_KEY, the same names the
# factory's birth jobs use. The environment's main-only deployment policy
# applies to the caller's ref.
#
# Authority: GITHUB_TOKEN stays contents:read. Every write uses an installation
# token of the repo-birth App, minted per target and scoped to exactly that one
# repository with contents:write. Each target is its own matrix job (fail-fast
# off, so one repository's failure never blocks another) with its own
# concurrency group. Core is checked out at `core-ref`, the exact commit the
# caller pins in `uses:`, and the run refuses if the checkout differs.
name: Release runner (Core)

on:
  workflow_call:
    inputs:
      repository:
        description: >-
          Release only this repository of the organization now (name or
          owner/name). Empty releases every declared repository.
        type: string
        required: false
        default: ""
      core-ref:
        description: >-
          The 40-hex Quantum-L9/l9-ci-core commit the caller pins in `uses:`.
          The engine is checked out at exactly this commit.
        type: string
        required: true
      environment:
        description: >-
          The caller-repository environment that holds vars.BIRTH_APP_ID and
          secrets.BIRTH_APP_PRIVATE_KEY.
        type: string
        required: false
        default: repo-birth
    secrets:
      BIRTH_APP_PRIVATE_KEY:
        description: >-
          Pass by name from the caller (BIRTH_APP_PRIVATE_KEY mapped to the
          caller's secret of the same name). The credentialed jobs name
          `environment`, so GitHub supplies the caller environment's secret of
          this name.
        required: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover release targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
      errors: ${{ steps.discover.outputs.errors }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: Quantum-L9/l9-ci-core
          ref: ${{ inputs.core-ref }}
          persist-credentials: false
      - name: Refuse a Core checkout that is not the pinned commit
        env:
          CORE_REF: ${{ inputs.core-ref }}
        run: |
          set -euo pipefail
          [[ "${CORE_REF}" =~ ^[0-9a-f]{40}$ ]] || { echo "core-ref must be a 40-hex commit: '${CORE_REF}'" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "${CORE_REF}" ] || { echo "Core checkout $(git rev-parse HEAD) != core-ref ${CORE_REF}" >&2; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: members
        name: Read candidate repositories from the L9 repository registry
        env:
          OWNER: ${{ github.repository_owner }}
          DISPATCHED: ${{ inputs.repository }}
        run: python3 -m tools.l9_release.runner members --owner "${OWNER}" --repository "${DISPATCHED}"
      - id: app
        name: Mint a read-only token for exactly those repositories
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BIRTH_APP_ID }}
          private-key: ${{ secrets.BIRTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.members.outputs.repositories }}
          permission-contents: read
          permission-metadata: read
      - id: discover
        name: Discover repositories that declare .l9/release.json
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          MEMBERS: ${{ steps.members.outputs.repositories }}
          # A one-repository release is strict: an undeclared or unreadable
          # target fails the run instead of being reported and skipped.
          STRICT: ${{ inputs.repository != '' }}
        run: |
          set -euo pipefail
          args=(discover --owner "${OWNER}" --members "${MEMBERS}")
          if [ "${STRICT}" = "true" ]; then args+=(--strict); fi
          python3 -m tools.l9_release.runner "${args[@]}"

  release:
    name: Release ${{ matrix.repository }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # One release at a time per target repository, never cancelled: a run
    # cancelled between the exact tag and the Release would strand it (the
    # engine's re-plan finishes it, but only if it gets to run).
    concurrency:
      group: l9-release-${{ matrix.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          repository: Quantum-L9/l9-ci-core
          ref: ${{ inputs.core-ref }}
          path: core
          persist-credentials: false
      - name: Refuse a Core checkout that is not the pinned commit
        working-directory: core
        env:
          CORE_REF: ${{ inputs.core-ref }}
        run: |
          set -euo pipefail
          [[ "${CORE_REF}" =~ ^[0-9a-f]{40}$ ]] || { echo "core-ref must be a 40-hex commit: '${CORE_REF}'" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "${CORE_REF}" ] || { echo "Core checkout $(git rev-parse HEAD) != core-ref ${CORE_REF}" >&2; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: false
      - id: app
        name: Mint a contents:write token for this one repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BIRTH_APP_ID }}
          private-key: ${{ secrets.BIRTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.name }}
          permission-contents: write
      - name: Check out the target default branch head
        id: target
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ matrix.repository }}
          BRANCH: ${{ matrix.default_branch }}
        run: |
          set -euo pipefail
          git init --quiet target
          cd target
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Basic auth with the token as password, scoped to github.com, as
          # actions/checkout does. The engine's tag pushes reuse it; the
          # directory is discarded with the runner.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git config "http.https://github.com/.extraheader" "${auth}"
          git -c protocol.version=2 fetch --quiet --no-tags origin "refs/heads/${BRANCH}"
          git checkout --quiet --detach FETCH_HEAD
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - id: plan
        name: Plan
        working-directory: core
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ matrix.repository }}
          COMMIT: ${{ steps.target.outputs.commit }}
          L9_RELEASE_ENGINE_REVISION: ${{ inputs.core-ref }}
        run: python3 -m tools.l9_release --workspace ../target --repository "${REPOSITORY}" --commit "${COMMIT}" plan
      - name: Build (make-v1 phases, then two clean rounds)
        if: steps.plan.outputs.work_pending == 'true'
        working-directory: core
        env:
          REPOSITORY: ${{ matrix.repository }}
          COMMIT: ${{ steps.target.outputs.commit }}
        run: >-
          python3 -m tools.l9_release --workspace ../target --repository "${REPOSITORY}"
          --commit "${COMMIT}" build --out "${RUNNER_TEMP}/l9-release-dist"
          --scratch "${RUNNER_TEMP}/l9-release-scratch" --phases run
      - name: Publish and verify
        if: steps.plan.outputs.work_pending == 'true'
        working-directory: core
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ matrix.repository }}
          COMMIT: ${{ steps.target.outputs.commit }}
          L9_RELEASE_ENGINE_REVISION: ${{ inputs.core-ref }}
        run: >-
          python3 -m tools.l9_release --workspace ../target --repository "${REPOSITORY}"
          --commit "${COMMIT}" publish --dist "${RUNNER_TEMP}/l9-release-dist"

  report:
    name: Release runner result
    needs: [discover, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail on any discovery error or failed release
        env:
          DISCOVER: ${{ needs.discover.result }}
          RELEASE: ${{ needs.release.result }}
          ERRORS: ${{ needs.discover.outputs.errors }}
          COUNT: ${{ needs.discover.outputs.count }}
        run: |
          set -euo pipefail
          echo "discover=${DISCOVER} release=${RELEASE} targets=${COUNT:-0} errors=${ERRORS:-[]}"
          if [ "${DISCOVER}" != "success" ]; then exit 1; fi
          if [ -n "${ERRORS}" ] && [ "${ERRORS}" != "[]" ]; then exit 1; fi
          case "${RELEASE}" in success|skipped) ;; *) exit 1 ;; esac
