---
name: Governed Semgrep normalization
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      report-path:
        type: string
        required: true
      report-artifact-name:
        type: string
        required: false
        default: ""
      snapshot-id:
        type: string
        required: true
      matrix-id:
        type: string
        required: true
      provider-version:
        type: string
        required: false
        default: unknown
      repository-root:
        type: string
        required: false
        default: .
      repository-revision:
        type: string
        required: false
        default: ""
      governance-root:
        type: string
        required: false
        default: .github/governance
      identity-map:
        type: string
        required: false
        default: ""
      evaluation-date:
        type: string
        required: false
        default: ""
      sdk-revision:
        type: string
        required: false
        default: 0c487747b0fcd172edaefe9e843dac818de8fc12
      minimum-sdk-version:
        type: string
        required: false
        default: "1.0.0"
      retention-days:
        type: number
        required: false
        default: 14
    outputs:
      mode:
        value: ${{ jobs.governance.outputs.mode }}
      artifact-name:
        value: ${{ jobs.normalize.outputs['artifact-name'] }}
      bundle-path:
        value: ${{ jobs.normalize.outputs['bundle-path'] }}
      payload-path:
        value: ${{ jobs.normalize.outputs['payload-path'] }}
      gate-result-path:
        value: ${{ jobs.normalize.outputs['gate-result-path'] }}
      workflow-conclusion:
        value: ${{ jobs.normalize.outputs['workflow-conclusion'] }}
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.governance.outputs.mode }}
      enabled: ${{ steps.governance.outputs.enabled }}
      strict: ${{ steps.governance.outputs.strict }}
      required-provider: >-
        ${{ steps.governance.outputs['required-provider'] }}
      sdk-policy: ${{ steps.governance.outputs['sdk-policy'] }}
      sdk-profile: ${{ steps.governance.outputs['sdk-profile'] }}
      waiver-ids: ${{ steps.governance.outputs['waiver-ids'] }}
      governance-digest: >-
        ${{ steps.governance.outputs['governance-digest'] }}
    steps:
      - name: Checkout immutable caller revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.repository-revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout Core workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .l9/runtime/core-control-plane
          fetch-depth: 1
          persist-credentials: false
      - id: governance
        name: Resolve governance
        uses: >-
          ./.l9/runtime/core-control-plane/.github/actions/resolve-governance
        with:
          profile: ${{ inputs.profile }}
          provider: semgrep
          event-name: ${{ github.event_name }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          governance-root: ${{ inputs.governance-root }}
          evaluation-date: ${{ inputs.evaluation-date }}
      - name: Record governance resolution
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          MODE: ${{ steps.governance.outputs.mode }}
          REQUIRED: ${{ steps.governance.outputs['required-provider'] }}
          STRICT: ${{ steps.governance.outputs.strict }}
          WAIVERS: ${{ steps.governance.outputs['waiver-ids'] }}
          DIGEST: ${{ steps.governance.outputs['governance-digest'] }}
        run: |
          {
            echo "profile=${PROFILE}"
            echo "mode=${MODE}"
            echo "required=${REQUIRED}"
            echo "strict=${STRICT}"
            echo "waivers=${WAIVERS}"
            echo "governance_digest=${DIGEST}"
          }
  normalize:
    needs:
      - governance
    if: needs.governance.outputs.enabled == 'true'
    uses: ./.github/workflows/normalize-semgrep-report.yml
    with:
      report-path: ${{ inputs.report-path }}
      report-artifact-name: ${{ inputs.report-artifact-name }}
      snapshot-id: ${{ inputs.snapshot-id }}
      matrix-id: ${{ inputs.matrix-id }}
      provider-version: ${{ inputs.provider-version }}
      repository-root: ${{ inputs.repository-root }}
      repository-revision: ${{ inputs.repository-revision }}
      identity-map: ${{ inputs.identity-map }}
      policy: ${{ needs.governance.outputs.sdk-policy }}
      strict: ${{ needs.governance.outputs.strict == 'true' }}
      required-provider: >-
        ${{ needs.governance.outputs.required-provider == 'true' }}
      sdk-revision: ${{ inputs.sdk-revision }}
      minimum-sdk-version: ${{ inputs.minimum-sdk-version }}
      retention-days: ${{ inputs.retention-days }}
  enforce:
    needs:
      - governance
      - normalize
    if: >-
      always() &&
      needs.governance.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce governed SDK result
        shell: bash
        env:
          NORMALIZE_RESULT: ${{ needs.normalize.result }}
          MODE: ${{ needs.governance.outputs.mode }}
          WORKFLOW_CONCLUSION: >-
            ${{ needs.normalize.outputs['workflow-conclusion'] }}
        run: |
          set -euo pipefail
          if [ "${NORMALIZE_RESULT}" != "success" ]; then
            echo "Semgrep normalization did not complete successfully" >&2
            exit 1
          fi
          case "${MODE}" in
            blocking)
              if [ "${WORKFLOW_CONCLUSION}" != "success" ]; then
                echo "SDK gate result blocks this profile" >&2
                exit 1
              fi
              ;;
            advisory|shadow)
              ;;
            *)
              echo "Unsupported governance mode: ${MODE}" >&2
              exit 2
              ;;
          esac
  disabled:
    needs:
      - governance
    if: needs.governance.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record disabled provider
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          MODE: ${{ needs.governance.outputs.mode }}
        run: |
          set -euo pipefail
          echo "Semgrep disabled for profile ${PROFILE} in mode ${MODE}"
