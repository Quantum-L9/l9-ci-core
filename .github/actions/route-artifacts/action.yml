---
name: Route analysis artifacts
description: >-
  Copies raw and SDK-produced canonical files into collision-safe Core artifact
  locations without altering canonical bytes.
inputs:
  provider:
    required: true
  matrix-id:
    required: true
  raw-report:
    required: true
  bundle:
    required: true
  agent-payload:
    required: true
  gate-result:
    description: Optional SDK-produced canonical gate-result artifact.
    required: false
    default: ""
  destination-root:
    required: false
    default: artifacts
outputs:
  raw-directory:
    value: ${{ steps.route.outputs['raw-directory'] }}
  bundle:
    value: ${{ steps.route.outputs.bundle }}
  agent-payload:
    value: ${{ steps.route.outputs['agent-payload'] }}
  gate-result:
    value: ${{ steps.gate.outputs['gate-result'] }}
runs:
  using: composite
  steps:
    - id: route
      shell: bash
      env:
        L9_PROVIDER: ${{ inputs.provider }}
        L9_MATRIX_ID: ${{ inputs.matrix-id }}
        L9_RAW_REPORT: ${{ inputs.raw-report }}
        L9_BUNDLE: ${{ inputs.bundle }}
        L9_AGENT_PAYLOAD: ${{ inputs.agent-payload }}
        L9_DESTINATION_ROOT: ${{ inputs.destination-root }}
      run: python3 "${{ github.action_path }}/route.py"
    - id: gate
      if: ${{ inputs.gate-result != '' }}
      shell: bash
      env:
        L9_MATRIX_ID: ${{ inputs.matrix-id }}
        L9_GATE_RESULT: ${{ inputs.gate-result }}
        L9_DESTINATION_ROOT: ${{ inputs.destination-root }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from __future__ import annotations
        import hashlib
        import json
        import os
        import shutil
        from pathlib import Path
        from typing import Any
        workspace = Path(
            os.environ.get("GITHUB_WORKSPACE", Path.cwd())
        ).resolve()
        matrix_id = os.environ["L9_MATRIX_ID"].strip()
        source_value = os.environ["L9_GATE_RESULT"].strip()
        destination_value = os.environ["L9_DESTINATION_ROOT"].strip()
        if not matrix_id:
            raise SystemExit("matrix-id is required")
        source = Path(source_value)
        source = (
            source.resolve()
            if source.is_absolute()
            else (workspace / source).resolve()
        )
        destination_root = Path(destination_value)
        destination_root = (
            destination_root.resolve()
            if destination_root.is_absolute()
            else (workspace / destination_root).resolve()
        )
        source.relative_to(workspace)
        destination_root.relative_to(workspace)
        if not source.is_file():
            raise SystemExit("gate result does not exist")
        destination = (
            destination_root
            / "l9"
            / matrix_id
            / "gate-result.json"
        )
        destination.parent.mkdir(parents=True, exist_ok=True)
        if source != destination.resolve():
            shutil.copyfile(source, destination)
        source_digest = hashlib.sha256(source.read_bytes()).hexdigest()
        destination_digest = hashlib.sha256(
            destination.read_bytes()
        ).hexdigest()
        if source_digest != destination_digest:
            raise SystemExit("gate-result copy changed canonical bytes")
        routing_record = (
            destination_root
            / "metadata"
            / matrix_id
            / "routing-record.json"
        )
        document: Any = json.loads(
            routing_record.read_text(encoding="utf-8")
        )
        if not isinstance(document, dict):
            raise SystemExit("routing record must be an object")
        artifacts = document.get("artifacts")
        if not isinstance(artifacts, dict):
            raise SystemExit("routing record artifacts must be an object")
        artifacts["gate_result"] = {
            "path": destination.resolve().as_posix(),
            "sha256": destination_digest,
        }
        routing_record.write_text(
            json.dumps(
                document,
                sort_keys=True,
                separators=(",", ":"),
            )
            + "\n",
            encoding="utf-8",
        )
        output = os.environ.get("GITHUB_OUTPUT")
        if output:
            with open(output, "a", encoding="utf-8") as stream:
                stream.write(
                    f"gate-result={destination.resolve().as_posix()}\n"
                )
        PY
