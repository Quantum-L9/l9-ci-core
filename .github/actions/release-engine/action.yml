name: L9 release engine
description: >
  Runs one stage of Core's upstream release engine (tools/l9_release) against
  the consumer checkout in the workspace, with immutable Core runtime code from
  this pinned action revision. The consumer contributes only its
  .l9/release.json (l9.release/v1) declaration; a repository without one is a
  no-op. Stages: plan (read-only decision), build (two clean rounds,
  byte-identical or fail), publish (exact tag, GitHub Release, assets, optional
  forward-only major tag, then verify), verify (re-download and check).
inputs:
  stage:
    description: plan, build, publish, or verify
    required: true
  workspace:
    required: false
    default: .
  dist:
    description: Artifact directory (build output; publish and verify input)
    required: false
    default: ""
  phases:
    description: >
      build only: verified-upstream when a preceding job ran the make-v1
      phases at this SHA, or run to execute them in a clean clone first.
    required: false
    default: ""
outputs:
  configured:
    description: Whether the repository declares .l9/release.json (plan)
    value: ${{ steps.engine.outputs.configured }}
  work-pending:
    description: Whether any release side effect is still pending (plan)
    value: ${{ steps.engine.outputs.work_pending }}
  exact-tag:
    value: ${{ steps.engine.outputs.exact_tag }}
  version:
    value: ${{ steps.engine.outputs.version }}
runs:
  using: composite
  steps:
    - id: engine
      shell: bash
      env:
        L9_RELEASE_STAGE: ${{ inputs.stage }}
        L9_RELEASE_WORKSPACE: ${{ inputs.workspace }}
        L9_RELEASE_DIST: ${{ inputs.dist }}
        L9_RELEASE_PHASES: ${{ inputs.phases }}
        L9_RELEASE_ENGINE_REVISION: ${{ github.action_ref }}
        L9_RELEASE_COMMIT: ${{ github.sha }}
      run: python3 "${{ github.action_path }}/release_engine.py"
