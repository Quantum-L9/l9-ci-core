name: Retrieve verified artifact set
description: >
  Downloads one exact GitHub Actions artifact by name, verifies the complete
  relocatable Core integrity index, and exposes safe routes without reading
  SDK-owned finding-bundle, agent-payload, or SARIF semantics.
inputs:
  artifact-name:
    description: Exact immutable artifact name produced by Core.
    required: true
  matrix-id:
    required: true
  provider:
    required: false
    default: semgrep
  repository:
    description: Expected owner/name identity of the analyzed repository.
    required: true
  repository-revision:
    description: Expected full immutable revision of the analyzed repository.
    required: true
  sdk-revision:
    description: Expected full immutable SDK revision recorded by Core.
    required: true
  destination:
    description: Empty destination directory for the downloaded artifact set.
    required: false
    default: .l9/runtime/artifact-download
outputs:
  artifact-root:
    value: ${{ steps.verify.outputs.artifact-root }}
  index:
    value: ${{ steps.verify.outputs.index }}
  bundle:
    value: ${{ steps.verify.outputs.bundle }}
  agent-payload:
    value: ${{ steps.verify.outputs.agent-payload }}
  raw-directory:
    value: ${{ steps.verify.outputs.raw-directory }}
  routing-record:
    value: ${{ steps.verify.outputs.routing-record }}
  sarif:
    value: ${{ steps.verify.outputs.sarif }}
runs:
  using: composite
  steps:
    - name: Validate empty retrieval destination
      shell: bash
      env:
        L9_DESTINATION: ${{ inputs.destination }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/prepare.py"
    - name: Download exact analysis artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.destination }}
    - id: verify
      name: Verify complete artifact integrity index
      shell: bash
      env:
        L9_ARTIFACT_ROOT: ${{ inputs.destination }}
        L9_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        L9_MATRIX_ID: ${{ inputs.matrix-id }}
        L9_PROVIDER: ${{ inputs.provider }}
        L9_REPOSITORY: ${{ inputs.repository }}
        L9_REPOSITORY_REVISION: ${{ inputs.repository-revision }}
        L9_SDK_REVISION: ${{ inputs.sdk-revision }}
      run: python3 "${{ github.action_path }}/retrieve.py"
