      "package": "pyjwt",
      "version": "2.13.0",
      "reason": "PyJWT is imported but never called by `semgrep scan`: in Semgrep 1.171.0's locked closure its only callers are semgrep/mcp/utilities/token_verifier.py (bearer-token verification of the `semgrep mcp` server) and mcp/client/auth/extensions/client_credentials.py (the MCP OAuth client), so no JWT, JWK or JWKS is decoded, verified or fetched. Core runs this Semgrep closure only as `semgrep scan` (l9-ci-sdk 4a887396 (l9_ci/providers/semgrep/provider.py)), on an ephemeral GitHub-hosted runner, with no --trace and an environment reduced to PATH, HOME, TMPDIR, TEMP and TMP; an org-wide code search (2026-11-21) finds no `semgrep mcp`, `semgrep login` or `--trace` call on this install.",
