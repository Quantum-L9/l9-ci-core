name: Run repository verification
description: >
  Runs the canonical repository-execution contract with immutable Core runtime
  code. Consumer workflow/runtime code is never imported as execution authority.
  Contract enforcement mode is resolved from this action's bundled
  contract-policy.json for the runner-supplied repository and, for a
  repository it does not list, from the live Quantum-L9/.github repository
  registry (lifecycle current is required; unreadable fails closed). No input
  selects it. Core-owned files of a stamped consumer (.l9/core-stamp.json) are
  verified byte-for-byte; drift blocks in every mode, and a repository
  without a stamp record is not stamp-checked. A tracked file holding an
  unresolved merge conflict (a complete <<<<<<< / ======= / >>>>>>> block)
  fails every repository, with or without a contract.
inputs:
  workspace:
    required: false
    default: .
  github-read-token:
    description: >
      Read-only token (organization secret L9_GITHUB_READ_TOKEN). The registry
      snapshot and the composer prefetch receive it. Both run before any
      consumer code. The verify step, which runs the consumer's make targets,
      does not. Empty reads anonymously.
    required: false
    default: ""
  event-name:
    description: >
      Empty (default): the consumer's make targets run under this run's own
      GitHub context. push: they run as a push of the checked-out commit to
      event-ref (GITHUB_EVENT_NAME, GITHUB_SHA, GITHUB_REF, GITHUB_EVENT_PATH
      set for that commit; GITHUB_BASE_REF and GITHUB_HEAD_REF cleared). The
      promotion canary uses push, since its legs check out a consumer's main
      SHA inside a Core pull_request run. Any other value fails verification.
    required: false
    default: ""
  event-ref:
    description: refs/heads/<branch> the push targets; required with event-name push.
    required: false
    default: ""
outputs:
  present:
    value: ${{ steps.verify.outputs.present }}
  status:
    description: pass, not_applicable (migration mode, contract absent), or fail
    value: ${{ steps.verify.outputs.status }}
  contract-mode:
    description: migration or required, resolved from Core's bundled policy
    value: ${{ steps.verify.outputs.contract-mode }}
  contract-version:
    description: absent, v1, v2, or invalid
    value: ${{ steps.verify.outputs.contract-version }}
  failure-kind:
    description: none, contract, command, or infrastructure
    value: ${{ steps.verify.outputs.failure-kind }}
runs:
  using: composite
  steps:
    # These steps run before any consumer code and are the only steps that
    # hold the token. external checks out .l9/external-checkout.json when a
    # consumer declared one. The verify step does not receive the token.
    - id: registry
      shell: bash
      env:
        L9_GITHUB_READ_TOKEN: ${{ inputs.github-read-token }}
      run: python3 "${{ github.action_path }}/run.py" --snapshot-registry "${RUNNER_TEMP}/l9-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.yaml"
    - id: composer
      shell: bash
      env:
        L9_GITHUB_READ_TOKEN: ${{ inputs.github-read-token }}
        L9_REPOSITORY_WORKSPACE: ${{ inputs.workspace }}
      run: python3 "${{ github.action_path }}/run.py" --prefetch-composer "${RUNNER_TEMP}/l9-composer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
    - id: external
      name: Check out a declared external repository
      shell: bash
      env:
        L9_GITHUB_READ_TOKEN: ${{ inputs.github-read-token }}
        L9_REPOSITORY_WORKSPACE: ${{ inputs.workspace }}
      run: python3 "${GITHUB_ACTION_PATH}/../checkout-external/checkout.py"
    - id: verify
      shell: bash
      env:
        L9_REPOSITORY_WORKSPACE: ${{ inputs.workspace }}
        L9_REPOSITORY_IDENTITY: ${{ github.repository }}
        L9_REGISTRY_SNAPSHOT: ${{ runner.temp }}/l9-registry-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.yaml
        SEED_COMPOSER_ROOT: ${{ steps.composer.outputs.seed-root }}
        L9_VERIFICATION_EVENT: ${{ inputs.event-name }}
        L9_VERIFICATION_REF: ${{ inputs.event-ref }}
      run: python3 "${{ github.action_path }}/run.py"
