name: Resolve Core governance
description: >
  Resolves the centrally owned execution profile, provider mode, requiredness,
  SDK policy selection, staged Semgrep identity maps, and applicable waivers without
  reading canonical findings.
  The default governance bundle is shipped with this pinned Core action and never
  depends on files copied into the consumer repository.
inputs:
  profile:
    required: true
  provider:
    required: true
  event-name:
    required: true
  repository:
    required: true
  ref:
    required: true
  evaluation-date:
    required: false
    description: ISO-8601 UTC date used for deterministic waiver validation.
outputs:
  sdk-profile:
    value: ${{ steps.resolve.outputs.sdk-profile }}
  mode:
    value: ${{ steps.resolve.outputs.mode }}
  enabled:
    value: ${{ steps.resolve.outputs.enabled }}
  strict:
    value: ${{ steps.resolve.outputs.strict }}
  required-provider:
    value: ${{ steps.resolve.outputs.required-provider }}
  sdk-policy:
    value: ${{ steps.resolve.outputs.sdk-policy }}
  identity-map-directory:
    value: ${{ steps.resolve.outputs.identity-map-directory }}
  waiver-ids:
    value: ${{ steps.resolve.outputs.waiver-ids }}
  governance-digest:
    value: ${{ steps.resolve.outputs.governance-digest }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        L9_PROFILE: ${{ inputs.profile }}
        L9_PROVIDER: ${{ inputs.provider }}
        L9_EVENT_NAME: ${{ inputs.event-name }}
        L9_REPOSITORY: ${{ inputs.repository }}
        L9_REF: ${{ inputs.ref }}
        L9_EVALUATION_DATE: ${{ inputs.evaluation-date }}
      run: python3 "${{ github.action_path }}/resolve.py"
