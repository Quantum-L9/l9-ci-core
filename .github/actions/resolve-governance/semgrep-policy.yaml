{
  "schema": "l9.finding-policy/v1",
  "metadata": {
    "version": "4"
  },
  "defaults": {
    "mode": "blocking"
  },
  "rules": {
    "l9.runtime.sdk.source.l9_ci.rulesets.semgrep.python.l9.baseline.python.broad-except": {
      "policy_key": "hygiene.python.broad-except",
      "mode": "advisory"
    },
    "python.lang.security.audit.dangerous-subprocess-use-tainted-env-args.dangerous-subprocess-use-tainted-env-args": {
      "policy_key": "actions.env-sourced-argv",
      "mode": "advisory"
    },
    "python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure": {
      "policy_key": "logging.credential-word-in-format-string",
      "mode": "advisory"
    },
    "python.lang.security.audit.insecure-file-permissions.insecure-file-permissions": {
      "policy_key": "filesystem.mode-magnitude-comparison",
      "mode": "advisory"
    }
  },
  "note": "Org default for required Organization CI (version 4, 2026-11-08): every finding is blocking unless a provider_rule_id is classified here. Advisory: the SDK baseline broad-except hygiene rule (informational; no security effect), and the Semgrep audit rule that taints every os.environ value reaching subprocess argv \u2014 composite GitHub Actions receive their inputs only through env, Core passes argv lists with shell=False after validating paths, and the rule's sole sanitizer (shlex.quote) is for shell strings, so the rule cannot be satisfied structurally and is reviewed per finding instead. Advisory since version 3: the Semgrep audit rule python-logger-credential-disclosure, whose only test is a regex over the logger call's FORMAT STRING (a secret word anywhere before a %s); it never inspects the logged arguments, so it blocks on prose such as \"Invalid API key: %s %s from %s\" logging the method, path and host, and on \"Token refresh scheduled in %s seconds\" logging an int. Blocking detection of a secret VALUE reaching a logger stays with the L9-owned SDK rules AST-LOGGING-001/002/003 (l9-ci-sdk l9_ci/rulesets/semgrep/python/l9-logging.yml), which default to blocking here and inspect the argument expressions; this rule's findings are still reported and reviewed per finding. Advisory since version 4: the Semgrep audit rule insecure-file-permissions, which flags os.chmod / lchmod / fchmod when the literal mode compares numerically >= 0o650. That is a magnitude test, not a permission-bit test: it reports owner-only 0o700 (no group or other bits) as widely permissive while passing 0o555, so it blocked required CI on an owner-only staging directory (Quantum-L9/Enrichment.Inference.Engine#287, os.fchmod(stage_fd, 0o700) in app/services/domain_spec_workflow.py). Its findings are still reported and reviewed per finding. Promote or demote a rule here after org review; a consumer cannot replace this file."
}
