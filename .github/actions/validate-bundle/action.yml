name: Validate canonical finding bundle
description: >
  Runs schema, semantic, and compatibility validation through the SDK.
inputs:
  executable:
    required: true
    description: Verified SDK executable.
  bundle:
    required: true
    description: Canonical finding bundle path.
  minimum-sdk-version:
    required: false
    description: Optional minimum acceptable SDK version.
runs:
  using: composite
  steps:
    - name: Validate bundle and verify compatibility
      shell: bash
      env:
        L9_EXECUTABLE: ${{ inputs.executable }}
        L9_BUNDLE: ${{ inputs.bundle }}
        L9_MINIMUM_SDK_VERSION: ${{ inputs.minimum-sdk-version }}
      run: python3 "${{ github.action_path }}/validate.py"
