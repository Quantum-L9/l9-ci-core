---
name: Validate canonical finding bundle
description: >-
  Runs schema, semantic, and compatibility validation through the exact SDK
  executable provisioned for the current analysis run.
inputs:
  executable:
    description: Verified SDK executable.
    required: true
  bundle:
    description: Canonical finding-bundle path.
    required: true
  minimum-sdk-version:
    description: Optional minimum acceptable SDK version.
    required: false
outputs:
  bundle:
    description: Validated canonical finding-bundle path.
    value: ${{ steps.validate.outputs.bundle }}
runs:
  using: composite
  steps:
    - id: validate
      name: Validate bundle
      shell: bash
      env:
        EXECUTABLE: ${{ inputs.executable }}
        BUNDLE: ${{ inputs.bundle }}
      run: |
        set -euo pipefail
        test -x "${EXECUTABLE}"
        test -f "${BUNDLE}"
        "${EXECUTABLE}" bundle validate "${BUNDLE}"
        echo "bundle=${BUNDLE}" >> "${GITHUB_OUTPUT}"
    - name: Verify compatibility
      shell: bash
      env:
        EXECUTABLE: ${{ inputs.executable }}
        BUNDLE: ${{ inputs.bundle }}
        MINIMUM_SDK_VERSION: ${{ inputs.minimum-sdk-version }}
      run: |
        set -euo pipefail
        command=(
          "${EXECUTABLE}"
          compatibility
          check
          --bundle "${BUNDLE}"
        )
        if [ -n "${MINIMUM_SDK_VERSION}" ]; then
          command+=(
            --minimum-SDK-version
            "${MINIMUM_SDK_VERSION}"
          )
        fi
        "${command[@]}"
