name: Validate l9-ci-core release
description: >
  Validates an immutable Core release: exact semver tag, the release version
  declared in .l9/repo-spec.yaml, the release-plane and publication contracts,
  immutable action pins, and the repository validation suite. Releases are
  audit anchors; the organization CI runtime is Core main via the ruleset.
inputs:
  tag:
    required: true
  expected-version:
    required: false
    default: ""
    description: >
      Optional override. When empty the expected version is read from
      .l9/repo-spec.yaml metadata.version so no workflow hard-codes a release.
outputs:
  release-version:
    value: ${{ steps.validate.outputs.release-version }}
runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      env:
        L9_RELEASE_TAG: ${{ inputs.tag }}
        L9_EXPECTED_VERSION: ${{ inputs.expected-version }}
      run: python3 "${{ github.action_path }}/validate_release.py"
