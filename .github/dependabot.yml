version: 2
updates:
  # Python deps: Dependabot's `uv` ecosystem understands pyproject.toml (PEP 621)
  # + uv.lock together and keeps them in sync in a single PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait for newly published versions to age before proposing them; a
    # freshly published (possibly compromised) release is not adopted on day 0.
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(uv)"

  # GitHub Actions. Dependabot's github-actions ecosystem scans
  # `<directory>/.github/workflows`; Core's own workflows live at "/". The
  # copy-first `presets/python` tree it used to scan was retired on
  # 2026-10-22 (AGENTS.md §15).
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    # Wait for newly published versions to age before proposing them; a
    # freshly published (possibly compromised) release is not adopted on day 0.
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
