[project]
name = "l9-ci-core-validation"
version = "2.0.0.dev1"
description = "Validation harness for the l9-ci-core thin control plane"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Ruff configuration lives in ruff.toml (its own single source of truth).
# A `[tool.ruff]` table here would be silently ignored whenever ruff.toml
# exists, so it is intentionally not duplicated.

# Mirrors requirements-ci.txt exactly (the toolchain this repo's own
# self-validation/mypy gate installs) so Dependabot's uv ecosystem can see
# and bump it via uv.lock instead of only requirements-ci.txt drifting
# silently. Does NOT cover the ruff/mypy/pytest versions pr-pipeline.yml
# pins for *downstream consumer* repos — that is a deliberate, org-wide
# toolchain pin with a much larger blast radius, out of scope here.
[project.optional-dependencies]
dev = ["PyYAML==6.0.2", "types-PyYAML==6.0.12.20260724"]

[tool.mypy]
# Type gate for Core's own control-plane code. Scoped to the executable
# Python (composite-action entrypoints + operator tools); tests are covered
# by the unittest suite. Stubs for the sole third-party import (yaml) come
# from types-PyYAML in requirements-ci.txt.
python_version = "3.11"
files = [".github/actions", "tools"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
