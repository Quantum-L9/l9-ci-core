# DEPRECATED — legacy copy-first L9 Analysis caller (frozen; no new features).
#
# Organization CI is required centrally: the Quantum-L9 organization ruleset
# requires Quantum-L9/l9-ci-core/.github/workflows/org-ci.yml directly, and
# consumer repositories do not copy L9 workflows, governance packs, Core pins,
# SDK pins, or enforcement modes. Do not copy this file into a new consumer.
# An existing copy is a duplicate, separately pinned analysis lane beside the
# required check and is scheduled for removal once central coverage is proven
# (presets/LEGACY.md, AGENTS.md §7).
#
# If a copy must stay alive meanwhile, its calling job must grant every
# permission the pinned Core kernel declares — `security-events: write`
# included, for the nested publication workflow — or GitHub rejects the run
# at startup with zero jobs (workflow audit 2026-09-13, F-001).
#
# L9 Governed Analysis Pipeline — TypeScript Preset
#
# DO NOT EDIT — this file is managed by l9-ci-core presets/typescript.
#
# Thin caller into Core analyze-semgrep.yml (SDK semgrep run → gate →
# publish + SARIF). Language is locked to typescript.

name: L9 Analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Pin to a full Core SHA. Bump after merging self-CI dogfood so consumers
  # pick up analyze-semgrep SARIF + gate wiring from that merge commit.
  # `uses:` cannot interpolate env — duplicate the SHA literally on the uses
  # line (same as CORE_ACTIONS_PIN). Keep L9_CORE_REF here for humans/agents.
  L9_CORE_REF: "1aa6c97b3a6f30b9e9d55e61575a172581ba8558"
permissions:
  contents: read
concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (semgrep)
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@1aa6c97b3a6f30b9e9d55e61575a172581ba8558
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      # `env` is not available in a reusable-workflow `with:` block (GitHub
      # allows only github, needs, strategy, matrix, inputs, vars there), so
      # the profile is selected from the github context. Each profile declares
      # the event classes it admits — pr_fast only pull_request, merge push,
      # nightly the class the kernel maps workflow_dispatch onto. A profile
      # that does not admit the incoming class makes resolve-governance fail
      # closed: "event '<class>' is not allowed for profile '<profile>'".
      profile: >-
        ${{ github.event_name == 'push' && 'merge'
         || github.event_name == 'workflow_dispatch' && 'nightly'
         || 'pr_fast' }}
      matrix-id: pr-semgrep
      # SDK-owned Semgrep execution language: python or typescript. Set it
      # here, literally — `env` cannot reach a reusable-workflow `with:`.
      language: typescript
