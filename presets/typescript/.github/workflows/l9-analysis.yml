# L9 Governed Analysis Pipeline — TypeScript Preset (LOCKED)
#
# DO NOT EDIT — this file is managed by l9-ci-core presets/typescript.
# To update, pull the latest preset from Quantum-L9/l9-ci-core.
#
# Thin caller into Core analyze-semgrep.yml (SDK semgrep run → gate →
# publish + SARIF). Language is locked to typescript.

name: L9 Analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Pin to a full Core SHA. Bump after merging self-CI dogfood so consumers
  # pick up analyze-semgrep SARIF + gate wiring from that merge commit.
  # `uses:` cannot interpolate env — duplicate the SHA literally on the uses
  # line (same as CORE_ACTIONS_PIN). Keep L9_CORE_REF here for humans/agents.
  L9_CORE_REF: "373bb6d26084e67ef76aaab95021364182a34ee7"
permissions:
  contents: read
concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (semgrep)
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@373bb6d26084e67ef76aaab95021364182a34ee7
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      # `env` context is not available in reusable-workflow `with:` values,
      # so select the profile here from the github context instead. pr_fast
      # only allows pull_request/workflow_dispatch; pushes to main must use
      # the merge profile or resolve-governance fails closed with
      # "event 'push' is not allowed".
      profile: ${{ github.event_name == 'pull_request' && 'pr_fast' || 'merge' }}
      matrix-id: pr-semgrep
      # SDK-owned Semgrep execution language: python or typescript. The SDK
      # selects the packaged ruleset; this caller authors no --config list.
      language: typescript
