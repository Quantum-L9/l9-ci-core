# Core-owned mypy preset (l9-ci-core presets/python-tooling). Do not edit.
#
# Stamped by `python3 -m tools.l9_repo --workspace <repo> stamp --profile python`
# and verified byte-for-byte by `... validate`. mypy reads mypy.ini before
# pyproject.toml and never merges configuration files, so a [tool.mypy] table
# in pyproject.toml is ignored. Name the checked paths in Repo.mk
# (`python -m mypy src tests`); silence an untyped third-party import inline
# with `# type: ignore[import-untyped]`.
[mypy]
python_version = 3.12
strict = True
