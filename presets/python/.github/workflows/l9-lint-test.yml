# L9 Consumer Lint + Test — Python Preset (LOCKED STRUCTURE)
#
# DO NOT EDIT workflow structure — only the env: block is consumer-configurable.
# Managed by l9-ci-core presets/python.
#
# Conventions:
#   - Immutable event-revision checkout (no floating action ref)
#   - SHA-pinned external actions
#   - Least privilege (contents: read only)
name: L9 Lint and Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# ── CONFIGURABLE: agent sets these during activation ───────────────────────────
env:
  PYTHON_VERSION: "3.12"
  SOURCE_DIR: "."
  TEST_DIR: "tests/"
  COVERAGE_THRESHOLD: "0"
  PYTEST_PARALLEL: "false"
  MYPY_EXCLUDE: ""

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Authenticate with a per-fetch Authorization header instead of
          # embedding the token in the remote URL, so the credential is never
          # written to the remote URL or .git/config (mirrors actions/checkout).
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
            -c "http.https://github.com/.extraheader=${auth_header}" \
            fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install consumer CI toolchain
        uses: Quantum-L9/l9-ci-core/.github/actions/install-consumer-ci@7148fc73dcbf41367f5c5401432dc997b1f4f869  # main@7148fc7
      # --only-binary :all: refuses source distributions: installing a
      # dependency must not be able to execute it. This is also what SonarCloud
      # githubactions:S8541 asks for by name, and this preset is copied into
      # every consumer, so an unhardened line here re-seeds that finding fleet-wide.
      - name: Install extra CI requirements
        run: |
          set -euo pipefail
          if [ -f requirements-ci.txt ]; then
            pip install --only-binary :all: -r requirements-ci.txt
          fi

      - name: ruff check
        run: ruff check "${SOURCE_DIR}" --output-format=github

      - name: ruff format --check
        run: ruff format --check "${SOURCE_DIR}"

      - name: mypy
        run: |
          set -euo pipefail
          # mkdir required before --install-types on a cold cache, else mypy
          # fails with the misleading "no mypy cache directory" error and
          # masks any real type errors underneath it (python/mypy#10768).
          mkdir -p .mypy_cache
          MYPY_EXCLUDE_ARGS=()
          if [ -n "${MYPY_EXCLUDE}" ]; then
            MYPY_EXCLUDE_ARGS=(--exclude "${MYPY_EXCLUDE}")
          fi
          # Repository-owned mypy configuration (pyproject.toml / mypy.ini /
          # setup.cfg) is authoritative for strictness and per-module import
          # handling. No global --ignore-missing-imports: a repo that needs to
          # ignore a specific untyped import declares it in its own config, and
          # a repo using Pydantic opts into the pydantic mypy plugin there
          # (plugins = pydantic.mypy). --install-types fetches declared stub
          # packages; it does not weaken checking. mypy is a required, blocking
          # gate — a non-zero exit fails this step.
          mypy "${SOURCE_DIR}" \
            "${MYPY_EXCLUDE_ARGS[@]}" \
            --show-error-codes --pretty \
            --install-types --non-interactive

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          # Authenticate with a per-fetch Authorization header instead of
          # embedding the token in the remote URL, so the credential is never
          # written to the remote URL or .git/config (mirrors actions/checkout).
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
          git -c protocol.version=2 \
            -c "http.https://github.com/.extraheader=${auth_header}" \
            fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install consumer CI toolchain
        uses: Quantum-L9/l9-ci-core/.github/actions/install-consumer-ci@7148fc73dcbf41367f5c5401432dc997b1f4f869  # main@7148fc7
      # Wheel-only for every dependency (see the lint job's note). The local
      # project keeps its editable install: it is the repository under test, not
      # a third-party artifact, and pytest needs it importable. Consumers whose
      # pyproject puts src/ on the path via [tool.pytest.ini_options] can drop
      # that line and avoid the source build entirely.
      - name: Install test tools
        run: |
          set -euo pipefail
          if [ -f requirements-ci.txt ]; then
            pip install --only-binary :all: -r requirements-ci.txt
          fi
          pip install -e ".[dev]" || pip install -e . || \
            echo "::notice::no local editable package to install"
          python -c "import pytest_cov" 2>/dev/null || \
            pip install --only-binary :all: "pytest-cov==7.1.0"
          python -c "import xdist" 2>/dev/null || \
            pip install --only-binary :all: "pytest-xdist==3.8.0"
          python -c "import pytest_timeout" 2>/dev/null || \
            pip install --only-binary :all: "pytest-timeout==2.4.0"

      - name: pytest with coverage
        env:
          TESTING: "true"
        run: |
          set -euo pipefail
          XDIST_ARGS=()
          if [ "${PYTEST_PARALLEL}" = "true" ]; then
            XDIST_ARGS=(-n auto)
          fi
          PYTHONPATH=. pytest "${TEST_DIR}" \
            "${XDIST_ARGS[@]}" \
            --cov="${SOURCE_DIR}" \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_THRESHOLD}" \
            --timeout=300 --tb=short -v
