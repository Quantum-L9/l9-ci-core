# Core-owned pytest preset (l9-ci-core presets/python). Do not edit.
#
# Stamped by `python3 -m tools.l9_repo --workspace <repo> stamp --profile python`
# and verified byte-for-byte by `... validate`. pytest uses the first
# configuration file it finds and pytest.ini wins over pyproject.toml, so a
# [tool.pytest.ini_options] table there is ignored.
[pytest]
testpaths = tests
