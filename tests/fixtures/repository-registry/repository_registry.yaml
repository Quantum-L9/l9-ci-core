schema: l9.repository-registry/v1
artifact_id: l9.repository-registry/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_repository_registry
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: repository_registry.yaml
purpose: >
  Name the canonical organization-level repository coordinates governed by
  Quantum-L9 and assign each registered repository exactly one RepositoryClass.
  This registry owns repository identity, lifecycle classification, and
  organization RepositoryClass assignment only. It does not own the domain
  semantics, implementation, runtime state, or repository-local authority of
  the registered repositories. Every entry is an explicit admission decision:
  a repository is a member because it is listed here with a class_ref, never
  because of its name, prefix, hosting organization, shape, ProductKind, or
  birth profile. An unlisted repository has no implied membership and no
  implied class. Since v3.43.0 (ADR-040) the registry is organization-complete:
  every repository the Quantum-L9 GitHub organization hosts, archived ones
  included, must be registered, and an unregistered hosted repository is a
  completeness violation, never an implied member. Membership is organization
  membership only. It does not imply a ProductKind, a Node, or participation
  in the constellation, which Constellation.Gate and Gate_SDK define.
class_catalog_ref: l9.repository-classes/global@1
global_rules:
  registry_names_repository_identity_and_classification_only: true
  every_entry_is_an_explicit_admission_decision: true
  repository_id_is_immutable: true
  repository_coordinate_is_provider_scoped: true
  repository_coordinate_is_case_sensitive: true
  every_registered_repository_has_exactly_one_class_ref: true
  every_class_ref_must_resolve_in_repository_classes: true
  every_class_ref_must_resolve_to_an_admitted_class: true
  repository_name_does_not_imply_repository_class: true
  repository_prefix_does_not_imply_repository_class: true
  organization_hosted_repositories_must_be_registered: true
  membership_is_conferred_by_registry_entry_never_by_organization_hosting: true
  registry_membership_does_not_imply_product_kind: true
  registry_membership_does_not_imply_constellation_participation: true
  repository_shape_does_not_imply_repository_class: true
  product_kind_does_not_imply_repository_class: true
  birth_profile_does_not_imply_repository_class: true
  unregistered_repository_has_no_implied_l9_membership: true
  unknown_or_ambiguous_repository_identity_fails_closed: true
  unknown_or_ambiguous_class_assignment_fails_closed: true
  repository_rename_preserves_stable_registry_id: true
  historical_repository_coordinates_must_be_preserved_as_aliases: true
  removed_repository_entries_must_be_retained_with_retired_lifecycle: true
  registry_classification_does_not_transfer_domain_semantic_ownership: true
  registry_classification_does_not_grant_execution_authority: true
  runtime_state_is_not_recorded_here: true
  ingestion_state_is_not_recorded_here: true
  memory_state_is_not_recorded_here: true
  credentials_are_not_recorded_here: true
does_not_own:
  - repository_domain_semantics
  - source_code_meaning
  - product_kind
  - product_release_admission
  - repository_birth_profile
  - repository_seed_distribution
  - credentials
  - permissions
  - execution_authority
  - runtime_health
  - deployment_state
  - memory_records
  - ingestion_progress
  - projection_runtime_state
repository_lifecycle:
  current: >
    Current canonical repository coordinate eligible for obligations defined by
    its RepositoryClass.
  superseded: >
    Repository identity replaced by another canonical coordinate while retained
    for historical resolution.
  retired: >
    Repository retained for historical resolution but no longer a current
    operational source. Class-defined historical obligations may continue to
    apply.
organization_completeness:
  decision_record: ADR-040
  supersedes: >
    The v3.15.0 global rule organization_hosting_does_not_imply_l9_membership,
    under which a repository hosted in the organization could stay
    unregistered. Hosting still confers nothing: a hosted repository is a
    member only through its entry here, and that entry is still an explicit
    admission decision. What changed is that leaving a hosted repository out
    is now a violation.
  scope:
    provider: github
    organization: Quantum-L9
    includes_archived_repositories: true
    includes_forked_repositories: true
  archived_repository_lifecycle: retired
  id_rule: >
    The id is the repository name lowercased with every run of '.', '_' and
    '-' folded to one '-', trimmed. Every entry follows it except the
    grandfathered pre-rule id dot-github (Quantum-L9/.github), whose name
    folds to no valid id. Memory derives namespace addresses from these ids.
  enforcement: >
    ops/registry-completeness.js compares the live organization listing with
    this registry and fails on a hosted repository that is not registered.
    The check is observational: it never writes the registry.
  admission_path: >
    auto-seed-new-repo.yml's admit job runs ops/register-org-repository.py,
    which proposes one entry (folded id, the single current admitted class,
    lifecycle current, no ProductKind) plus its registry-only release record
    as a reviewable pull request. The owner's merge of that exact entry is the
    admission decision. A factory-born repository is registered by the birth
    path (ADR-039) instead, and an already-archived repository is refused and
    left to a hand admission with lifecycle retired. Nothing merges
    automatically.
  organization_admission_fields:
    basis: organization_completeness
    decision_record: ADR-040
    github_repository_id: the GitHub repository's immutable numeric id
    observed_at: the time the organization listing returned the repository
  pinned_entries_never_carry_organization_admission: true
  organization_admission_and_birth_provenance_are_exclusive: true
factory_born_entries:
  decision_record: ADR-039
  identification: >
    An entry carrying birth_provenance was registered from the factory's
    attested birth record by ops/register-birth.py, which opens a reviewable
    pull request; the owner's merge of that exact entry is the admission
    decision. birth_provenance is evidence of what the factory produced. It
    confers no authority, does not admit a product, and does not imply a
    RepositoryClass.
  id_rule: >
    The id is the repository name lowercased with every run of '.', '_' and
    '-' folded to one '-'. It is never typed.
  lifecycle_at_registration: current
  class_ref_rule: >
    The single current admitted RepositoryClass. If the class catalog admits
    more than one current class, registration fails closed.
  birth_provenance_fields:
    factory: Quantum-L9/l9-repo-template
    receipt_schema: l9.birth-receipt/v1
    receipt_digest: sha256 digest recorded in the newborn's .l9/birth-receipt.json
    root_commit: the newborn's single root commit, whose trailers carry the digest
    template_sha: the factory commit the repository was born from
    template_version: the factory version recorded at that commit
    org_policy_sha: the Quantum-L9/.github commit the birth applied
    birth_profile: the birth profile (policies/repo-classes.yml), not a RepositoryClass
    born_at: the receipt's birth timestamp
  pinned_entries_never_carry_birth_provenance: true
