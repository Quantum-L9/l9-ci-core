sonar.organization=quantum-l9
sonar.projectKey=Quantum-L9_l9-ci-core
sonar.projectName=l9-ci-core
sonar.sources=.
sonar.tests=tests
sonar.python.version=3.12
# tests/ is the test root. It must stay out of the source set, or the scanner
# indexes tests/actions/__init__.py twice and exits 3 before analysis.
sonar.exclusions=tests/**,**/.venv/**,**/__pycache__/**,**/build/**,**/dist/**
