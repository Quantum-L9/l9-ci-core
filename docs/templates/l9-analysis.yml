# L9 analysis caller (TEMPLATE — copy into your repo at .github/workflows/l9-analysis.yml)
#
# Thin stub into Core's analyze-semgrep.yml kernel. Works for Python AND
# Node.js: set the `language:` value below (python or typescript) — it must be
# a literal, because `env` cannot be referenced from a reusable-workflow
# `with:` block. The SDK owns semgrep
# execution, gate evaluation, agent-payload + SARIF projection; this file
# only triggers and calls the reusable workflow.
#
# Prerequisite: copy docs/templates/governance/*.yaml into THIS repo at
# .github/governance/ (the CI instantiation pack the resolver reads).

name: L9 Analysis
on:
  pull_request:
  workflow_dispatch:
env:
  # Pin to a full Core SHA. Bump after merging self-CI dogfood so consumers
  # pick up analyze-semgrep SARIF + gate wiring from that merge commit.
  # `uses:` cannot interpolate env — duplicate the SHA literally on the uses
  # line (same as CORE_ACTIONS_PIN). Keep L9_CORE_REF here for humans/agents.
  L9_CORE_REF: "1aa6c97b3a6f30b9e9d55e61575a172581ba8558"
permissions:
  contents: read
concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (semgrep)
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@1aa6c97b3a6f30b9e9d55e61575a172581ba8558
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      # `env` is not available in a reusable-workflow `with:` block (GitHub
      # allows only github, needs, strategy, matrix, inputs, vars there), so
      # the profile is selected from the github context. Each profile declares
      # the event classes it admits — pr_fast only pull_request, merge push,
      # nightly the class the kernel maps workflow_dispatch onto. A profile
      # that does not admit the incoming class makes resolve-governance fail
      # closed: "event '<class>' is not allowed for profile '<profile>'".
      profile: >-
        ${{ github.event_name == 'push' && 'merge'
         || github.event_name == 'workflow_dispatch' && 'nightly'
         || 'pr_fast' }}
      matrix-id: pr-semgrep
      # SDK-owned Semgrep execution language: python or typescript. Set it
      # here, literally — `env` cannot reach a reusable-workflow `with:`.
      language: python
